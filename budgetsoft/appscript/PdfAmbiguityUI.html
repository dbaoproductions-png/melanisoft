<script>
(function(){
  const PA={rows:null,compte:'',meta:null,analyse:null};
  const q=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
  function dateFr(v){if(!v)return'—';const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]:String(v)}
  function pdfState(){try{return typeof sprint0809!=='undefined'&&sprint0809?sprint0809:(window.sprint0809||{})}catch(e){return window.sprint0809||{}}}
  function clean(s){return String(s||'').split(/\b(?:TOTAL DES OPERATIONS|SOLDE (?:CREDITEUR|DEBITEUR)|Montant de votre autorisation|Hello bank! est une marque|Votre satisfaction est notre priorité)\b/i)[0].replace(/\s+/g,' ').trim()}
  function rowsPdf(){const st=pdfState(),compte=q('pdf-account')?.value||'';return (st.pdfOperations||[]).map(o=>{const raw=clean(o.libelle_bancaire||o.details||o.libelle||'');const m=raw.match(/(?:FACTURE\(S\)\s+CARTE[^]*?\s+DU|^DU)\s+(\d{2})(\d{2})(\d{2})\b/i);const da=o.date_achat||(m?new Date(2000+Number(m[3]),Number(m[2])-1,Number(m[1]),12).toISOString():'');const cm=raw.match(/CARTE\s+\d*[Xx]+(\d{4})/i);return{date:o.date_achat||o.date_comptable||o.date,date_comptable:o.date_comptable||o.date,date_achat:da,libelle:o.libelle||raw,libelle_bancaire:raw,montant:o.montant,type:o.montant<0?'depense':'revenu',carte_fin:o.carte_fin||(cm?cm[1]:''),marchand_normalise:o.marchand_normalise||'',_ligneBrute:o._ligneBrute||'',compte}})}
  function modal(){if(q('pdf-ambiguity-modal'))return;q('pdf-status')?.setAttribute('data-ambiguity-ui','1');const m=document.createElement('div');m.id='pdf-ambiguity-modal';m.className='modal hidden';m.innerHTML=`<div class="modal-card wide-modal" style="max-width:980px;max-height:94vh;overflow:auto"><div class="modal-heading"><div><p class="panel-kicker">Rapprochement PDF</p><h2>Cas ambigus à décider</h2></div><button class="modal-close" id="pdf-ambiguity-close">×</button></div><div class="warning-box"><strong>Sécurité :</strong> aucune écriture n’est effectuée avant toutes les décisions.</div><div id="pdf-ambiguity-summary" class="helper-text" style="margin-top:10px"></div><div id="pdf-ambiguity-list" style="display:grid;gap:14px;margin-top:14px"></div><div id="pdf-ambiguity-error" class="error hidden"></div><div class="form-actions"><button class="secondary-button" id="pdf-ambiguity-cancel">Annuler</button><button class="primary-button" id="pdf-ambiguity-submit" disabled>Valider les rapprochements et importer</button></div></div>`;document.body.appendChild(m);q('pdf-ambiguity-close').onclick=fermer;q('pdf-ambiguity-cancel').onclick=fermer;q('pdf-ambiguity-submit').onclick=soumettre;m.addEventListener('change',actualiser)}
  function fermer(){q('pdf-ambiguity-modal')?.classList.add('hidden')}
  function afficher(a){modal();PA.analyse=a;q('pdf-ambiguity-summary').innerHTML=`<strong>${a.ambigues}</strong> cas ambigu(s) sur ${a.recues} opérations · ${a.rapprochementsAutomatiques} rapprochement(s) automatique(s) · ${a.nouvelles} nouvelle(s).`;q('pdf-ambiguity-list').innerHTML=(a.details||[]).map((d,i)=>{const p=d.operationPdf||{},cs=(d.candidats||[]).map(c=>`<label style="display:block;border:1px solid #d8e4df;border-radius:10px;padding:10px;margin-top:8px"><input type="radio" name="pdf-amb-${d.index}" value="match:${esc(c.id)}"> <strong>Rapprocher avec cette opération</strong><br><span class="helper-text">${dateFr(c.date_achat||c.date)} · ${esc(c.libelle||c.libelle_bancaire)} · ${money(c.montant)} · <strong>${esc(c.categorie||'Sans catégorie')}</strong> · score ${Number(c.score||0)}${c.source?' · '+esc(c.source):''}${c.statut?' / '+esc(c.statut):''}</span></label>`).join('');return `<section style="border:1px solid #cbded6;border-radius:12px;padding:14px"><strong>Cas ${i+1}</strong><div class="warning-box" style="margin-top:6px"><strong>PDF</strong> · ${dateFr(p.date_comptable)} · <strong>${money(p.montant)}</strong><br>${esc(p.libelle_bancaire||p.libelle)}</div>${cs}<label style="display:block;border:1px solid #d8e4df;border-radius:10px;padding:10px;margin-top:8px"><input type="radio" name="pdf-amb-${d.index}" value="create"> <strong>Aucune correspondance — créer une nouvelle opération</strong></label></section>`}).join('');q('pdf-ambiguity-submit').disabled=true;q('pdf-ambiguity-modal').classList.remove('hidden')}
  function actualiser(){q('pdf-ambiguity-submit').disabled=!((PA.analyse?.details||[]).every(d=>document.querySelector(`input[name="pdf-amb-${d.index}"]:checked`)))}
  function decisions(){return (PA.analyse?.details||[]).map(d=>{const v=document.querySelector(`input[name="pdf-amb-${d.index}"]:checked`)?.value||'';return v==='create'?{index:d.index,action:'create'}:{index:d.index,action:'match',operationId:v.replace(/^match:/,'')}})}
  function soumettre(){const b=q('pdf-ambiguity-submit'),err=q('pdf-ambiguity-error'),status=q('pdf-status');b.disabled=true;b.textContent='Import transactionnel…';google.script.run.withSuccessHandler(r=>{b.textContent='Valider les rapprochements et importer';if(r.bloque){err.textContent=r.message;err.classList.remove('hidden');b.disabled=false;return}fermer();if(status)status.textContent=`✅ PDF certifié : ${r.recues} opérations · ${r.remplacees} rapprochées · ${r.creees} nouvelles · ${r.decisionsManuelles||0} décision(s) manuelle(s).`;if(typeof charger==='function')charger()}).withFailureHandler(e=>{b.disabled=false;b.textContent='Valider les rapprochements et importer';err.textContent='❌ '+(e.message||e);err.classList.remove('hidden')}).importerPdfBancaireCertifieAvecDecisions(PA.rows,PA.compte,PA.meta,decisions())}
  function lancerImport(){const st=pdfState(),compte=q('pdf-account')?.value,status=q('pdf-status'),bouton=q('confirm-pdf-import');if(!compte){if(status)status.textContent='Choisissez le compte.';return}const meta=st.pdfMeta||{},ops=st.pdfOperations||[];if(status)status.textContent=`Préparation de ${ops.length} opération(s) détectée(s)…`;const ctl=meta.controle||controlerTotauxPdf(ops,meta);if(ctl.verifiable&&!ctl.conforme){status.textContent='Import refusé : totaux PDF non conformes.';return}const rows=rowsPdf();if(!rows.length){status.textContent=`Aucune opération à importer (état PDF=${ops.length}). Rechargez puis réanalysez le PDF.`;return}PA.rows=rows;PA.compte=compte;PA.meta=meta;bouton.disabled=true;bouton.textContent='Rapprochement certifié…';google.script.run.withSuccessHandler(r=>{bouton.disabled=false;bouton.textContent='Importer les opérations';if(!r.bloque){status.textContent=`✅ PDF certifié : ${r.controle.nombre} opérations · ${r.remplacees} rapprochées · ${r.creees} nouvelles.`;if(typeof charger==='function')charger();return}status.textContent=`⚠️ ${r.ambigues} rapprochement(s) ambigu(s). Aucune écriture effectuée.`;google.script.run.withSuccessHandler(afficher).withFailureHandler(e=>status.textContent='❌ '+(e.message||e)).analyserAmbiguitesPdfBancaire(rows,compte)}).withFailureHandler(e=>{bouton.disabled=false;bouton.textContent='Importer les opérations';status.textContent='❌ '+(e.message||e)}).importerPdfBancaireCertifie(rows,compte,meta)}
  function install(){modal();window.confirmerImportPdf=lancerImport;window.__pdfAmbiguityUI='2026-08-21.3'}
  document.addEventListener('DOMContentLoaded',()=>setTimeout(install,1000));
})();
</script>
