<script>
(function(){
  const PA={rows:null,compte:'',meta:null,analyse:null};
  const q=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const moneyPA=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
  function dateFr(v){if(!v)return'—';const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]:String(v)}
  function creerModal(){if(q('pdf-ambiguity-modal'))return;const m=document.createElement('div');m.id='pdf-ambiguity-modal';m.className='modal hidden';m.innerHTML=`<div class="modal-card wide-modal" style="max-width:980px;max-height:94vh;overflow:auto"><div class="modal-heading"><div><p class="panel-kicker">Rapprochement PDF</p><h2>Cas ambigus à décider</h2></div><button class="modal-close" id="pdf-ambiguity-close">×</button></div><div class="warning-box"><strong>Sécurité :</strong> aucune écriture n’est effectuée tant que chaque cas ambigu n’a pas reçu une décision explicite.</div><div id="pdf-ambiguity-summary" class="helper-text" style="margin-top:10px"></div><div id="pdf-ambiguity-list" style="display:grid;gap:14px;margin-top:14px"></div><div id="pdf-ambiguity-error" class="error hidden" style="margin-top:12px"></div><div class="form-actions"><button type="button" class="secondary-button" id="pdf-ambiguity-cancel">Annuler</button><button type="button" class="primary-button" id="pdf-ambiguity-submit" disabled>Valider les rapprochements et importer</button></div></div>`;document.body.appendChild(m);q('pdf-ambiguity-close').onclick=fermer;q('pdf-ambiguity-cancel').onclick=fermer;q('pdf-ambiguity-submit').onclick=soumettre;m.addEventListener('change',actualiserBouton)}
  function fermer(){q('pdf-ambiguity-modal')?.classList.add('hidden')}
  function afficher(analyse){creerModal();PA.analyse=analyse;q('pdf-ambiguity-summary').innerHTML=`<strong>${analyse.ambigues}</strong> cas ambigu(s) sur ${analyse.recues} opérations · ${analyse.rapprochementsAutomatiques} rapprochement(s) automatique(s) · ${analyse.nouvelles} nouvelle(s) opération(s) prévue(s).`;q('pdf-ambiguity-list').innerHTML=(analyse.details||[]).map((d,i)=>{const p=d.operationPdf||{};const candidats=(d.candidats||[]).map(c=>`<label style="display:block;border:1px solid #d8e4df;border-radius:10px;padding:10px;margin-top:8px;cursor:pointer"><input type="radio" name="pdf-amb-${d.index}" value="match:${esc(c.id)}"> <strong>Rapprocher avec cette opération</strong><br><span class="helper-text">${dateFr(c.date_achat||c.date)} · ${esc(c.libelle||c.libelle_bancaire)} · ${moneyPA(c.montant)} · catégorie <strong>${esc(c.categorie||'Sans catégorie')}</strong> · score ${Number(c.score||0)}${c.source?' · '+esc(c.source):''}${c.statut?' / '+esc(c.statut):''}</span></label>`).join('');return `<section style="border:1px solid #cbded6;border-radius:12px;padding:14px"><div style="font-weight:700;margin-bottom:6px">Cas ${i+1}</div><div class="warning-box" style="margin:0"><strong>Opération du relevé PDF</strong><br>${dateFr(p.date_comptable)}${p.date_achat&&p.date_achat!==p.date_comptable?' · achat '+dateFr(p.date_achat):''} · <strong>${moneyPA(p.montant)}</strong><br>${esc(p.libelle_bancaire||p.libelle)}${p.carte_fin?' · carte …'+esc(p.carte_fin):''}</div><div style="margin-top:10px"><strong>Choisir la correspondance :</strong>${candidats}<label style="display:block;border:1px solid #d8e4df;border-radius:10px;padding:10px;margin-top:8px;cursor:pointer"><input type="radio" name="pdf-amb-${d.index}" value="create"> <strong>Aucune correspondance — créer une nouvelle opération</strong></label></div></section>`}).join('');q('pdf-ambiguity-error').classList.add('hidden');q('pdf-ambiguity-error').textContent='';q('pdf-ambiguity-submit').disabled=true;q('pdf-ambiguity-modal').classList.remove('hidden')}
  function actualiserBouton(){const details=(PA.analyse&&PA.analyse.details)||[];q('pdf-ambiguity-submit').disabled=!details.every(d=>document.querySelector(`input[name="pdf-amb-${d.index}"]:checked`))}
  function decisions(){return (PA.analyse.details||[]).map(d=>{const v=document.querySelector(`input[name="pdf-amb-${d.index}"]:checked`)?.value||'';return v==='create'?{index:d.index,action:'create'}:{index:d.index,action:'match',operationId:v.replace(/^match:/,'')}})}
  function finImport(r){const status=q('pdf-status');if(status)status.textContent=`✅ PDF certifié : ${r.recues} opérations · ${r.remplacees} existantes rapprochées · ${r.creees} nouvelles · ${r.decisionsManuelles||0} décision(s) manuelle(s) · totaux et continuité conformes.`;if(typeof charger==='function')charger()}
  function soumettre(){const b=q('pdf-ambiguity-submit'),err=q('pdf-ambiguity-error');b.disabled=true;b.textContent='Import transactionnel…';err.classList.add('hidden');google.script.run.withSuccessHandler(r=>{b.textContent='Valider les rapprochements et importer';if(r.bloque){err.textContent=r.message||'Des ambiguïtés restent à résoudre.';err.classList.remove('hidden');b.disabled=false;return}fermer();finImport(r)}).withFailureHandler(e=>{b.disabled=false;b.textContent='Valider les rapprochements et importer';err.textContent='❌ '+(e.message||e);err.classList.remove('hidden')}).importerPdfBancaireCertifieAvecDecisions(PA.rows,PA.compte,PA.meta,decisions())}
  function lignesDepuisSocle(){if(typeof sprint0809==='undefined'||!Array.isArray(sprint0809.pdfOperations))return [];return sprint0809.pdfOperations.map(o=>{const d=String(o.libelle_bancaire||o.details||'');const cm=d.match(/(?:CARTE|CB)\s+\d*X+(\d{4})/i);return {date_comptable:o.date_comptable||o.date,date_achat:o.date_achat||o.date_comptable||o.date,libelle:o.libelle||'',libelle_bancaire:d||o.libelle||'',montant:Number(o.montant||0),type:Number(o.montant||0)<0?'depense':'revenu',carte_fin:o.carte_fin||(cm?cm[1]:'')}})}
  function importCertifie(){const btn=q('confirm-pdf-import'),status=q('pdf-status'),compte=q('pdf-account')?.value||'',rows=lignesDepuisSocle(),meta=(typeof sprint0809!=='undefined'?sprint0809.pdfMeta:null);if(!compte){status.textContent='Choisissez le compte concerné.';return}if(!rows.length){status.textContent='Aucune opération à importer.';return}if(meta?.controle?.verifiable&&!meta.controle.conforme){status.textContent='Import bloqué : les totaux calculés ne correspondent pas aux totaux officiels du relevé.';return}btn.disabled=true;btn.textContent='Contrôle des rapprochements…';status.textContent=`Contrôle certifié de ${rows.length} opération(s), sans écriture…`;google.script.run.withSuccessHandler(analyse=>{btn.disabled=false;btn.textContent='Importer les opérations';if(analyse.ambigues>0){PA.rows=rows;PA.compte=compte;PA.meta=meta;status.textContent=`${analyse.ambigues} rapprochement(s) ambigu(s) : décision manuelle requise. Aucune écriture effectuée.`;afficher(analyse);return}status.textContent='Aucune ambiguïté. Import certifié en cours…';btn.disabled=true;btn.textContent='Import certifié…';google.script.run.withSuccessHandler(r=>{btn.disabled=false;btn.textContent='Importer les opérations';finImport(r)}).withFailureHandler(err=>{btn.disabled=false;btn.textContent='Importer les opérations';status.textContent='❌ '+(err.message||err)}).importerPdfBancaireCertifieAvecDecisions(rows,compte,meta,[])}).withFailureHandler(err=>{btn.disabled=false;btn.textContent='Importer les opérations';status.textContent='❌ Contrôle des rapprochements : '+(err.message||err)}).analyserAmbiguitesPdfBancaire(rows,compte)}
  function installerRoutageCertifie(){const ancien=q('confirm-pdf-import');if(!ancien||ancien.dataset.certifiedOwner==='1')return false;const nouveau=ancien.cloneNode(true);nouveau.dataset.certifiedOwner='1';ancien.parentNode.replaceChild(nouveau,ancien);nouveau.addEventListener('click',importCertifie);return true}
  function surveillerBoutonImportPdf(){
    installerRoutageCertifie();
    const observer=new MutationObserver(()=>installerRoutageCertifie());
    observer.observe(document.documentElement,{childList:true,subtree:true});
    document.addEventListener('click',event=>{
      const ouvre=event.target&&event.target.closest?event.target.closest('#import-pdf-button'):null;
      if(ouvre)setTimeout(installerRoutageCertifie,0);
    },true);
  }
  window.ouvrirResolutionAmbiguitesPdfBudgetSoft=function(rows,compte,meta,analyse){PA.rows=rows;PA.compte=compte;PA.meta=meta;afficher(analyse)};
  document.addEventListener('DOMContentLoaded',()=>{creerModal();surveillerBoutonImportPdf()});
})();
</script>
