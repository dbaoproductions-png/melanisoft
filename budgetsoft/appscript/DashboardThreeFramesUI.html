<script>
(function(){
  function fmt(v){return v==null?'—':(typeof money!=='undefined'?money.format(Number(v||0)):Number(v||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}));}
  function ech(v){return typeof echapper==='function'?echapper(v):String(v||'');}
  function dfr(v){return v?new Date(v).toLocaleDateString('fr-FR'):'—';}
  function installerStructure_(){const dash=document.getElementById('dashboard');if(!dash)return;dash.innerHTML='<div id="dashboard-three-frames" style="display:grid;gap:16px"><article class="card panel" id="dash-current"><div class="helper-text">Chargement du cycle courant…</div></article><article class="card panel" id="dash-forecast"><div class="helper-text">Chargement du prévisionnel…</div></article><article class="card panel" id="dash-previous"><div class="helper-text">Chargement du cycle précédent…</div></article></div>';}
  function carte_(titre,valeur,sousTitre){return `<div style="padding:14px 16px;border:1px solid var(--line);border-radius:14px;min-width:0"><span style="display:block;color:var(--muted);font-size:12px">${ech(titre)}</span><strong style="display:block;font-size:24px;margin:7px 0 4px">${valeur}</strong><small style="color:var(--muted)">${ech(sousTitre||'')}</small></div>`;}
  function grille_(contenu,n){return `<div style="display:grid;grid-template-columns:repeat(${n||4},minmax(0,1fr));gap:12px;margin-top:14px">${contenu}</div>`;}
  function listeCharges_(charges,titre){const items=(charges||[]).slice(0,8);if(!items.length)return '';return `<div style="margin-top:14px"><strong>${ech(titre||'Charges fixes à venir')}</strong>${items.map(x=>`<div style="display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)"><span>${dfr(x.date)} · ${ech(x.libelle)}</span><strong>${fmt(x.montant)}</strong></div>`).join('')}</div>`;}
  function rendre_(d){if(!d)return;window.__dashboardTroisCadresData=d;const c=d.cycleCourant||{},p=d.previsionnel||{},m=d.cyclePrecedent||{};
    const current=document.getElementById('dash-current');
    if(current) current.innerHTML=`<div class="panel-heading" style="margin-bottom:8px"><div><span class="panel-kicker">Cycle en cours</span><h2>${ech(c.libelle||'Cycle')}</h2></div><span class="badge">Jour ${c.jour||'—'}/${c.duree||'—'}</span></div><div style="font-size:16px;font-weight:700">${dfr(c.debut)} → ${dfr(c.fin)}</div><div class="helper-text" style="margin-top:6px">Données importées jusqu’au ${dfr(c.dateReference)}.</div>${grille_(carte_('Solde bancaire',fmt(c.soldeBancaire),c.dateSolde?'Au '+dfr(c.dateSolde):'Solde de relevé absent')+carte_('Charges fixes restantes',fmt(c.chargesFixesRestantes),(c.nombreChargesFixes||0)+' charge(s) à venir')+carte_('Solde engagé',fmt(c.soldeEngage),'Solde après charges fixes connues')+carte_('Épargne du cycle',fmt(c.epargne),'Revenus moins dépenses déjà constatés'),4)}${listeCharges_(c.detailChargesFixes,'Charges fixes encore prévues dans ce cycle')}`;
    const detail=listeCharges_(p.detailCharges,'Charges fixes prévues avant le prochain salaire');
    const forecast=document.getElementById('dash-forecast');
    if(forecast) forecast.innerHTML=`<div class="panel-heading" style="margin-bottom:8px"><div><span class="panel-kicker">Prévisionnel</span><h2>Jusqu’au prochain salaire</h2></div><span class="badge">${p.nombreCharges||0} charge(s) fixe(s)</span></div><div class="helper-text">Projection à partir de la dernière donnée importée jusqu’à la fin du cycle.</div>${grille_(carte_('Solde de départ',fmt(p.soldeDepart),p.dateSolde?'Au '+dfr(p.dateSolde):'Solde inconnu')+carte_('Charges à venir',fmt(p.chargesRestantes),'Charges fixes restantes')+carte_('Solde projeté',fmt(p.soldeProjete),'Avant le prochain salaire'),3)}${detail||'<div class="success-box" style="margin-top:14px">Aucune charge fixe restante détectée sur ce cycle.</div>'}`;
    const previous=document.getElementById('dash-previous');
    if(previous) previous.innerHTML=`<div class="panel-heading" style="margin-bottom:8px"><div><span class="panel-kicker">Cycle précédent</span><h2>${ech(m.libelle||'Cycle précédent')}</h2></div><span class="badge">${m.operations||0} opération(s)</span></div><div style="font-size:16px;font-weight:700">${dfr(m.debut)} → ${dfr(m.fin)}</div>${grille_(carte_('Revenus',fmt(m.revenus),'Cycle précédent')+carte_('Dépenses',fmt(m.depenses),'Cycle précédent')+carte_('Épargne',fmt(m.epargne),'Revenus moins dépenses'),3)}`;
    if(typeof rendreListeOperations==='function'&&document.getElementById('operation-type-filter')?.value==='charges_a_venir')rendreListeOperations();
  }
  function chargerTroisCadres_(){google.script.run.withSuccessHandler(rendre_).withFailureHandler(e=>{const z=document.getElementById('dash-current');if(z)z.innerHTML='<div class="error">Erreur dashboard : '+ech(e.message||e)+'</div>';}).chargerDashboardReel();}
  window.chargerDashboardTroisCadres=chargerTroisCadres_;
  document.addEventListener('DOMContentLoaded',()=>{installerStructure_();setTimeout(chargerTroisCadres_,250);});
  const ancienRendre=typeof rendreDashboard==='function'?rendreDashboard:null;if(ancienRendre){window.rendreDashboard=function(data){ancienRendre(data);installerStructure_();setTimeout(chargerTroisCadres_,50);};}
  const refresh=document.getElementById('refresh-button');if(refresh)refresh.addEventListener('click',()=>setTimeout(chargerTroisCadres_,250));
})();
</script>
