<script>
(function(){
  function fmt(v){return v==null||v===''?'—':(typeof money!=='undefined'?money.format(Number(v)):Number(v).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}));}
  function ech(v){return typeof echapper==='function'?echapper(v):String(v==null?'':v);}
  function dfr(v){return v?new Date(String(v).length===10?v+'T12:00:00':v).toLocaleDateString('fr-FR'):'—';}
  function structure(){const d=document.getElementById('dashboard');if(d)d.innerHTML='<div id="dashboard-three-frames" style="display:grid;gap:16px"><article class="card panel" id="dash-current">Chargement…</article><article class="card panel" id="dash-forecast">Chargement…</article><article class="card panel" id="dash-previous">Chargement…</article></div>';}
  function carte(t,v,s,fort){return `<div style="padding:14px 16px;border:1px solid var(--line);border-radius:14px;min-width:0"><span style="display:block;color:var(--muted);font-size:12px">${ech(t)}</span><strong style="display:block;font-size:${fort?'30':'23'}px;margin:7px 0 4px;overflow-wrap:anywhere">${v}</strong><small style="color:var(--muted)">${ech(s||'')}</small></div>`;}
  function grille(x,n){return `<div style="display:grid;grid-template-columns:repeat(${n},minmax(0,1fr));gap:12px;margin-top:14px">${x}</div>`;}
  function ratio(a,b){return `${fmt(a)} / ${fmt(b)}`;}
  function render(d){
    const c=d&&d.courtTerme||{},s=d&&d.cycleSuivant||{},p=d&&d.cyclePrecedent||{},a=document.getElementById('dash-current'),b=document.getElementById('dash-forecast'),z=document.getElementById('dash-previous');
    if(a)a.innerHTML=`<div class="panel-heading"><div><span class="panel-kicker">Priorité</span><h2>Chiffres clés de ${ech((c.libelle||'').replace(/\s+\d{4}$/,''))}</h2></div><span class="badge" style="font-size:20px;font-weight:800;padding:8px 13px">${ech(c.progression||'—')} jours</span></div><div class="helper-text">${ech(c.libelle||'Cycle')} · ${dfr(c.debut)} → ${dfr(c.fin)} · données au ${dfr(c.dateReference)}</div>${grille(
      carte('Solde bancaire réel',fmt(c.soldeBancaire),'Valeur comptable canonique')+
      carte('Solde prévisionnel à mi-cycle',fmt(c.soldeMiCycle),'Projection au milieu du cycle')+
      carte('Solde prévisionnel au dernier jour',fmt(c.soldeFinCycle),'Projection au '+dfr(c.fin))+
      carte('Recettes au jour J / attendues',ratio(c.revenusConstates,c.revenusAttendus),'Constaté / projection du cycle')+
      carte('Dépenses au jour J / attendues',ratio(c.depensesConstatees,c.depensesAttendues),'Constaté / projection du cycle'),5)}${grille(
      carte('CB différées engagées',fmt(c.cbDifferees),c.nombreCb==null?'Source Cerbère':(c.nombreCb||0)+' opération(s)')+
      carte('Prélèvements bancaires à venir',fmt(c.prelevements),(c.nombrePrelevements||0)+' opération(s)')+
      carte('Charges fixes restantes',fmt(c.chargesFixes),(c.nombreCharges||0)+' charge(s)')+
      carte('Pilotable encore disponible',fmt(c.pilotableDisponible),'Source Cerbère Express',true)+
      carte('Pilotable disponible par jour',fmt(c.pilotableParJour),c.joursRestants?'Sur '+c.joursRestants+' jour(s)':'Fin du cycle',true),5)}${grille(carte('Résultat constaté du cycle',fmt(c.resultat),'Recettes - dépenses bancaires réelles'),1)}`;
    if(b)b.innerHTML=`<div class="panel-heading"><div><span class="panel-kicker">Anticipation</span><h2>Cycle suivant · ${ech(s.libelle||'')}</h2></div><span class="badge">Prévision</span></div><div class="helper-text">${dfr(s.debut)} → ${dfr(s.fin)}</div>${grille(
      carte('Solde prévisionnel à J1',fmt(s.soldeJ1),'Premier jour du cycle')+
      carte('Solde prévisionnel à mi-cycle',fmt(s.soldeMiCycle),'Milieu du cycle')+
      carte('Solde prévisionnel au dernier jour',fmt(s.soldeFinCycle),'Fin du cycle')+
      carte('Recettes prévisionnelles',fmt(s.revenusPrevisionnels),'Projection connue')+
      carte('Dépenses prévisionnelles',fmt(s.depensesPrevisionnelles),'Projection connue')+
      carte('CB différées engagées',fmt(s.cbDifferees),'Déjà engagées pour ce cycle')+
      carte('Pilotable prévisionnel',fmt(s.pilotablePrevisionnel),'Source Cerbère Express',true),4)}`;
    if(z)z.innerHTML=`<div class="panel-heading"><div><span class="panel-kicker">Repère</span><h2>Cycle précédent · ${ech(p.libelle||'')}</h2></div><span class="badge">${p.operations||0} opération(s)</span></div><div class="helper-text">${dfr(p.debut)} → ${dfr(p.fin)}</div>${grille(
      carte('Solde à J1',fmt(p.soldeJ1),'Premier jour du cycle')+
      carte('Solde à mi-cycle',fmt(p.soldeMiCycle),'Milieu du cycle')+
      carte('Solde au dernier jour',fmt(p.soldeFinCycle),'Fin du cycle')+
      carte('Recettes',fmt(p.revenus),'Constaté')+
      carte('Dépenses',fmt(p.depenses),'Constaté')+
      carte('CB différées engagées',fmt(p.cbDifferees),p.cbDifferees==null?'Historique non encore publié':'Constaté')+
      carte('Pilotable initial du cycle',fmt(p.pilotableInitial),p.pilotableInitial==null?'Historique non encore publié':'Source Cerbère'),4)}`;
  }
  function charger(){google.script.run.withSuccessHandler(render).withFailureHandler(e=>{const x=document.getElementById('dash-current');if(x)x.innerHTML='<div class="error">Erreur dashboard : '+ech(e&&e.message||e)+'</div>';}).chargerDashboardSyntheseV3BudgetSoft20260907();}
  window.chargerDashboardTroisCadres=charger;document.addEventListener('DOMContentLoaded',()=>{structure();setTimeout(charger,250);});const ancien=typeof rendreDashboard==='function'?rendreDashboard:null;if(ancien)window.rendreDashboard=function(data){ancien(data);structure();setTimeout(charger,50);};const r=document.getElementById('refresh-button');if(r)r.addEventListener('click',()=>setTimeout(charger,250));
})();
</script>
