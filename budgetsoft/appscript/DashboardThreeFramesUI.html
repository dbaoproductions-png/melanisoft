<script>
(function(){
 function fmt(v){return v==null?'—':(typeof money!=='undefined'?money.format(Number(v||0)):Number(v||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}));} function ech(v){return typeof echapper==='function'?echapper(v):String(v||'');} function dfr(v){return v?new Date(v).toLocaleDateString('fr-FR'):'—';}
 function structure(){const d=document.getElementById('dashboard');if(d)d.innerHTML='<div id="dashboard-three-frames" style="display:grid;gap:16px"><article class="card panel" id="dash-current">Chargement…</article><article class="card panel" id="dash-forecast">Chargement…</article><article class="card panel" id="dash-previous">Chargement…</article></div>';}
 function carte(t,v,s,fort){return `<div style="padding:14px 16px;border:1px solid var(--line);border-radius:14px"><span style="display:block;color:var(--muted);font-size:12px">${ech(t)}</span><strong style="display:block;font-size:${fort?'30':'23'}px;margin:7px 0 4px">${v}</strong><small style="color:var(--muted)">${ech(s||'')}</small></div>`;} function grille(x,n){return `<div style="display:grid;grid-template-columns:repeat(${n},minmax(0,1fr));gap:12px;margin-top:14px">${x}</div>`;}
 function rendre(d){const c=d.courtTerme||{},s=d.cycleSuivant||{},p=d.cyclePrecedent||{},a=document.getElementById('dash-current'),b=document.getElementById('dash-forecast'),z=document.getElementById('dash-previous');
  if(a)a.innerHTML=`<div class="panel-heading"><div><span class="panel-kicker">Priorité</span><h2>Tenir jusqu’au prochain salaire</h2></div><span class="badge">${c.joursRestants||0} jour(s) à tenir</span></div><div class="helper-text">${ech(c.libelle||'Cycle')} · ${dfr(c.debut)} → ${dfr(c.fin)} · données au ${dfr(c.dateReference)}</div>${grille(carte('Solde bancaire réel',fmt(c.soldeBancaire),c.dateSolde?'Au '+dfr(c.dateSolde):'')+carte('CB différées engagées',fmt(c.cbDifferees),(c.nombreCb||0)+' opération(s)')+carte('Prélèvements bancaires à venir',fmt(c.prelevements),(c.nombrePrelevements||0)+' opération(s)')+carte('Charges fixes restantes',fmt(c.chargesFixes),(c.nombreCharges||0)+' charge(s)')+carte('Reste réellement disponible',fmt(c.disponible),'Après tous les engagements connus',true),5)}${grille(carte('Budget disponible par jour',fmt(c.budgetJour),c.joursRestants?'Sur '+c.joursRestants+' jour(s)':'Fin du cycle')+carte('Résultat constaté du cycle',fmt(c.epargne),'Revenus - dépenses bancaires réelles'),2)}`;
  if(b)b.innerHTML=`<div class="panel-heading"><div><span class="panel-kicker">Anticipation</span><h2>Cycle suivant · ${ech(s.libelle||'')}</h2></div><span class="badge">Déjà engagé</span></div><div class="helper-text">${dfr(s.debut)} → ${dfr(s.fin)}. Projection limitée aux éléments déjà connus : revenus réguliers estimés, charges fixes et cartes différées.</div>${grille(carte('Salaire attendu',fmt(s.salaireAttendu),'Moyenne des 6 derniers salaires nets versés')+carte('CB différées déjà engagées',fmt(s.cbDifferees),(s.nombreCb||0)+' opération(s)')+carte('Charges fixes prévues',fmt(s.chargesFixes),(s.nombreCharges||0)+' échéance(s) dans le cycle')+carte('Marge avant dépenses variables',fmt(s.marge),'Reste théorique après engagements connus',true),4)}<div class="helper-text" style="margin-top:12px">Les courses, loisirs et autres dépenses variables futures ne sont pas encore déduits : cette marge n’est donc pas un budget libre définitif.</div>`;
  if(z)z.innerHTML=`<div class="panel-heading"><div><span class="panel-kicker">Repère</span><h2>Cycle précédent · ${ech(p.libelle||'')}</h2></div><span class="badge">${p.operations||0} opération(s)</span></div><div class="helper-text">${dfr(p.debut)} → ${dfr(p.fin)}</div>${grille(carte('Revenus',fmt(p.revenus),'Cycle terminé')+carte('Dépenses',fmt(p.depenses),'Cycle terminé')+carte('Résultat',fmt(p.epargne),'Revenus - dépenses'),3)}`;
 }
 function fusionnerEngagements(d,e){if(!d||!d.courtTerme||!e)return d;const c=d.courtTerme;c.cbDifferees=Number(e.cbDifferees||0);c.nombreCb=Number(e.nombreCb||0);c.prelevements=Number(e.prelevements||0);c.nombrePrelevements=Number(e.nombrePrelevements||0);c.chargesFixes=Number(e.chargesFixesRestantes||0);c.nombreCharges=Number(e.nombreChargesFixesRestantes||0);if(c.soldeFiable){c.disponible=Math.round((Number(c.soldeBancaire||0)-c.cbDifferees-c.prelevements-c.chargesFixes)*100)/100;c.budgetJour=c.joursRestants>0?Math.round((c.disponible/c.joursRestants)*100)/100:c.disponible;}return d;}
 function charger(){google.script.run.withSuccessHandler(d=>{google.script.run.withSuccessHandler(e=>rendre(fusionnerEngagements(d,e))).withFailureHandler(()=>rendre(d)).chargerEngagementsBancairesFuturs();}).withFailureHandler(e=>{const x=document.getElementById('dash-current');if(x)x.innerHTML='<div class="error">Erreur dashboard : '+ech(e.message||e)+'</div>';}).chargerDashboardReelV2();}
 window.chargerDashboardTroisCadres=charger;document.addEventListener('DOMContentLoaded',()=>{structure();setTimeout(charger,250);});const ancien=typeof rendreDashboard==='function'?rendreDashboard:null;if(ancien)window.rendreDashboard=function(data){ancien(data);structure();setTimeout(charger,50);};const r=document.getElementById('refresh-button');if(r)r.addEventListener('click',()=>setTimeout(charger,250));
})();
</script>
