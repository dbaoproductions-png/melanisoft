<script>
(function(){
  let analyseHelloBank=null;
  function remplirComptesHelloBank_(){const s=document.getElementById('hello-bank-account');if(!s||!state.data)return;const comptes=(state.data.Comptes||[]).filter(c=>estActif(c.actif));s.innerHTML=comptes.map(c=>`<option value="${echapperAttribut(c.id)}">${echapper(c.nom)}</option>`).join('');}
  function ouvrir_(){analyseHelloBank=null;remplirComptesHelloBank_();document.getElementById('hello-bank-text').value='';document.getElementById('hello-bank-results').classList.add('hidden');document.getElementById('hello-bank-confirm').classList.add('hidden');document.getElementById('hello-bank-modal').classList.remove('hidden');setTimeout(()=>document.getElementById('hello-bank-text').focus(),50);}
  function fermer_(){document.getElementById('hello-bank-modal').classList.add('hidden');}
  function analyser_(){const b=document.getElementById('hello-bank-analyze');b.disabled=true;google.script.run.withSuccessHandler(r=>{b.disabled=false;analyseHelloBank=r;rendre_(r);}).withFailureHandler(e=>{b.disabled=false;afficherErreur(e.message||String(e));}).analyserCollerHelloBank(document.getElementById('hello-bank-text').value,document.getElementById('hello-bank-account').value);}
  function rendre_(r){const z=document.getElementById('hello-bank-results');z.classList.remove('hidden');document.getElementById('hello-bank-summary').innerHTML=`<div class="import-stat"><span>Détectées</span><strong>${r.total||0}</strong></div><div class="import-stat"><span>À importer</span><strong>${r.importables||0}</strong></div><div class="import-stat"><span>Doublons</span><strong>${r.doublons||0}</strong></div><div class="import-stat"><span>Déjà couverts</span><strong>${r.avantReleve||0}</strong></div>`+`<div class="success-box" style="margin-top:12px">Crédits à importer : <strong>${money.format(r.revenus||0)}</strong> · Débits : <strong>${money.format(r.depenses||0)}</strong> · Net : <strong>${money.format(r.net||0)}</strong>${r.dateDernierReleve?'<br>Dernier relevé connu : '+formaterDate(r.dateDernierReleve):''}</div>`;
    const lignes=(r.lignes||[]);document.getElementById('hello-bank-preview').innerHTML=lignes.slice(0,30).map((l,i)=>`<div class="import-row ${l.valide?'':'invalid'}"><span>${formaterDate(l.date)}</span><div><strong>${echapper(l.libelle)}</strong><small>${l.doublon?'Doublon détecté':(l.avantReleve?'Déjà couvert par le dernier relevé':'Prête à importer')}</small></div><span>${money.format(l.type==='depense'?-Math.abs(l.montant):Math.abs(l.montant))}</span><select onchange="window.__helloAction(${i},this.value)" ${l.valide?'':'disabled'}><option value="importer" ${l.action==='importer'?'selected':''}>Importer</option><option value="ignorer" ${l.action==='ignorer'?'selected':''}>Ignorer</option></select></div>`).join('')+(lignes.length>30?`<div class="helper-text">${lignes.length-30} autre(s) opération(s) non affichée(s) dans l’aperçu.</div>`:'');document.getElementById('hello-bank-confirm').classList.toggle('hidden',!(r.importables>0));}
  window.__helloAction=function(i,a){if(analyseHelloBank&&analyseHelloBank.lignes&&analyseHelloBank.lignes[i])analyseHelloBank.lignes[i].action=a;};
  function importer_(){if(!analyseHelloBank)return;const b=document.getElementById('hello-bank-confirm');b.disabled=true;b.textContent='Import en cours…';google.script.run.withSuccessHandler(r=>{b.disabled=false;b.textContent='Importer';document.getElementById('hello-bank-results').innerHTML=`<div class="success-box"><strong>Import terminé</strong><br>${r.importees||0} opération(s) importée(s), ${r.ignorees||0} ignorée(s).${(r.erreurs||[]).length?'<br>'+echapper(r.erreurs.join(' | ')):''}</div>`;setTimeout(()=>{fermer_();charger();ouvrirVue('operations');if(typeof chargerDashboardTroisCadres==='function')chargerDashboardTroisCadres();},1200);}).withFailureHandler(e=>{b.disabled=false;b.textContent='Importer';afficherErreur(e.message||String(e));}).importerCollerHelloBank(analyseHelloBank.lignes);}
  document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('import-hello-bank-button');if(b)b.addEventListener('click',ouvrir_);document.getElementById('close-hello-bank-modal')?.addEventListener('click',fermer_);document.getElementById('cancel-hello-bank')?.addEventListener('click',fermer_);document.getElementById('hello-bank-analyze')?.addEventListener('click',analyser_);document.getElementById('hello-bank-confirm')?.addEventListener('click',importer_);document.getElementById('hello-bank-modal')?.addEventListener('click',e=>{if(e.target.id==='hello-bank-modal')fermer_();});});
})();
</script>
