<script>
(function(){'use strict';
  const COLORS={vert:'#2f7d63',orange:'#c18a25',rouge:'#ba5148'};
  function montant(txt){
    const s=String(txt||'').replace(/[^0-9,.-]/g,'').replace(/\.(?=.*\.)/g,'').replace(',','.');
    const n=Number(s);return Number.isFinite(n)?n:0;
  }
  function dateFrCourte(s){
    const m=String(s||'').trim().match(/^(\d{2})\/(\d{2})\/(\d{2,4})$/);if(!m)return null;
    const y=Number(m[3])<100?2000+Number(m[3]):Number(m[3]);
    return new Date(y,Number(m[2])-1,Number(m[1]),12);
  }
  function progressionCycle(cycle){
    const txt=cycle&&cycle.querySelector('header > span')?cycle.querySelector('header > span').textContent:'';
    const m=String(txt||'').match(/(\d{2}\/\d{2}\/\d{2,4})\s*→\s*(\d{2}\/\d{2}\/\d{2,4})/);if(!m)return 0;
    const a=dateFrCourte(m[1]),z=dateFrCourte(m[2]),n=new Date();if(!a||!z)return 0;
    const day=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000;
    const jours=Math.max(1,Math.round(day(z)-day(a))+1),jour=Math.max(1,Math.min(jours,Math.floor(day(n)-day(a))+1));
    return jour/jours;
  }
  function niveau(allocation,consomme,progression){
    if(consomme>allocation+.009||(allocation<=0&&consomme>0))return'rouge';
    if(allocation>0&&consomme/allocation>progression+.0001)return'orange';
    return'vert';
  }
  function libellesP2(){
    const c2=document.getElementById('c4-1');if(!c2)return;
    const walker=document.createTreeWalker(c2,NodeFilter.SHOW_TEXT);
    let n;while((n=walker.nextNode())){if(n.nodeValue&&/\bP1\b/.test(n.nodeValue))n.nodeValue=n.nodeValue.replace(/\bP1\b/g,'P2');}
  }
  function appliquer(){
    libellesP2();
    document.querySelectorAll('.c4-cycle').forEach(cycle=>{
      const prog=progressionCycle(cycle);
      cycle.querySelectorAll('.c4-line').forEach(row=>{
        const range=row.querySelector('.c4-range');if(!range)return;
        const spans=row.querySelectorAll(':scope > span');
        const reel=spans.length>1?Math.max(0,montant(spans[1].textContent)):0;
        const allocation=Math.max(0,Number(range.value||0));
        const n=niveau(allocation,reel,prog);
        range.dataset.traffic=n;
        range.style.accentColor=COLORS[n];
        row.classList.toggle('traffic-orange',n==='orange');
        row.classList.toggle('traffic-rouge',n==='rouge');
      });
    });
  }
  let timer=0;function planifier(){clearTimeout(timer);timer=setTimeout(appliquer,20);}
  document.addEventListener('input',e=>{if(e.target&&e.target.classList&&e.target.classList.contains('c4-range'))planifier();},true);
  document.addEventListener('change',planifier,true);
  new MutationObserver(planifier).observe(document.documentElement,{subtree:true,childList:true,characterData:true});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',appliquer);else appliquer();
  const st=document.createElement('style');st.textContent='.c4-range[data-traffic="orange"]{accent-color:#c18a25}.c4-range[data-traffic="rouge"]{accent-color:#ba5148}.c4-line.traffic-orange [data-reste]{color:#926509;font-weight:800}.c4-line.traffic-rouge [data-reste]{color:#a73f38;font-weight:800}';document.head.appendChild(st);
})();

/*
 * Supradoctrine BudgetSoft 2026-09-06 :
 * - l'écran Opérations suit la date comptable ; une ligne future reste dans « Futures » ;
 * - Cerbère/Cerbère Express conservent seuls leur lecture anticipée des achats CB ;
 * - les groupes de crédits affichent leurs agrégats, sans recalcul autonome dans l'UI.
 */
(function(){'use strict';
  const VERSION='2026-09-06.1';
  const finAujourdhui=()=>{const d=new Date();d.setHours(23,59,59,999);return d;};
  const dateComptable=o=>{const v=o&&((o.date_comptable!==undefined&&o.date_comptable!==null&&o.date_comptable!=='')?o.date_comptable:o.date);const d=v?new Date(v):null;return d&&!isNaN(d)?d:null;};
  const estComptabilisee=o=>{const d=dateComptable(o);return !d||d<=finAujourdhui();};

  function installerDoctrineOperations(){
    const courant=window.operationsFiltrees;
    if(typeof courant!=='function'||courant.__dateComptable20260906)return;
    const completBase=typeof courant.__complet==='function'?courant.__complet:courant;
    const completFiltre=function(){return (completBase.apply(this,arguments)||[]).filter(estComptabilisee);};
    const filtre=function(){return (courant.apply(this,arguments)||[]).filter(estComptabilisee);};
    filtre.__dateComptable20260906=true;
    if(courant.__limiteOperations20260828)filtre.__limiteOperations20260828=true;
    filtre.__complet=completFiltre;
    window.operationsFiltrees=filtre;
    try{if(window.state&&state.currentView==='operations'&&typeof rendreListeOperations==='function')rendreListeOperations();}catch(e){}
  }

  const euro=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
  let creditsEnCours=false,creditsCache=null,creditsCacheAt=0;
  function poserTotal(h2,label,valeur){
    const panel=h2&&h2.closest('.panel');if(!panel)return;
    const heading=panel.querySelector('.panel-heading');if(!heading)return;
    let badge=heading.querySelector('[data-credit-total-20260906="'+label+'"]');
    if(!badge){badge=document.createElement('div');badge.dataset.creditTotal20260906=label;badge.className='credit-group-total-20260906';heading.appendChild(badge);}
    badge.innerHTML='<span>'+label+'</span><strong>'+euro(valeur)+'</strong>';
  }
  function appliquerTotauxCredits(data){
    const zone=document.getElementById('generic-view');if(!zone||!data)return;
    const hs=[...zone.querySelectorAll('.panel-heading h2')];
    const hAm=hs.find(h=>/Crédits amortissables/i.test(h.textContent||''));
    const hRev=hs.find(h=>/Crédits renouvelables/i.test(h.textContent||''));
    const am=Array.isArray(data.amortissables)?data.amortissables:[];
    const rev=Array.isArray(data.renouvelables)?data.renouvelables:[];
    const capitalAm=am.reduce((s,c)=>s+Math.max(0,Number(c&&c.capital_restant||0)),0);
    const encoursRev=rev.reduce((s,c)=>s+Math.max(0,Number(c&&c.capital_restant||0)),0);
    if(hAm)poserTotal(hAm,'Capital restant dû',capitalAm);
    if(hRev)poserTotal(hRev,'Encours total',encoursRev);
  }
  function chargerTotauxCredits(){
    const zone=document.getElementById('generic-view');
    if(!zone||!/[Cc]rédits amortissables/.test(zone.textContent||''))return;
    if(creditsCache&&Date.now()-creditsCacheAt<15000){appliquerTotauxCredits(creditsCache);return;}
    if(creditsEnCours)return;creditsEnCours=true;
    google.script.run.withSuccessHandler(d=>{creditsEnCours=false;creditsCache=d;creditsCacheAt=Date.now();appliquerTotauxCredits(d);}).withFailureHandler(()=>{creditsEnCours=false;}).chargerCreditsEtDettesV2();
  }

  const style=document.createElement('style');style.textContent='.credit-group-total-20260906{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:2px}.credit-group-total-20260906 span{font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.04em}.credit-group-total-20260906 strong{font-size:18px;color:#183d32}';document.head.appendChild(style);
  function tick(){installerDoctrineOperations();chargerTotauxCredits();}
  document.addEventListener('DOMContentLoaded',()=>setTimeout(tick,300));
  document.addEventListener('click',e=>{if(e.target.closest?.('.nav-item[data-view]'))setTimeout(tick,180);},true);
  new MutationObserver(()=>{clearTimeout(window.__budgetsoftDoctrineTick);window.__budgetsoftDoctrineTick=setTimeout(tick,80);}).observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(tick,900);
  console.log('[BudgetSoft supradoctrine UI] '+VERSION);
})();
</script>
