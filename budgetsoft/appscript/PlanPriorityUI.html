<script>
(function(){
'use strict';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const yes=v=>v===true||String(v)==='true'; let data=null,edit=null;
function afficherPlanV4(){
 const z=document.getElementById('generic-view');
 z.innerHTML='<article class="card panel plan-v4"><div class="panel-heading"><div><span class="panel-kicker">Stratégie · exécution · réel</span><h2>Plan / Actions</h2></div><button class="primary-button" id="pv4-add">＋ Action</button></div><p class="helper-text">Les objectifs donnent la direction. Les actions restent simples, datées et quantifiables ; BudgetSoft suit ensuite leur réalisation et recalcule le plan.</p><div id="pv4-body" class="loading">Recalcul du plan…</div></article>';
 document.getElementById('pv4-add').onclick=()=>ouvrirAction();
 google.script.run.withSuccessHandler(d=>{data=d;render()}).withFailureHandler(e=>document.getElementById('pv4-body').textContent='Erreur : '+(e.message||e)).chargerPlanActionsV4();
 style();
}
window.budgetsoftModules=window.budgetsoftModules||{};window.budgetsoftModules.plan=afficherPlanV4;
function render(){const z=document.getElementById('pv4-body'),g=data.gains||{};z.className='';z.innerHTML=`<div class="pv4-metrics"><div><small>GAIN ACQUIS</small><b>${eur(g.mensuel_acquis)}/mois</b><span>${eur(g.annuel_acquis)}/an</span></div><div><small>GAIN ATTENDU</small><b>${eur(g.mensuel_attendu)}/mois</b><span>${eur(g.annuel_attendu)}/an</span></div><div><small>ACTIONS</small><b>${data.actions.length}</b><span>${data.objectifs.length} objectif(s)</span></div></div><div class="pv4-title"><div><span class="panel-kicker">Objectifs et actions</span><h3>Ce que nous voulons changer</h3></div></div>${data.groupes.map(grp).join('')}${data.sansObjectif.length?`<div class="pv4-goal"><div class="pv4-goalhead"><b>Actions sans objectif</b></div>${data.sansObjectif.map(row).join('')}</div>`:''}<div class="pv4-events"><div class="pv4-title"><div><span class="panel-kicker">Les impondérables de la vie</span><h3>Événements</h3><p class="helper-text">Ce qui arrive au budget, en positif ou en négatif, sans être une décision stratégique.</p></div><button class="primary-button" id="pv4-event">＋ Événement</button></div><div class="pv4-eventgrid">${(data.evenements||[]).map(ev).join('')||'<div class="empty-state">Aucun événement.</div>'}</div></div>`;document.getElementById('pv4-event').onclick=ouvrirEvenement;z.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>ouvrirAction(data.actions.find(a=>String(a.id)===b.dataset.action)));}
function grp(x){const i=x.impact||{};return `<div class="pv4-goal"><div class="pv4-goalhead"><div><b>${esc(x.objectif.nom)}</b><small>${esc(x.objectif.statut||'Actif')}</small></div><div><strong>${eur(i.mensuel_confirme)}/mois confirmé</strong><small>+ ${eur(i.mensuel_attendu)}/mois attendu · ${eur(i.annuel_confirme)}/an</small></div></div>${x.actions.map(row).join('')||'<div class="empty-state">Aucune action liée.</div>'}</div>`}
function row(a){return `<button class="pv4-action" data-action="${esc(a.id)}"><div><span class="pv4-state ${yes(a.impact_confirme)?'ok':'wait'}">${yes(a.impact_confirme)?'Confirmée':'À confirmer'}</span><b>${esc(a.libelle)}</b><small>${esc(a.nature_action||'Action')}${a.source_libelle?' · '+esc(a.source_libelle):''}${yes(a.processus)?' · Processus V'+esc(a.version_processus||1):''}</small></div><div><b>${eur(a.impact_montant)}${a.impact_frequence==='mensuel'?'/mois':''}</b><small>→ ${esc(a.affectation||'Projet')}</small></div><span>›</span></button>`}
function ev(e){const n=e.type==='depense'?-Math.abs(Number(e.montant||0)):Math.abs(Number(e.montant||0));return `<div class="pv4-event"><small>${esc(e.type)} · ${esc(String(e.date_effet||'').slice(0,10))}</small><b>${esc(e.libelle)}</b><strong>${eur(n)}</strong></div>`}
function ouvrirAction(a){edit=a||null;const m=document.createElement('div');m.className='modal';m.id='pv4-modal';m.innerHTML=`<div class="modal-card wide-modal"><div class="modal-heading"><div><p class="panel-kicker">${a?'Suivi et ajustement':'Nouvelle action'}</p><h2>${esc(a?.libelle||'Action')}</h2></div><button class="modal-close" id="pv4-x">×</button></div><div class="form-grid"><label class="full-field">Action<input id="pv4-l" value="${esc(a?.libelle||'')}"></label><label>Objectif<select id="pv4-o"><option value="">— Aucun —</option>${data.objectifs.map(o=>`<option value="${esc(o.id)}" ${String(a?.objectif_id)==String(o.id)?'selected':''}>${esc(o.nom)}</option>`).join('')}</select></label><label>Nature de l'action<select id="pv4-n">${[['supprimer','Supprimer'],['remplacer','Remplacer'],['reduire','Réduire'],['augmenter','Augmenter'],['creer','Créer'],['deplacer','Déplacer / renégocier'],['autre','Autre']].map(x=>`<option value="${x[0]}" ${a?.nature_action===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><label>Affectation<input id="pv4-af" value="${esc(a?.affectation||a?.projet||'Projet')}"></label><label>Statut<select id="pv4-st">${['À instruire','Décidée','En cours','Effective','Abandonnée'].map(s=>`<option ${a?.statut===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="source-box"><strong>Rapprochement BudgetSoft</strong><div class="source-search"><input id="pv4-q" placeholder="Deezer, MNT, Oney…" value="${esc(a?.source_libelle||'')}"><button class="secondary-button" id="pv4-search">Rechercher</button></div><div id="pv4-results"></div></div><div class="form-grid"><label>Impact<select id="pv4-it"><option value="baisse_charge">Baisse de charge</option><option value="hausse_revenu" ${a?.impact_type==='hausse_revenu'?'selected':''}>Hausse de revenu</option><option value="hausse_charge" ${a?.impact_type==='hausse_charge'?'selected':''}>Hausse de charge</option><option value="reservation_objectif" ${a?.impact_type==='reservation_objectif'?'selected':''}>Réservation objectif</option></select></label><label>Montant<input id="pv4-m" type="number" step="0.01" value="${Number(a?.impact_montant||0)}"></label><label>Fréquence<select id="pv4-f"><option value="mensuel">Mensuel</option><option value="ponctuel" ${a?.impact_frequence==='ponctuel'?'selected':''}>Ponctuel</option></select></label><label>Date d'effet<input id="pv4-d" type="date" value="${String(a?.date_effet||'').slice(0,10)}"></label><label class="checkbox-line full-field"><input type="checkbox" id="pv4-c" ${yes(a?.impact_confirme)?'checked':''}> <b>Impact confirmé</b> : montant et date suffisamment certains pour alimenter le prévisionnel</label><label class="checkbox-line full-field"><input type="checkbox" id="pv4-r" ${yes(a?.reevaluer_charges_fixes)?'checked':''}> Réévaluer les charges fixes lors de la validation</label><label class="checkbox-line full-field"><input type="checkbox" id="pv4-p" ${yes(a?.processus)?'checked':''}> Cette action nécessite un processus de résolution</label></div><div class="impact-preview" id="pv4-preview"></div><div id="pv4-resolution"></div><label>Commentaire<textarea id="pv4-com" rows="2">${esc(a?.commentaire||'')}</textarea></label><div class="form-actions"><button class="secondary-button" id="pv4-cancel">Annuler</button><button class="primary-button" id="pv4-save">Valider l'action</button></div></div>`;document.body.appendChild(m);m._source={type:a?.source_type||'',id:a?.source_id||'',libelle:a?.source_libelle||''};document.getElementById('pv4-x').onclick=document.getElementById('pv4-cancel').onclick=()=>m.remove();document.getElementById('pv4-search').onclick=search;document.getElementById('pv4-p').onchange=resolution;['pv4-m','pv4-f'].forEach(id=>document.getElementById(id).oninput=preview);document.getElementById('pv4-save').onclick=save;preview();resolution();}
function search(){google.script.run.withSuccessHandler(r=>{const z=document.getElementById('pv4-results');z.innerHTML=r.map((x,i)=>`<button class="source-hit" data-src="${i}"><b>${esc(x.libelle)}</b><span>${esc(x.detail)} · ${eur(x.montant)}${x.capital_restant?' · capital '+eur(x.capital_restant):''}</span></button>`).join('')||'<small>Aucune correspondance.</small>';z.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{const x=r[Number(b.dataset.src)],m=document.getElementById('pv4-modal');m._source=x;document.getElementById('pv4-q').value=x.libelle;document.getElementById('pv4-m').value=x.montant||0;if(x.type==='credit')document.getElementById('pv4-p').checked=true;preview();resolution();});}).rechercherSourceActionV3(document.getElementById('pv4-q').value)}
function preview(){const n=Number(document.getElementById('pv4-m')?.value||0),monthly=document.getElementById('pv4-f')?.value==='mensuel',z=document.getElementById('pv4-preview');if(z)z.innerHTML='<strong>Impact automatisé</strong>'+[1,3,6,12,36,60,120].map(h=>`<span>${h<12?h+' mois':h/12+' an'+(h>12?'s':'')}<b>${eur(monthly?n*h:n)}</b></span>`).join('')}
function resolution(){const z=document.getElementById('pv4-resolution');if(!z)return;if(!document.getElementById('pv4-p').checked){z.innerHTML='';return}if(!edit?.id){z.innerHTML='<div class="pv4-res"><b>Plan de résolution</b><small>Après enregistrement, BudgetSoft calculera automatiquement une proposition à partir des données disponibles à l’instant T.</small></div>';return}z.innerHTML='<div class="loading">BudgetSoft vérifie les données et P1–P6…</div>';google.script.run.withSuccessHandler(r=>{z.innerHTML=`<div class="pv4-res"><div><b>Plan de résolution proposé</b><small>Calculé à l’instant T · ${r.soutenable?'soutenable':'à ajuster'} · à valider</small></div>${r.etapes.map((e,i)=>`<div class="pv4-step"><span>${i+1}</span><div><b>${esc(e.libelle)}</b><small>${esc(e.statut)}</small></div></div>`).join('')}</div>`}).withFailureHandler(e=>z.textContent='Calcul impossible : '+(e.message||e)).proposerResolutionActionV4(edit.id,4)}
function save(){const m=document.getElementById('pv4-modal'),s=m._source||{};const d={id:edit?.id||'',libelle:document.getElementById('pv4-l').value,objectif_id:document.getElementById('pv4-o').value,nature_action:document.getElementById('pv4-n').value,affectation:document.getElementById('pv4-af').value||'Projet',projet:document.getElementById('pv4-af').value||'Projet',statut:document.getElementById('pv4-st').value,mode_impact:s.id?'adosse':'manuel',source_type:s.type||'',source_id:s.id||'',source_libelle:s.libelle||'',impact_type:document.getElementById('pv4-it').value,impact_montant:Number(document.getElementById('pv4-m').value||0),impact_frequence:document.getElementById('pv4-f').value,date_effet:document.getElementById('pv4-d').value,impact_confirme:document.getElementById('pv4-c').checked,reevaluer_charges_fixes:document.getElementById('pv4-r').checked,processus:document.getElementById('pv4-p').checked,commentaire:document.getElementById('pv4-com').value};google.script.run.withSuccessHandler(v=>{data=v;m.remove();render()}).withFailureHandler(e=>alert(e.message||e)).enregistrerActionPlanV4(d)}
function ouvrirEvenement(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-card"><div class="modal-heading"><div><p class="panel-kicker">Impondérable</p><h2>Nouvel événement</h2></div><button class="modal-close" id="pev-x">×</button></div><label>Libellé<input id="pev-l"></label><div class="form-grid"><label>Nature<select id="pev-t"><option value="recette">Positif / recette</option><option value="depense">Négatif / dépense</option></select></label><label>Montant<input id="pev-m" type="number" step="0.01"></label><label>Date d'effet<input id="pev-d" type="date"></label><label>Certitude<select id="pev-c"><option value="certaine">Certaine</option><option value="probable">Probable</option><option value="possible">Possible</option></select></label></div><div class="form-actions"><button class="secondary-button" id="pev-cancel">Annuler</button><button class="primary-button" id="pev-save">Enregistrer et recalculer</button></div></div>`;document.body.appendChild(m);document.getElementById('pev-x').onclick=document.getElementById('pev-cancel').onclick=()=>m.remove();document.getElementById('pev-save').onclick=()=>google.script.run.withSuccessHandler(v=>{data=v;m.remove();render()}).withFailureHandler(e=>alert(e.message||e)).enregistrerEvenementPlanV4({libelle:document.getElementById('pev-l').value,type:document.getElementById('pev-t').value,montant:Number(document.getElementById('pev-m').value||0),date_effet:document.getElementById('pev-d').value,certitude:document.getElementById('pev-c').value,statut:'Prévu'});}
function style(){if(document.getElementById('pv4-style'))return;const s=document.createElement('style');s.id='pv4-style';s.textContent=`.plan-v4{max-width:1180px;margin:auto}.pv4-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.pv4-metrics>div{background:#edf7f3;border-radius:14px;padding:16px}.pv4-metrics small,.pv4-metrics span,.pv4-metrics b{display:block}.pv4-metrics b{font-size:22px;color:#147d64;margin:4px 0}.pv4-title,.pv4-goalhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.pv4-goal{border:1px solid rgba(20,125,100,.15);border-radius:14px;overflow:hidden;margin:14px 0}.pv4-goalhead{background:#f7fbf9;padding:14px}.pv4-goalhead small{display:block;color:#6b7976;margin-top:3px}.pv4-goalhead>div:last-child{text-align:right}.pv4-action{width:100%;border:0;border-top:1px solid rgba(20,125,100,.1);background:white;padding:14px;display:grid;grid-template-columns:1fr auto 20px;gap:14px;text-align:left;align-items:center;cursor:pointer}.pv4-action b,.pv4-action small{display:block}.pv4-action>div:nth-child(2){text-align:right}.pv4-action small{color:#6b7976;margin-top:3px}.pv4-state{display:inline-block!important;font-size:11px;padding:3px 8px;border-radius:999px;margin-bottom:5px}.pv4-state.ok{background:#e3f5ed;color:#12664f}.pv4-state.wait{background:#fff3d6;color:#8a6200}.pv4-events{border-top:2px solid rgba(20,125,100,.15);margin-top:30px;padding-top:24px}.pv4-eventgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.pv4-event{border:1px solid rgba(20,125,100,.14);border-radius:12px;padding:13px}.pv4-event small,.pv4-event b,.pv4-event strong{display:block}.pv4-event strong{font-size:18px;margin-top:8px}.pv4-res{background:#f7fbf9;border-radius:14px;padding:15px;margin:15px 0}.pv4-res>small,.pv4-res>div>small{display:block;color:#6b7976;margin-top:3px}.pv4-step{display:flex;gap:12px;padding:11px 0;border-top:1px solid rgba(20,125,100,.12)}.pv4-step>span{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#147d64;color:white}.pv4-step small{display:block;color:#6b7976}@media(max-width:760px){.pv4-metrics,.pv4-eventgrid{grid-template-columns:1fr}.pv4-title,.pv4-goalhead{display:block}.pv4-action{grid-template-columns:1fr auto}.pv4-action>span{display:none}.pv4-goalhead>div:last-child{text-align:left;margin-top:8px}}`;document.head.appendChild(s)}
document.addEventListener('click',function(e){const b=e.target.closest&&e.target.closest('.nav-item[data-view="plan"]');if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('generic-view')?.classList.add('active');const t=document.getElementById('page-title');if(t)t.textContent='Plan / Actions';const eye=document.getElementById('page-eyebrow');if(eye)eye.textContent='Stratégie et prévision';afficherPlanV4();},true);
})();
</script>
