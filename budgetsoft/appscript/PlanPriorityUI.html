<script>
(function(){'use strict';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const Y=v=>v===true||String(v)==='true';let D=null;
function cats(v){return `<option value="">— Catégorie —</option>${(D?.categories||[]).map(c=>`<option ${String(c)===String(v||'')?'selected':''}>${E(c)}</option>`).join('')}`}
function load(){google.script.run.withSuccessHandler(d=>{D=d;render()}).withFailureHandler(e=>alert(e.message||e)).chargerPlanActionsV4()}
function show(){const z=document.getElementById('generic-view');document.getElementById('page-title').textContent='Planification';document.getElementById('page-eyebrow').textContent='Planification · Objectifs · Actions';z.innerHTML=`<article class="card panel plan-v4"><div class="panel-heading"><div><span class="panel-kicker">Planification · Objectifs · Actions</span><h2>Planification</h2><p class="helper-text">Un objectif regroupe les actions qui concourent au même résultat. Les gains sont agrégés automatiquement.</p></div><div><button class="secondary-button" id="po-new">＋ Objectif</button> <button class="primary-button" id="pa-new">＋ Nouvelle action</button></div></div><div id="pa-body" class="loading">Chargement…</div></article>`;document.getElementById('pa-new').onclick=()=>actionForm();document.getElementById('po-new').onclick=()=>objectifForm();load();style()}
window.budgetsoftModules=window.budgetsoftModules||{};window.budgetsoftModules.plan=show;
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.nav-item[data-view="plan"]');if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('generic-view').classList.add('active');show()},true);
function tools(kind,id){return `<span class="pa-tools"><button title="Modifier" data-edit-${kind}="${E(id)}">✎</button><button title="Supprimer" data-del-${kind}="${E(id)}">×</button></span>`}
function render(){const z=document.getElementById('pa-body'),g=D.gains||{};z.className='';z.innerHTML=`<div class="pa-metrics"><div><small>GAIN ACQUIS GLOBAL</small><b>${M(g.mensuel_acquis)}/mois</b></div><div><small>GAIN ATTENDU GLOBAL</small><b>${M(g.mensuel_attendu)}/mois</b></div><div><small>ACTIONS</small><b>${D.actions.length}</b><span>${D.objectifs.length} objectif(s)</span></div></div><h3>Objectifs → Actions</h3>${D.groupes.map(grp).join('')}${D.sansObjectif.length?`<section class="pa-goal"><div class="pa-goalhead"><b>Actions sans objectif</b></div>${D.sansObjectif.map(row).join('')}</section>`:''}<div class="pa-events"><div class="pa-title"><div><span class="panel-kicker">Les impondérables de la vie</span><h3>Événements</h3></div><button class="primary-button" id="pa-event">＋ Événement</button></div><div class="pa-eventgrid">${(D.evenements||[]).map(ev).join('')||'<div class="empty-state">Aucun événement.</div>'}</div></div>`;document.getElementById('pa-event').onclick=()=>eventForm();z.querySelectorAll('[data-edit-action]').forEach(b=>b.onclick=()=>actionForm(D.actions.find(a=>String(a.id)===b.dataset.editAction)));z.querySelectorAll('[data-del-action]').forEach(b=>b.onclick=()=>del('action',b.dataset.delAction));z.querySelectorAll('[data-edit-goal]').forEach(b=>b.onclick=()=>objectifForm(D.objectifs.find(o=>String(o.id)===b.dataset.editGoal)));z.querySelectorAll('[data-del-goal]').forEach(b=>b.onclick=()=>del('objectif',b.dataset.delGoal));z.querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>eventForm(D.evenements.find(x=>String(x.id)===b.dataset.editEvent)));z.querySelectorAll('[data-del-event]').forEach(b=>b.onclick=()=>del('evenement',b.dataset.delEvent));}
function grp(g){const i=g.impact||{};return `<section class="pa-goal"><div class="pa-goalhead"><div><b>${E(g.objectif.nom)}</b><small>${E(g.objectif.statut||'Actif')}</small></div><div class="pa-goal-gains"><span>Attendu <b>${M(i.mensuel_attendu)}/mois</b></span><span>Acquis <b>${M(i.mensuel_acquis)}/mois</b></span>${tools('goal',g.objectif.id)}</div></div>${g.actions.map(row).join('')||'<div class="empty-state">Aucune action.</div>'}</section>`}
function row(a){const frac=Y(a.fractionne)?` · ${E(a.nombre_fois||2)}× ${E(a.periodicite_fractionnement||'mensuel')}`:'';return `<div class="pa-row"><button data-edit-action="${E(a.id)}"><b>${E(a.libelle)}</b><small>${E(a.nature_action||'Action')} · ${E(a.categorie||'')} · ${M(a.impact_montant)}${a.impact_frequence==='mensuel'?'/mois':''}${a.mode_paiement?' · '+E(a.mode_paiement):''}${frac}${Y(a.processus)?' · processus V'+E(a.version_processus||1):''}</small></button>${tools('action',a.id)}</div>`}
function ev(e){const s=e.type==='depense'?-1:1,frac=Y(e.fractionne)?` · ${E(e.nombre_fois||2)}× ${E(e.periodicite_fractionnement||'mensuel')}`:'';return `<div class="pa-event"><div><small>${E(e.type)} · ${E(String(e.date_effet||'').slice(0,10))}${e.mode_paiement?' · '+E(e.mode_paiement):''}${frac}</small><b>${E(e.libelle)}</b><span>${E(e.categorie||'Sans catégorie')}</span></div><strong>${M(s*Math.abs(Number(e.montant||0)))}</strong>${tools('event',e.id)}</div>`}
function del(type,id){if(!confirm('Supprimer cet élément ?'))return;google.script.run.withSuccessHandler(v=>{D=v;render()}).withFailureHandler(e=>alert(e.message||e)).supprimerElementPlanV4(type,id)}
function objectifForm(o){o=o||{};const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-card compact-modal"><div class="modal-heading"><h2>${o.id?'Modifier':'Nouvel'} objectif</h2><button class="modal-close" id="ox">×</button></div><label>Objectif<input id="on" value="${E(o.nom||'')}" placeholder="Ex. Réduire l'endettement"></label><div class="form-grid"><label>Horizon<select id="oh">${['court','moyen','long'].map(x=>`<option value="${x}" ${o.horizon===x?'selected':''}>${x==='court'?'Court terme':x==='moyen'?'Moyen terme':'Long terme'}</option>`).join('')}</select></label><label>Priorité<select id="op">${['haute','moyenne','basse'].map(x=>`<option ${o.priorite===x?'selected':''}>${x}</option>`).join('')}</select></label></div><p class="helper-text">Gain attendu et gain acquis sont calculés automatiquement à partir des actions rattachées.</p><div class="form-actions"><button class="secondary-button" id="ocancel">Annuler</button><button class="primary-button" id="osave">Enregistrer</button></div></div>`;document.body.appendChild(m);document.getElementById('ox').onclick=document.getElementById('ocancel').onclick=()=>m.remove();document.getElementById('osave').onclick=()=>{const nom=document.getElementById('on').value.trim();if(!nom)return alert("Le nom de l'objectif est obligatoire.");google.script.run.withSuccessHandler(()=>{m.remove();load()}).withFailureHandler(e=>alert(e.message||e)).enregistrerObjectifPlan({id:o.id||'',nom,horizon:document.getElementById('oh').value,priorite:document.getElementById('op').value,statut:o.statut||'Actif'})}}
function actionForm(a){a=a||{};const m=document.createElement('div');m.className='modal';m.id='pa-action-modal';m._source={type:a.source_type||'',id:a.source_id||'',libelle:a.source_libelle||'',categorie:a.categorie||''};m.innerHTML=`<div class="modal-card wide-modal compact-modal"><div class="modal-heading"><h2>${a.id?'Modifier':'Nouvelle'} action</h2><button class="modal-close" id="ax">×</button></div><div class="form-grid"><label class="full-field">Action<input id="al" value="${E(a.libelle||'')}"></label><label>Objectif<select id="ao"><option value="">— Aucun —</option>${D.objectifs.map(o=>`<option value="${E(o.id)}" ${String(a.objectif_id)==String(o.id)?'selected':''}>${E(o.nom)}</option>`).join('')}</select></label><label>Nature<select id="an">${[['supprimer','Supprimer'],['remplacer','Remplacer'],['reduire','Réduire'],['rembourser','Rembourser / solder'],['augmenter','Augmenter'],['creer','Créer'],['deplacer','Déplacer / renégocier'],['autre','Autre']].map(x=>`<option value="${x[0]}" ${a.nature_action===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><label>Catégorie<select id="ac">${cats(a.categorie)}</select></label><label>Statut<select id="ast">${['À instruire','Décidée','En cours','Effective','Abandonnée'].map(x=>`<option ${a.statut===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="source-box"><strong>Rapprochement BudgetSoft</strong><div class="source-search"><input id="aq" placeholder="Deezer, MNT, Oney…" value="${E(a.source_libelle||'')}"><button class="secondary-button" id="asearch">Rechercher</button></div><div id="aresults"></div></div><div class="form-grid"><label>Impact<select id="ait"><option value="baisse_charge" ${a.impact_type==='baisse_charge'?'selected':''}>Baisse de charge</option><option value="hausse_revenu" ${a.impact_type==='hausse_revenu'?'selected':''}>Hausse de revenu</option><option value="hausse_charge" ${a.impact_type==='hausse_charge'?'selected':''}>Hausse de charge</option><option value="reservation_objectif" ${a.impact_type==='reservation_objectif'?'selected':''}>Réservation objectif</option></select></label><label>Montant total<input id="am" type="number" step="0.01" value="${Number(a.impact_montant||0)}"></label><label>Date / 1re échéance<input id="ad" type="date" value="${String(a.date_effet||'').slice(0,10)}"></label><label>Mode de paiement<select id="ap">${['CB','Chèque','Virement','Prélèvement','Espèces','Autre'].map(x=>`<option ${a.mode_paiement===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Fréquence de l'impact<select id="af"><option value="ponctuel" ${a.impact_frequence!=='mensuel'?'selected':''}>Ponctuel</option><option value="mensuel" ${a.impact_frequence==='mensuel'?'selected':''}>Mensuel</option></select></label><label class="checkbox-line full-field"><input type="checkbox" id="aconf" ${Y(a.impact_confirme)?'checked':''}> Impact confirmé : alimente le prévisionnel</label><label class="checkbox-line full-field"><input type="checkbox" id="areval" ${Y(a.reevaluer_charges_fixes)?'checked':''}> Réévaluer CF0 si cette action modifie une charge fixe</label><label class="checkbox-line full-field"><input type="checkbox" id="aproc" ${Y(a.processus)?'checked':''}> Cette action nécessite un processus de résolution</label><label class="checkbox-line full-field"><input type="checkbox" id="afr" ${Y(a.fractionne)?'checked':''}> Paiement / encaissement en plusieurs fois</label><div id="afrbox" class="full-field form-grid"><label>Périodicité<select id="aper"><option value="mensuel" ${a.periodicite_fractionnement!=='annuel'?'selected':''}>Mensuel</option><option value="annuel" ${a.periodicite_fractionnement==='annuel'?'selected':''}>Annuel</option></select></label><label>Nombre de fois<select id="anb">${Array.from({length:11},(_,i)=>i+2).map(n=>`<option value="${n}" ${Number(a.nombre_fois||2)===n?'selected':''}>${n}</option>`).join('')}</select></label></div></div><div id="aprev" class="event-preview"></div><details id="ares-wrap" ${Y(a.processus)?'open':''}><summary>Plan de résolution</summary><div id="ares"></div></details><label>Commentaire<textarea id="acom" rows="2">${E(a.commentaire||'')}</textarea></label><div class="form-actions"><button class="secondary-button" id="acancel">Annuler</button><button class="primary-button" id="asave">Enregistrer</button></div></div>`;document.body.appendChild(m);const upd=()=>{document.getElementById('afrbox').style.display=document.getElementById('afr').checked?'grid':'none';const total=Math.abs(Number(document.getElementById('am').value||0)),n=document.getElementById('afr').checked?Number(document.getElementById('anb').value||2):1;document.getElementById('aprev').innerHTML=total?`<small>Prévision Cerbère</small><b>${n===1?M(total):n+' échéances d’environ '+M(total/n)}</b>`:''};const res=()=>{const z=document.getElementById('ares');if(!document.getElementById('aproc').checked){z.innerHTML='';return;}const s=m._source||{};z.innerHTML='<div class="loading">Calcul du plan…</div>';const runner=google.script.run.withSuccessHandler(r=>{z.innerHTML=`<div class="pa-res"><b>Plan proposé</b><small>Capital ${M(r.capital_restant)} · disponibilités ${M(r.disponibilites_mobilisables)} · ${r.soutenable?'soutenable':'à ajuster'}</small>${(r.echeancier||[]).map(e=>`<span>${E(e.libelle)} : ${M(e.montant_prevu)}</span>`).join('')}</div>`}).withFailureHandler(e=>z.textContent='Calcul impossible : '+(e.message||e));if((s.type==='credit'||s.type==='dette')&&s.id)runner.proposerResolutionSourceV4(s.type,s.id,4,[]);else if(a.id)runner.proposerResolutionActionV4(a.id,4,[]);else z.innerHTML='<small>Rapprochez l’action à un crédit ou une dette pour calculer un échéancier.</small>'};document.getElementById('ax').onclick=document.getElementById('acancel').onclick=()=>m.remove();document.getElementById('afr').onchange=upd;document.getElementById('aproc').onchange=()=>{document.getElementById('ares-wrap').open=document.getElementById('aproc').checked;res()};['am','anb','aper'].forEach(id=>document.getElementById(id).oninput=upd);document.getElementById('asearch').onclick=()=>google.script.run.withSuccessHandler(r=>{const z=document.getElementById('aresults');z.innerHTML=r.map((x,i)=>`<button class="source-hit" data-src="${i}"><b>${E(x.libelle)}</b><span>${E(x.detail||'')} · ${M(x.montant)}${x.categorie?' · '+E(x.categorie):''}</span></button>`).join('')||'<small>Aucune correspondance.</small>';z.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{const x=r[Number(b.dataset.src)];m._source=x;document.getElementById('aq').value=x.libelle;if(x.categorie)document.getElementById('ac').value=x.categorie;if(x.type==='credit'||x.type==='dette'){document.getElementById('an').value='rembourser';document.getElementById('ac').value='Crédits';document.getElementById('aproc').checked=true;document.getElementById('ares-wrap').open=true;}res();});}).withFailureHandler(e=>alert(e.message||e)).rechercherSourceActionV4(document.getElementById('aq').value);document.getElementById('asave').onclick=()=>{const s=m._source||{},d={id:a.id||'',libelle:document.getElementById('al').value,objectif_id:document.getElementById('ao').value,nature_action:document.getElementById('an').value,categorie:document.getElementById('ac').value,statut:document.getElementById('ast').value,mode_impact:s.id?'adosse':'manuel',source_type:s.type||'',source_id:s.id||'',source_libelle:s.libelle||'',impact_type:document.getElementById('ait').value,impact_montant:Number(document.getElementById('am').value||0),impact_frequence:document.getElementById('af').value,date_effet:document.getElementById('ad').value,mode_paiement:document.getElementById('ap').value,fractionne:document.getElementById('afr').checked,periodicite_fractionnement:document.getElementById('aper').value,nombre_fois:Number(document.getElementById('anb').value||1),impact_confirme:document.getElementById('aconf').checked,reevaluer_charges_fixes:document.getElementById('areval').checked,processus:document.getElementById('aproc').checked,commentaire:document.getElementById('acom').value};google.script.run.withSuccessHandler(v=>{D=v;m.remove();render()}).withFailureHandler(e=>alert(e.message||e)).enregistrerActionPlanV4(d)};upd();res()}
function eventForm(e){e=e||{};const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-card compact-modal"><div class="modal-heading"><h2>${e.id?'Modifier':'Nouvel'} événement</h2><button class="modal-close" id="ex">×</button></div><div class="form-grid"><label class="full-field">Libellé<input id="el" value="${E(e.libelle||'')}"></label><label>Nature<select id="et"><option value="depense" ${e.type==='depense'?'selected':''}>Dépense</option><option value="recette" ${e.type==='recette'?'selected':''}>Recette</option></select></label><label>Catégorie<select id="ec">${cats(e.categorie)}</select></label><label>Montant total<input id="em" type="number" step="0.01" value="${Number(e.montant||0)}"></label><label>Date / 1re échéance<input id="ed" type="date" value="${String(e.date_effet||'').slice(0,10)}"></label><label>Mode de paiement<select id="ep">${['CB','Chèque','Virement','Prélèvement','Espèces','Autre'].map(x=>`<option ${e.mode_paiement===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Certitude<select id="ece">${['certaine','probable','possible'].map(x=>`<option ${e.certitude===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Statut<select id="es">${['Prévu','Réalisé','Rapproché','Annulé'].map(x=>`<option ${e.statut===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="checkbox-line full-field"><input type="checkbox" id="ef" ${Y(e.fractionne)?'checked':''}> Paiement / encaissement en plusieurs fois</label><div id="efbox" class="full-field form-grid"><label>Périodicité<select id="eper"><option value="mensuel" ${e.periodicite_fractionnement!=='annuel'?'selected':''}>Mensuel</option><option value="annuel" ${e.periodicite_fractionnement==='annuel'?'selected':''}>Annuel</option></select></label><label>Nombre de fois<select id="en">${Array.from({length:11},(_,i)=>i+2).map(n=>`<option value="${n}" ${Number(e.nombre_fois||2)===n?'selected':''}>${n}</option>`).join('')}</select></label></div></div><div id="eprev" class="event-preview"></div><label>Commentaire<textarea id="ecom" rows="2">${E(e.commentaire||'')}</textarea></label><div class="form-actions"><button class="secondary-button" id="ecancel">Annuler</button><button class="primary-button" id="esave">Enregistrer</button></div></div>`;document.body.appendChild(m);const upd=()=>{document.getElementById('efbox').style.display=document.getElementById('ef').checked?'grid':'none';const total=Math.abs(Number(document.getElementById('em').value||0)),n=document.getElementById('ef').checked?Number(document.getElementById('en').value||2):1;document.getElementById('eprev').innerHTML=total?`<small>Prévision Cerbère</small><b>${n===1?M(total):n+' échéances d’environ '+M(total/n)}</b>`:''};document.getElementById('ex').onclick=document.getElementById('ecancel').onclick=()=>m.remove();document.getElementById('ef').onchange=upd;['em','en','eper'].forEach(id=>document.getElementById(id).oninput=upd);document.getElementById('esave').onclick=()=>{const d={id:e.id||'',libelle:document.getElementById('el').value,type:document.getElementById('et').value,categorie:document.getElementById('ec').value,montant:Number(document.getElementById('em').value||0),date_effet:document.getElementById('ed').value,mode_paiement:document.getElementById('ep').value,certitude:document.getElementById('ece').value,statut:document.getElementById('es').value,fractionne:document.getElementById('ef').checked,periodicite_fractionnement:document.getElementById('eper').value,nombre_fois:Number(document.getElementById('en').value||1),recurrence:document.getElementById('ef').checked?document.getElementById('eper').value:'ponctuel',commentaire:document.getElementById('ecom').value};google.script.run.withSuccessHandler(v=>{D=v;m.remove();render()}).withFailureHandler(x=>alert(x.message||x)).enregistrerEvenementPlanV4(d)};upd()}
function style(){if(document.getElementById('pa-style'))return;const s=document.createElement('style');s.id='pa-style';s.textContent=`.plan-v4{max-width:1180px;margin:auto}.pa-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.pa-metrics>div{background:#edf7f3;border-radius:14px;padding:16px}.pa-metrics b,.pa-metrics small,.pa-metrics span{display:block}.pa-goal{border:1px solid rgba(20,125,100,.15);border-radius:14px;margin:14px 0;overflow:hidden}.pa-goalhead,.pa-title{display:flex;justify-content:space-between;align-items:center;padding:12px}.pa-goalhead small{display:block;color:#6b7976}.pa-goal-gains{display:flex;align-items:center;gap:14px}.pa-goal-gains span{font-size:12px}.pa-goal-gains b{display:block}.pa-row{display:flex;border-top:1px solid #e7efec}.pa-row>button{flex:1;border:0;background:#fff;text-align:left;padding:12px}.pa-row small{display:block;color:#687773}.pa-tools{display:inline-flex;gap:4px}.pa-tools button{border:0;background:transparent;cursor:pointer}.pa-events{margin-top:28px}.pa-eventgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pa-event{border:1px solid #dce8e3;border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr auto auto;gap:8px}.compact-modal{max-height:86vh;overflow:auto}.event-preview,.pa-res{background:#f7fbf9;border-radius:10px;padding:10px;margin:10px 0}.event-preview b,.pa-res b,.pa-res small,.pa-res span{display:block}.source-hit{display:block;width:100%;text-align:left;border:0;border-top:1px solid #e5ece9;background:#fff;padding:8px}.source-hit span{display:block;font-size:12px;color:#687773}@media(max-width:800px){.pa-metrics,.pa-eventgrid{grid-template-columns:1fr}.pa-goalhead,.pa-goal-gains{display:block}.pa-goal-gains span{margin-top:6px}}`;document.head.appendChild(s)}
})();
</script>
