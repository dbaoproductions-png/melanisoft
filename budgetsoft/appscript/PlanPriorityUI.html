<script>
(function(){
'use strict';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const yes=v=>v===true||String(v)==='true';let data=null,edit=null,resolutionTimer=null;
function reload(){google.script.run.withSuccessHandler(d=>{data=d;render()}).withFailureHandler(e=>alert(e.message||e)).chargerPlanActionsV4()}
function cats(selected){return `<option value="">— Catégorie —</option>${(data?.categories||[]).map(c=>`<option ${String(c)===String(selected||'')?'selected':''}>${esc(c)}</option>`).join('')}`}
function afficherPlanV4(){const z=document.getElementById('generic-view'),t=document.getElementById('page-title'),e=document.getElementById('page-eyebrow'),n=document.querySelector('.nav-item[data-view="plan"] span');if(t)t.textContent='Planification';if(e)e.textContent='Planification · Objectifs · Actions';if(n)n.textContent='Planification';z.innerHTML=`<article class="card panel plan-v4"><div class="panel-heading"><div><span class="panel-kicker">Planification · Objectifs · Actions</span><h2>Planification</h2></div><div><button class="secondary-button" id="pv4-add-goal">＋ Nouvel objectif</button> <button class="primary-button" id="pv4-add">＋ Nouvelle action</button></div></div><p class="helper-text">Les objectifs donnent la direction. Les actions restent simples, datées et quantifiables ; BudgetSoft suit leur réalisation et recalcule la planification.</p><div id="pv4-body" class="loading">Recalcul de la planification…</div></article>`;document.getElementById('pv4-add').onclick=()=>ouvrirAction();document.getElementById('pv4-add-goal').onclick=()=>ouvrirObjectif();reload();style()}
window.budgetsoftModules=window.budgetsoftModules||{};window.budgetsoftModules.plan=afficherPlanV4;
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.nav-item[data-view="plan"]');if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('generic-view').classList.add('active');afficherPlanV4()},true);
function tools(type,id){return `<span class="pv4-tools"><button title="Modifier" data-edit-${type}="${esc(id)}">✎</button><button title="Supprimer" data-del-${type}="${esc(id)}">×</button></span>`}
function render(){const z=document.getElementById('pv4-body'),g=data.gains||{};z.className='';z.innerHTML=`<div class="pv4-metrics"><div><small>GAIN ACQUIS</small><b>${eur(g.mensuel_acquis)}/mois</b><span>${eur(g.annuel_acquis)}/an</span></div><div><small>GAIN ATTENDU</small><b>${eur(g.mensuel_attendu)}/mois</b><span>${eur(g.annuel_attendu)}/an</span></div><div><small>ACTIONS</small><b>${data.actions.length}</b><span>${data.objectifs.length} objectif(s)</span></div></div><div class="pv4-title"><div><span class="panel-kicker">Objectifs → Actions</span><h3>Ce que nous voulons changer</h3></div></div>${data.groupes.map(grp).join('')}${data.sansObjectif.length?`<div class="pv4-goal"><div class="pv4-goalhead"><b>Actions sans objectif</b></div>${data.sansObjectif.map(row).join('')}</div>`:''}<div class="pv4-events"><div class="pv4-title"><div><span class="panel-kicker">Les impondérables de la vie</span><h3>Événements</h3><p class="helper-text">Ce qui arrive au budget, en positif ou en négatif, sans être une décision stratégique.</p></div><button class="primary-button" id="pv4-event">＋ Événement</button></div><div class="pv4-eventgrid">${(data.evenements||[]).map(ev).join('')||'<div class="empty-state">Aucun événement.</div>'}</div></div>`;document.getElementById('pv4-event').onclick=()=>ouvrirEvenement();z.querySelectorAll('[data-edit-action]').forEach(b=>b.onclick=()=>ouvrirAction(data.actions.find(a=>String(a.id)===b.dataset.editAction)));z.querySelectorAll('[data-del-action]').forEach(b=>b.onclick=()=>del('action',b.dataset.delAction));z.querySelectorAll('[data-edit-goal]').forEach(b=>b.onclick=()=>ouvrirObjectif(data.objectifs.find(o=>String(o.id)===b.dataset.editGoal)));z.querySelectorAll('[data-del-goal]').forEach(b=>b.onclick=()=>del('objectif',b.dataset.delGoal));z.querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>ouvrirEvenement(data.evenements.find(e=>String(e.id)===b.dataset.editEvent)));z.querySelectorAll('[data-del-event]').forEach(b=>b.onclick=()=>del('evenement',b.dataset.delEvent))}
function grp(x){const i=x.impact||{};return `<div class="pv4-goal"><div class="pv4-goalhead"><div class="pv4-name"><div><b>${esc(x.objectif.nom)}</b><small>${esc(x.objectif.statut||'Actif')}</small></div>${tools('goal',x.objectif.id)}</div><div><strong>${eur(i.mensuel_confirme)}/mois confirmé</strong><small>+ ${eur(i.mensuel_attendu)}/mois attendu · ${eur(i.annuel_confirme)}/an</small></div></div>${x.actions.map(row).join('')||'<div class="empty-state">Aucune action liée.</div>'}</div>`}
function labelNature(v){return ({supprimer:'Supprimer',remplacer:'Remplacer',reduire:'Réduire',augmenter:'Augmenter',creer:'Créer',deplacer:'Déplacer / renégocier',rembourser:'Rembourser / solder',autre:'Autre'})[v]||'Action'}
function row(a){return `<div class="pv4-action"><button class="pv4-action-main" data-edit-action="${esc(a.id)}"><div><span class="pv4-state ${yes(a.impact_confirme)?'ok':'wait'}">${yes(a.impact_confirme)?'Confirmée':'À confirmer'}</span><b>${esc(a.libelle)}</b><small>${esc(labelNature(a.nature_action))}${a.categorie?' · '+esc(a.categorie):''}${a.source_libelle?' · '+esc(a.source_libelle):''}${yes(a.processus)?' · Processus V'+esc(a.version_processus||1):''}</small></div><div><b>${eur(a.impact_montant)}${a.impact_frequence==='mensuel'?'/mois':''}</b></div></button>${tools('action',a.id)}</div>`}
function ev(e){const n=e.type==='depense'?-Math.abs(Number(e.montant||0)):Math.abs(Number(e.montant||0)),done=String(e.statut)==='Rapproché';return `<div class="pv4-event"><div><small>${esc(e.type)} · ${esc(String(e.date_effet||'').slice(0,10))}${e.categorie?' · '+esc(e.categorie):''}</small><b>${esc(e.libelle)}</b><span class="pv4-state ${done?'ok':'wait'}">${esc(e.statut||'Prévu')}</span></div><strong>${eur(n)}</strong>${tools('event',e.id)}</div>`}
function del(type,id){if(!confirm('Supprimer cet élément ?'))return;google.script.run.withSuccessHandler(v=>{data=v;render()}).withFailureHandler(e=>alert(e.message||e)).supprimerElementPlanV4(type,id)}
function ouvrirObjectif(o){o=o||{};const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-card"><div class="modal-heading"><div><p class="panel-kicker">Planification · niveau 1</p><h2>${o.id?'Modifier':'Nouvel'} objectif</h2></div><button class="modal-close" id="pgo-x">×</button></div><label>Objectif<input id="pgo-n" value="${esc(o.nom||'')}" placeholder="Ex. Diminuer les charges fixes"></label><div class="form-grid"><label>Horizon<select id="pgo-h">${['court','moyen','long'].map(x=>`<option ${o.horizon===x?'selected':''} value="${x}">${x==='court'?'Court terme':x==='moyen'?'Moyen terme':'Long terme'}</option>`).join('')}</select></label><label>Priorité<select id="pgo-p">${['haute','moyenne','basse'].map(x=>`<option ${o.priorite===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="form-actions"><button class="secondary-button" id="pgo-cancel">Annuler</button><button class="primary-button" id="pgo-save">Enregistrer</button></div></div>`;document.body.appendChild(m);document.getElementById('pgo-x').onclick=document.getElementById('pgo-cancel').onclick=()=>m.remove();document.getElementById('pgo-save').onclick=()=>{const nom=document.getElementById('pgo-n').value.trim();if(!nom)return alert("Le nom de l'objectif est obligatoire.");google.script.run.withSuccessHandler(()=>{m.remove();reload()}).withFailureHandler(e=>alert(e.message||e)).enregistrerObjectifPlan({id:o.id||'',nom,horizon:document.getElementById('pgo-h').value,priorite:document.getElementById('pgo-p').value,statut:o.statut||'Actif'})}}
function ouvrirAction(a){edit=a||null;const m=document.createElement('div');m.className='modal';m.id='pv4-modal';m.innerHTML=`<div class="modal-card wide-modal compact-modal"><div class="modal-heading"><div><p class="panel-kicker">${a?'Suivi et ajustement':'Planification · nouvelle action'}</p><h2>${esc(a?.libelle||'Action')}</h2></div><button class="modal-close" id="pv4-x">×</button></div><div class="form-grid"><label class="full-field">Action<input id="pv4-l" value="${esc(a?.libelle||'')}"></label><label>Objectif<select id="pv4-o"><option value="">— Aucun —</option>${data.objectifs.map(o=>`<option value="${esc(o.id)}" ${String(a?.objectif_id)==String(o.id)?'selected':''}>${esc(o.nom)}</option>`).join('')}</select></label><label>Nature<select id="pv4-n">${[['supprimer','Supprimer'],['remplacer','Remplacer'],['reduire','Réduire'],['rembourser','Rembourser / solder'],['augmenter','Augmenter'],['creer','Créer'],['deplacer','Déplacer / renégocier'],['autre','Autre']].map(x=>`<option value="${x[0]}" ${a?.nature_action===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><label>Catégorie<select id="pv4-cat">${cats(a?.categorie)}</select></label><label>Statut<select id="pv4-st">${['À instruire','Décidée','En cours','Effective','Abandonnée'].map(s=>`<option ${a?.statut===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="source-box"><strong>Rapprochement BudgetSoft</strong><div class="source-search"><input id="pv4-q" placeholder="Deezer, MNT, Oney…" value="${esc(a?.source_libelle||'')}"><button class="secondary-button" id="pv4-search">Rechercher</button></div><div id="pv4-results"></div></div><div class="form-grid"><label>Impact<select id="pv4-it"><option value="baisse_charge">Baisse de charge</option><option value="hausse_revenu" ${a?.impact_type==='hausse_revenu'?'selected':''}>Hausse de revenu</option><option value="hausse_charge" ${a?.impact_type==='hausse_charge'?'selected':''}>Hausse de charge</option><option value="reservation_objectif" ${a?.impact_type==='reservation_objectif'?'selected':''}>Réservation objectif</option></select></label><label>Montant<input id="pv4-m" type="number" step="0.01" value="${Number(a?.impact_montant||0)}"></label><label>Fréquence<select id="pv4-f"><option value="mensuel">Mensuel</option><option value="ponctuel" ${a?.impact_frequence==='ponctuel'?'selected':''}>Ponctuel</option></select></label><label>Date d'effet<input id="pv4-d" type="date" value="${String(a?.date_effet||'').slice(0,10)}"></label><label class="checkbox-line full-field"><input type="checkbox" id="pv4-c" ${yes(a?.impact_confirme)?'checked':''}> <b>Impact confirmé</b> : alimente le prévisionnel</label><label class="checkbox-line full-field"><input type="checkbox" id="pv4-r" ${yes(a?.reevaluer_charges_fixes)?'checked':''}> Réévaluer les charges fixes lors de la validation</label><label class="checkbox-line full-field"><input type="checkbox" id="pv4-p" ${yes(a?.processus)?'checked':''}> Cette action nécessite un processus de résolution</label></div><div class="impact-preview" id="pv4-preview"></div><details id="pv4-resolution-wrap" ${yes(a?.processus)?'open':''}><summary>Plan de résolution</summary><div id="pv4-resolution"></div></details><label>Commentaire<textarea id="pv4-com" rows="2">${esc(a?.commentaire||'')}</textarea></label><div class="form-actions"><button class="secondary-button" id="pv4-cancel">Annuler</button><button class="primary-button" id="pv4-save">Valider l'action</button></div></div>`;document.body.appendChild(m);m._source={type:a?.source_type||'',id:a?.source_id||'',libelle:a?.source_libelle||'',categorie:a?.categorie||''};document.getElementById('pv4-x').onclick=document.getElementById('pv4-cancel').onclick=()=>m.remove();document.getElementById('pv4-search').onclick=search;document.getElementById('pv4-p').onchange=()=>{document.getElementById('pv4-resolution-wrap').open=document.getElementById('pv4-p').checked;resolution()};['pv4-m','pv4-f'].forEach(id=>document.getElementById(id).oninput=preview);document.getElementById('pv4-save').onclick=save;preview();resolution()}
function search(){google.script.run.withSuccessHandler(r=>{const z=document.getElementById('pv4-results');z.innerHTML=r.map((x,i)=>`<button class="source-hit" data-src="${i}"><b>${esc(x.libelle)}</b><span>${esc(x.detail)} · ${eur(x.montant)}${x.capital_restant?' · capital '+eur(x.capital_restant):''}${x.categorie?' · '+esc(x.categorie):''}</span></button>`).join('')||'<small>Aucune correspondance.</small>';z.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{const x=r[Number(b.dataset.src)],m=document.getElementById('pv4-modal');m._source=x;document.getElementById('pv4-q').value=x.libelle;document.getElementById('pv4-m').value=x.montant||0;if(x.categorie)document.getElementById('pv4-cat').value=x.categorie;if(x.type==='credit'||x.type==='dette'){document.getElementById('pv4-n').value='rembourser';document.getElementById('pv4-cat').value='Crédits';document.getElementById('pv4-p').checked=true;document.getElementById('pv4-resolution-wrap').open=true;document.getElementById('pv4-f').value='ponctuel'}preview();resolution()})}).withFailureHandler(e=>alert(e.message||e)).rechercherSourceActionV4(document.getElementById('pv4-q').value)}
function preview(){const n=Number(document.getElementById('pv4-m')?.value||0),monthly=document.getElementById('pv4-f')?.value==='mensuel',z=document.getElementById('pv4-preview');if(z)z.innerHTML='<strong>Impact automatisé</strong>'+[1,3,6,12,36,60,120].map(h=>`<span>${h<12?h+' mois':h/12+' an'+(h>12?'s':'')}<b>${eur(monthly?n*h:n)}</b></span>`).join('')}
function collectReels(){return [...document.querySelectorAll('[data-res-real]')].map(x=>Number(x.value||0))}
function showResolution(r){const z=document.getElementById('pv4-resolution');if(!z)return;z.innerHTML=`<div class="pv4-res"><div><b>Plan de résolution proposé</b><small>Capital ${eur(r.capital_restant)} · disponibilités ${eur(r.disponibilites_mobilisables)} · ${r.soutenable?'soutenable':'à ajuster'} · à valider</small></div>${r.echeancier?.length?`<div class="res-grid"><b>Période</b><b>Proposé</b><b>Réel</b>${r.echeancier.map((e,i)=>`<span>${esc(e.libelle||('P'+(i+1)))}</span><input data-res-plan="${i}" type="number" step="0.01" value="${Number(e.montant_prevu||0)}"><input data-res-real="${i}" type="number" step="0.01" value="${Number(e.montant_reel||0)}">`).join('')}</div>`:''}${r.non_couvert>0?`<small class="warn">Reste non couvert : ${eur(r.non_couvert)}</small>`:''}</div>`;z.querySelectorAll('[data-res-real]').forEach(inp=>inp.onchange=()=>{clearTimeout(resolutionTimer);resolutionTimer=setTimeout(resolution,250)})}
function resolution(){const z=document.getElementById('pv4-resolution');if(!z)return;if(!document.getElementById('pv4-p').checked){z.innerHTML='';return}const s=document.getElementById('pv4-modal')._source||{},reels=collectReels();z.innerHTML='<div class="loading">BudgetSoft vérifie les données et P1–P6…</div>';const runner=google.script.run.withSuccessHandler(showResolution).withFailureHandler(e=>z.textContent='Calcul impossible : '+(e.message||e));if((s.type==='credit'||s.type==='dette')&&s.id)runner.proposerResolutionSourceV4(s.type,s.id,4,reels);else if(edit?.id)runner.proposerResolutionActionV4(edit.id,4,reels);else z.innerHTML='<div class="pv4-res"><small>Rapprochez l’action avec un crédit ou une dette pour obtenir un échéancier calculé.</small></div>'}
function save(){const m=document.getElementById('pv4-modal'),s=m._source||{},plans=[...document.querySelectorAll('[data-res-plan]')],reels=[...document.querySelectorAll('[data-res-real]')],d={id:edit?.id||'',libelle:document.getElementById('pv4-l').value,objectif_id:document.getElementById('pv4-o').value,nature_action:document.getElementById('pv4-n').value,categorie:document.getElementById('pv4-cat').value,statut:document.getElementById('pv4-st').value,mode_impact:s.id?'adosse':'manuel',source_type:s.type||'',source_id:s.id||'',source_libelle:s.libelle||'',impact_type:document.getElementById('pv4-it').value,impact_montant:Number(document.getElementById('pv4-m').value||0),impact_frequence:document.getElementById('pv4-f').value,date_effet:document.getElementById('pv4-d').value,impact_confirme:document.getElementById('pv4-c').checked,reevaluer_charges_fixes:document.getElementById('pv4-r').checked,processus:document.getElementById('pv4-p').checked,commentaire:document.getElementById('pv4-com').value};if(plans.length)d.etapes=plans.map((x,i)=>({libelle:'Échéance '+(i+1),date_prevue:'',montant_prevu:Number(x.value||0),montant_reel:Number(reels[i]?.value||0),statut:Number(reels[i]?.value||0)>0?'Réalisée':'Prévue'}));google.script.run.withSuccessHandler(v=>{data=v;m.remove();render()}).withFailureHandler(e=>alert(e.message||e)).enregistrerActionPlanV4(d)}
function ouvrirEvenement(e){e=e||{};const m=document.createElement('div');m.className='modal';m.id='pev-modal';m.innerHTML=`<div class="modal-card compact-modal"><div class="modal-heading"><div><p class="panel-kicker">Événement</p><h2>${e.id?'Modifier':'Nouvel'} événement</h2></div><button class="modal-close" id="pev-x">×</button></div><div class="form-grid"><label class="full-field">Libellé<input id="pev-l" value="${esc(e.libelle||'')}"></label><label>Nature<select id="pev-t"><option value="depense" ${e.type==='depense'?'selected':''}>Dépense</option><option value="recette" ${e.type==='recette'?'selected':''}>Recette</option></select></label><label>Catégorie<select id="pev-cat">${cats(e.categorie)}</select></label><label>Montant<input id="pev-m" type="number" step="0.01" value="${Number(e.montant||0)}"></label><label>Date d'effet<input id="pev-d" type="date" value="${String(e.date_effet||'').slice(0,10)}"></label><label>Certitude<select id="pev-c">${['certaine','probable','possible'].map(x=>`<option ${e.certitude===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Récurrence<select id="pev-r"><option value="ponctuel">Ponctuel</option><option value="annuel" ${e.recurrence==='annuel'?'selected':''}>Annuel</option><option value="mensuel" ${e.recurrence==='mensuel'?'selected':''}>Mensuel</option></select></label><label>Statut<select id="pev-st">${['Prévu','Réalisé','Rapproché','Annulé'].map(x=>`<option ${e.statut===x?'selected':''}>${x}</option>`).join('')}</select></label></div><label>Commentaire<textarea id="pev-com" rows="2">${esc(e.commentaire||'')}</textarea></label><div id="pev-match"></div><div class="form-actions">${e.id&&e.statut!=='Rapproché'?'<button class="secondary-button" id="pev-link">Rapprocher avec une opération</button>':''}<button class="secondary-button" id="pev-cancel">Annuler</button><button class="primary-button" id="pev-save">Enregistrer</button></div></div>`;document.body.appendChild(m);document.getElementById('pev-x').onclick=document.getElementById('pev-cancel').onclick=()=>m.remove();if(document.getElementById('pev-link'))document.getElementById('pev-link').onclick=()=>chercherOperationEvenement(e);document.getElementById('pev-save').onclick=()=>{const d={id:e.id||'',libelle:document.getElementById('pev-l').value,type:document.getElementById('pev-t').value,categorie:document.getElementById('pev-cat').value,montant:Number(document.getElementById('pev-m').value||0),date_effet:document.getElementById('pev-d').value,certitude:document.getElementById('pev-c').value,recurrence:document.getElementById('pev-r').value,statut:document.getElementById('pev-st').value,commentaire:document.getElementById('pev-com').value};google.script.run.withSuccessHandler(v=>{data=v;m.remove();render()}).withFailureHandler(x=>alert(x.message||x)).enregistrerEvenementPlanV4(d)}}
function chercherOperationEvenement(e){const z=document.getElementById('pev-match');z.innerHTML='<div class="loading">Recherche des opérations proches…</div>';google.script.run.withSuccessHandler(r=>{z.innerHTML=`<div class="source-box"><strong>Opérations proposées</strong>${r.map(x=>`<button class="source-hit" data-op="${esc(x.id)}"><b>${esc(x.libelle)}</b><span>${esc(String(x.date||'').slice(0,10))} · ${eur(x.montant)}${x.categorie?' · '+esc(x.categorie):''}</span></button>`).join('')||'<small>Aucune opération proche.</small>'}</div>`;z.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>google.script.run.withSuccessHandler(v=>{data=v;document.getElementById('pev-modal').remove();render()}).withFailureHandler(x=>alert(x.message||x)).rapprocherEvenementV4(e.id,b.dataset.op))}).withFailureHandler(x=>z.textContent='Erreur : '+(x.message||x)).rechercherOperationsEvenementV4({montant:Number(document.getElementById('pev-m').value||0),date_effet:document.getElementById('pev-d').value,categorie:document.getElementById('pev-cat').value})}
function style(){if(document.getElementById('pv4-style'))return;const s=document.createElement('style');s.id='pv4-style';s.textContent=`.plan-v4{max-width:1180px;margin:auto}.pv4-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.pv4-metrics>div{background:#edf7f3;border-radius:14px;padding:16px}.pv4-metrics small,.pv4-metrics span,.pv4-metrics b{display:block}.pv4-metrics b{font-size:22px;color:#147d64;margin:4px 0}.pv4-title,.pv4-goalhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.pv4-goal{border:1px solid rgba(20,125,100,.15);border-radius:14px;overflow:hidden;margin:14px 0}.pv4-goalhead{background:#f7fbf9;padding:14px}.pv4-goalhead small{display:block;color:#6b7976;margin-top:3px}.pv4-name{display:flex;gap:10px;align-items:center}.pv4-tools{display:inline-flex;gap:4px}.pv4-tools button{border:0;background:transparent;cursor:pointer;font-size:16px;padding:3px 5px}.pv4-action{display:flex;align-items:center;border-top:1px solid rgba(20,125,100,.1);background:#fff}.pv4-action-main{flex:1;border:0;background:white;padding:14px;display:flex;justify-content:space-between;gap:12px;text-align:left;cursor:pointer}.pv4-state{display:inline-block!important;width:max-content;border-radius:20px;padding:3px 8px;margin:4px 0;font-size:11px}.pv4-state.ok{background:#daf1e7;color:#12654f}.pv4-state.wait{background:#f4efe0;color:#755d16}.pv4-events{margin-top:34px;padding-top:24px;border-top:2px solid rgba(20,125,100,.12)}.pv4-eventgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pv4-event{border:1px solid rgba(20,125,100,.14);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}.compact-modal{max-height:86vh;overflow:auto}.compact-modal .form-grid{gap:10px}.compact-modal label{margin-bottom:6px}.impact-preview{display:flex;gap:8px;flex-wrap:wrap;background:#f7fbf9;border-radius:12px;padding:10px;margin:10px 0}.impact-preview>strong{width:100%}.imp
