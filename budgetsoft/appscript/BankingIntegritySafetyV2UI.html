<script>
(function(){
function qv2(id){return document.getElementById(id)}
function moneyV2(n){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0))}
function escV2(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateV2(v){return v?new Date(v).toLocaleDateString('fr-FR'):'—'}
function installSafetyV2(){
 const pane=qv2('bi-flux');if(!pane||qv2('bi-flux-preview-v2'))return;
 const box=document.createElement('div');box.id='bi-flux-preview-v2';box.className='warning-box';box.style.marginTop='12px';box.innerHTML='<strong>Simulation obligatoire :</strong> aucune écriture tant que le rapprochement complet n’est pas validé.';pane.insertBefore(box,pane.querySelector('.form-actions'));
 const oldAnalyse=qv2('bi-flux-analyse'),oldImport=qv2('bi-flux-import');if(oldAnalyse)oldAnalyse.onclick=analyseV2;if(oldImport)oldImport.onclick=importV2;
 installerAuditSoldeV2();
}
function installerAuditSoldeV2(){
 const etat=qv2('bi-etat');if(!etat||qv2('bi-balance-audit'))return;
 const d=document.createElement('div');d.id='bi-balance-audit';d.style.marginTop='18px';d.innerHTML=`<div class="warning-box"><strong>Audit des soldes</strong><br>Contrôle en lecture seule : compare le calcul historique du tableau de bord avec un calcul fondé sur la date comptable bancaire.</div><div style="display:grid;grid-template-columns:minmax(0,220px) auto;gap:10px;align-items:end;margin-top:12px"><label>Solde Hello bank! à comparer (facultatif)<input id="bi-observed-balance" inputmode="decimal" placeholder="ex. -471,68"></label><button class="secondary-button" id="bi-run-balance-audit" type="button">Auditer les soldes</button></div><div id="bi-balance-audit-status" class="helper-text" style="margin-top:10px"></div><div id="bi-balance-audit-result"></div>`;
 etat.appendChild(d);qv2('bi-run-balance-audit').onclick=lancerAuditSoldeV2;
}
function lancerAuditSoldeV2(){
 const st=qv2('bi-balance-audit-status'),res=qv2('bi-balance-audit-result'),val=qv2('bi-observed-balance').value.trim();
 st.textContent='Audit en cours…';res.innerHTML='';
 google.script.run.withSuccessHandler(r=>{
   st.textContent=`Audit terminé · référence ${dateV2(r.reference)} · aucune donnée modifiée.`;
   const obs=r.soldeObserve==null?'':`<div class="import-stat"><span>Solde Hello bank!</span><strong>${moneyV2(r.soldeObserve)}</strong></div><div class="import-stat"><span>Écart banque / comptable</span><strong>${moneyV2(r.ecartObserveVsComptable)}</strong></div>`;
   const comptes=(r.comptes||[]).map(c=>`<tr><td>${escV2(c.nom||c.id)}</td><td>${c.baseFiable?'Relevé':'Solde initial'}</td><td>${dateV2(c.dateBase)}</td><td style="text-align:right">${moneyV2(c.base)}</td><td style="text-align:right">${moneyV2(c.soldeLegacy)}</td><td style="text-align:right">${moneyV2(c.soldeComptable)}</td><td style="text-align:right"><strong>${moneyV2(c.ecart)}</strong></td></tr>`).join('');
   const diffs=(r.operationsDifferentes||[]).slice(0,60).map(o=>`<tr><td>${dateV2(o.dateBudget)}</td><td>${dateV2(o.dateComptable)}</td><td>${escV2(o.libelle)}</td><td style="text-align:right">${moneyV2(o.montant)}</td><td>${o.incluseTableauBord?'Oui':'Non'}</td><td>${o.incluseComptable?'Oui':'Non'}</td></tr>`).join('');
   res.innerHTML=`<div class="import-summary" style="margin-top:12px"><div class="import-stat"><span>Solde tableau de bord</span><strong>${moneyV2(r.soldeDashboard)}</strong></div><div class="import-stat"><span>Reconstitué avec date</span><strong>${moneyV2(r.soldeReconstitueDate)}</strong></div><div class="import-stat"><span>Reconstitué date comptable</span><strong>${moneyV2(r.soldeReconstitueComptable)}</strong></div><div class="import-stat"><span>Écart date / comptable</span><strong>${moneyV2(r.ecartDateVsComptable)}</strong></div>${obs}</div><div class="warning-box" style="margin-top:12px"><strong>Diagnostic :</strong> ${escV2(r.diagnostic)}<br>Écart tableau de bord / comptable : <strong>${moneyV2(r.ecartDashboardVsComptable)}</strong> · dates comptables manquantes : <strong>${r.manqueDateComptable}</strong>.</div><details style="margin-top:12px"><summary><strong>Détail par compte</strong></summary><div style="overflow:auto"><table class="data-table" style="width:100%;margin-top:8px"><thead><tr><th>Compte</th><th>Base</th><th>Date base</th><th>Solde base</th><th>Calcul actuel</th><th>Calcul comptable</th><th>Écart</th></tr></thead><tbody>${comptes||'<tr><td colspan="7">Aucun compte</td></tr>'}</tbody></table></div></details><details style="margin-top:12px" ${diffs?'open':''}><summary><strong>Opérations incluses différemment (${(r.operationsDifferentes||[]).length})</strong></summary><div style="overflow:auto;max-height:420px"><table class="data-table" style="width:100%;margin-top:8px"><thead><tr><th>Date BudgetSoft</th><th>Date comptable</th><th>Libellé</th><th>Montant</th><th>Tableau de bord</th><th>Comptable</th></tr></thead><tbody>${diffs||'<tr><td colspan="6">Aucune différence</td></tr>'}</tbody></table></div></details>`;
 }).withFailureHandler(e=>st.textContent='Erreur audit : '+(e.message||e)).auditerSoldesBancairesV1(val);
}
function parseFluxV2(done){const txt=qv2('bi-flux-text').value,compte=qv2('bi-flux-account').value,st=qv2('bi-flux-status');if(!compte||!txt.trim()){st.textContent='Choisissez le compte et collez les opérations.';return}qv2('bi-flux-import').disabled=true;st.textContent='Analyse du copier-coller…';google.script.run.withSuccessHandler(parsed=>{const lignes=(parsed?.lignes||[]).map(x=>({date:x.date,date_comptable:x.date_comptable,date_achat:x.date_achat||'',libelle:x.libelle,libelle_bancaire:x.libelle_bancaire,marchand_normalise:x.marchand_normalise||'',carte_fin:x.carte_fin||'',montant:Number(x.montant||0),type:x.type,compte,source_bancaire:'flux',statut_bancaire:'provisoire'}));window.__BI_V2_FLUX={lignes,compte};done(lignes,compte)}).withFailureHandler(e=>st.textContent='Erreur : '+(e.message||e)).analyserCollerHelloBankEnrichiV34(txt,compte)}
function candidatAmbiguV30(c){
 const meta=[dateV2(c.date),moneyV2(c.montant),c.categorie||'Sans catégorie',c.source||'source ?',c.statut||'statut ?',`score ${Number(c.score||0)}`].join(' · ');
 return `<div style="padding:7px 9px;margin:5px 0;border:1px solid #e1e8e4;border-radius:8px;background:#fff"><strong>${escV2(c.libelle||'—')}</strong><br><small>${escV2(meta)}${c.protegeePdf?' · PDF protégée':''}</small></div>`;
}
function blocAmbiguV30(d){
 const options=(d.candidats||[]).map(c=>`<option value="lier:${escV2(c.id)}">Correspond à : ${escV2(c.libelle||c.id)} · ${moneyV2(c.montant)} · score ${Number(c.score||0)}</option>`).join('');
 const candidats=(d.candidats||[]).map(candidatAmbiguV30).join('');
 return `<div class="bi-amb-v30" data-amb-index="${Number(d.index)}" style="border:1px solid #e1b65c;background:#fffaf0;border-radius:10px;padding:11px;margin:10px 0"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><strong>À trancher : ${escV2(d.libelle||'—')}</strong><br><small>${dateV2(d.date)} · ${moneyV2(d.montant)} · ${escV2(d.raison||'plusieurs correspondances possibles')}</small></div><strong style="white-space:nowrap">#${Number(d.index)+1}</strong></div><div style="margin-top:9px"><small><strong>Candidats existants</strong></small>${candidats}</div><label style="display:block;margin-top:9px"><strong>Votre décision</strong><select class="bi-amb-select-v30" data-amb-index="${Number(d.index)}" style="width:100%;margin-top:5px"><option value="">— Choisir —</option>${options}<option value="creer">Créer comme nouvelle opération</option><option value="ignorer">Ignorer cette ligne</option></select></label></div>`;
}
function detailFluxV30(r,lignes){
 const pool=(lignes||[]).map((x,i)=>({x,i,used:false}));
 function achatPour(d){const c=pool.find(p=>!p.used&&Math.abs(Number(p.x.montant||0)-Number(d.montant||0))<0.001&&String(p.x.libelle_bancaire||p.x.libelle||'')===String(d.libelle||''));if(c){c.used=true;return c.x.date_achat||c.x.date||''}return ''}
 const nouvelles=(r.detailsNouvelles||[]).map(d=>`<tr><td>${dateV2(achatPour(d))}</td><td>${dateV2(d.date)}</td><td>${escV2(d.libelle)}</td><td style="text-align:right">${moneyV2(d.montant)}</td><td>${escV2(d.categorieProposee||'—')}</td></tr>`).join('');
 pool.forEach(p=>p.used=false);
 const existantes=(r.detailsExistantes||[]).map(d=>`<tr><td>${dateV2(achatPour(d))}</td><td>${dateV2(d.date)}</td><td>${escV2(d.libelle)}</td><td style="text-align:right">${moneyV2(d.montant)}</td><td>${escV2(d.categorieExistante||'—')}</td><td>${escV2((d.sourceExistante||'—')+' / '+(d.statutExistant||'—'))}${d.protegeePdf?' · <strong>PDF protégée</strong>':''}</td></tr>`).join('');
 const amb=(r.detailsAmbigues||[]).map(blocAmbiguV30).join('');
 return `<details style="margin-top:12px" open><summary><strong>Nouvelles (${r.nouvelles})</strong></summary><div style="overflow:auto;max-height:420px"><table class="data-table" style="width:100%;min-width:760px;margin-top:8px"><thead><tr><th>Date achat</th><th>Date comptable</th><th>Libellé</th><th>Montant</th><th>Catégorie proposée</th></tr></thead><tbody>${nouvelles||'<tr><td colspan="5">Aucune</td></tr>'}</tbody></table></div></details><details style="margin-top:12px"><summary><strong>Existantes (${r.existantes}, dont ${r.protegeesPdf||0} PDF protégées)</strong></summary><div style="overflow:auto;max-height:420px"><table class="data-table" style="width:100%;min-width:820px;margin-top:8px"><thead><tr><th>Date achat</th><th>Date comptable</th><th>Libellé</th><th>Montant</th><th>Catégorie existante</th><th>Source / statut</th></tr></thead><tbody>${existantes||'<tr><td colspan="6">Aucune</td></tr>'}</tbody></table></div></details>${r.ambigues?`<details style="margin-top:12px" open><summary><strong>Ambiguës à valider (${r.ambigues})</strong></summary><div id="bi-amb-list-v30" style="max-height:520px;overflow:auto;padding-right:4px">${amb}</div></details>`:''}`;
}
function decisionsAmbiguitesV30(){return Object.keys(window.__BI_V2_DECISIONS||{}).map(k=>window.__BI_V2_DECISIONS[k]).sort((a,b)=>a.index-b.index)}
function majEtatAmbiguitesV30(){
 const a=window.__BI_V2_ANALYSE||{},total=Number(a.ambigues||0),decisions=decisionsAmbiguitesV30(),fait=decisions.length,b=qv2('bi-flux-import'),st=qv2('bi-amb-verdict-v30');
 const complet=Number(a.rejetes||0)===0&&fait===total;
 if(st)st.innerHTML=total?(complet?`✅ <strong>${fait}/${total}</strong> ambiguïtés tranchées. Vous pouvez importer.`:`⚠️ <strong>${fait}/${total}</strong> ambiguïtés tranchées. Choisissez une décision pour chaque ligne.`):'✅ Aucune ambiguïté.';
 if(b){b.disabled=!complet;b.textContent=total?'Valider et importer':'Importer le flux contrôlé';}
}
function changerAmbiguiteV30(select){
 const index=Number(select.dataset.ambIndex),v=String(select.value||'');window.__BI_V2_DECISIONS=window.__BI_V2_DECISIONS||{};
 if(!v){delete window.__BI_V2_DECISIONS[index];majEtatAmbiguitesV30();return;}
 if(v.indexOf('lier:')===0)window.__BI_V2_DECISIONS[index]={index,action:'lier',candidatId:v.slice(5)};
 else window.__BI_V2_DECISIONS[index]={index,action:v};
 majEtatAmbiguitesV30();
}
function analyseV2(){parseFluxV2((lignes,compte)=>{const st=qv2('bi-flux-status'),box=qv2('bi-flux-preview-v2');google.script.run.withSuccessHandler(r=>{window.__BI_V2_ANALYSE=r;window.__BI_V2_DECISIONS={};st.textContent=`${r.recues} opérations détectées · débits ${moneyV2(r.controle.debits)} · crédits ${moneyV2(r.controle.credits)}.`;const verdict=r.rejetes?'<br>⛔ Import bloqué : ligne(s) inexploitable(s) détectée(s).':r.ambigues?`<br><span id="bi-amb-verdict-v30">⚠️ <strong>0/${r.ambigues}</strong> ambiguïtés tranchées. Choisissez une décision pour chaque ligne.</span>`:'<br><span id="bi-amb-verdict-v30">✅ Simulation cohérente ; aucune écriture n’a encore été faite.</span>';box.innerHTML=`<strong>Simulation :</strong> ${r.existantes} existantes · ${r.nouvelles} nouvelles · ${r.ambigues} ambiguës · ${r.rejetes} rejetées.<br><strong>Nettoyage détecté :</strong> ${r.placeholders} prévisions/charges générées à absorber · ${r.orphelines} lignes bancaires ou prévisions devenues orphelines.${verdict}${detailFluxV30(r,lignes)}`;box.querySelectorAll('.bi-amb-select-v30').forEach(s=>s.addEventListener('change',()=>changerAmbiguiteV30(s)));majEtatAmbiguitesV30()}).withFailureHandler(e=>st.textContent='Erreur : '+(e.message||e)).analyserFluxBancaireAvantImportV2(lignes,compte)})}
function importV2(){
 const f=window.__BI_V2_FLUX,a=window.__BI_V2_ANALYSE,st=qv2('bi-flux-status'),b=qv2('bi-flux-import'),decisions=decisionsAmbiguitesV30();
 if(!f||!a){st.textContent='Refaites d’abord la simulation complète.';return}
 if(Number(a.rejetes||0)>0){st.textContent='Import impossible : des lignes sont inexploitées.';return}
 if(decisions.length!==Number(a.ambigues||0)){st.textContent='Tranchez toutes les ambiguïtés avant l’import.';return}
 const lies=decisions.filter(d=>d.action==='lier').length,crees=decisions.filter(d=>d.action==='creer').length,ignores=decisions.filter(d=>d.action==='ignorer').length;
 const texte=`La simulation prévoit :\n${a.existantes} correspondances automatiques\n${a.nouvelles} créations automatiques\n${lies} ambiguïté(s) rattachée(s) à une opération existante\n${crees} ambiguïté(s) créée(s) comme nouvelle(s)\n${ignores} ambiguïté(s) ignorée(s)\n${a.placeholders} prévisions générées absorbées\n${a.orphelines} lignes orphelines supprimées\n\nUne sauvegarde complète sera créée avant écriture. Continuer ?`;
 if(!confirm(texte))return;b.disabled=true;b.textContent='Import transactionnel…';
 google.script.run.withSuccessHandler(r=>{b.textContent='Importer le flux contrôlé';b.disabled=false;if(r.bloque){st.textContent='⛔ '+r.message;return}st.textContent=`✅ ${r.recues} reçues · ${r.existantes} correspondances finales (dont ${r.protegeesPdf} PDF protégées) · ${r.creees} créées · ${r.categorisees} catégorisées automatiquement · ${r.ambiguesResolues||0} ambiguïté(s) résolue(s) · ${r.ambiguesIgnorees||0} ignorée(s) · ${r.placeholdersSupprimes} prévisions absorbées · ${r.orphelinesSupprimees} orphelines supprimées · ${r.totalApres} opérations après contrôle · sauvegarde ${r.sauvegarde}.`;if(typeof charger==='function')charger()}).withFailureHandler(e=>{b.disabled=false;b.textContent='Valider et importer';st.textContent='❌ '+(e.message||e)}).importerFluxBancaireControleV2(f.lignes,f.compte,decisions)
}
document.addEventListener('DOMContentLoaded',()=>setTimeout(installSafetyV2,600));
})();
</script>
