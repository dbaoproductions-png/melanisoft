<script>
(function(){
function qv2(id){return document.getElementById(id)}
function moneyV2(n){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0))}
function escV2(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function installSafetyV2(){
 const pane=qv2('bi-flux');if(!pane||qv2('bi-flux-preview-v2'))return;
 const box=document.createElement('div');box.id='bi-flux-preview-v2';box.className='warning-box';box.style.marginTop='12px';box.innerHTML='<strong>Simulation obligatoire :</strong> aucune écriture tant que le rapprochement complet n’est pas validé.';pane.insertBefore(box,pane.querySelector('.form-actions'));
 const oldAnalyse=qv2('bi-flux-analyse'),oldImport=qv2('bi-flux-import');if(oldAnalyse)oldAnalyse.onclick=analyseV2;if(oldImport)oldImport.onclick=importV2;
}
function parseFluxV2(done){const txt=qv2('bi-flux-text').value,compte=qv2('bi-flux-account').value,st=qv2('bi-flux-status');if(!compte||!txt.trim()){st.textContent='Choisissez le compte et collez les opérations.';return}qv2('bi-flux-import').disabled=true;st.textContent='Analyse du copier-coller…';google.script.run.withSuccessHandler(parsed=>{const lignes=(parsed?.lignes||[]).map(x=>({date_comptable:x.date,date_achat:x.dateAchat||'',libelle:x.libelle,libelle_bancaire:x.details||x.libelle,montant:x.type==='depense'?-Math.abs(Number(x.montant||0)):Math.abs(Number(x.montant||0)),type:x.type,compte}));window.__BI_V2_FLUX={lignes,compte};done(lignes,compte)}).withFailureHandler(e=>st.textContent='Erreur : '+(e.message||e)).analyserCollerHelloBank(txt,compte)}
function analyseV2(){parseFluxV2((lignes,compte)=>{const st=qv2('bi-flux-status'),box=qv2('bi-flux-preview-v2');google.script.run.withSuccessHandler(r=>{window.__BI_V2_ANALYSE=r;st.textContent=`${r.recues} opérations détectées · débits ${moneyV2(r.controle.debits)} · crédits ${moneyV2(r.controle.credits)}.`;box.innerHTML=`<strong>Simulation :</strong> ${r.existantes} existantes · ${r.nouvelles} nouvelles · ${r.ambigues} ambiguës · ${r.rejetes} rejetées.<br><strong>Nettoyage détecté :</strong> ${r.placeholders} prévisions/charges générées à absorber · ${r.orphelines} lignes bancaires ou prévisions devenues orphelines.${r.ambigues||r.rejetes?'<br>⛔ Import bloqué.':''}${!r.ambigues&&!r.rejetes?'<br>✅ Simulation cohérente ; aucune écriture n’a encore été faite.':''}`;qv2('bi-flux-import').disabled=!r.pret}).withFailureHandler(e=>st.textContent='Erreur : '+(e.message||e)).analyserFluxBancaireAvantImportV2(lignes,compte)})}
function importV2(){const f=window.__BI_V2_FLUX,a=window.__BI_V2_ANALYSE,st=qv2('bi-flux-status'),b=qv2('bi-flux-import');if(!f||!a||!a.pret){st.textContent='Refaites d’abord la simulation complète.';return}const texte=`La simulation prévoit :\n${a.existantes} rapprochements\n${a.nouvelles} créations\n${a.placeholders} prévisions générées absorbées\n${a.orphelines} lignes orphelines supprimées\n\nUne sauvegarde complète sera créée avant écriture. Continuer ?`;if(!confirm(texte))return;b.disabled=true;b.textContent='Import transactionnel…';google.script.run.withSuccessHandler(r=>{b.textContent='Importer le flux contrôlé';b.disabled=false;if(r.bloque){st.textContent='⛔ '+r.message;return}st.textContent=`✅ ${r.recues} reçues · ${r.remplacees} rapprochées · ${r.creees} créées · ${r.placeholdersSupprimes} prévisions absorbées · ${r.orphelinesSupprimees} orphelines supprimées · ${r.totalApres} opérations après contrôle · sauvegarde ${r.sauvegarde}.`;if(typeof charger==='function')charger()}).withFailureHandler(e=>{b.disabled=false;b.textContent='Importer le flux contrôlé';st.textContent='❌ '+(e.message||e)}).importerFluxBancaireControleV2(f.lignes,f.compte)}
document.addEventListener('DOMContentLoaded',()=>setTimeout(installSafetyV2,600));
})();
</script>
