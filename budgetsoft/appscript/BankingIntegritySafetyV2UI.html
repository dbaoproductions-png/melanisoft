<script>
(function(){
function qv2(id){return document.getElementById(id)}
function moneyV2(n){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0))}
function escV2(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function installSafetyV2(){
 const pane=qv2('bi-flux');if(!pane||qv2('bi-flux-preview-v2'))return;
 const box=document.createElement('div');box.id='bi-flux-preview-v2';box.className='warning-box';box.style.marginTop='12px';box.innerHTML='<strong>Pré-rapprochement obligatoire :</strong> l’analyse affiche les opérations déjà existantes, réellement nouvelles, ambiguës et rejetées avant toute écriture.';pane.insertBefore(box,pane.querySelector('.form-actions'));
 const mig=qv2('bi-migration');if(mig&&!qv2('bi-restore-v2')){const d=document.createElement('div');d.className='warning-box';d.style.marginTop='14px';d.innerHTML='<strong>Restauration contrôlée</strong><br><input id="bi-restore-name-v2" style="width:100%;margin-top:8px" value="Operations_backup_20260813_073348"><div class="form-actions" style="justify-content:flex-start"><button class="secondary-button" id="bi-restore-v2" type="button">Restaurer cette sauvegarde</button></div><div id="bi-restore-status-v2" class="helper-text"></div>';mig.appendChild(d);qv2('bi-restore-v2').onclick=restoreV2;}
 const oldAnalyse=qv2('bi-flux-analyse'),oldImport=qv2('bi-flux-import');if(oldAnalyse)oldAnalyse.onclick=analyseV2;if(oldImport)oldImport.onclick=importV2;
}
function parseFluxV2(done){const txt=qv2('bi-flux-text').value,compte=qv2('bi-flux-account').value,st=qv2('bi-flux-status');if(!compte||!txt.trim()){st.textContent='Choisissez le compte et collez les opérations.';return}qv2('bi-flux-import').disabled=true;st.textContent='Analyse du copier-coller…';google.script.run.withSuccessHandler(parsed=>{const lignes=(parsed?.lignes||[]).map(x=>({date_comptable:x.date,date_achat:x.dateAchat||'',libelle:x.libelle,libelle_bancaire:x.details||x.libelle,montant:x.type==='depense'?-Math.abs(Number(x.montant||0)):Math.abs(Number(x.montant||0)),type:x.type,compte}));window.__BI_V2_FLUX={lignes,compte,parseCount:(parsed?.lignes||[]).length};done(lignes,compte)}).withFailureHandler(e=>st.textContent='Erreur : '+(e.message||e)).analyserCollerHelloBank(txt,compte)}
function analyseV2(){parseFluxV2((lignes,compte)=>{const st=qv2('bi-flux-status'),box=qv2('bi-flux-preview-v2');google.script.run.withSuccessHandler(r=>{window.__BI_V2_ANALYSE=r;st.textContent=`${r.recues} opérations exploitables · débits ${moneyV2(r.controle.debits)} · crédits ${moneyV2(r.controle.credits)}.`;let extra='';if(r.rejetees){extra+='<br>⛔ '+r.rejetees+' ligne(s) rejetée(s) par le contrôle de structure.';const d=(r.detailsRejetees||[]).slice(0,5).map(x=>`${escV2(x.libelle)} (${escV2(x.raison)})`).join('<br>');if(d)extra+='<br><small>'+d+'</small>';}if(r.ambigues)extra+='<br>⛔ Import bloqué tant que les ambiguïtés ne sont pas résolues.';if(r.nouvelles)extra+='<br>⚠️ '+r.nouvelles+' ligne(s) augmenteraient réellement la base.';box.innerHTML=`<strong>Pré-rapprochement :</strong> ${r.existantes} existantes · ${r.nouvelles} nouvelles · ${r.ambigues} ambiguës · ${r.rejetees||0} rejetées.${extra}`;qv2('bi-flux-import').disabled=!r.pret||!r.recues}).withFailureHandler(e=>st.textContent='Erreur : '+(e.message||e)).analyserFluxBancaireAvantImportV2(lignes,compte)})}
function importV2(){const f=window.__BI_V2_FLUX,a=window.__BI_V2_ANALYSE,st=qv2('bi-flux-status'),b=qv2('bi-flux-import');if(!f||!a||!a.pret){st.textContent='Refaites d’abord le pré-rapprochement et résolvez les blocages.';return}if(a.nouvelles&&!confirm(`${a.nouvelles} opération(s) seront réellement créées. Continuer ?`))return;b.disabled=true;b.textContent='Import transactionnel…';google.script.run.withSuccessHandler(r=>{b.textContent='Importer le flux contrôlé';b.disabled=false;if(r.bloque){st.textContent='⛔ '+r.message;return}st.textContent=`✅ ${r.recues} reçues · ${r.remplacees} rapprochées · ${r.creees} créées · sauvegarde ${r.sauvegarde}.`;if(typeof charger==='function')charger()}).withFailureHandler(e=>{b.disabled=false;b.textContent='Importer le flux contrôlé';st.textContent='❌ '+(e.message||e)}).importerFluxBancaireControleV2(f.lignes,f.compte)}
function restoreV2(){const nom=qv2('bi-restore-name-v2').value.trim(),st=qv2('bi-restore-status-v2');if(!confirm('Restaurer '+nom+' ? Une sauvegarde de l’état actuel sera créée avant restauration.'))return;st.textContent='Restauration et contrôle…';google.script.run.withSuccessHandler(r=>{st.innerHTML=`✅ Restauration contrôlée : <strong>${escV2(r.sauvegardeSource)}</strong>. ${r.apres.nombre} opérations · débits ${moneyV2(r.apres.debits)} · crédits ${moneyV2(r.apres.credits)}. Sauvegarde de sécurité : ${escV2(r.sauvegardeSecours)}.`;if(typeof charger==='function')charger()}).withFailureHandler(e=>st.textContent='❌ '+(e.message||e)).restaurerOperationsDepuisSauvegardeV2(nom)}
document.addEventListener('DOMContentLoaded',()=>setTimeout(installSafetyV2,600));
})();
</script>
