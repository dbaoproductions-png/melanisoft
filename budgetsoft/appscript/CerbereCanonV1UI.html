<script>
(function(){'use strict';
const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
let canon=null,budgetReference=0,recettesCanon=null,historiqueP0=null,cf0Etat=null;

/* ========================= P0 · DÉPENSES ========================= */
function loadCanon(){
  google.script.run.withSuccessHandler(d=>{
    canon=d;budgetReference=Number(d?.totaux?.monetaire||0);
    google.script.run.withSuccessHandler(h=>{historiqueP0=h;openEditor()}).withFailureHandler(()=>{historiqueP0=null;openEditor()}).chargerHistoriqueP0CerbereV1(6);
  }).withFailureHandler(e=>alert(e.message||e)).chargerCanonCerbereV1();
}
function openEditor(){
  let box=document.getElementById('cerb-canon-editor');if(!box){box=document.createElement('div');box.id='cerb-canon-editor';document.body.appendChild(box)}
  box.innerHTML=`<div class="cc-backdrop"></div><div class="cc-modal cc-modal-wide"><div class="cc-head"><div><small>P0 · PILOTABLE MAÎTRE</small><h2>Reparamétrer le budget de référence</h2></div><button id="cc-close">×</button></div><div class="cc-doctrine"><b>À quoi sert P0 ?</b><span>P0 est la répartition de référence des dépenses pilotables d’un mois normal. Les opérations réelles ne le modifient jamais. Seule une validation explicite dans cette fenêtre crée un nouveau P0 ; P1, P2… peuvent ensuite s’en écarter localement.</span></div><div class="cc-summary"><span>P0 actuel <b>${money(budgetReference)}</b></span><span>Nouveau P0 <b id="cc-new-total">${money(budgetReference)}</b></span><span>Écart <b id="cc-delta">0,00 €</b></span><span>Pluxee <b>${money(canon.totaux.pluxee)}</b></span></div><div class="cc-stack" id="cc-stack"></div><div id="cc-rows"></div><details class="cc-history" open><summary>Historique réel pour aider au réglage</summary><p>Montants réellement engagés dans les postes P0 selon la doctrine Cerbère : charges fixes exclues, santé nette et CB imputées au cycle où elles impactent le budget. Cet historique est seulement une aide : il ne recalcule jamais P0 tout seul.</p><div id="cc-history-table"></div></details><div class="cc-foot"><small>Valider remplace la référence maître P0. Aucun équilibrage artificiel n’est imposé dans Projet ou Divers.</small><button class="secondary-button" id="cc-cancel">Annuler</button><button class="primary-button" id="cc-save">Valider comme nouveau P0</button></div></div>`;
  box.querySelector('#cc-close').onclick=box.querySelector('#cc-cancel').onclick=closeEditor;box.querySelector('.cc-backdrop').onclick=closeEditor;box.querySelector('#cc-save').onclick=saveCanon;renderRows();renderHistory();
}
function renderRows(){
  const rows=document.getElementById('cc-rows');if(!rows)return;
  rows.innerHTML=canon.postes.map((p,i)=>`<div class="cc-row ${p.protege?'protected':''}" data-i="${i}"><div class="cc-label"><strong>${escAttr(p.categorie)}</strong><span>P0 ${money(p.monetaire)}${p.pluxee?' + '+money(p.pluxee)+' Pluxee':''}</span></div><div class="cc-control"><button data-minus="${i}" ${p.protege?'disabled':''}>−10</button><input class="cc-range" type="range" data-i="${i}" min="0" max="${Math.max(1500,Math.ceil((Number(p.monetaire||0)+1000)/100)*100)}" step="1" value="${Number(p.monetaire||0)}" ${p.protege?'disabled':''}><button data-plus="${i}" ${p.protege?'disabled':''}>+10</button><input class="cc-amount" data-amount="${i}" type="number" min="0" step="1" value="${Number(p.monetaire||0)}" ${p.protege?'disabled':''}></div></div>`).join('');
  rows.querySelectorAll('.cc-row').forEach(row=>{const i=Number(row.dataset.i),range=row.querySelector('.cc-range'),amount=row.querySelector('.cc-amount');if(!range||!amount||canon.postes[i].protege)return;range.oninput=()=>{amount.value=range.value;setCanonAmount(i,range.value)};amount.oninput=()=>{range.value=Math.min(Number(range.max),Math.max(0,Number(amount.value||0)));setCanonAmount(i,amount.value)};});
  rows.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>bump(Number(b.dataset.minus),-10));rows.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>bump(Number(b.dataset.plus),10));renderStack();
}
function setCanonAmount(i,v){const p=canon.postes[i];if(!p||p.protege)return;p.monetaire=Math.max(0,Number(v||0));renderStack()}
function bump(i,d){const p=canon.postes[i];if(!p||p.protege)return;p.monetaire=Math.max(0,Number(p.monetaire||0)+d);const row=document.querySelector(`.cc-row[data-i="${i}"]`);if(row){const r=row.querySelector('.cc-range'),a=row.querySelector('.cc-amount');if(r)r.value=Math.min(Number(r.max),p.monetaire);if(a)a.value=p.monetaire}renderStack()}
function renderStack(){
  const total=canon.postes.reduce((s,p)=>s+Number(p.monetaire||0),0),z=document.getElementById('cc-stack');if(z)z.innerHTML=canon.postes.filter(p=>p.monetaire>0).map((p,i)=>`<span title="${escAttr(p.categorie)} : ${money(p.monetaire)}" style="width:${100*p.monetaire/Math.max(1,total)}%" class="cc-seg cc-s${i%8}"></span>`).join('');
  const delta=Math.round((total-budgetReference)*100)/100,nt=document.getElementById('cc-new-total'),dv=document.getElementById('cc-delta');if(nt)nt.textContent=money(total);if(dv){dv.textContent=(delta>0?'+':'')+money(delta);dv.classList.toggle('negative',delta<0);dv.classList.toggle('positive',delta>0)}
}
function renderHistory(){
  const z=document.getElementById('cc-history-table');if(!z)return;if(!historiqueP0||!historiqueP0.periodes?.length){z.innerHTML='<div class="empty-state">Historique indisponible.</div>';return}
  const labels=historiqueP0.periodes.map(p=>{const d=new Date(p.fin+'T12:00:00');const m=isNaN(d)?p.fin:d.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'});return `${m}${p.enCours?' *':''}`});
  z.innerHTML=`<div class="cc-hrow cc-hhead"><b>Poste</b><b>P0</b>${labels.map(x=>`<b>${escAttr(x)}</b>`).join('')}<b>Moy.</b></div>${(historiqueP0.lignes||[]).map(l=>`<div class="cc-hrow"><strong>${escAttr(l.categorie)}</strong><span>${money(l.p0)}</span>${(l.valeurs||[]).map(v=>`<span>${money(v)}</span>`).join('')}<span><b>${money(l.moyenne)}</b></span></div>`).join('')}<small>* cycle en cours, donc valeur encore incomplète.</small>`;
}
function saveCanon(){
  const b=document.getElementById('cc-save');if(b){b.disabled=true;b.textContent='Enregistrement…'}
  google.script.run.withSuccessHandler(d=>{canon=d;closeEditor();if(window.chargerCerbereV2UI)window.chargerCerbereV2UI()}).withFailureHandler(e=>{alert(e.message||e);if(b){b.disabled=false;b.textContent='Valider comme nouveau P0'}}).enregistrerCanonCerbereV1(canon.postes)
}
function closeEditor(){document.getElementById('cerb-canon-editor')?.remove()}

/* ========================= R0 · RECETTES ========================= */
function loadRecettesCanon(){google.script.run.withSuccessHandler(d=>{recettesCanon=d;openRecettesEditor()}).withFailureHandler(e=>alert(e.message||e)).chargerCanonRecettesCerbereV1()}
function openRecettesEditor(){let box=document.getElementById('cerb-recettes-editor');if(!box){box=document.createElement('div');box.id='cerb-recettes-editor';document.body.appendChild(box)}box.innerHTML=`<div class="cc-backdrop"></div><div class="cc-modal"><div class="cc-head"><div><small>R0 · RECETTES MAÎTRE</small><h2>Canon mensuel de recettes</h2></div><button id="rc-close">×</button></div><div class="cc-doctrine"><b>À quoi sert R0 ?</b><span>R0 décrit les recettes normales attendues. Il ne change jamais quand une recette réelle arrive. Si le réel diffère du canon, l’écart corrige uniquement R1/Rn, c’est-à-dire la période concernée.</span></div><div class="rc-summary"><span>Total canonique <b id="rc-total">${money(recettesCanon.total)}</b></span><span><b>${(recettesCanon.postes||[]).length}</b> sources actives</span></div><div class="rc-headrow"><span>Source</span><span>Montant mensuel</span><span>Nature</span><span></span></div><div id="rc-rows"></div><button class="secondary-button rc-add" id="rc-add">＋ Ajouter une recette</button><div class="cc-foot"><small>Valider R0 crée une nouvelle référence maître ; le Réel ne l’écrit jamais.</small><button class="secondary-button" id="rc-cancel">Annuler</button><button class="primary-button" id="rc-save">Valider comme nouvelle référence R0</button></div></div>`;box.querySelector('#rc-close').onclick=box.querySelector('#rc-cancel').onclick=closeRecettesEditor;box.querySelector('.cc-backdrop').onclick=closeRecettesEditor;box.querySelector('#rc-add').onclick=addRecette;box.querySelector('#rc-save').onclick=saveRecettesCanon;renderRecettesRows()}
function renderRecettesRows(){const rows=document.getElementById('rc-rows');rows.innerHTML=(recettesCanon.postes||[]).map((p,i)=>`<div class="rc-row" data-i="${i}"><input class="rc-name" value="${escAttr(p.categorie)}" placeholder="Ex. Salaire"><input class="rc-amount" inputmode="decimal" value="${Number(p.montant||0).toFixed(2)}"><select class="rc-nature"><option value="structurelle" ${p.nature==='structurelle'?'selected':''}>Structurelle</option><option value="variable" ${p.nature==='variable'?'selected':''}>Variable</option></select><button class="rc-delete" title="Supprimer">×</button></div>`).join('');rows.querySelectorAll('.rc-row').forEach(row=>{const i=Number(row.dataset.i);row.querySelector('.rc-name').oninput=e=>{recettesCanon.postes[i].categorie=e.target.value};row.querySelector('.rc-amount').oninput=e=>{recettesCanon.postes[i].montant=parseNumber(e.target.value);updateRecettesTotal()};row.querySelector('.rc-nature').onchange=e=>{recettesCanon.postes[i].nature=e.target.value};row.querySelector('.rc-delete').onclick=()=>{recettesCanon.postes.splice(i,1);renderRecettesRows();updateRecettesTotal()}});updateRecettesTotal()}
function addRecette(){recettesCanon.postes.push({categorie:'',montant:0,nature:'structurelle',ordre:recettesCanon.postes.length+1,commentaire:''});renderRecettesRows();const rows=document.querySelectorAll('#rc-rows .rc-row');rows[rows.length-1]?.querySelector('.rc-name')?.focus()}
function updateRecettesTotal(){const total=(recettesCanon.postes||[]).reduce((s,p)=>s+Math.max(0,Number(p.montant||0)),0);recettesCanon.total=Math.round(total*100)/100;const z=document.getElementById('rc-total');if(z)z.textContent=money(recettesCanon.total)}
function saveRecettesCanon(){const postes=(recettesCanon.postes||[]).map((p,i)=>({categorie:String(p.categorie||'').trim(),montant:Math.max(0,Number(p.montant||0)),nature:p.nature||'structurelle',ordre:i+1,actif:true,commentaire:p.commentaire||''})).filter(p=>p.categorie&&p.montant>0);if(!postes.length){alert('R0 doit contenir au moins une recette.');return}const b=document.getElementById('rc-save');b.disabled=true;b.textContent='Enregistrement…';google.script.run.withSuccessHandler(d=>{recettesCanon=d;closeRecettesEditor();if(window.chargerCerbereV2UI)window.chargerCerbereV2UI()}).withFailureHandler(e=>{alert(e.message||e);b.disabled=false;b.textContent='Valider comme nouvelle référence R0'}).enregistrerCanonRecettesCerbereV1(postes)}
function closeRecettesEditor(){document.getElementById('cerb-recettes-editor')?.remove()}

/* ========================= CF0 · CHARGES FIXES ========================= */
function loadCF0(){google.script.run.withSuccessHandler(d=>{cf0Etat=d;openCF0Editor()}).withFailureHandler(e=>alert(e.message||e)).chargerEtatCF0CerbereV1()}
function openCF0Editor(){
  let box=document.getElementById('cerb-cf0-editor');if(!box){box=document.createElement('div');box.id='cerb-cf0-editor';document.body.appendChild(box)}
  box.innerHTML=`<div class="cc-backdrop"></div><div class="cc-modal"><div class="cc-head"><div><small>CF0 · CHARGES FIXES MAÎTRE</small><h2>Référentiel des charges fixes</h2></div><button id="cf-close">×</button></div><div class="cc-doctrine"><b>À quoi sert CF0 ?</b><span>CF0 est le référentiel maître des charges fixes. La doctrine prévoit qu’au démarrage de chaque cycle, le 28, la période reçoit une photographie de CF0 qui reste stable pendant le mois. Une opération réelle rapprochée remplace ensuite l’occurrence prévue dans la période, sans modifier CF0.</span></div><div class="cc-summary"><span>CF0 actuel <b id="cf-total">${money(cf0Etat.total)}</b></span><span><b id="cf-count">${Number(cf0Etat.nombreActives||0)}</b> charge(s) active(s)</span><span>Cycle <b>${formatCycle(cf0Etat.periode)}</b></span></div><div class="cf-list">${(cf0Etat.charges||[]).map(c=>`<div><span>${escAttr(c.libelle)}</span><b>${money(c.montant)}</b></div>`).join('')}</div><div class="cc-foot"><small>Le reparamétrage se fait dans le référentiel Charges fixes. Le recalcul ici relit ce référentiel sans toucher aux opérations.</small><button class="secondary-button" id="cf-open-fixed">Ouvrir Charges fixes</button><button class="secondary-button" id="cf-recalc">Recalculer CF0</button><button class="primary-button" id="cf-close2">Fermer</button></div></div>`;
  box.querySelector('#cf-close').onclick=box.querySelector('#cf-close2').onclick=closeCF0Editor;box.querySelector('.cc-backdrop').onclick=closeCF0Editor;box.querySelector('#cf-open-fixed').onclick=openFixedCharges;box.querySelector('#cf-recalc').onclick=recalcCF0;
}
function recalcCF0(){const b=document.getElementById('cf-recalc');b.disabled=true;b.textContent='Recalcul…';google.script.run.withSuccessHandler(d=>{cf0Etat=d;closeCF0Editor();openCF0Editor();if(window.chargerCerbereV2UI)window.chargerCerbereV2UI()}).withFailureHandler(e=>{alert(e.message||e);b.disabled=false;b.textContent='Recalculer CF0'}).recalculerEtatCF0CerbereV1()}
function openFixedCharges(){closeCF0Editor();const b=[...document.querySelectorAll('.nav-item')].find(x=>/charges\s+fixes/i.test(String(x.textContent||'')));if(b)b.click();else alert('La rubrique Charges fixes est introuvable dans la navigation.')}
function closeCF0Editor(){document.getElementById('cerb-cf0-editor')?.remove()}
function formatCycle(p){if(!p)return'—';return String(p.debut||'').slice(0,10)+' → '+String(p.fin||'').slice(0,10)}

function parseNumber(v){const n=Number(String(v??'').replace(/\s/g,'').replace(',','.'));return Number.isFinite(n)?Math.max(0,n):0}
function escAttr(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ========================= API UI ========================= */
window.ouvrirCanonDepensesCerbereUI=loadCanon;
window.ouvrirCanonRecettesCerbereUI=loadRecettesCanon;
window.ouvrirCF0CerbereUI=loadCF0;

const style=document.createElement('style');style.textContent=`#cerb-canon-editor,#cerb-recettes-editor,#cerb-cf0-editor{position:fixed;inset:0;z-index:9999}.cc-backdrop{position:absolute;inset:0;background:rgba(0,35,28,.42)}.cc-modal{position:absolute;right:3vw;top:3vh;bottom:3vh;width:min(800px,94vw);overflow:auto;background:#f8fbfa;border-radius:18px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.28)}.cc-modal-wide{width:min(1080px,94vw)}.cc-head{display:flex;justify-content:space-between}.cc-head small{color:#147d64;font-weight:800}.cc-head h2{margin:3px 0}.cc-head button{border:0;background:transparent;font-size:30px}.cc-doctrine{background:#edf7f3;border-radius:12px;padding:12px 14px;margin:14px 0}.cc-doctrine b,.cc-doctrine span{display:block}.cc-doctrine span{margin-top:4px}.cc-summary,.rc-summary{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.cc-summary span,.rc-summary span{background:#fff;padding:9px 12px;border-radius:10px}.positive{color:#147d64}.negative{color:#b42318}.cc-stack{height:28px;display:flex;overflow:hidden;border-radius:9px;background:#e5eeeb;margin:16px 0}.cc-seg{height:100%;min-width:2px}.cc-s0{background:#0f766e}.cc-s1{background:#14b8a6}.cc-s2{background:#84cc16}.cc-s3{background:#eab308}.cc-s4{background:#f97316}.cc-s5{background:#8b5cf6}.cc-s6{background:#06b6d4}.cc-s7{background:#64748b}.cc-row{background:#fff;padding:11px 13px;border-radius:11px;margin:8px 0}.cc-label{display:flex;justify-content:space-between}.cc-control{display:grid;grid-template-columns:54px 1fr 54px 100px;gap:8px;align-items:center;margin-top:7px}.cc-control input[type=range]{width:100%;height:28px;accent-color:#147d64;cursor:pointer}.cc-control input[type=range]::-webkit-slider-thumb{width:24px;height:24px}.cc-control button{height:30px;border:1px solid #cddbd6;background:#fff;border-radius:8px;cursor:pointer}.cc-amount{height:30px;box-sizing:border-box;border:1px solid #cddbd6;border-radius:8px;text-align:right;padding:5px}.cc-row.protected{background:#edf7f3}.cc-history{margin:18px 0;border-top:1px solid #dce7e3;padding-top:12px}.cc-history summary{font-weight:800;cursor:pointer}.cc-history p{font-size:12px;color:#61706b}.cc-hrow{display:grid;grid-template-columns:minmax(150px,1.5fr) repeat(8,minmax(78px,1fr));gap:5px;align-items:center;padding:6px 4px;border-top:1px solid #edf1ef;font-size:11px;min-width:820px}.cc-hhead{position:sticky;top:0;background:#f8fbfa}.cc-history #cc-history-table{overflow:auto}.cc-foot{position:sticky;bottom:-22px;background:#f8fbfa;padding:16px 0 4px;display:flex;align-items:center;justify-content:flex-end;gap:10px}.cc-foot small{margin-right:auto}.rc-headrow,.rc-row{display:grid;grid-template-columns:1.4fr .8fr .8fr 40px;gap:8px;align-items:center}.rc-headrow{padding:0 10px 5px;font-size:11px;font-weight:800;color:#667}.rc-row{background:#fff;border-radius:10px;padding:8px 10px;margin:7px 0}.rc-row input,.rc-row select{width:100%;box-sizing:border-box;padding:8px;border:1px solid #d7e2de;border-radius:8px;background:#fff}.rc-delete{border:0;background:#fff0ed;color:#a33;font-size:20px;border-radius:8px;cursor:pointer}.rc-add{margin-top:8px}.cf-list{max-height:42vh;overflow:auto;background:#fff;border-radius:12px;padding:4px 12px}.cf-list>div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #edf1ef}.cf-list>div:first-child{border-top:0}@media(max-width:700px){.cc-control{grid-template-columns:46px 1fr 46px}.cc-amount{grid-column:1/-1;width:100%}.rc-headrow{display:none}.rc-row{grid-template-columns:1fr}.rc-delete{justify-self:end;width:40px}.cc-foot{flex-wrap:wrap}.cc-foot small{width:100%}}`;document.head.appendChild(style)})();
</script>
