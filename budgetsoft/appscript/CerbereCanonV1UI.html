<script>
(function(){'use strict';const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));let canon=null,budgetReference=0;
function loadCanon(){google.script.run.withSuccessHandler(d=>{canon=d;openEditor()}).withFailureHandler(e=>alert(e.message||e)).chargerCanonCerbereV1()}
function openEditor(){let box=document.getElementById('cerb-canon-editor');if(!box){box=document.createElement('div');box.id='cerb-canon-editor';document.body.appendChild(box)}budgetReference=canon.postes.reduce((s,p)=>s+Number(p.monetaire||0),0);box.innerHTML=`<div class="cc-backdrop"></div><div class="cc-modal"><div class="cc-head"><div><small>P0 · BUDGET MAÎTRE</small><h2>Canon hérité par P1 à P6</h2></div><button id="cc-close">×</button></div><p>P0 décrit un mois normal. Les périodes futures en héritent puis appliquent leurs événements et actions. Les tirettes sont libres : Cerbère affiche l'argent restant à ventiler ou à retrouver.</p><div class="cc-summary"><span>Référence <b>${money(budgetReference)}</b></span><span>Pluxee <b>${money(canon.totaux.pluxee)}</b></span><span>Épargne protégée <b>${money(canon.epargneProtegee)}</b></span></div><div class="cc-balance"><small id="cc-balance-label">Monétique disponible</small><strong id="cc-balance-value">0 €</strong><div><i id="cc-balance-bar"></i></div></div><div class="cc-stack" id="cc-stack"></div><div id="cc-rows"></div><div class="cc-foot"><small>Un solde négatif doit être compensé avant validation.</small><button class="secondary-button" id="cc-cancel">Annuler</button><button class="primary-button" id="cc-save">Valider P0</button></div></div>`;box.querySelector('#cc-close').onclick=box.querySelector('#cc-cancel').onclick=closeEditor;box.querySelector('.cc-backdrop').onclick=closeEditor;box.querySelector('#cc-save').onclick=saveCanon;renderRows()}
function renderRows(){const rows=document.getElementById('cc-rows');rows.innerHTML=canon.postes.map((p,i)=>`<div class="cc-row ${p.protege?'protected':''}"><div class="cc-label"><strong>${p.categorie}</strong><span>${money(p.monetaire)}${p.pluxee?' + '+money(p.pluxee)+' Pluxee':''}</span></div><div class="cc-control"><button data-minus="${i}">−10</button><input type="range" data-i="${i}" min="0" max="${Math.max(1500,Math.ceil((Number(p.monetaire||0)+800)/100)*100)}" step="1" value="${p.monetaire}" ${p.protege?'disabled':''}><button data-plus="${i}">+10</button></div></div>`).join('');rows.querySelectorAll('input[type=range]').forEach(r=>r.oninput=()=>{canon.postes[Number(r.dataset.i)].monetaire=Number(r.value);renderRows()});rows.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>bump(Number(b.dataset.minus),-10));rows.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>bump(Number(b.dataset.plus),10));renderStack()}
function bump(i,d){const p=canon.postes[i];if(!p||p.protege)return;p.monetaire=Math.max(0,Number(p.monetaire||0)+d);renderRows()}
function renderStack(){const total=canon.postes.reduce((s,p)=>s+Number(p.monetaire||0),0),z=document.getElementById('cc-stack');z.innerHTML=canon.postes.filter(p=>p.monetaire>0).map((p,i)=>`<span title="${p.categorie} : ${money(p.monetaire)}" style="width:${100*p.monetaire/Math.max(1,total)}%" class="cc-seg cc-s${i%8}"></span>`).join('');const balance=Math.round((budgetReference-total)*100)/100,v=document.getElementById('cc-balance-value'),l=document.getElementById('cc-balance-label'),bar=document.getElementById('cc-balance-bar');v.textContent=(balance>0?'+':'')+money(balance);l.textContent=balance>=0?'Monétique disponible à ventiler':'Monétique à retrouver';document.querySelector('.cc-balance').classList.toggle('negative',balance<0);bar.style.width=Math.min(100,Math.abs(balance)/Math.max(1,budgetReference)*500)+'%';document.getElementById('cc-save').disabled=balance<-.009}
function saveCanon(){const total=canon.postes.reduce((s,p)=>s+Number(p.monetaire||0),0),balance=budgetReference-total;if(balance<-.009){alert('Il faut retrouver '+money(Math.abs(balance))+' avant de valider.');return}const projet=canon.postes.find(p=>p.categorie==='Projet');if(projet&&balance>0)projet.monetaire=Number(projet.monetaire||0)+balance;google.script.run.withSuccessHandler(d=>{canon=d;closeEditor();if(window.chargerCerbereV2UI)window.chargerCerbereV2UI()}).withFailureHandler(e=>alert(e.message||e)).enregistrerCanonCerbereV1(canon.postes)}
function closeEditor(){document.getElementById('cerb-canon-editor')?.remove()}
function injectButton(){const z=document.getElementById('cerbere-content');if(!z||document.getElementById('cc-open'))return;const tabs=z.querySelector('.cerb-tabs');if(!tabs)return;const b=document.createElement('button');b.id='cc-open';b.className='primary-button';b.textContent='⚖ P0 · Budget maître';b.onclick=loadCanon;tabs.appendChild(b)}new MutationObserver(injectButton).observe(document.documentElement,{subtree:true,childList:true});
const style=document.createElement('style');style.textContent=`#cerb-canon-editor{position:fixed;inset:0;z-index:9999}.cc-backdrop{position:absolute;inset:0;background:rgba(0,35,28,.42)}.cc-modal{position:absolute;right:3vw;top:3vh;bottom:3vh;width:min(800px,94vw);overflow:auto;background:#f8fbfa;border-radius:18px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.28)}.cc-head{display:flex;justify-content:space-between}.cc-head small{color:#147d64;font-weight:800}.cc-head h2{margin:3px 0}.cc-head button{border:0;background:transparent;font-size:30px}.cc-summary{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.cc-summary span{background:#fff;padding:9px 12px;border-radius:10px}.cc-balance{background:#eaf7f2;padding:13px;border-radius:12px}.cc-balance.negative{background:#fff0ed}.cc-balance strong{float:right;font-size:20px}.cc-balance>div{clear:both;height:9px;background:#d9e5e1;border-radius:9px;margin-top:9px;overflow:hidden}.cc-balance i{display:block;height:100%;background:#147d64}.cc-balance.negative i{background:#b84a3a}.cc-stack{height:32px;display:flex;overflow:hidden;border-radius:9px;background:#e5eeeb;margin:16px 0}.cc-seg{height:100%;min-width:2px}.cc-s0{background:#0f766e}.cc-s1{background:#14b8a6}.cc-s2{background:#84cc16}.cc-s3{background:#eab308}.cc-s4{background:#f97316}.cc-s5{background:#8b5cf6}.cc-s6{background:#06b6d4}.cc-s7{background:#64748b}.cc-row{background:#fff;padding:11px 13px;border-radius:11px;margin:8px 0}.cc-label{display:flex;justify-content:space-between}.cc-control{display:grid;grid-template-columns:54px 1fr 54px;gap:8px;align-items:center;margin-top:7px}.cc-control input{width:100%;height:28px;accent-color:#147d64;cursor:pointer}.cc-control input::-webkit-slider-thumb{width:24px;height:24px}.cc-control button{height:30px;border:1px solid #cddbd6;background:#fff;border-radius:8px;cursor:pointer}.cc-row.protected{background:#edf7f3}.cc-foot{position:sticky;bottom:-22px;background:#f8fbfa;padding:16px 0 4px;display:flex;align-items:center;justify-content:flex-end;gap:10px}.cc-foot small{margin-right:auto}#cc-open{margin-left:auto}`;document.head.appendChild(style)})();
</script>
