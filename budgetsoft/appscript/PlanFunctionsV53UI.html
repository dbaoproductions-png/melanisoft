<script>
(function(){
'use strict';

function decorateMeasures(){
  document.querySelectorAll('#generic-view .pa-row').forEach(row=>{
    const actionButton=row.querySelector('button[data-edit-action]');
    const measure=row.querySelector('.pv5-measure');
    if(!actionButton||!measure||measure.dataset.pv53==='1')return;
    measure.dataset.pv53='1';
    measure.setAttribute('role','button');
    measure.setAttribute('tabindex','0');
    measure.title='Modifier la fonction, la cible et les règles de mesure';

    const line=measure.querySelector('.pv5-line');
    if(line&&!line.querySelector('.pv53-edit-measure')){
      const edit=document.createElement('button');
      edit.type='button';
      edit.className='pv53-edit-measure';
      edit.textContent='✎ Mesure';
      edit.title='Modifier la mesure';
      line.appendChild(edit);
    }

    const open=ev=>{
      if(ev){ev.preventDefault();ev.stopPropagation();}
      actionButton.click();
    };
    measure.addEventListener('click',open);
    measure.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){open(ev);}});
  });
}

function clarifyModal(){
  const m=document.getElementById('pv5-modal');
  if(!m||m.dataset.pv53==='1')return;
  m.dataset.pv53='1';
  const fn=m.querySelector('#pv5-f');
  const target=m.querySelector('#pv5-target');
  if(fn){
    const label=fn.closest('label');
    if(label&&label.firstChild&&label.firstChild.nodeType===3)label.firstChild.nodeValue='Fonction de mesure';
  }
  if(target){
    const wrap=target.closest('label');
    if(wrap)wrap.classList.add('pv53-measure-field');
  }
  const grid=fn&&fn.closest('.form-grid');
  if(grid&&!grid.querySelector('.pv53-measure-heading')){
    const h=document.createElement('div');
    h.className='pv53-measure-heading full-field';
    h.innerHTML='<strong>Mesure de l’action</strong><small>La fonction et la cible ci-dessous pilotent le suivi quantifié affiché dans le Plan.</small>';
    const fnLabel=fn.closest('label');
    grid.insertBefore(h,fnLabel);
  }
}

const obs=new MutationObserver(()=>{decorateMeasures();clarifyModal();});
obs.observe(document.documentElement,{childList:true,subtree:true});
setTimeout(()=>{decorateMeasures();clarifyModal();},250);

const st=document.createElement('style');
st.textContent=`
.pv5-measure[data-pv53="1"]{cursor:pointer;border-radius:8px;transition:background .12s ease}.pv5-measure[data-pv53="1"]:hover{background:#f5f8f6}.pv53-edit-measure{border:0;background:transparent;font:inherit;font-weight:700;cursor:pointer;padding:2px 6px;border-radius:6px;opacity:.72}.pv53-edit-measure:hover{background:#e8eeeb;opacity:1}.pv53-measure-heading{margin:4px 0 0;padding:9px 11px;background:#f7fbf9;border-radius:9px}.pv53-measure-heading strong,.pv53-measure-heading small{display:block}.pv53-measure-heading small{margin-top:2px;opacity:.68}.pv53-measure-field input{font-weight:700}`;
document.head.appendChild(st);
})();
</script>
