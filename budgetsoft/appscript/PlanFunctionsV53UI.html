<script>
(function(){
'use strict';
const M=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));

function nombreFr_(s){
  const m=String(s||'').replace(/\u202f|\u00a0/g,' ').match(/(-?[\d\s]+(?:[,.]\d+)?)\s*€/);
  if(!m)return 0;
  return Number(m[1].replace(/\s/g,'').replace(',','.'))||0;
}

function resultatObjectifDepuisDom_(goal){
  let mensuel=0,annuel=0,actions=0;
  goal.querySelectorAll('.p54-actionrow').forEach(row=>{
    const statut=String(row.querySelector('.p54-status')?.textContent||'').trim();
    if(statut==='Abandonnée')return;
    const attendu=[...row.querySelectorAll('.p54-gains span')].find(x=>/^Attendu\b/i.test(String(x.textContent||'').trim()));
    if(!attendu)return;
    const txt=String(attendu.textContent||'');
    const mm=txt.match(/(-?[\d\s.,]+)\s*€\s*\/\s*mois/i);
    const aa=txt.match(/(-?[\d\s.,]+)\s*€\s*\/\s*an/i);
    const parse=x=>Number(String(x||'').replace(/\u202f|\u00a0|\s/g,'').replace(',','.'))||0;
    const m=mm?parse(mm[1]):0,a=aa?parse(aa[1]):0;
    if(m||a){mensuel+=m;annuel+=a;actions++;}
  });
  return {mensuel,annuel,actions};
}

function decorerObjectifs_(){
  document.querySelectorAll('#generic-view .p54-goal').forEach(goal=>{
    const header=goal.querySelector(':scope > header');
    if(!header||!header.querySelector('[data-edit-goal]'))return;
    const r=resultatObjectifDepuisDom_(goal);
    let box=header.querySelector('.p55-goal-result');
    if(!box){
      box=document.createElement('div');
      box.className='p55-goal-result';
      const tools=header.querySelector('.p54-tools');
      if(tools)header.insertBefore(box,tools);else header.appendChild(box);
    }
    box.innerHTML=`<small>RÉSULTAT ATTENDU</small><b>${r.mensuel?M(r.mensuel)+'/mois · ':''}${M(r.annuel)}/an</b><span>${r.actions} action(s) contributive(s)</span>`;
  });
}

function rendreFormulairesPraticables_(){
  document.querySelectorAll('.p54-modal .modal-card').forEach(card=>{
    const head=card.querySelector('.modal-heading'),foot=card.querySelector('.form-actions');
    if(head)head.classList.add('p55-sticky-head');
    if(foot)foot.classList.add('p55-sticky-foot');
  });
}

let timer=null;
function appliquer_(){
  clearTimeout(timer);
  timer=setTimeout(()=>{
    decorerObjectifs_();
    rendreFormulairesPraticables_();
  },20);
}

/*
 * Ne plus observer tout le document en profondeur : Plan pouvait retraiter le DOM
 * à chaque mutation d'un autre module. On limite maintenant l'observation au rendu
 * du Plan et à l'ajout direct des modales.
 */
function installerObservateursPlan_(){
  const gv=document.getElementById('generic-view');
  if(gv)new MutationObserver(appliquer_).observe(gv,{childList:true,subtree:true});
  if(document.body)new MutationObserver(muts=>{
    if(muts.some(m=>[...m.addedNodes].some(n=>n&&n.nodeType===1&&((n.matches&&n.matches('.p54-modal'))||(n.querySelector&&n.querySelector('.p54-modal'))))))appliquer_();
  }).observe(document.body,{childList:true,subtree:false});
}
installerObservateursPlan_();
setTimeout(appliquer_,30);

/*
 * Pré-chauffe très courte du cache serveur après stabilisation de l'application.
 * Les deux appels sont indépendants et remplissent les caches utilisés ensuite par
 * PlanFunctionsV54UI. Aucun rendu n'est déclenché ici.
 */
let prechauffeLancee=false;
function prechaufferPlan_(){
  if(prechauffeLancee||!window.google||!google.script||!google.script.run)return;
  prechauffeLancee=true;
  try{google.script.run.withFailureHandler(()=>{}).chargerPlanStructureV54();}catch(e){}
  try{google.script.run.withFailureHandler(()=>{}).chargerMesuresPlanV54();}catch(e){}
}
const navPlan=document.querySelector('.nav-item[data-view="plan"]');
if(navPlan){
  navPlan.addEventListener('pointerenter',prechaufferPlan_,{once:true,passive:true});
  navPlan.addEventListener('focus',prechaufferPlan_,{once:true,passive:true});
}
setTimeout(prechaufferPlan_,1800);

const st=document.createElement('style');
st.id='plan-v55-direct-style';
st.textContent=`
/* Plan : même largeur utile que les autres grands modules. */
#generic-view>.p54,#generic-view .p54{max-width:none!important;width:100%!important;margin-left:0!important;margin-right:0!important;box-sizing:border-box!important}
#generic-view .p54-head,#generic-view .p54-metrics,#generic-view .p54-goals,#generic-view .p54-events{width:100%!important;max-width:none!important;box-sizing:border-box!important}

/* Événements : une bande horizontale pleine largeur par événement. */
#generic-view .p54-eventgrid{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:0!important;width:100%!important}
#generic-view .p54-eventgrid>article{width:100%!important;box-sizing:border-box!important;border:0!important;border-top:1px solid #e7efec!important;border-radius:0!important;padding:10px 12px!important;display:grid!important;grid-template-columns:minmax(0,1fr) auto auto!important;gap:12px!important;align-items:center!important}
#generic-view .p54-eventgrid>article:first-child{border-top:0!important}
#generic-view .p54-eventgrid>article>button{min-width:0!important;display:grid!important;grid-template-columns:minmax(150px,.35fr) minmax(220px,1fr) minmax(180px,.55fr)!important;gap:14px!important;align-items:center!important;padding:0!important}
#generic-view .p54-eventgrid>article>button small,#generic-view .p54-eventgrid>article>button b,#generic-view .p54-eventgrid>article>button span{margin:0!important;min-width:0!important}

/* Formulaires : ne dépassent jamais la fenêtre, scroll interne. */
.p54-modal{align-items:flex-start!important;padding:10px!important;overflow:hidden!important;box-sizing:border-box!important}
.p54-modal .modal-card{max-height:calc(100vh - 20px)!important;height:auto!important;overflow-y:auto!important;overflow-x:hidden!important;margin:0 auto!important;overscroll-behavior:contain!important}
.p54-modal .modal-card.wide-modal{width:min(980px,calc(100vw - 24px))!important;max-width:min(980px,calc(100vw - 24px))!important}
.p54-modal .p55-sticky-head{position:sticky!important;top:0!important;z-index:8!important;background:#fff!important;padding-top:6px!important;padding-bottom:8px!important;border-bottom:1px solid #edf1ef!important}
.p54-modal .p55-sticky-foot{position:sticky!important;bottom:-1px!important;z-index:8!important;background:#fff!important;padding-top:10px!important;padding-bottom:6px!important;border-top:1px solid #edf1ef!important}

/* Résultat attendu de l'objectif. */
.p55-goal-result{margin-left:auto!important;margin-right:14px!important;text-align:right!important;min-width:210px!important}
.p55-goal-result small,.p55-goal-result b,.p55-goal-result span{display:block!important}.p55-goal-result small{font-size:10px!important;letter-spacing:.04em!important;opacity:.58!important}.p55-goal-result b{font-size:13px!important;margin:2px 0!important}.p55-goal-result span{font-size:11px!important;opacity:.62!important}

@media(max-width:800px){
  #generic-view .p54-eventgrid>article>button{grid-template-columns:1fr!important;gap:2px!important}
  .p55-goal-result{text-align:left!important;margin:6px 0 0!important;min-width:0!important}
  .p54-modal{padding:4px!important}.p54-modal .modal-card{max-height:calc(100vh - 8px)!important}.p54-modal .modal-card.wide-modal{width:calc(100vw - 8px)!important;max-width:calc(100vw - 8px)!important}
}
`;
document.head.appendChild(st);
})();
</script>
