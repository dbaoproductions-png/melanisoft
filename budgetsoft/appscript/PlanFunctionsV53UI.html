<script>
(function(){'use strict';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const Y=v=>v===true||String(v)==='true';
const ECON=['REDUIRE','SUPPRIMER','REMPLACER','RECEVOIR'];
const FL={REMBOURSER:'Rembourser',TRANSFERER:'Épargner / transférer',RECEVOIR:'Recevoir',REDUIRE:'Réduire',SUPPRIMER:'Supprimer',REMPLACER:'Remplacer',PLAFONNER:'Plafonner',ATTEINDRE:'Atteindre / maintenir un stock'};
let D=null,MEAS=null,busy=false;
function gain(a,m){const f=String(a.fonction_plan||'').toUpperCase();if(!ECON.includes(f))return {m:0,a:0};const x=Math.max(0,Number(m==null?(a.cible_valeur||a.impact_montant||0):m)),q=String(a.impact_frequence||'ponctuel').toLowerCase();return q==='mensuel'?{m:x,a:x*12}:q==='annuel'?{m:x/12,a:x}:{m:0,a:x};}
function effectiveAmount(a){if(!MEAS)return 0;const z=(MEAS.mesures||{})[String(a.id)]||{},f=String(a.fonction_plan||'').toUpperCase();if(f==='SUPPRIMER')return Number(z.progression||0)>=100?Number(a.cible_valeur||a.impact_montant||0):0;if(['REDUIRE','REMPLACER'].includes(f))return Math.max(0,Number(z.realise||0));if(f==='RECEVOIR'){const r=Math.max(0,Number(z.realise||0)),c=Math.max(0,Number(a.cible_valeur||a.impact_montant||0));return ['mensuel','annuel'].includes(String(a.impact_frequence||''))?Math.min(r,c||r):r;}return 0;}
function toast(t,kind){let z=document.getElementById('p54-toast');if(!z){z=document.createElement('div');z.id='p54-toast';document.body.appendChild(z);}z.className='p54-toast '+(kind||'');z.textContent=t;z.classList.add('show');setTimeout(()=>z.classList.remove('show'),2200);}
function root(){return document.getElementById('generic-view');}
function show(){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));root().classList.add('active');document.getElementById('page-title').textContent='Plan';document.getElementById('page-eyebrow').textContent='Feuille de route opérationnelle';root().innerHTML=`<article class="p54"><header class="p54-head"><div><span class="panel-kicker">Quelques mois → 1 an</span><h2>Plan d’action</h2><p>Des actions mesurables, reliées aux données réelles de BudgetSoft.</p></div><div class="p54-head-actions"><button class="secondary-button" id="p54-goal">＋ Objectif</button><button class="primary-button" id="p54-action">＋ Action</button></div></header><div id="p54-body"><div class="p54-loading"><span></span>Chargement du plan…</div></div></article>`;bindHead();if(D){render();refreshStructure(true);}else refreshStructure(false);}
function bindHead(){document.getElementById('p54-action').onclick=()=>actionForm({});document.getElementById('p54-goal').onclick=()=>goalForm({});}
function refreshStructure(silent){if(busy&&!silent)return;busy=true;google.script.run.withSuccessHandler(d=>{busy=false;D=d;render();loadMeasures();}).withFailureHandler(e=>{busy=false;document.getElementById('p54-body').innerHTML='<div class="error">'+E(e.message||e)+'</div>';}).chargerPlanStructureV54();}
function loadMeasures(){google.script.run.withSuccessHandler(m=>{MEAS=m;render();}).withFailureHandler(()=>{}).chargerMesuresPlanV54();}
function metrics(){const ge=D.gains_attendus||{},gf=MEAS&&MEAS.gains_effectifs||{},n=(D.actions||[]).length,done=(D.actions||[]).filter(a=>String(a.statut)==='Effective').length,ctl=MEAS?Object.values(MEAS.mesures||{}).filter(x=>String(x.confiance||'')==='à_valider').length:'—';return `<div class="p54-metrics"><div><small>AVANCEMENT</small><b>${n?Math.round(done/n*100):0} %</b><span>${done}/${n} action(s) effective(s)</span></div><div class="gain"><small>GAIN ATTENDU</small><b>${M(ge.mensuel)}/mois</b><span>${M(ge.annuel)}/an</span></div><div class="gain effective"><small>GAIN EFFECTIF</small><b>${MEAS?M(gf.mensuel)+'/mois':'Calcul…'}</b><span>${MEAS?M(gf.annuel)+'/an':'Enquête en cours'}</span></div><div><small>ACTIONS</small><b>${n}</b><span>${(D.objectifs||[]).length} objectif(s)</span></div><div><small>À CONTRÔLER</small><b>${ctl}</b><span>preuve à confirmer</span></div></div>`;}
function render(){if(!D)return;const body=document.getElementById('p54-body');if(!body)return;body.innerHTML=metrics()+`<div class="p54-goals">${(D.groupes||[]).map(group).join('')}${(D.sansObjectif||[]).length?`<section class="p54-goal"><header><div><h3>Sans objectif</h3><small>Actions à classer</small></div></header><div>${D.sansObjectif.map(actionRow).join('')}</div></section>`:''}</div>`+eventsBlock();bindRows();}
function group(g){return `<section class="p54-goal"><header><div><h3>${E(g.objectif.nom)}</h3><small>${E(g.objectif.horizon||'')} ${g.objectif.priorite?'· '+E(g.objectif.priorite):''}</small></div><span class="p54-tools"><button data-edit-goal="${E(g.objectif.id)}">✎</button><button data-del-goal="${E(g.objectif.id)}">×</button></span></header><div>${(g.actions||[]).map(actionRow).join('')||'<div class="empty-state">Aucune action.</div>'}</div></section>`;}
function actionRow(a){const f=String(a.fonction_plan||'').toUpperCase(),g=gain(a),eff=effectiveAmount(a),eg=gain(a,eff),m=MEAS&&(MEAS.mesures||{})[String(a.id)]||null,progress=m?Number(m.progression||0):0,cond=a.condition_libelle?`<span class="p54-tag condition">${E(a.condition_statut||'En attente')} · ${E(a.condition_libelle)}</span>`:'';return `<article class="p54-actionrow"><button class="p54-actionmain" data-edit-action="${E(a.id)}"><div class="p54-actiontitle"><b>${E(a.libelle)}</b><span class="p54-status ${E(String(a.statut||'Prévue').replace(/\s/g,'-'))}">${E(a.statut||'Prévue')}</span></div><div class="p54-tags"><span class="p54-tag">${E(FL[f]||f||'Action')}</span>${a.categorie?`<span class="p54-tag">${E(a.categorie)}</span>`:''}${a.impact_frequence?`<span class="p54-tag">${E(a.impact_frequence)}</span>`:''}${cond}</div><div class="p54-gains"><span>Attendu <b>${g.m?M(g.m)+'/mois · ':''}${M(g.a)}/an</b></span>${eff>0?`<span class="real">Effectif <b>${eg.m?M(eg.m)+'/mois · ':''}${M(eg.a)}/an</b></span>`:''}${!ECON.includes(f)?'<span class="neutral">Impact économique neutre</span>':''}</div>${m?`<div class="p54-progress"><i style="width:${Math.max(0,Math.min(100,progress))}%"></i></div><small>${E(m.statut||'En cours')} · ${Math.round(progress*10)/10}% · ${E(m.confiance||'à valider')}</small>`:''}</button><span class="p54-tools"><button data-edit-action="${E(a.id)}">✎</button><button data-del-action="${E(a.id)}">×</button></span></article>`;}
function eventsBlock(){return `<section class="p54-events"><header><div><span class="panel-kicker">Les impondérables de la vie</span><h3>Événements</h3><p>Une dépense ou recette ponctuelle prévue, éventuellement fractionnée, puis rapprochée du réel.</p></div><button class="primary-button" id="p54-event">＋ Événement</button></header><div class="p54-eventgrid">${(D.evenements||[]).map(e=>`<article><button data-edit-event="${E(e.id)}"><small>${E(e.type||'')} · ${E(String(e.date_effet||'').slice(0,10))}</small><b>${E(e.libelle)}</b><span>${E(e.categorie||'Sans catégorie')} · ${E(e.statut||'Prévu')}</span></button><strong>${e.type==='depense'?'-':''}${M(Math.abs(Number(e.montant||0)))}</strong><span class="p54-tools"><button data-edit-event="${E(e.id)}">✎</button><button data-del-event="${E(e.id)}">×</button></span></article>`).join('')||'<div class="empty-state">Aucun événement.</div>'}</div></section>`;}
function bindRows(){root().querySelectorAll('[data-edit-action]').forEach(b=>b.onclick=e=>{e.stopPropagation();actionForm((D.actions||[]).find(a=>String(a.id)===String(b.dataset.editAction))||{});});root().querySelectorAll('[data-del-action]').forEach(b=>b.onclick=()=>del('action',b.dataset.delAction));root().querySelectorAll('[data-edit-goal]').forEach(b=>b.onclick=()=>goalForm((D.objectifs||[]).find(o=>String(o.id)===String(b.dataset.editGoal))||{}));root().querySelectorAll('[data-del-goal]').forEach(b=>b.onclick=()=>del('objectif',b.dataset.delGoal));root().querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=e=>{e.stopPropagation();eventForm((D.evenements||[]).find(x=>String(x.id)===String(b.dataset.editEvent))||{});});root().querySelectorAll('[data-del-event]').forEach(b=>b.onclick=()=>del('evenement',b.dataset.delEvent));document.getElementById('p54-event').onclick=()=>eventForm({});}
function del(type,id){if(!confirm('Supprimer cet élément ?'))return;toast('Suppression…');google.script.run.withSuccessHandler(()=>{toast('Supprimé','ok');refreshStructure(false);}).withFailureHandler(e=>toast(e.message||e,'err')).supprimerElementPlanV54(type,id);}
function opts(arr,v){return arr.map(x=>`<option value="${E(x)}" ${String(x)===String(v||'')?'selected':''}>${E(x)}</option>`).join('');}
function sourceResults(z,items,pick){const groups=[['charge_fixe','Charges fixes'],['operation','Opérations'],['credit','Crédits'],['dette','Dettes']];z.innerHTML=groups.map(([t,l])=>{const xs=(items||[]).filter(x=>x.type===t);return xs.length?`<div class="p54-results"><small>${l}</small>${xs.map((x,i)=>`<button data-rtype="${t}" data-rid="${E(x.id)}"><b>${E(x.libelle)}</b><span>${E(x.detail||'')} · ${M(x.capital_restant||x.montant||0)}</span></button>`).join('')}</div>`:'';}).join('')||'<small>Aucun résultat.</small>';z.querySelectorAll('[data-rid]').forEach(b=>b.onclick=()=>pick((items||[]).find(x=>x.type===b.dataset.rtype&&String(x.id)===String(b.dataset.rid))||{}));}
function actionForm(a){a=a||{};const f0=String(a.fonction_plan||'REDUIRE').toUpperCase(),m=document.createElement('div');m.className='modal p54-modal';m._source={type:a.source_type||'',id:a.source_id||'',libelle:a.source_libelle||'',montant:a.valeur_depart||0,categorie:a.categorie||''};m._rep={type:a.source_remplacement_id?'charge_fixe':'',id:a.source_remplacement_id||'',libelle:a.source_remplacement_libelle||'',montant:a.valeur_remplacement||0};m.innerHTML=`<div class="modal-card wide-modal compact-modal"><div class="modal-heading"><div><span class="panel-kicker">Action mesurable</span><h2>${a.id?'Modifier':'Nouvelle'} action</h2></div><button class="modal-close" id="p54-x">×</button></div><div class="form-grid"><label class="full-field">Action<input id="p54-l" value="${E(a.libelle||'')}"></label><label>Objectif<select id="p54-o"><option value="">— Aucun —</option>${(D.objectifs||[]).map(o=>`<option value="${E(o.id)}" ${String(o.id)===String(a.objectif_id||'')?'selected':''}>${E(o.nom)}</option>`).join('')}</select></label><label>Statut<select id="p54-s">${opts(['Prévue','En cours','Effective','Abandonnée'],normalStatus(a.statut))}</select></label><label>Fonction<select id="p54-f">${Object.keys(FL).map(k=>`<option value="${k}" ${k===f0?'selected':''}>${E(FL[k])}</option>`).join('')}</select></label><label>Catégorie<select id="p54-c"><option value="">— Sans catégorie —</option>${(D.categories||[]).map(c=>`<option ${String(c)===String(a.categorie||'')?'selected':''}>${E(c)}</option>`).join('')}</select></label><label id="p54-targetwrap">Cible<input id="p54-target" type="number" min="0" step="0.01" value="${Number(a.cible_valeur||a.impact_montant||0)}"></label><label id="p54-freqwrap">Fréquence de la cible<select id="p54-freq">${[['mensuel','Mensuelle'],['annuel','Annuelle'],['ponctuel','Ponctuelle']].map(x=>`<option value="${x[0]}" ${String(a.impact_frequence||'mensuel')===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><label>Date de début / effet<input id="p54-start" type="date" value="${E(String(a.date_effet||'').slice(0,10))}"></label><label>Date cible<input id="p54-end" type="date" value="${E(String(a.date_cible||'').slice(0,10))}"></label></div><div class="source-box" id="p54-source"><strong>Rattachement BudgetSoft</strong><p class="helper-text">Charge fixe, opération réelle, crédit ou dette selon la fonction.</p><div class="source-search"><input id="p54-q" value="${E(a.source_libelle||'')}" placeholder="Opodo, MNT, Oney…"><button class="secondary-button" id="p54-search">Rechercher</button></div><div id="p54-results"></div></div><div class="source-box" id="p54-rep"><strong>Nouveau contrat</strong><div class="source-search"><input id="p54-rq" value="${E(a.source_remplacement_libelle||'')}" placeholder="Aésio…"><button class="secondary-button" id="p54-rsearch">Rechercher</button></div><div id="p54-rresults"></div><div class="form-grid"><label>Ancien tarif mensuel<input id="p54-old" type="number" min="0" step="0.01" value="${Number(a.valeur_depart||0)}"></label><label>Nouveau tarif mensuel<input id="p54-new" type="number" min="0" step="0.01" value="${Number(a.valeur_remplacement||0)}"></label></div><label class="checkbox-line"><input type="checkbox" id="p54-autocalc" checked> Calculer automatiquement l’économie cible</label></div><div class="p54-condition"><strong>Condition / prérequis</strong><div class="form-grid"><label class="full-field">Condition<input id="p54-cond" value="${E(a.condition_libelle||'')}"></label><label>État<select id="p54-condst">${opts(['En attente','Remplie'],a.condition_statut||'En attente')}</select></label><label>Date de confirmation<input id="p54-condd" type="date" value="${E(String(a.condition_date||'').slice(0,10))}"></label></div></div><label class="checkbox-line"><input type="checkbox" id="p54-auto" ${a.enquete_auto===false||String(a.enquete_auto)==='false'?'':'checked'}> Enquête automatique dans les données BudgetSoft</label><label class="checkbox-line" id="p54-confirmwrap"><input type="checkbox" id="p54-confirm" ${Y(a.impact_confirme)?'checked':''}> Impact confirmé : peut alimenter le prévisionnel Cerbère</label><label class="checkbox-line" id="p54-reevalwrap"><input type="checkbox" id="p54-reeval" ${Y(a.reevaluer_charges_fixes)?'checked':''}> Réévaluer les charges fixes si l’action devient effective</label><div id="p54-preview" class="p54-preview"></div><label>Commentaire<textarea id="p54-com" rows="2">${E(a.commentaire||'')}</textarea></label><div class="form-actions"><button class="secondary-button" id="p54-cancel">Annuler</button><button class="primary-button" id="p54-save">Enregistrer</button></div></div>`;document.body.appendChild(m);
const f=m.querySelector('#p54-f'),target=m.querySelector('#p54-target'),freq=m.querySelector('#p54-freq'),old=m.querySelector('#p54-old'),nw=m.querySelector('#p54-new'),ac=m.querySelector('#p54-autocalc');function upd(){const v=f.value,econ=ECON.includes(v),rep=v==='REMPLACER';m.querySelector('#p54-freqwrap').style.display=econ?'block':'none';m.querySelector('#p54-rep').style.display=rep?'block':'none';m.querySelector('#p54-reevalwrap').style.display=['REDUIRE','SUPPRIMER','REMPLACER'].includes(v)?'flex':'none';m.querySelector('#p54-confirmwrap').style.display=econ?'flex':'none';if(rep&&ac.checked){target.value=Math.max(0,Number(old.value||0)-Number(nw.value||0)).toFixed(2);}const fake={fonction_plan:v,cible_valeur:Number(target.value||0),impact_frequence:freq.value},g=gain(fake);m.querySelector('#p54-preview').innerHTML=`<small>Gain attendu</small><b>${g.m?M(g.m)+'/mois · ':''}${M(g.a)}/an</b>${econ?'':'<span>Impact économique neutre</span>'}`;}[f,freq,old,nw].forEach(x=>{x.onchange=upd;x.oninput=upd;});target.oninput=()=>{if(f.value==='REMPLACER')ac.checked=false;upd();};ac.onchange=upd;upd();m.querySelector('#p54-x').onclick=m.querySelector('#p54-cancel').onclick=()=>m.remove();
function search(btn,q,res,role,pick){m.querySelector(btn).onclick=()=>{const z=m.querySelector(res);z.innerHTML='Recherche…';google.script.run.withSuccessHandler(r=>sourceResults(z,r,x=>{pick(x);z.innerHTML=`<small>Rattaché à <b>${E(x.libelle)}</b> · ${E(x.detail||'')}</small>`;upd();})).withFailureHandler(e=>z.textContent=e.message||e).rechercherRapprochementsPlanV52(m.querySelector(q).value,f.value,role);};}search('#p54-search','#p54-q','#p54-results','source',x=>{m._source=x;m.querySelector('#p54-q').value=x.libelle||'';if(x.categorie)m.querySelector('#p54-c').value=x.categorie;if(x.montant&&!Number(old.value||0))old.value=x.montant;if(f.value==='REMBOURSER'&&x.capital_restant&&!Number(target.value||0))target.value=x.capital_restant;});search('#p54-rsearch','#p54-rq','#p54-rresults','remplacement',x=>{m._rep=x;m.querySelector('#p54-rq').value=x.libelle||'';if(x.montant)nw.value=x.montant;});
m.querySelector('#p54-save').onclick=()=>{const b=m.querySelector('#p54-save'),cond=m.querySelector('#p54-cond').value.trim(),src=m._source||{},rp=m._rep||{};const dto={id:a.id||'',libelle:m.querySelector('#p54-l').value.trim(),objectif_id:m.querySelector('#p54-o').value,statut:m.querySelector('#p54-s').value,fonction_plan:f.value,categorie:m.querySelector('#p54-c').value,cible_valeur:Math.abs(Number(target.value||0)),impact_frequence:freq.value,date_effet:m.querySelector('#p54-start').value,date_cible:m.querySelector('#p54-end').value,source_type:src.type||a.source_type||'',source_id:src.id||a.source_id||'',source_libelle:src.libelle||m.querySelector('#p54-q').value||'',source_remplacement_id:rp.type==='charge_fixe'?rp.id||'':a.source_remplacement_id||'',source_remplacement_libelle:rp.libelle||m.querySelector('#p54-rq').value||'',valeur_depart:Math.abs(Number(old.value||src.montant||a.valeur_depart||0)),valeur_remplacement:Math.abs(Number(nw.value||0)),enquete_auto:m.querySelector('#p54-auto').checked,impact_confirme:m.querySelector('#p54-confirm').checked,reevaluer_charges_fixes:m.querySelector('#p54-reeval').checked,condition_libelle:cond,condition_statut:cond?m.querySelector('#p54-condst').value:'',condition_date:m.querySelector('#p54-condd').value,commentaire:m.querySelector('#p54-com').value};if(!dto.libelle)return alert('Le libellé est obligatoire.');if(!dto.cible_valeur&& !['SUPPRIMER','REMPLACER'].includes(dto.fonction_plan))return alert('La cible doit être supérieure à zéro.');b.disabled=true;b.textContent='Enregistrement…';toast('Enregistrement de l’action…');google.script.run.withSuccessHandler(()=>{m.remove();toast('Action enregistrée ✓','ok');refreshStructure(false);}).withFailureHandler(e=>{b.disabled=false;b.textContent='Enregistrer';toast(e.message||e,'err');}).enregistrerActionPlanV54(dto);};}
function normalStatus(s){return ['Effective','Abandonnée','En cours'].includes(String(s||''))?String(s):'Prévue';}
function goalForm(o){o=o||{};const m=document.createElement('div');m.className='modal p54-modal';m.innerHTML=`<div class="modal-card compact-modal"><div class="modal-heading"><h2>${o.id?'Modifier':'Nouvel'} objectif</h2><button class="modal-close" id="g-x">×</button></div><label>Objectif<input id="g-n" value="${E(o.nom||'')}"></label><div class="form-grid"><label>Horizon<select id="g-h">${opts(['court','moyen','long'],o.horizon||'court')}</select></label><label>Priorité<select id="g-p">${opts(['haute','moyenne','basse'],o.priorite||'moyenne')}</select></label></div><div class="form-actions"><button class="secondary-button" id="g-c">Annuler</button><button class="primary-button" id="g-s">Enregistrer</button></div></div>`;document.body.appendChild(m);m.querySelector('#g-x').onclick=m.querySelector('#g-c').onclick=()=>m.remove();m.querySelector('#g-s').onclick=()=>{const nom=m.querySelector('#g-n').value.trim();if(!nom)return alert('Le nom est obligatoire.');const b=m.querySelector('#g-s');b.disabled=true;b.textContent='Enregistrement…';google.script.run.withSuccessHandler(()=>{m.remove();toast('Objectif enregistré ✓','ok');refreshStructure(false);}).withFailureHandler(e=>{b.disabled=false;b.textContent='Enregistrer';toast(e.message||e,'err');}).enregistrerObjectifPlan({id:o.id||'',nom,horizon:m.querySelector('#g-h').value,priorite:m.querySelector('#g-p').value,statut:'Actif'});};}
function eventForm(e){e=e||{};const m=document.createElement('div');m.className='modal p54-modal';m.innerHTML=`<div class="modal-card compact-modal"><div class="modal-heading"><div><span class="panel-kicker">Événement ponctuel</span><h2>${e.id?'Modifier':'Nouvel'} événement</h2></div><button class="modal-close" id="ev-x">×</button></div><div class="form-grid"><label class="full-field">Libellé<input id="ev-l" value="${E(e.libelle||'')}"></label><label>Nature<select id="ev-t">${opts(['depense','recette'],e.type||'depense')}</select></label><label>Catégorie<select id="ev-cat"><option value="">— Sans catégorie —</option>${(D.categories||[]).map(c=>`<option ${String(c)===String(e.categorie||'')?'selected':''}>${E(c)}</option>`).join('')}</select></label><label>Montant total<input id="ev-m" type="number" min="0" step="0.01" value="${Math.abs(Number(e.montant||0))}"></label><label>Date / 1re échéance<input id="ev-d" type="date" value="${E(String(e.date_effet||'').slice(0,10))}"></label><label>Mode de paiement<select id="ev-pay">${opts(['CB','Chèque','Virement','Prélèvement','Espèces','Autre'],e.mode_paiement||'Virement')}</select></label><label>Certitude<select id="ev-cert">${opts(['certaine','probable','possible'],e.certitude||'certaine')}</select></label><label>Statut<select id="ev-st">${opts(['Prévu','Réalisé','Rapproché','Annulé'],e.statut||'Prévu')}</select></label><label class="checkbox-line full-field"><input type="checkbox" id="ev-fr" ${Y(e.fractionne)?'checked':''}> Paiement / encaissement en plusieurs fois</label><div class="form-grid full-field" id="ev-frbox"><label>Périodicité<select id="ev-per">${opts(['mensuel','annuel'],e.periodicite_fractionnement||'mensuel')}</select></label><label>Nombre de fois<select id="ev-n">${Array.from({length:11},(_,i)=>i+2).map(n=>`<option value="${n}" ${Number(e.nombre_fois||2)===n?'selected':''}>${n}</option>`).join('')}</select></label></div></div><div id="ev-prev" class="p54-preview"></div><div id="ev-match"></div><label>Commentaire<textarea id="ev-com" rows="2">${E(e.commentaire||'')}</textarea></label><div class="form-actions">${e.id&&e.statut!=='Rapproché'?'<button class="secondary-button" id="ev-link">Rapprocher</button>':''}<button class="secondary-button" id="ev-c">Annuler</button><button class="primary-button" id="ev-s">Enregistrer</button></div></div>`;document.body.appendChild(m);const upd=()=>{const fr=m.querySelector('#ev-fr').checked,n=fr?Number(m.querySelector('#ev-n').value||2):1,total=Math.abs(Number(m.querySelector('#ev-m').value||0));m.querySelector('#ev-frbox').style.display=fr?'grid':'none';m.querySelector('#ev-prev').innerHTML=total?`<small>Prévision Cerbère</small><b>${n===1?M(total):n+' échéances d’environ '+M(total/n)}</b>`:'';};['#ev-fr','#ev-n','#ev-m','#ev-per'].forEach(q=>{m.querySelector(q).onchange=upd;m.querySelector(q).oninput=upd;});upd();m.querySelector('#ev-x').onclick=m.querySelector('#ev-c').onclick=()=>m.remove();if(m.querySelector('#ev-link'))m.querySelector('#ev-link').onclick=()=>{const z=m.querySelector('#ev-match');z.innerHTML='Recherche…';google.script.run.withSuccessHandler(r=>{z.innerHTML=(r||[]).map(x=>`<button class="source-hit" data-op="${E(x.id)}"><b>${E(x.libelle)}</b><span>${E(String(x.date||'').slice(0,10))} · ${M(x.montant)}</span></button>`).join('')||'<small>Aucune opération proche.</small>';z.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>google.script.run.withSuccessHandler(()=>{m.remove();toast('Événement rapproché ✓','ok');refreshStructure(false);}).rapprocherEvenementV4(e.id,b.dataset.op));}).withFailureHandler(x=>z.textContent=x.message||x).rechercherOperationsEvenementV54({type:m.querySelector('#ev-t').value,montant:Number(m.querySelector('#ev-m').value||0),date_effet:m.querySelector('#ev-d').value,categorie:m.querySelector('#ev-cat').value});};m.querySelector('#ev-s').onclick=()=>{const b=m.querySelector('#ev-s'),fr=m.querySelector('#ev-fr').checked,dto={id:e.id||'',libelle:m.querySelector('#ev-l').value.trim(),type:m.querySelector('#ev-t').value,categorie:m.querySelector('#ev-cat').value,montant:Math.abs(Number(m.querySelector('#ev-m').value||0)),date_effet:m.querySelector('#ev-d').value,mode_paiement:m.querySelector('#ev-pay').value,certitude:m.querySelector('#ev-cert').value,statut:m.querySelector('#ev-st').value,fractionne:fr,nombre_fois:fr?Number(m.querySelector('#ev-n').value||2):1,periodicite_fractionnement:fr?m.querySelector('#ev-per').value:'ponctuel',commentaire:m.querySelector('#ev-com').value};b.disabled=true;b.textContent='Enregistrement…';toast('Enregistrement de l’événement…');google.script.run.withSuccessHandler(()=>{m.remove();toast('Événement enregistré ✓','ok');refreshStructure(false);}).withFailureHandler(x=>{b.disabled=false;b.textContent='Enregistrer';toast(x.message||x,'err');}).enregistrerEvenementPlanV54(dto);};}
