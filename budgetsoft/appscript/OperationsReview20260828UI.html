<script>
(function(){
const TECH=/\s*\[(?:RECURRENCE|AUDIT_[A-Z0-9_]*|VALIDATION_RAPPROCHEMENT|AUDIT_RETRO|PDF:HELLOBANK|CARTE_DIFFEREE|CORRESPONDANCE|RAPPROCHEMENT|RAPPROCHEMENT_MANUEL|EXCEPTIONNEL_PREVISION)(?::[^\]]*)?\]/g;
const q=id=>document.getElementById(id);
const propre=v=>String(v||'').replace(TECH,' ').replace(/\s+/g,' ').trim();
function styles(){if(q('operations-review-style'))return;const s=document.createElement('style');s.id='operations-review-style';s.textContent=`#operations .operations-summary{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:10px!important;margin:10px 0 12px!important}#operations .operations-summary .metric-card{padding:14px 16px!important;min-width:0}#operations .operations-summary .metric-card strong{font-size:1.35rem!important}#operations .filters{display:grid!important;grid-template-columns:minmax(250px,1.7fr) minmax(150px,.9fr) minmax(135px,.75fr) minmax(145px,.8fr) minmax(145px,.8fr) auto;gap:8px!important;margin-bottom:10px!important}#operations .operation-table-row{grid-template-columns:36px 96px minmax(320px,1fr) 140px 160px 112px 76px!important;column-gap:10px!important}#operations .operation-label{min-width:0;overflow-wrap:anywhere}#operations .operation-amount{text-align:right;white-space:nowrap}#operations-tools-row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0 10px;flex-wrap:wrap}.operations-classify{display:flex;gap:8px;flex-wrap:wrap}.operations-control-details{position:relative}.operations-control-details summary{list-style:none;cursor:pointer}.operations-control-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:230px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);display:grid;gap:6px}.operations-control-menu button{width:100%;text-align:left}#operations-actions-main{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#operation-batch-bar{margin:8px 0!important;padding:8px 10px!important;gap:8px!important}@media(max-width:1100px){#operations .operations-summary{grid-template-columns:repeat(2,minmax(0,1fr))!important}}`;document.head.appendChild(s)}
function actions(){const tb=document.querySelector('#operations .toolbar-buttons');if(!tb)return;[...tb.children].forEach(x=>x.style.display='none');if(q('operations-actions-main'))return;const w=document.createElement('div');w.id='operations-actions-main';w.innerHTML='<button class="primary-button" id="operations-add-modern">＋ Ajouter une opération</button><button class="secondary-button" id="operations-hello-modern">📋 Importer Hello bank!</button><button class="secondary-button" id="operations-pdf-modern">📄 Importer un relevé PDF</button>';tb.appendChild(w);q('operations-add-modern').onclick=()=>q('add-operation-button')?.click();q('operations-pdf-modern').onclick=()=>q('import-pdf-button')?.click();q('operations-hello-modern').onclick=()=>{q('banking-integrity-button')?.click();setTimeout(()=>document.querySelector('#banking-integrity-modal .bi-tab[data-tab="flux"]')?.click(),50)}}
function carte(){const z=document.querySelector('#operations .operations-summary');if(z&&!q('operations-uncategorized')){const c=document.createElement('article');c.className='card metric-card';c.innerHTML='<span>Sans catégorie</span><strong id="operations-uncategorized">0</strong><small>Opérations restant à classer</small>';z.appendChild(c)}}
function outils(){const p=document.querySelector('#operations .operations-page-panel');if(!p||q('operations-tools-row'))return;const f=p.querySelector('.filters'),r=document.createElement('div');r.id='operations-tools-row';r.innerHTML='<div class="operations-classify"><button class="secondary-button" id="operations-category-modern">🏷 Catégoriser</button><button class="secondary-button" id="operations-bulk-modern">🏷 Catégoriser en masse</button></div><details class="operations-control-details"><summary class="secondary-button">⚙ Outils de contrôle ▾</summary><div class="operations-control-menu"><button class="secondary-button" id="operations-match-modern">🔎 Rapprochements</button><button class="secondary-button" id="operations-retro-modern">🧹 Audit rétrospectif</button><button class="secondary-button" id="operations-balance-modern">✓ Vérifier le solde</button><button class="secondary-button" id="operations-maintenance-modern">Maintenance bancaire</button></div></details>';f?.after(r);q('operations-category-modern').onclick=()=>q('category-review-button')?.click();q('operations-bulk-modern').onclick=()=>q('bulk-category-button')?.click();q('operations-match-modern').onclick=()=>q('review-matches-button')?.click();q('operations-retro-modern').onclick=()=>q('retro-audit-button')?.click();q('operations-balance-modern').onclick=()=>{q('banking-integrity-button')?.click();setTimeout(()=>document.querySelector('#banking-integrity-modal .bi-tab[data-tab="etat"]')?.click(),50)};q('operations-maintenance-modern').onclick=()=>{q('banking-integrity-button')?.click();setTimeout(()=>document.querySelector('#banking-integrity-modal .bi-tab[data-tab="migration"]')?.click(),50)}}
function nettoyer(){document.querySelectorAll('#operations-list .operation-label small').forEach(el=>{const t=propre(el.textContent);if(el.textContent!==t)el.textContent=t;el.hidden=!t})}
function idRow(row){const b=row?.querySelector('button[onclick*="modifierOperation"]');const m=String(b?.getAttribute('onclick')||'').match(/modifierOperation\(['"]([^'"]+)['"]\)/);return m?m[1]:''}
function ids(){return [...document.querySelectorAll('#operations-list .operation-table-row:not(.header) .operation-batch-check:checked')].map(c=>idRow(c.closest('.operation-table-row'))).filter(Boolean)}
function batch(){const clear=q('operation-batch-clear');if(clear&&!clear.dataset.fixed2){clear.dataset.fixed2='1';clear.onclick=()=>{document.querySelectorAll('#operations-list .operation-batch-check:checked').forEach(c=>{c.checked=false;c.dispatchEvent(new Event('change',{bubbles:true}))});const h=document.querySelector('#operations-list .header .operation-batch-check');if(h){h.checked=false;h.indeterminate=false}}}const bar=q('operation-batch-bar');if(bar&&!q('operation-to-fixed-batch')){const b=document.createElement('button');b.id='operation-to-fixed-batch';b.type='button';b.className='secondary-button';b.textContent='＋ Charges fixes';b.onclick=()=>{const sel=ids();if(!sel.length)return;google.script.run.withSuccessHandler(r=>{const actifs=(r.groupes||[]).filter(g=>!g.doublonChargeId);if(!actifs.length){alert('Aucune nouvelle charge fixe à créer.');return}const txt=actifs.map(g=>`${g.libelle||g.libelle_bancaire} · ${g.montant} € · ${g.frequence}`).join('\n');if(!confirm('Créer ces charges fixes ?\n\n'+txt))return;google.script.run.withSuccessHandler(x=>{alert(`${x.creees} charge(s) créée(s), ${x.operationsLiees} opération(s) reliée(s).`);if(typeof charger==='function')charger()}).withFailureHandler(e=>afficherErreur(e.message||String(e))).creerChargesFixesDepuisOperations20260828(sel,actifs.map(g=>g.cle))}).withFailureHandler(e=>afficherErreur(e.message||String(e))).previsualiserChargesFixesDepuisOperations20260828(sel)};bar.appendChild(b)}const b=q('operation-to-fixed-batch');if(b)b.disabled=!ids().length}
function apres(){carte();nettoyer();batch()}
function edition(){const wrap=fn=>function(){const r=fn.apply(this,arguments);[120,350].forEach(ms=>setTimeout(()=>{const t=q('operation-comment');if(t)t.value=propre(t.value)},ms));return r};if(typeof window.ouvrirOperation==='function'&&!window.ouvrirOperation.__op28){window.ouvrirOperation=wrap(window.ouvrirOperation);window.ouvrirOperation.__op28=true}if(typeof window.modifierOperation==='function'&&!window.modifierOperation.__op28){window.modifierOperation=wrap(window.modifierOperation);window.modifierOperation.__op28=true}}
function hookRendu(){const old=window.rendreListeOperations;if(typeof old==='function'&&!old.__op28){const w=function(){const r=old.apply(this,arguments);setTimeout(apres,0);return r};w.__op28=true;window.rendreListeOperations=w}}
function install(){styles();actions();carte();outils();edition();hookRendu();apres();document.addEventListener('change',e=>{if(e.target.matches?.('.operation-batch-check'))setTimeout(batch,0)})}
document.addEventListener('DOMContentLoaded',()=>setTimeout(install,1100));setTimeout(install,1500);
})();
</script>
