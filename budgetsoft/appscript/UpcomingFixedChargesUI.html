<script>
(function(){
  // Depuis 0.8-lab, la vue Opérations est strictement réservée aux mouvements
  // réels. Les échéances prévisionnelles restent dans l'onglet Charges fixes
  // et peuvent alimenter les tableaux de bord, mais ne sont jamais injectées
  // dans la liste des opérations, même sous forme de filtre virtuel.
  document.addEventListener('DOMContentLoaded',function(){
    const select=document.getElementById('operation-type-filter');
    if(!select)return;
    const ancienne=select.querySelector('option[value="charges_a_venir"]');
    if(ancienne)ancienne.remove();
  });
})();
</script>
