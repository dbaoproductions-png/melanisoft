<script>
(function(){let analyse=null;function installer(){const tb=document.querySelector('#operations .toolbar-buttons');if(tb&&!document.getElementById('reimport-cleanup-button')){const b=document.createElement('button');b.id='reimport-cleanup-button';b.type='button';b.className='secondary-button';b.textContent='🧼 Nettoyer par réimportation';b.onclick=ouvrir;tb.prepend(b);}if(document.getElementById('reimport-cleanup-modal'))return;const w=document.createElement('div');w.innerHTML=`<div class="modal hidden" id="reimport-cleanup-modal"><div class="modal-card wide-modal" style="max-height:94vh;overflow:auto"><div class="modal-heading"><div><p class="panel-kicker">Nettoyage sécurisé</p><h2>Réimporter sans perdre vos catégories</h2></div><button class="modal-close" id="close-reimport-cleanup">×</button></div><div class="warning-box"><strong>Mode remplacement.</strong> Les correspondances sûres remplacent uniquement les données bancaires source. Les cas résiduels peuvent ensuite être arbitrés manuellement.</div><label>Compte<select id="reimport-cleanup-account"></select></label><div class="form-grid" style="margin-top:12px"><label>Source<select id="reimport-cleanup-source"><option value="pdf">Relevé PDF Hello bank!</option><option value="coller">Copier-coller Hello bank!</option></select></label></div><div id="reimport-cleanup-pdf-zone" style="margin-top:12px"><label>Relevé PDF<input type="file" id="reimport-cleanup-pdf" accept="application/pdf"></label></div><div id="reimport-cleanup-paste-zone" class="hidden" style="margin-top:12px"><label>Opérations copiées<textarea id="reimport-cleanup-text" class="import-area" rows="12"></textarea></label></div><div id="reimport-cleanup-status" class="helper-text" style="margin-top:10px"></div><div id="reimport-cleanup-summary" class="import-summary" style="margin-top:12px"></div><div id="reimport-cleanup-filters" class="hidden" style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap"><button class="secondary-button" data-filter="residuels">À arbitrer</button><button class="secondary-button" data-filter="Ambigu">Ambiguës</button><button class="secondary-button" data-filter="Nouveau">Nouvelles</button><button class="secondary-button" data-filter="Correspondance sûre">Sûres</button></div><div id="reimport-cleanup-preview" class="import-preview" style="max-height:420px;overflow:auto"></div><div class="form-actions"><button class="secondary-button" id="reimport-cleanup-analyze">Analyser sans modifier</button><button class="primary-button" id="reimport-cleanup-apply" disabled>Remplacer les correspondances sûres</button></div></div></div>`;document.body.appendChild(w.firstElementChild);document.getElementById('close-reimport-cleanup').onclick=()=>document.getElementById('reimport-cleanup-modal').classList.add('hidden');document.getElementById('reimport-cleanup-analyze').onclick=analyser;document.getElementById('reimport-cleanup-apply').onclick=appliquer;document.getElementById('reimport-cleanup-source').onchange=changerSource;document.querySelectorAll('#reimport-cleanup-filters button').forEach(b=>b.onclick=()=>rendreListe(b.dataset.filter));}
function comptes(){const s=document.getElementById('reimport-cleanup-account');s.innerHTML=(state.data?.Comptes||[]).filter(c=>estActif(c.actif)).map(c=>`<option value="${echapperAttribut(c.id)}">${echapper(c.nom)}</option>`).join('');}
function changerSource(){const pdf=document.getElementById('reimport-cleanup-source').value==='pdf';document.getElementById('reimport-cleanup-pdf-zone').classList.toggle('hidden',!pdf);document.getElementById('reimport-cleanup-paste-zone').classList.toggle('hidden',pdf);analyse=null;document.getElementById('reimport-cleanup-apply').disabled=true;document.getElementById('reimport-cleanup-summary').innerHTML='';document.getElementById('reimport-cleanup-preview').innerHTML='';}
function ouvrir(){analyse=null;comptes();document.getElementById('reimport-cleanup-source').value='pdf';document.getElementById('reimport-cleanup-pdf').value='';document.getElementById('reimport-cleanup-text').value='';changerSource();document.getElementById('reimport-cleanup-status').textContent='';document.getElementById('reimport-cleanup-modal').classList.remove('hidden');}
async function lirePdfReimport_(fichier){const pdfjs=await chargerPdfJs();const data=await fichier.arrayBuffer();const pdf=await pdfjs.getDocument({data}).promise,operations=[],textes=[];for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),viewport=page.getViewport({scale:1}),contenu=await page.getTextContent();operations.push(...extraireOperationsPageHelloBank(contenu.items,viewport.width));textes.push(contenu.items.map(i=>i.str).join(' '));}const meta=extraireMetaReleveHelloBank(textes.join(' ')),controle=controlerTotauxPdf(operations,meta);if(controle.verifiable&&!controle.conforme)throw new Error(`Totaux PDF non conformes : débits ${money.format(controle.debitsCalcules)} / PDF ${money.format(controle.debitsPdf)} ; crédits ${money.format(controle.creditsCalcules)} / PDF ${money.format(controle.creditsPdf)}.`);return{operations,meta,controle,pages:pdf.numPages};}
function envoyerAnalyse_(lignes,compte,s,b){google.script.run.withSuccessHandler(r=>{analyse=r;b.disabled=false;b.textContent='Analyser sans modifier';s.textContent='Analyse terminée. Aucune donnée n’a été modifiée.';rendre(r);}).withFailureHandler(e=>{b.disabled=false;b.textContent='Analyser sans modifier';s.textContent='Erreur : '+(e.message||e);}).analyserReimportNettoyage(lignes,compte);}
async function analyser(){const source=document.getElementById('reimport-cleanup-source').value,compte=document.getElementById('reimport-cleanup-account').value,s=document.getElementById('reimport-cleanup-status'),b=document.getElementById('reimport-cleanup-analyze');if(!compte){s.textContent='Choisissez le compte.';return;}b.disabled=true;b.textContent='Analyse…';document.getElementById('reimport-cleanup-apply').disabled=true;if(source==='pdf'){const fichier=document.getElementById('reimport-cleanup-pdf').files[0];if(!fichier){b.disabled=false;b.textContent='Analyser sans modifier';s.textContent='Choisissez un relevé PDF.';return;}try{s.textContent='Lecture du PDF…';const lu=await lirePdfReimport_(fichier),lignes=lu.operations.map(o=>({date:o.date,libelle:o.libelle,commentaire:'[REIMPORT_PDF] Libellé bancaire : '+String(o.details||o.libelle||''),type:o.montant<0?'depense':'revenu',montant:o.montant,valide:true}));envoyerAnalyse_(lignes,compte,s,b);}catch(e){b.disabled=false;b.textContent='Analyser sans modifier';s.textContent='Erreur PDF : '+(e.message||String(e));}}else{const texte=document.getElementById('reimport-cleanup-text').value;if(!texte.trim()){b.disabled=false;b.textContent='Analyser sans modifier';s.textContent='Collez d’abord les opérations.';return;}google.script.run.withSuccessHandler(parsed=>{const lignes=(parsed?.lignes||[]).map(x=>({...x,montant:x.type==='depense'?-Math.abs(Number(x.montant||0)):Math.abs(Number(x.montant||0))}));envoyerAnalyse_(lignes,compte,s,b);}).withFailureHandler(e=>{b.disabled=false;b.textContent='Analyser sans modifier';s.textContent='Erreur : '+(e.message||e);}).analyserCollerHelloBank(texte,compte);}}
function rendre(r){document.getElementById('reimport-cleanup-summary').innerHTML=`<div class="import-stat"><span>Lignes</span><strong>${r.total||0}</strong></div><div class="import-stat"><span>Correspondances sûres</span><strong>${r.sures||0}</strong></div><div class="import-stat"><span>Ambiguës</span><strong>${r.ambigues||0}</strong></div><div class="import-stat"><span>Nouvelles</span><strong>${r.nouvelles||0}</strong></div>`;document.getElementById('reimport-cleanup-filters').classList.remove('hidden');document.getElementById('reimport-cleanup-apply').disabled=!(r.sures>0);rendreListe((r.ambigues||r.nouvelles)?'residuels':'Correspondance sûre');}
function rendreListe(filtre){if(!analyse)return;let lignes=analyse.lignes||[];if(filtre==='residuels')lignes=lignes.filter(x=>x.statut!=='Correspondance sûre');else lignes=lignes.filter(x=>x.statut===filtre);document.getElementById('reimport-cleanup-preview').innerHTML=lignes.map((x,i)=>{const idx=(analyse.lignes||[]).indexOf(x),cands=x.candidats||[],arbitrage=x.statut!=='Correspondance sûre';return `<div style="padding:12px 0;border-bottom:1px solid var(--line)" data-reimport-index="${idx}"><strong>${echapper(x.libelle)}</strong><br><small>PDF : ${formaterDate(x.date)} · ${money.format(Number(x.montant||0))} · ${echapper(x.statut)}${x.score?' · score '+x.score:''}</small>${arbitrage?`<div style="margin-top:8px"><select class="reimport-candidate" style="width:100%"><option value="">— Choisir une opération BudgetSoft —</option>${cands.map(c=>`<option value="${echapperAttribut(c.id)}">${formaterDate(c.date)} · ${money.format(Number(c.montant||0))} · ${echapper(c.libelle)} · ${echapper(c.categorie||'Sans catégorie')} · score ${c.score}</option>`).join('')}</select><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px"><button class="primary-button" onclick="arbitrerReimportUI(${idx},'rapprocher',this)">Rapprocher</button><button class="secondary-button" onclick="arbitrerReimportUI(${idx},'nouvelle',this)">Réellement nouvelle</button><button class="secondary-button" onclick="arbitrerReimportUI(${idx},'ignorer',this)">Ignorer</button></div></div>`:`<br><small>BudgetSoft : ${echapper(x.ancien_libelle||'')} · ${echapper(x.categorie||'Sans catégorie')}</small>`}</div>`;}).join('')||'<div class="empty-state">Aucune opération dans ce filtre.</div>';}
window.arbitrerReimportUI=function(idx,decision,b){const ligne=analyse?.lignes?.[idx];if(!ligne)return;const bloc=b.closest('[data-reimport-index]'),candidate=bloc.querySelector('.reimport-candidate')?.value||'';if(decision==='rapprocher'&&!candidate){alert('Choisissez d’abord l’opération BudgetSoft correspondante.');return;}if(decision==='nouvelle'&&!confirm('Importer cette ligne comme une opération réellement nouvelle ?'))return;bloc.querySelectorAll('button,select').forEach(x=>x.disabled=true);google.script.run.withSuccessHandler(r=>{ligne.statut='Traité';document.getElementById('reimport-cleanup-status').textContent='Arbitrage enregistré : '+r.statut+'.';rendreListe('residuels');if(typeof charger==='function')charger();}).withFailureHandler(e=>{document.getElementById('reimport-cleanup-status').textContent='Erreur : '+(e.message||e);bloc.querySelectorAll('button,select').forEach(x=>x.disabled=false);}).arbitrerReimportNettoyage(ligne,decision,candidate);};
function appliquer(){if(!analyse)return;const b=document.getElementById('reimport-cleanup-apply'),s=document.getElementById('reimport-cleanup-status');if(!confirm(`Remplacer ${analyse.sures||0} correspondance(s) sûre(s) ?`))return;b.disabled=true;b.textContent='Remplacement…';google.script.run.withSuccessHandler(r=>{b.textContent='Terminé';s.textContent=`${r.remplacees||0} opération(s) nettoyée(s). Les cas résiduels restent disponibles dans À arbitrer.`;if(typeof charger==='function')charger();}).withFailureHandler(e=>{b.disabled=false;b.textContent='Remplacer les correspondances sûres';s.textContent='Erreur : '+(e.message||e);}).appliquerReimportNettoyage(analyse.lignes);}
document.addEventListener('DOMContentLoaded',()=>setTimeout(installer,150));})();
</script>
