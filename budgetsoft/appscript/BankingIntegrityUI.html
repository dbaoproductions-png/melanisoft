<script>
(function(){
const BI={migration:null};
function q(id){return document.getElementById(id)}
function moneyBI(n){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0))}
function escBI(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function compteOptionsBI(){return (state.data?.Comptes||[]).filter(c=>estActif(c.actif)).map(c=>`<option value="${escBI(c.id)}">${escBI(c.nom)}</option>`).join('')}
function installBI(){const tb=document.querySelector('#operations .toolbar-buttons');if(tb&&!q('banking-integrity-button')){const b=document.createElement('button');b.id='banking-integrity-button';b.className='secondary-button';b.type='button';b.textContent='🛡️ Banque fiable';b.onclick=ouvrirBI;tb.prepend(b)}creerModalBI();installerOverridePdfBI()}
function creerModalBI(){if(q('banking-integrity-modal'))return;const m=document.createElement('div');m.id='banking-integrity-modal';m.className='modal hidden';m.innerHTML=`<div class="modal-card wide-modal" style="max-height:94vh;overflow:auto"><div class="modal-heading"><div><p class="panel-kicker">Intégrité bancaire</p><h2>Migration et imports certifiés</h2></div><button class="modal-close" id="bi-close">×</button></div><div class="warning-box"><strong>Principe :</strong> les données bancaires peuvent être remplacées ; les enrichissements BudgetSoft (ID, catégorie, charge fixe, commentaires métier) sont préservés lors des rapprochements PDF.</div><div class="form-actions" style="justify-content:flex-start"><button class="secondary-button bi-tab" data-tab="etat">État</button><button class="secondary-button bi-tab" data-tab="migration">Migration initiale</button><button class="secondary-button bi-tab" data-tab="flux">Copier-coller HelloBank</button></div><section id="bi-etat" class="bi-pane"><div id="bi-etat-content" class="helper-text">Chargement…</div></section><section id="bi-migration" class="bi-pane hidden"><p class="helper-text">Sélectionnez le fichier XLSX nettoyé. BudgetSoft contrôle le schéma, les ID, dates, signes et totaux avant toute écriture. Une sauvegarde automatique de l'ancienne feuille <code>Operations</code> est créée. En cas d'écart après écriture, restauration automatique.</p><label>Base nettoyée (.xlsx)<input type="file" id="bi-xlsx" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label><div id="bi-migration-status" class="helper-text"></div><div id="bi-migration-summary" class="import-summary"></div><div class="form-actions"><button class="secondary-button" id="bi-analyse-xlsx">Analyser sans modifier</button><button class="primary-button" id="bi-migrate" disabled>Remplacer Operations</button></div></section><section id="bi-flux" class="bi-pane hidden"><p class="helper-text">Pour les opérations visibles sur Hello bank! avant le relevé PDF. Elles restent <strong>provisoires</strong> et pourront être écrasées par le PDF sans perdre leur catégorie ni leur ID.</p><label>Compte<select id="bi-flux-account"></select></label><label>Copier-coller HelloBank<textarea id="bi-flux-text" rows="12" class="import-area"></textarea></label><div id="bi-flux-status" class="helper-text"></div><div class="form-actions"><button class="secondary-button" id="bi-flux-analyse">Analyser</button><button class="primary-button" id="bi-flux-import" disabled>Importer le flux contrôlé</button></div></section></div>`;document.body.appendChild(m);q('bi-close').onclick=()=>m.classList.add('hidden');m.querySelectorAll('.bi-tab').forEach(b=>b.onclick=()=>showTabBI(b.dataset.tab));q('bi-analyse-xlsx').onclick=analyserXlsxBI;q('bi-migrate').onclick=migrerXlsxBI;q('bi-flux-analyse').onclick=analyserFluxBI;q('bi-flux-import').onclick=importerFluxBI;}
function ouvrirBI(){q('banking-integrity-modal').classList.remove('hidden');q('bi-flux-account').innerHTML='<option value="">Choisir un compte</option>'+compteOptionsBI();showTabBI('etat')}
function showTabBI(tab){document.querySelectorAll('.bi-pane').forEach(p=>p.classList.add('hidden'));q('bi-'+tab).classList.remove('hidden');if(tab==='etat')chargerEtatBI()}
function chargerEtatBI(){q('bi-etat-content').textContent='Contrôle en cours…';google.script.run.withSuccessHandler(r=>{q('bi-etat-content').innerHTML=`<div class="import-summary"><div class="import-stat"><span>Opérations</span><strong>${r.total}</strong></div><div class="import-stat"><span>Définitives PDF</span><strong>${r.definitives}</strong></div><div class="import-stat"><span>Provisoires</span><strong>${r.provisoires}</strong></div><div class="import-stat"><span>Clés de rapprochement</span><strong>${r.clesRapprochement}</strong></div></div><p>${r.audit.ok?'✅ Intégrité structurelle OK':'⚠️ '+escBI((r.audit.erreurs||[]).join(' · '))}</p><p>Débits : <strong>${moneyBI(r.audit.debits)}</strong> · Crédits : <strong>${moneyBI(r.audit.credits)}</strong> · Schéma bancaire ${escBI(r.schema)}</p>`}).withFailureHandler(e=>q('bi-etat-content').textContent='Erreur : '+(e.message||e)).etatIntegriteBancaire()}
function loadSheetJSBI(){return new Promise((resolve,reject)=>{if(window.XLSX)return resolve(window.XLSX);const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=()=>resolve(window.XLSX);s.onerror=()=>reject(new Error('Impossible de charger le lecteur XLSX.'));document.head.appendChild(s)})}
function serialCellBI(v){if(v instanceof Date)return v.toISOString();return v==null?'':v}
async function analyserXlsxBI(){const f=q('bi-xlsx').files[0],st=q('bi-migration-status'),btn=q('bi-analyse-xlsx');if(!f){st.textContent='Choisissez le fichier XLSX nettoyé.';return}btn.disabled=true;st.textContent='Lecture locale du classeur…';q('bi-migrate').disabled=true;try{const XLSX=await loadSheetJSBI(),buf=await f.arrayBuffer(),book=XLSX.read(buf,{type:'array',cellDates:true});if(!book.SheetNames.includes('Operations'))throw new Error('La feuille Operations est absente.');const arr=XLSX.utils.sheet_to_json(book.Sheets.Operations,{header:1,raw:true,defval:''});if(arr.length<2)throw new Error('La feuille Operations est vide.');const headers=arr[0].map(x=>String(x||'').trim()),rows=arr.slice(1).filter(r=>r.some(v=>v!==''&&v!=null)).map(r=>r.map(serialCellBI));BI.migration={headers,rows};st.textContent=`${rows.length} lignes lues. Contrôle serveur…`;google.script.run.withSuccessHandler(r=>{btn.disabled=false;BI.migration.analyse=r;q('bi-migration-summary').innerHTML=`<div class="import-stat"><span>Nouvelle base</span><strong>${r.auditNouveau.nombre}</strong></div><div class="import-stat"><span>Débits</span><strong>${moneyBI(r.auditNouveau.debits)}</strong></div><div class="import-stat"><span>Crédits</span><strong>${moneyBI(r.auditNouveau.credits)}</strong></div><div class="import-stat"><span>ID uniques</span><strong>${r.auditNouveau.idsUniques}</strong></div>`;if(r.pret){st.textContent='✅ Tous les contrôles préalables sont conformes. Aucune donnée n’a encore été modifiée.';q('bi-migrate').disabled=false}else{st.textContent='❌ Migration bloquée : '+(r.auditNouveau.erreurs||[]).join(' · ')}}).withFailureHandler(e=>{btn.disabled=false;st.textContent='Erreur : '+(e.message||e)}).analyserMigrationOperations(BI.migration)}catch(e){btn.disabled=false;st.textContent='Erreur : '+(e.message||e)}}
function migrerXlsxBI(){if(!BI.migration?.analyse?.pret)return;if(!confirm(`Remplacer la feuille Operations par ${BI.migration.analyse.auditNouveau.nombre} opérations ? Une sauvegarde automatique sera créée.`))return;const b=q('bi-migrate'),st=q('bi-migration-status');b.disabled=true;b.textContent='Migration et contrôles…';google.script.run.withSuccessHandler(r=>{b.textContent='Migration terminée';st.innerHTML=`✅ Migration validée. Sauvegarde : <strong>${escBI(r.backup)}</strong>. ${r.audit.nombre} opérations, ${moneyBI(r.audit.debits)} de débits et ${moneyBI(r.audit.credits)} de crédits contrôlés après écriture.`;if(typeof charger==='function')charger();chargerEtatBI()}).withFailureHandler(e=>{b.disabled=false;b.textContent='Remplacer Operations';st.textContent='❌ '+(e.message||e)}).migrerOperationsControlees(BI.migration)}
function analyserFluxBI(){const txt=q('bi-flux-text').value,compte=q('bi-flux-account').value,st=q('bi-flux-status');if(!compte||!txt.trim()){st.textContent='Choisissez le compte et collez les opérations.';return}q('bi-flux-import').disabled=true;st.textContent='Analyse du copier-coller…';google.script.run.withSuccessHandler(parsed=>{const lignes=(parsed?.lignes||[]).map(x=>({date_comptable:x.date,date_achat:x.dateAchat||'',libelle:x.libelle,libelle_bancaire:x.details||x.libelle,montant:x.type==='depense'?-Math.abs(Number(x.montant||0)):Math.abs(Number(x.montant||0)),type:x.type,compte}));BI.flux={lignes,compte};const deb=lignes.filter(x=>x.montant<0).reduce((s,x)=>s+Math.abs(x.montant),0),cred=lignes.filter(x=>x.montant>0).reduce((s,x)=>s+x.montant,0);st.textContent=`${lignes.length} opérations détectées · débits ${moneyBI(deb)} · crédits ${moneyBI(cred)}. Vérifiez ces totaux avant l’import.`;q('bi-flux-import').disabled=!lignes.length}).withFailureHandler(e=>st.textContent='Erreur : '+(e.message||e)).analyserCollerHelloBank(txt,compte)}
function importerFluxBI(){if(!BI.flux)return;const b=q('bi-flux-import'),st=q('bi-flux-status');b.disabled=true;b.textContent='Import contrôlé…';google.script.run.withSuccessHandler(r=>{b.textContent='Importer le flux contrôlé';b.disabled=false;st.textContent=`✅ ${r.controle.nombre} reçues · ${r.creees} créées · ${r.remplacees} rapprochées · ${r.ambigues} ambiguës ignorées.`;if(typeof charger==='function')charger()}).withFailureHandler(e=>{b.disabled=false;b.textContent='Importer le flux contrôlé';st.textContent='❌ '+(e.message||e)}).importerFluxBancaireControle(BI.flux.lignes,BI.flux.compte)}
function cleanDetailsPdfBI(s){return String(s||'').split(/\b(?:TOTAL DES OPERATIONS|SOLDE (?:CREDITEUR|DEBITEUR)|Montant de votre autorisation|Hello bank! est une marque|Votre satisfaction est notre priorité)\b/i)[0].replace(/\s+/g,' ').trim()}
function pdfRowsBI(){const compte=q('pdf-account')?.value||'';return (sprint0809.pdfOperations||[]).map(o=>{const sourceLibelle=o.libelle_bancaire||o.details||o.libelle||'';const raw=cleanDetailsPdfBI(sourceLibelle);const m=raw.match(/(?:FACTURE\(S\)\s+CARTE[^]*?\s+DU|^DU)\s+(\d{2})(\d{2})(\d{2})\b/i),dateAchat=o.date_achat|| (m?new Date(2000+Number(m[3]),Number(m[2])-1,Number(m[1]),12).toISOString():'');const cm=raw.match(/CARTE\s+\d*[Xx]+(\d{4})/i);return{date:o.date_achat||o.date_comptable||o.date,date_comptable:o.date_comptable||o.date,date_achat:dateAchat,libelle:o.libelle||raw,libelle_bancaire:raw,montant:o.montant,type:o.montant<0?'depense':'revenu',carte_fin:o.carte_fin||(cm?cm[1]:''),marchand_normalise:o.marchand_normalise||'',_ligneBrute:o._ligneBrute||'',compte}})}
function installerOverridePdfBI(){if(window.__biPdfOverride)return;window.__biPdfOverride=true;window.confirmerImportPdf=function(){const compte=q('pdf-account')?.value,status=q('pdf-status'),bouton=q('confirm-pdf-import');if(!compte){if(status)status.textContent='Choisissez le compte.';return}const meta=sprint0809.pdfMeta||{},ctl=meta.controle||controlerTotauxPdf(sprint0809.pdfOperations||[],meta);if(ctl.verifiable&&!ctl.conforme){if(status)status.textContent='Import refusé : les totaux du PDF ne sont pas conformes.';return}const rows=pdfRowsBI();if(!rows.length){if(status)status.textContent='Aucune opération à importer.';return}const invalides=rows.filter(r=>!String(r.libelle_bancaire||'').trim());if(invalides.length){const i=invalides[0];if(status)status.textContent=`Import refusé : ${invalides.length} opération(s) sans libellé avant envoi serveur. Date=${i.date_comptable||''} ; montant=${i.montant} ; brut=${i._ligneBrute||'[vide]'}`;return}bouton.disabled=true;bouton.textContent='Rapprochement certifié…';if(status)status.textContent='Contrôle serveur des totaux, soldes et rapprochements…';google.script.run.withSuccessHandler(r=>{bouton.disabled=false;bouton.textContent='Importer les opérations';if(r.bloque){status.textContent='⚠️ '+r.message+' Aucune opération ambiguë n’a été remplacée.';return}status.textContent=`✅ PDF certifié : ${r.controle.nombre} opérations · ${r.remplacees} provisoires remplacées · ${r.creees} nouvelles · totaux et continuité des soldes conformes.`;if(typeof charger==='function')charger()}).withFailureHandler(e=>{bouton.disabled=false;bouton.textContent='Importer les opérations';status.textContent='❌ '+(e.message||e)}).importerPdfBancaireCertifie(rows,compte,meta)}}
document.addEventListener('DOMContentLoaded',()=>setTimeout(installBI,250));
})();
</script>
