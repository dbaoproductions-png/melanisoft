<script>
(function(){
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const T=v=>v===true||String(v)==='true'; let D=null,editing=null;
window.budgetsoftModules=window.budgetsoftModules||{};window.budgetsoftModules.plan=show;
function show(){const z=document.getElementById('generic-view');z.innerHTML='<div id="plan4" class="plan4"><div class="p4-head"><div><span class="panel-kicker">Stratégie · exécution · réel</span><h2>Plan / Actions</h2><p>Les objectifs donnent la direction. Les actions restent simples, datées et quantifiables ; BudgetSoft suit ensuite leur réalisation.</p></div><button class="primary-button" id="p4-new">＋ Action</button></div><div id="p4-body" class="loading">Recalcul du plan…</div></div>';style();document.getElementById('p4-new').onclick=()=>form();load();}
function load(){google.script.run.withSuccessHandler(d=>{D=d;render()}).withFailureHandler(fail).chargerPlanActionsV4()}
function fail(e){const z=document.getElementById('p4-body');if(z)z.textContent='Erreur : '+(e.message||e)}
function render(){const z=document.getElementById('p4-body'),g=D.gains||{};z.className='';z.innerHTML=`<div class="p4-metrics"><div><small>GAIN ACQUIS</small><b>${M(g.mensuel_acquis)}/mois</b><span>${M(g.annuel_acquis)}/an</span></div><div><small>GAIN ATTENDU</small><b>${M(g.mensuel_attendu)}/mois</b><span>${M(g.annuel_attendu)}/an</span></div><div><small>ACTIONS</small><b>${D.actions.length}</b><span>${D.objectifs.length} objectif(s)</span></div></div><section class="p4-section"><div class="p4-title"><div><span class="panel-kicker">Objectifs et actions</span><h3>Ce que nous voulons changer</h3></div></div>${D.groupes.map(group).join('')}${D.sansObjectif.length?`<div class="p4-goal"><div class="p4-goalhead"><div><b>Actions sans objectif</b></div></div>${D.sansObjectif.map(action).join('')}</div>`:''}</section><section class="p4-section events"><div class="p4-title"><div><span class="panel-kicker">Les impondérables de la vie</span><h3>Événements</h3><p>Ce qui arrive au budget, en positif ou en négatif, sans être une décision stratégique.</p></div><button class="primary-button" id="p4-event">＋ Événement</button></div><div class="event-grid">${(D.evenements||[]).map(ev).join('')||'<div class="empty-state">Aucun événement.</div>'}</div></section>`;document.getElementById('p4-event').onclick=eventForm;z.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>form(D.actions.find(a=>String(a.id)===b.dataset.a)));}
function group(x){const i=x.impact||{};return `<div class="p4-goal"><div class="p4-goalhead"><div><b>${E(x.objectif.nom)}</b><small>${E(x.objectif.statut||'Actif')}</small></div><div><strong>${M(i.mensuel_confirme)}/mois confirmé</strong><small>+ ${M(i.mensuel_attendu)}/mois attendu · ${M(i.annuel_confirme)}/an confirmé</small></div></div>${x.actions.map(action).join('')||'<div class="empty-state">Aucune action liée.</div>'}</div>`}
function action(a){const confirmed=T(a.impact_confirme),process=T(a.processus);return `<button class="p4-action" data-a="${E(a.id)}"><div class="p4-actionmain"><span class="state ${confirmed?'ok':'wait'}">${confirmed?'Confirmée':'À confirmer'}</span><b>${E(a.libelle)}</b><small>${E(a.nature_action||'Action')} ${a.source_libelle?'· '+E(a.source_libelle):''}${process?' · Processus V'+E(a.version_processus||1):''}</small></div><div class="p4-impact"><b>${M(a.impact_montant)}${a.impact_frequence==='mensuel'?'/mois':''}</b><small>→ ${E(a.affectation||'Projet')}</small></div><span class="chev">›</span></button>`}
function ev(e){const sign=e.type==='depense'?-1:1;return `<div class="event-card"><small>${E(e.type||'événement')} · ${E(String(e.date_effet||'').slice(0,10))}</small><b>${E(e.libelle)}</b><strong>${M(sign*Math.abs(Number(e.montant||0)))}</strong></div>`}
function form(a){editing=a||null;const modal=document.createElement('div');modal.className='modal';modal.id='p4-modal';modal.innerHTML=`<div class="modal-card wide-modal p4-form"><div class="modal-heading"><div><p class="panel-kicker">${a?'Suivi et ajustement':'Nouvelle action'}</p><h2>${E(a?.libelle||'Action')}</h2></div><button class="modal-close" id="p4-close">×</button></div><div class="form-grid"><label class="full-field">Action<input id="f-label" value="${E(a?.libelle||'')}"></label><label>Objectif<select id="f-obj"><option value="">— Aucun —</option>${D.objectifs.map(o=>`<option value="${E(o.id)}" ${String(a?.objectif_id)==String(o.id)?'selected':''}>${E(o.nom)}</option>`).join('')}</select></label><label>Nature de l'action<select id="f-nature">${['supprimer|Supprimer','remplacer|Remplacer','reduire|Réduire','augmenter|Augmenter','creer|Créer','deplacer|Déplacer / renégocier','autre|Autre'].map(x=>{const [v,l]=x.split('|');return `<option value="${v}" ${a?.nature_action===v?'selected':''}>${l}</option>`}).join('')}</select></label><label>Projet / affectation<input id="f-project" value="${E(a?.projet||a?.affectation||'Projet')}"></label><label>Statut<select id="f-status">${['À instruire','Décidée','En cours','Effective','Abandonnée'].map(s=>`<option ${a?.statut===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="source-box"><strong>Rapprochement BudgetSoft</strong><div class="source-search"><input id="f-q" placeholder="Deezer, MNT, Oney…" value="${E(a?.source_libelle||'')}"><button class="secondary-button" id="f-search">Rechercher</button></div><div id="f-results"></div></div><div class="form-grid"><label>Impact<select id="f-impact"><option value="baisse_charge">Baisse de charge</option><option value="hausse_revenu" ${a?.impact_type==='hausse_revenu'?'selected':''}>Hausse de revenu</option><option value="hausse_charge" ${a?.impact_type==='hausse_charge'?'selected':''}>Hausse de charge</option><option value="reservation_objectif" ${a?.impact_type==='reservation_objectif'?'selected':''}>Réservation objectif</option></select></label><label>Montant<input id="f-amount" type="number" step="0.01" value="${Number(a?.impact_montant||0)}"></label><label>Fréquence<select id="f-freq"><option value="mensuel">Mensuel</option><option value="ponctuel" ${a?.impact_frequence==='ponctuel'?'selected':''}>Ponctuel</option></select></label><label>Date d'effet<input id="f-date" type="date" value="${iso(a?.date_effet)}"></label><label class="checkbox-line full-field"><input type="checkbox" id="f-confirm" ${T(a?.impact_confirme)?'checked':''}> <b>Impact confirmé</b> : montant et date suffisamment certains pour alimenter le prévisionnel</label><label class="checkbox-line full-field"><input type="checkbox" id="f-reval" ${T(a?.reevaluer_charges_fixes)?'checked':''}> Réévaluer les charges fixes lors de la validation</label><label class="checkbox-line full-field"><input type="checkbox" id="f-process" ${T(a?.processus)?'checked':''}> Cette action nécessite un processus de résolution</label></div><div class="impact-preview" id="f-preview"></div><div id="resolution" class="resolution"></div><label>Commentaire<textarea id="f-comment" rows="2">${E(a?.commentaire||'')}</textarea></label><div class="form-actions"><button class="secondary-button" id="f-cancel">Annuler</button><button class="primary-button" id="f-save">Valider l'action</button></div></div>`;document.body.appendChild(modal);modal._source={type:a?.source_type||'',id:a?.source_id||'',libelle:a?.source_libelle||''};document.getElementById('p4-close').onclick=document.getElementById('f-cancel').onclick=()=>modal.remove();document.getElementById('f-search').onclick=search;['f-amount','f-freq'].forEach(id=>document.getElementById(id).oninput=preview);document.getElementById('f-process').onchange=resolution;document.getElementById('f-save').onclick=save;preview();resolution();}
function search(){const q=document.getElementById('f-q').value;google.script.run.withSuccessHandler(r=>{const z=document.getElementById('f-results');z.innerHTML=r.map((x,i)=>`<button class="source-hit" data-s="${i}"><b>${E(x.libelle)}</b><span>${E(x.detail)} · ${M(x.montant)}${x.capital_restant?' · capital '+M(x.capital_restant):''}</span></button>`).join('')||'<small>Aucune correspondance.</small>';z.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const x=r[Number(b.dataset.s)];document.getElementById('p4-modal')._source=x;document.getElementById('f-q').value=x.libelle;document.getElementById('f-amount').value=x.montant||0;if(x.type==='credit')document.getElementById('f-process').checked=true;preview();resolution();});}).rechercherSourceActionV3(q)}
function preview(){const n=Number(document.getElementById('f-amount')?.value||0),monthly=document.getElementById('f-freq')?.value==='mensuel',hs=[1,3,6,12,36,60,120],z=document.getElementById('f-preview');if(z)z.innerHTML='<strong>Impact automatisé</strong>'+hs.map(h=>`<span>${h<12?h+' mois':h/12+' an'+(h>12?'s':'')}<b>${M(monthly?n*h:n)}</b></span>`).join('')}
function resolution(){const z=document.getElementById('resolution');if(!z)return;if(!document.getElementById('f-process').checked){z.innerHTML='';return;}if(!editing?.id){z.innerHTML='<div class="resolution-head"><b>Plan de résolution</b><small>Enregistrez l’action : BudgetSoft calculera ensuite une proposition à partir des données disponibles à l’instant T.</small></div>';return;}z.innerHTML='<div class="loading">BudgetSoft vérifie les données et P1–P6…</div>';google.script.run.withSuccessHandler(r=>{z.innerHTML=`<div class="resolution-head"><div><b>Plan de résolution proposé</b><small>Calculé à l’instant T · à valider</small></div><span class="state ${r.soutenable?'ok':'wait'}">${r.soutenable?'Soutenable':'À ajuster'}</span></div>${r.etapes.map((e,i)=>`<div class="res-step"><span>${i+1}</span><div><b>${E(e.libelle)}</b><small>${E(e.statut)}</small></div></div>`).join('')}`}).withFailureHandler(e=>z.textContent='Calcul impossible : '+(e.message||e)).proposerResolutionActionV4(editing.id,4)}
function save(){const modal=document.getElementById('p4-modal'),src=modal._source||{};const d={id:editing?.id||'',libelle:document.getElementById('f-label').value,objectif_id:document.getElementById('f-obj').value,nature_action:document.getElementById('f-nature').value,projet:document.getElementById('f-project').value,affectation:document.getElementById('f-project').value||'Projet',statut:document.getElementById('f-status').value,mode_impact:src.id?'adosse':'manuel',source_type:src.type||'',source_id:src.id||'',source_libelle:src.libelle||'',impact_type:document.getElementById('f-impact').value,impact_montant:Number(document.getElementById('f-amount').value||0),impact_frequence:document.getElementById('f-freq').value,date_effet:document.getElementById('f-date').value,impact_confirme:document.getElementById('f-confirm').checked,reevaluer_charges_fixes:document.getElementById('f-reval').checked,processus:document.getElementById('f-process').checked,commentaire:document.getElementById('f-comment').value};google.script.run.withSuccessHandler(v=>{D=v;modal.remove();render()}).withFailureHandler(e=>alert(e.message||e)).enregistrerActionPlanV4(d)}
function eventForm(){const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modal-card"><div class="modal-heading"><div><p class="panel-kicker">Impondérable</p><h2>Nouvel événement</h2></div><button class="modal-close" id="ev-x">×</button></div><label>Libellé<input id="ev-l"></label><div class="form-grid"><label>Nature<select id="ev-t"><option value="recette">Positif / recette</option><option value="depense">Négatif / dépense</option></select></label><label>Montant<input id="ev-m" type="number" step="0.01"></label><label>Date d'effet<input id="ev-d" type="date"></label><label>Certitude<select id="ev-c"><option value="certaine">Certaine</option><option value="probable">Probable</option><option value="possible">Possible</option></select></label></div><div class="form-actions"><button class="secondary-button" id="ev-cancel">Annuler</button><button class="primary-button" id="ev-save">Enregistrer et recalculer</button></div></div>`;document.body.appendChild(modal);document.getElementById('ev-x').onclick=document.getElementById('ev-cancel').onclick=()=>modal.remove();document.getElementById('ev-save').onclick=()=>google.script.run.withSuccessHandler(v=>{D=v;modal.remove();render()}).withFailureHandler(e=>alert(e.message||e)).enregistrerEvenementPlanV4({libelle:document.getElementById('ev-l').value,type:document.getElementById('ev-t').value,montant:Number(document.getElementById('ev-m').value||0),date_effet:document.getElementById('ev-d').value,certitude:document.getElementById('ev-c').value,statut:'Prévu'});}
function iso(v){if(!v)return'';return String(v).slice(0,10)}
function style(){if(document.getElementById('p4-style'))return;const s=document.createElement('style');s.id='p4-style';s.textContent=`.plan4{max-width:1180px;margin:auto}.p4-head,.p4-title,.p4-goalhead,.resolution-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.p4-head p,.p4-title p{max-width:760px;color:#63736f}.p4-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.p4-metrics>div{padding:18px;border-radius:16px;background:#edf7f3}.p4-metrics small,.p4-metrics span{display:block}.p4-metrics b{display:block;font-size:24px;color:#147d64;margin:4px 0}.p4-section{background:#fff;border:1px solid rgba(20,125,100,.15);border-radius:18px;padding:20px;margin:18px 0}.p4-goal{border:1px solid rgba(20,125,100,.14);border-radius:14px;margin:14px 0;overflow:hidden}.p4-goalhead{padding:15px;background:#f7fbf9}.p4-goalhead small{display:block;margin-top:4px;color:#6b7976}.p4-goalhead>div:last-child{text-align:right}.p4-action{width:100%;border:0;border-top:1px solid rgba(20,125,100,.1);background:#fff;padding:14px 16px;display:grid;grid-template-columns:1fr auto 24px;gap:14px;text-align:left;align-items:center;cursor:pointer}.p4-action:hover{background:#fbfdfc}.p4-actionmain b,.p4-actionmain small,.p4-impact b,.p4-impact small{display:block}.p4-actionmain small,.p4-impact small{color:#6b7976;margin-top:3px}.p4-impact{text-align:right}.state{display:inline-block!important;width:max-content;padding:3px 8px;border-radius:999px;font-size:11px;margin-bottom:5px}.state.ok{background:#e3f5ed;color:#12664f}.state.wait{background:#fff3d6;color:#8a6200}.chev{font-size:24px}.events{margin-top:30px}.event-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.event-card{border:1px solid rgba(20,125,100,.14);border-radius:12px;padding:13px}.event-card small,.event-card b,.event-card strong{display:block}.event-card strong{margin-top:8px;font-size:18px}.p4-form{max-width:900px}.resolution{margin:16px 0;padding:16px;border-radius:14px;background:#f7fbf9}.resolution:empty{display:none}.resolution-head small{display:block;color:#6b7976;margin-top:3px}.res-step{display:flex;gap:12px;padding:12px 0;border-top:1px solid rgba(20,125,100,.12)}.res-step>span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#147d64;color:#fff;font-weight:700}.res-step small{display:block;color:#6b7976;margin-top:3px}@media(max-width:760px){.p4-head,.p4-title,.p4-goalhead{display:block}.p4-metrics,.event-grid{grid-template-columns:1fr}.p4-action{grid-template-columns:1fr auto}.chev{display:none}.p4-goalhead>div:last-child{text-align:left;margin-top:8px}}`;document.head.appendChild(s)}
})();
</script>
