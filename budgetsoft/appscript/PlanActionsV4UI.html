<script>
(function(){
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const T=v=>v===true||String(v)==='true'; let D=null,editing=null;
window.budgetsoftModules=window.budgetsoftModules||{};window.budgetsoftModules.plan=show;
function show(){const z=document.getElementById('generic-view');z.innerHTML='<div id="plan4" class="plan4"><div class="p4-head"><div><span class="panel-kicker">Stratégie · exécution · réel</span><h2>Plan / Actions</h2><p>Les objectifs donnent la direction. Les actions restent simples, datées et quantifiables ; BudgetSoft suit ensuite leur réalisation.</p></div><button class="primary-button" id="p4-new">＋ Action</button></div><div id="p4-body" class="loading">Recalcul du plan…</div></div>';style();document.getElementById('p4-new').onclick=()=>form();load();}
function load(){google.script.run.withSuccessHandler(d=>{D=d;render()}).withFailureHandler(fail).chargerPlanActionsV4()}
function fail(e){const z=document.getElementById('p4-body');if(z)z.textContent='Erreur : '+(e.message||e)}
function render(){const z=document.getElementById('p4-body'),g=D.gains||{};z.className='';z.innerHTML=`<div class="p4-metrics"><div><small>GAIN ACQUIS</small><b>${M(g.mensuel_acquis)}/mois</b><span>${M(g.annuel_acquis)}/an</span></div><div><small>GAIN ATTENDU</small><b>${M(g.mensuel_attendu)}/mois</b><span>${M(g.annuel_attendu)}/an</span></div><div><small>ACTIONS</small><b>${D.actions.length}</b><span>${D.objectifs.length} objectif(s)</span></div></div><section class="p4-section"><div class="p4-title"><div><span class="panel-kicker">Objectifs et actions</span><h3>Ce que nous voulons changer</h3></div></div>${D.groupes.map(group).join('')}${D.sansObjectif.length?`<div class="p4-goal"><div class="p4-goalhead"><div><b>Actions sans objectif</b></div></div>${D.sansObjectif.map(action).join('')}</div>`:''}</section><section class="p4-section events"><div class="p4-title"><div><span class="panel-kicker">Les impondérables de la vie</span><h3>Événements</h3><p>Ce qui arrive au budget, en positif ou en négatif, sans être une décision stratégique.</p></div><button class="primary-button" id="p4-event">＋ Événement</button></div><div class="event-grid">${(D.evenements||[]).map(ev).join('')||'<div class="empty-state">Aucun événement.</div>'}</div></section>`;document.getElementById('p4-event').onclick=()=>eventForm();z.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>form(D.actions.find(a=>String(a.id)===b.dataset.a)));z.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>eventForm(D.evenements.find(e=>String(e.id)===b.dataset.e)));}
function group(x){const i=x.impact||{};return `<div class="p4-goal"><div class="p4-goalhead"><div><b>${E(x.objectif.nom)}</b><small>${E(x.objectif.statut||'Actif')}</small></div><div><strong>${M(i.mensuel_confirme)}/mois confirmé</strong><small>+ ${M(i.mensuel_attendu)}/mois attendu · ${M(i.annuel_confirme)}/an confirmé</small></div></div>${x.actions.map(action).join('')||'<div class="empty-state">Aucune action liée.</div>'}</div>`}
function action(a){const confirmed=T(a.impact_confirme),process=T(a.processus);return `<button class="p4-action" data-a="${E(a.id)}"><div class="p4-actionmain"><span class="state ${confirmed?'ok':'wait'}">${confirmed?'Confirmée':'À confirmer'}</span><b>${E(a.libelle)}</b><small>${E(a.nature_action||'Action')} ${a.source_libelle?'· '+E(a.source_libelle):''}${process?' · Processus V'+E(a.version_processus||1):''}</small></div><div class="p4-impact"><b>${M(a.impact_montant)}${a.impact_frequence==='mensuel'?'/mois':''}</b><small>→ ${E(a.affectation||'Projet')}</small></div><span class="chev">›</span></button>`}
function ev(e){const sign=e.type==='depense'?-1:1,frac=T(e.fractionne)?` · ${E(e.nombre_fois)}× ${E(e.periodicite_fractionnement||'mensuel')}`:'';return `<button class="event-card event-button" data-e="${E(e.id)}"><small>${E(e.type||'événement')} · ${E(String(e.date_effet||'').slice(0,10))} · ${E(e.mode_paiement||'')} ${frac}</small><b>${E(e.libelle)}</b><strong>${M(sign*Math.abs(Number(e.montant||0)))}</strong><span>${E(e.categorie||'Sans catégorie')}</span></button>`}
function form(a){editing=a||null;const modal=document.createElement('div');modal.className='modal';modal.id='p4-modal';modal.innerHTML=`<div class="modal-card wide-modal p4-form"><div class="modal-heading"><div><p class="panel-kicker">${a?'Suivi et ajustement':'Nouvelle action'}</p><h2>${E(a?.libelle||'Action')}</h2></div><button class="modal-close" id="p4-close">×</button></div><div class="form-grid"><label class="full-field">Action<input id="f-label" value="${E(a?.libelle||'')}"></label><label>Objectif<select id="f-obj"><option value="">— Aucun —</option>${D.objectifs.map(o=>`<option value="${E(o.id)}" ${String(a?.objectif_id)==String(o.id)?'selected':''}>${E(o.nom)}</option>`).join('')}</select></label><label>Nature de l'action<select id="f-nature">${['supprimer|Supprimer','remplacer|Remplacer','reduire|Réduire','augmenter|Augmenter','creer|Créer','deplacer|Déplacer / renégocier','autre|Autre'].map(x=>{const [v,l]=x.split('|');return `<option value="${v}" ${a?.nature_action===v?'selected':''}>${l}</option>`}).join('')}</select></label><label>Projet / affectation<input id="f-project" value="${E(a?.projet||a?.affectation||'Projet')}"></label><label>Statut<select id="f-status">${['À instruire','Décidée','En cours','Effective','Abandonnée'].map(s=>`<option ${a?.statut===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="source-box"><strong>Rapprochement BudgetSoft</strong><div class="source-search"><input id="f-q" placeholder="Deezer, MNT, Oney…" value="${E(a?.source_libelle||'')}"><button class="secondary-button" id="f-search">Rechercher</button></div><div id="f-results"></div></div><div class="form-grid"><label>Impact<select id="f-impact"><option value="baisse_charge">Baisse de charge</option><option value="hausse_revenu" ${a?.impact_type==='hausse_revenu'?'selected':''}>Hausse de revenu</option><option value="hausse_charge" ${a?.impact_type==='hausse_charge'?'selected':''}>Hausse de charge</option><option value="reservation_objectif" ${a?.impact_type==='reservation_objectif'?'selected':''}>Réservation objectif</option></select></label><label>Montant<input id="f-amount" type="number" step="0.01" value="${Number(a?.impact_montant||0)}"></label><label>Fréquence<select id="f-freq"><option value="mensuel">Mensuel</option><option value="ponctuel" ${a?.impact_frequence==='ponctuel'?'selected':''}>Ponctuel</option></select></label><label>Date d'effet<input id="f-date" type="date" value="${iso(a?.date_effet)}"></label><label class="checkbox-line full-field"><input type="checkbox" id="f-confirm" ${T(a?.impact_confirme)?'checked':''}> <b>Impact confirmé</b></label><label class="checkbox-line full-field"><input type="checkbox" id="f-reval" ${T(a?.reevaluer_charges_fixes)?'checked':''}> Réévaluer les charges fixes lors de la validation</label><label class="checkbox-line full-field"><input type="checkbox" id="f-process" ${T(a?.processus)?'checked':''}> Cette action nécessite un processus de résolution</label></div><div class="impact-preview" id="f-preview"></div><div id="resolution" class="resolution"></div><label>Commentaire<textarea id="f-comment" rows="2">${E(a?.commentaire||'')}</textarea></label><div class="form-actions"><button class="secondary-button" id="f-cancel">Annuler</button><button class="primary-button" id="f-save">Valider l'action</button></div></div>`;document.body.appendChild(modal);modal._source={type:a?.source_type||'',id:a?.source_id||'',libelle:a?.source_libelle||''};document.getElementById('p4-close').onclick=document.getElementById('f-cancel').onclick=()=>modal.remove();document.getElementById('f-search').onclick=search;['f-amount','f-freq'].forEach(id=>document.getElementById(id).oninput=preview);document.getElementById('f-process').onchange=resolution;document.getElementById('f-save').onclick=save;preview();resolution();}
function search(){const q=document.getElementById('f-q').value;google.script.run.withSuccessHandler(r=>{const z=document.getElementById('f-results');z.innerHTML=r.map((x,i)=>`<button class="source-hit" data-s="${i}"><b>${E(x.libelle)}</b><span>${E(x.detail)} · ${M(x.montant)}</span></button>`).join('')||'<small>Aucune correspondance.</small>';z.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const x=r[Number(b.dataset.s)];document.getElementById('p4-modal')._source=x;document.getElementById('f-q').value=x.libelle;document.getElementById('f-amount').value=x.montant||0;if(x.type==='credit')document.getElementById('f-process').checked=true;preview();resolution();});}).rechercherSourceActionV3(q)}
function preview(){const n=Number(document.getElementById('f-amount')?.value||0),monthly=document.getElementById('f-freq')?.value==='mensuel',hs=[1,3,6,12,36,60,120],z=document.getElementById('f-preview');if(z)z.innerHTML='<strong>Impact automatisé</strong>'+hs.map(h=>`<span>${h<12?h+' mois':h/12+' an'+(h>12?'s':'')}<b>${M(monthly?n*h:n)}</b></span>`).join('')}
function resolution(){const z=document.getElementById('resolution');if(!z)return;if(!document.getElementById('f-process').checked){z.innerHTML='';return;}if(!editing?.id){z.innerHTML='<div class="resolution-head"><b>Plan de résolution</b><small>Enregistrez l’action pour calculer une proposition.</small></div>';return;}z.innerHTML='<div class="loading">BudgetSoft vérifie les données…</div>';google.script.run.withSuccessHandler(r=>{z.innerHTML=`<div class="resolution-head"><div><b>Plan de résolution proposé</b><small>Calculé à l’instant T · à valider</small></div><span class="state ${r.soutenable?'ok':'wait'}">${r.soutenable?'Soutenable':'À ajuster'}</span></div>`}).withFailureHandler(e=>z.textContent='Calcul impossible : '+(e.message||e)).proposerResolutionActionV4(editing.id,4)}
function save(){const modal=document.getElementById('p4-modal'),src=modal._source||{};const d={id:editing?.id||'',libelle:document.getElementById('f-label').value,objectif_id:document.getElementById('f-obj').value,nature_action:document.getElementById('f-nature').value,projet:document.getElementById('f-project').value,affectation:document.getElementById('f-project').value||'Projet',statut:document.getElementById('f-status').value,mode_impact:src.id?'adosse':'manuel',source_type:src.type||'',source_id:src.id||'',source_libelle:src.libelle||'',impact_type:document.getElementById('f-impact').value,impact_montant:Number(document.getElementById('f-amount').value||0),impact_frequence:document.getElementById('f-freq').value,date_effet:document.getElementById('f-date').value,impact_confirme:document.getElementById('f-confirm').checked,reevaluer_charges_fixes:document.getElementById('f-reval').checked,processus:document.getElementById('f-process').checked,commentaire:document.getElementById('f-comment').value};google.script.run.withSuccessHandler(v=>{D=v;modal.remove();render()}).withFailureHandler(e=>alert(e.message||e)).enregistrerActionPlanV4(d)}
function eventForm(e){e=e||{};const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modal-card"><div class="modal-heading"><div><p class="panel-kicker">Impondérable</p><h2>${e.id?'Modifier':'Nouvel'} événement</h2></div><button class="modal-close" id="ev-x">×</button></div><label>Libellé<input id="ev-l" value="${E(e.libelle||'')}"></label><div class="form-grid"><label>Nature<select id="ev-t"><option value="recette" ${e.type==='recette'?'selected':''}>Positif / recette</option><option value="depense" ${e.type==='depense'?'selected':''}>Négatif / dépense</option></select></label><label>Montant total<input id="ev-m" type="number" step="0.01" value="${Number(e.montant||0)}"></label><label>Date d'effet / 1re échéance<input id="ev-d" type="date" value="${iso(e.date_effet)}"></label><label>Mode de paiement<select id="ev-pay">${['CB','Chèque','Virement','Prélèvement','Espèces','Autre'].map(x=>`<option ${e.mode_paiement===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Catégorie<select id="ev-cat"><option value="">— À catégoriser —</option>${(D.categories||[]).map(c=>`<option ${e.categorie===c?'selected':''}>${E(c)}</option>`).join('')}</select></label><label>Certitude<select id="ev-c"><option value="certaine" ${e.certitude==='certaine'?'selected':''}>Certaine</option><option value="probable" ${e.certitude==='probable'?'selected':''}>Probable</option><option value="possible" ${e.certitude==='possible'?'selected':''}>Possible</option></select></label><label class="checkbox-line full-field"><input type="checkbox" id="ev-frac" ${T(e.fractionne)?'checked':''}> Paiement / encaissement en plusieurs fois</label><div id="ev-frac-box" class="full-field form-grid"><label>Périodicité<select id="ev-period"><option value="mensuel" ${e.periodicite_fractionnement!=='annuel'?'selected':''}>Mensuel</option><option value="annuel" ${e.periodicite_fractionnement==='annuel'?'selected':''}>Annuel</option></select></label><label>Nombre de fois<select id="ev-count">${Array.from({length:11},(_,i)=>i+2).map(n=>`<option value="${n}" ${Number(e.nombre_fois||2)===n?'selected':''}>${n}</option>`).join('')}</select></label></div></div><div id="ev-preview" class="event-preview"></div><div class="form-actions"><button class="secondary-button" id="ev-cancel">Annuler</button><button class="primary-button" id="ev-save">Enregistrer</button></div></div>`;document.body.appendChild(modal);const frac=()=>{document.getElementById('ev-frac-box').style.display=document.getElementById('ev-frac').checked?'grid':'none';eventPreview()};document.getElementById('ev-x').onclick=document.getElementById('ev-cancel').onclick=()=>modal.remove();document.getElementById('ev-frac').onchange=frac;['ev-m','ev-count','ev-period'].forEach(id=>document.getElementById(id).oninput=eventPreview);document.getElementById('ev-save').onclick=()=>{const d={id:e.id||'',libelle:document.getElementById('ev-l').value,type:document.getElementById('ev-t').value,montant:Number(document.getElementById('ev-m').value||0),date_effet:document.getElementById('ev-d').value,mode_paiement:document.getElementById('ev-pay').value,categorie:document.getElementById('ev-cat').value,certitude:document.getElementById('ev-c').value,fractionne:document.getElementById('ev-frac').checked,periodicite_fractionnement:document.getElementById('ev-period').value,nombre_fois:Number(document.getElementById('ev-count').value||1),statut:e.statut||'Prévu'};google.script.run.withSuccessHandler(v=>{D=v;modal.remove();render()}).withFailureHandler(x=>alert(x.message||x)).enregistrerEvenementPlanV4(d)};frac();}
function eventPreview(){const z=document.getElementById('ev-preview');if(!z)return;const total=Math.abs(Number(document.getElementById('ev-m')?.value||0)),on=document.getElementById('ev-frac')?.checked,n=on?Number(document.getElementById('ev-count')?.value||2):1;if(!total){z.innerHTML='';return;}z.innerHTML=`<small>Prévision Cerbère</small><b>${n===1?M(total):n+' échéances d’environ '+M(total/n)}</b>`}
function iso(v){if(!v)return'';return String(v).slice(0,10)}
function style(){if(document.getElementById('p4-style'))return;const s=document.createElement('style');s.id='p4-style';s.textContent=`.plan4{max-width:1180px;margin:auto}.p4-head,.p4-title,.p4-goalhead,.resolution-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.p4-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.p4-metrics>div{padding:18px;border-radius:16px;background:#edf7f3}.p4-metrics small,.p4-metrics span{display:block}.p4-metrics b{display:block;font-size:24px;color:#147d64;margin:4px 0}.p4-section{background:#fff;border:1px solid rgba(20,125,100,.15);border-radius:18px;padding:20px;margin:18px 0}.p4-goal{border:1px solid rgba(20,125,100,.14);border-radius:14px;margin:14px 0;overflow:hidden}.p4-goalhead{padding:15px;background:#f7fbf9}.p4-action{width:100%;border:0;border-top:1px solid #e8efec;background:white;padding:14px;display:flex;text-align:left;align-items:center;gap:12px}.p4-actionmain{flex:1}.p4-actionmain b,.p4-actionmain small{display:block}.event-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.event-card{padding:15px;border:1px solid #dce9e4;border-radius:14px;background:#fff;text-align:left}.event-card>*{display:block}.event-button{cursor:pointer;width:100%}.event-preview{margin:12px 0;padding:12px;background:#f7fbf9;border-radius:12px}.event-preview b{display:block}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full-field{grid-column:1/-1}.checkbox-line{display:flex;align-items:center;gap:8px}@media(max-width:720px){.form-grid,.p4-metrics{grid-template-columns:1fr}.full-field{grid-column:auto}}`;document.head.appendChild(s)}
})();
</script>
