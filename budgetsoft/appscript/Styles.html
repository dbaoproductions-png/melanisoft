<style>
:root{--green:#147d64;--green-dark:#0e5d4b;--green-soft:#eaf6f2;--ink:#17322b;--muted:#6f7f7a;--line:#dfe9e5;--bg:#f5f8f7;--white:#fff;--danger:#b53c3c;--shadow:0 12px 30px rgba(19,63,51,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}button{font:inherit}.hidden{display:none!important}.app-shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:linear-gradient(180deg,var(--green-dark),#0a493b);color:#fff;padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 26px}.brand-mark{width:42px;height:42px;border-radius:13px;background:#fff;color:var(--green-dark);display:grid;place-items:center;font-weight:800;font-size:22px}.brand strong{display:block;font-size:18px}.brand span{font-size:12px;opacity:.72}.nav{display:grid;gap:5px}.nav-item{border:0;background:transparent;color:rgba(255,255,255,.82);padding:11px 12px;border-radius:11px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center}.nav-item:hover,.nav-item.active{background:rgba(255,255,255,.14);color:#fff}.sidebar-footer{margin-top:auto;padding:18px 10px 4px;font-size:12px;opacity:.62}.main{padding:28px 34px 40px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow,.panel-kicker{margin:0 0 4px;text-transform:uppercase;letter-spacing:.09em;font-size:11px;font-weight:700;color:var(--green)}h1{font-size:28px;margin:0}.topbar-actions{display:flex;align-items:center;gap:10px}.icon-button,.user-chip{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}.icon-button{border:1px solid var(--line);background:#fff;cursor:pointer;font-size:20px}.user-chip{background:var(--green);color:#fff;font-weight:700}.loading,.error{padding:14px 16px;border-radius:12px;margin-bottom:18px}.loading{background:var(--green-soft);color:var(--green-dark)}.error{background:#fff0f0;color:var(--danger);border:1px solid #f0c9c9}.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}.card{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.metric-card{padding:20px}.metric-card span{display:block;color:var(--muted);font-size:13px}.metric-card strong{display:block;font-size:27px;margin:10px 0 5px}.metric-card small{color:var(--muted)}.dashboard-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel{padding:20px;min-height:260px}.panel-heading{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.panel h2{margin:0;font-size:18px}.operations-panel,.alerts-panel{min-height:220px}.chart-placeholder{height:190px;border-radius:14px;background:linear-gradient(180deg,#f7fbf9,#edf5f2);display:flex;align-items:end;justify-content:center;gap:10px;padding:20px;color:var(--muted)}.bar{width:34px;background:var(--green);border-radius:8px 8px 3px 3px;min-height:4px;position:relative}.bar.negative{background:#d88970}.bar-label{position:absolute;bottom:-19px;font-size:10px;color:var(--muted);left:50%;transform:translateX(-50%)}.health-score{display:flex;align-items:baseline;gap:10px;margin:10px 0 20px}.health-score strong{font-size:38px;color:var(--green)}.health-score span{color:var(--muted)}.health-list{display:grid;gap:10px}.health-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.status-good{color:var(--green)}.status-watch{color:#b47a10}.status-bad{color:var(--danger)}.operation-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.operation-row small{display:block;color:var(--muted);margin-top:3px}.amount-positive{color:var(--green);font-weight:700}.amount-negative{color:var(--danger);font-weight:700}.empty-state{color:var(--muted);padding:24px 0}.coming-soon{padding:54px;text-align:center;max-width:700px;margin:40px auto}.coming-icon{font-size:45px}.coming-soon h2{font-size:26px;margin:14px 0 8px}.coming-soon p{color:var(--muted);line-height:1.6}

@media(max-width:760px){.app-shell{grid-template-columns:78px 1fr}.sidebar{padding:18px 10px}.brand>div:last-child,.nav-item span,.sidebar-footer{display:none}.brand{justify-content:center;padding:0 0 24px}.nav-item{justify-content:center;font-size:19px}.main{padding:22px 18px}.cards{grid-template-columns:1fr}.topbar h1{font-size:23px}}
</style>
