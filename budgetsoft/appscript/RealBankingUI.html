<script>
(function(){
  function estAuto(o){return /\[RECURRENCE:[^\]]+\]/.test(String(o&&o.commentaire||''));}
  function parametres(){return Object.fromEntries((state.data?.Parametres||[]).map(p=>[String(p.cle),p.valeur]));}
  function correspondCompte(o,c){return String(o.compte)===String(c.id)||String(o.compte)===String(c.nom);}
  function estFuture(o){const d=new Date(o&&o.date);if(isNaN(d))return false;const finAuj=new Date();finAuj.setHours(23,59,59,999);return d>finAuj;}

  window.soldeCompte=function(compte,operations){
    const params=parametres(),cleSolde='solde_releve_'+String(compte.id),cleDate='date_solde_releve_'+String(compte.id);
    const valeur=params[cleSolde],dateRef=params[cleDate]?new Date(params[cleDate]):null;
    // Solde bancaire réel = uniquement mouvements réellement débités/crédités à ce jour.
    // Les cartes différées futures restent dans Operations pour le prévisionnel mais ne touchent pas encore le solde.
    const reelles=(operations||[]).filter(o=>!estAuto(o)&&!estFuture(o)&&correspondCompte(o,compte));
    if(valeur!==undefined&&valeur!==''&&dateRef&&!isNaN(dateRef)){
      const base=Number(String(valeur).replace(',','.'));
      if(Number.isFinite(base)){
        const apres=reelles.filter(o=>{const d=new Date(o.date);return !isNaN(d)&&d>dateRef;}).reduce((s,o)=>s+nombre(o.montant),0);
        return base+apres;
      }
    }
    return nombre(compte.solde_initial)+reelles.reduce((s,o)=>s+nombre(o.montant),0);
  };

  window.operationsFiltrees=function(){
    const recherche=document.getElementById('operation-search').value.trim().toLowerCase();
    const compte=document.getElementById('operation-account-filter').value;
    const type=document.getElementById('operation-type-filter').value;
    const mois=document.getElementById('operation-month-filter').value;
    return (state.data?.Operations||[]).filter(o=>{
      if(estAuto(o))return false;
      const texte=[o.libelle,o.categorie,o.commentaire].join(' ').toLowerCase();
      const d=new Date(o.date),moisOperation=isNaN(d)?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      return (!recherche||texte.includes(recherche))&&(!compte||String(o.compte)===String(compte))&&(!type||type==='charges_a_venir'||String(o.type).toLowerCase()===type)&&(!mois||moisOperation===mois);
    }).sort((a,b)=>new Date(b.date)-new Date(a.date));
  };

  const ancienRendreDashboard=window.rendreDashboard;
  if(typeof ancienRendreDashboard==='function'){
    window.rendreDashboard=function(data){const original=data.Operations;data.Operations=(original||[]).filter(o=>!estAuto(o));try{return ancienRendreDashboard(data);}finally{data.Operations=original;}};
  }

  let analyseHelloBank=null;
  function installerImportHelloBank_(){
    const barre=document.querySelector('#operations .toolbar-buttons');
    if(barre&&!document.getElementById('import-hello-bank-button')){
      const b=document.createElement('button');b.type='button';b.className='secondary-button';b.id='import-hello-bank-button';b.innerHTML='📋 Coller Hello bank!';
      const pdf=document.getElementById('import-pdf-button');barre.insertBefore(b,pdf||barre.firstChild);b.addEventListener('click',ouvrirHelloBank_);
    }
    if(!document.getElementById('hello-bank-modal')){
      const wrap=document.createElement('div');wrap.innerHTML=`<div class="modal hidden" id="hello-bank-modal" role="dialog" aria-modal="true"><div class="modal-card wide-modal"><div class="modal-heading"><div><p class="panel-kicker">Import bancaire courant</p><h2>Coller les opérations Hello bank!</h2></div><button type="button" class="modal-close" id="close-hello-bank-modal">×</button></div><p class="helper-text">Dans Hello bank!, sélectionnez les opérations affichées, copiez-les puis collez-les ici.</p><label>Compte<select id="hello-bank-account"></select></label><label style="margin-top:12px">Opérations copiées<textarea id="hello-bank-text" class="import-area" rows="12" placeholder="Collez ici le contenu copié depuis Hello bank!"></textarea></label><div id="hello-bank-status" class="helper-text" style="margin-top:10px"></div><div id="hello-bank-results" class="hidden" style="margin-top:14px"><div id="hello-bank-summary" class="import-summary"></div><div id="hello-bank-preview" class="import-preview"></div></div><div class="form-actions"><button type="button" class="secondary-button" id="cancel-hello-bank">Annuler</button><button type="button" class="secondary-button" id="hello-bank-analyze">Analyser</button><button type="button" class="primary-button hidden" id="hello-bank-confirm">Importer</button></div></div></div>`;
      document.body.appendChild(wrap.firstElementChild);
      document.getElementById('close-hello-bank-modal').addEventListener('click',fermerHelloBank_);
      document.getElementById('cancel-hello-bank').addEventListener('click',fermerHelloBank_);
      document.getElementById('hello-bank-analyze').addEventListener('click',analyserHelloBank_);
      document.getElementById('hello-bank-confirm').addEventListener('click',importerHelloBank_);
      document.getElementById('hello-bank-modal').addEventListener('click',e=>{if(e.target.id==='hello-bank-modal')fermerHelloBank_();});
    }
  }
  function remplirComptesHelloBank_(){const s=document.getElementById('hello-bank-account');if(!s||!state.data)return;const comptes=(state.data.Comptes||[]).filter(c=>estActif(c.actif));s.innerHTML=comptes.map(c=>`<option value="${echapperAttribut(c.id)}">${echapper(c.nom)}</option>`).join('');}
  function ouvrirHelloBank_(){analyseHelloBank=null;remplirComptesHelloBank_();document.getElementById('hello-bank-text').value='';document.getElementById('hello-bank-status').textContent='';document.getElementById('hello-bank-results').classList.add('hidden');document.getElementById('hello-bank-confirm').classList.add('hidden');document.getElementById('hello-bank-modal').classList.remove('hidden');setTimeout(()=>document.getElementById('hello-bank-text').focus(),50);}
  function fermerHelloBank_(){document.getElementById('hello-bank-modal').classList.add('hidden');}
  function analyserHelloBank_(){
    const b=document.getElementById('hello-bank-analyze'),status=document.getElementById('hello-bank-status'),texte=document.getElementById('hello-bank-text').value,compte=document.getElementById('hello-bank-account').value;
    if(!texte.trim()){status.innerHTML='<span class="warning-text">Collez d’abord les opérations Hello bank!.</span>';return;}
    if(!compte){status.innerHTML='<span class="warning-text">Choisissez le compte bancaire.</span>';return;}
    b.disabled=true;b.textContent='Analyse en cours…';status.textContent='Analyse du copier-coller en cours…';document.getElementById('hello-bank-results').classList.add('hidden');
    google.script.run.withSuccessHandler(r=>{b.disabled=false;b.textContent='Analyser';analyseHelloBank=r;status.textContent=(r&&r.total?`${r.total} opération(s) détectée(s).`:'Analyse terminée.');rendreHelloBank_(r||{});}).withFailureHandler(e=>{b.disabled=false;b.textContent='Analyser';const msg=e&&e.message?e.message:String(e||'Erreur inconnue');status.innerHTML='<span class="warning-text"><strong>Échec de l’analyse :</strong> '+echapper(msg)+'</span>';document.getElementById('hello-bank-results').classList.add('hidden');}).analyserCollerHelloBank(texte,compte);
  }
  function rendreHelloBank_(r){const z=document.getElementById('hello-bank-results');z.classList.remove('hidden');document.getElementById('hello-bank-summary').innerHTML=`<div class="import-stat"><span>Détectées</span><strong>${r.total||0}</strong></div><div class="import-stat"><span>À importer</span><strong>${r.importables||0}</strong></div><div class="import-stat"><span>Doublons</span><strong>${r.doublons||0}</strong></div><div class="import-stat"><span>Déjà couvertes</span><strong>${r.avantReleve||0}</strong></div><div class="success-box" style="margin-top:12px">Crédits : <strong>${money.format(r.revenus||0)}</strong> · Débits : <strong>${money.format(r.depenses||0)}</strong> · Net : <strong>${money.format(r.net||0)}</strong>${r.dateDernierReleve?'<br>Dernier relevé connu : '+formaterDate(r.dateDernierReleve):''}</div>`;
    const lignes=r.lignes||[];document.getElementById('hello-bank-preview').innerHTML=lignes.slice(0,30).map((l,i)=>`<div class="import-row ${l.valide?'':'invalid'}"><span>${formaterDate(l.date)}</span><div><strong>${echapper(l.libelle)}</strong><small>${l.doublon?'Doublon détecté':(l.avantReleve?'Déjà couverte par le dernier relevé':'Prête à importer')}</small></div><span>${money.format(l.type==='depense'?-Math.abs(l.montant):Math.abs(l.montant))}</span><select onchange="window.__helloBankAction(${i},this.value)" ${l.valide?'':'disabled'}><option value="importer" ${l.action==='importer'?'selected':''}>Importer</option><option value="ignorer" ${l.action==='ignorer'?'selected':''}>Ignorer</option></select></div>`).join('')+(lignes.length>30?`<div class="helper-text">${lignes.length-30} autre(s) opération(s) analysée(s).</div>`:'');document.getElementById('hello-bank-confirm').classList.toggle('hidden',!(r.importables>0));}
  window.__helloBankAction=function(i,a){if(analyseHelloBank&&analyseHelloBank.lignes&&analyseHelloBank.lignes[i])analyseHelloBank.lignes[i].action=a;};
  function importerHelloBank_(){if(!analyseHelloBank)return;const b=document.getElementById('hello-bank-confirm');b.disabled=true;b.textContent='Import en cours…';google.script.run.withSuccessHandler(r=>{b.disabled=false;b.textContent='Importer';document.getElementById('hello-bank-results').innerHTML=`<div class="success-box"><strong>Import terminé</strong><br>${r.importees||0} opération(s) importée(s), ${r.ignorees||0} ignorée(s).${(r.erreurs||[]).length?'<br>'+echapper(r.erreurs.join(' | ')):''}</div>`;document.getElementById('hello-bank-confirm').classList.add('hidden');setTimeout(()=>{fermerHelloBank_();charger();ouvrirVue('operations');if(typeof chargerDashboardTroisCadres==='function')chargerDashboardTroisCadres();},1200);}).withFailureHandler(e=>{b.disabled=false;b.textContent='Importer';document.getElementById('hello-bank-status').innerHTML='<span class="warning-text">'+echapper(e.message||String(e))+'</span>';}).importerCollerHelloBank(analyseHelloBank.lignes);}
  document.addEventListener('DOMContentLoaded',()=>setTimeout(installerImportHelloBank_,100));
})();
</script>
