<script>
(function(){'use strict';
  const moneyP_=n=>typeof money!=='undefined'?money.format(Number(n||0)):Number(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
  const escP_=s=>typeof echapper==='function'?echapper(String(s??'')):String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let cachePatrimoine_=null;

  function carteComptePatrimoine_(c,icone){return `<article class="pat-account"><div class="pat-icon">${icone}</div><div><strong>${escP_(c.nom||'Compte')}</strong><small>${String(c.type)==='placement'?'Placement':'Livret / épargne'}</small></div><b>${moneyP_(c.solde)}</b></article>`;}
  function carteActifPatrimoine_(a){return `<article class="pat-account"><div class="pat-icon">🏠</div><div><strong>${escP_(a.nom||'Actif')}</strong><small>${escP_(a.type||'Actif patrimonial')}</small></div><b>${moneyP_(a.valeur)}</b></article>`;}

  function rendrePatrimoine_(d){
    cachePatrimoine_=d;
    const z=document.getElementById('generic-view');if(!z)return;
    const livrets=Array.isArray(d?.livrets)?d.livrets:[],placements=Array.isArray(d?.placements)?d.placements:[],actifs=Array.isArray(d?.actifs)?d.actifs:[];
    z.innerHTML=`<div class="section-toolbar"><p class="section-intro">Vue des actifs patrimoniaux et financiers. Les crédits et dettes sont suivis dans l’onglet Crédits.</p><button class="secondary-button" id="pat-refresh">Actualiser</button></div>
      <div class="cards pat-summary">
        <article class="card metric-card"><span>Actifs patrimoniaux</span><strong>${moneyP_(d?.totalActifsPatrimoniaux)}</strong><small>Immobilier et autres actifs saisis</small></article>
        <article class="card metric-card"><span>Livrets</span><strong>${moneyP_(d?.totalLivrets)}</strong><small>Comptes de type épargne</small></article>
        <article class="card metric-card"><span>Placements</span><strong>${moneyP_(d?.totalPlacements)}</strong><small>Comptes de type placement</small></article>
        <article class="card metric-card"><span>Total des actifs</span><strong>${moneyP_(d?.totalActifs)}</strong><small>Patrimoine + actifs financiers</small></article>
      </div>
      <div class="pat-grid">
        <article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Patrimoine</span><h2>Actifs</h2></div></div><div class="pat-list">${actifs.length?actifs.map(carteActifPatrimoine_).join(''):'<div class="empty-state">Aucun actif patrimonial enregistré.</div>'}</div></article>
        <article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Épargne disponible</span><h2>Livrets</h2></div></div><div class="pat-list">${livrets.length?livrets.map(c=>carteComptePatrimoine_(c,'🐷')).join(''):'<div class="empty-state">Aucun compte de type épargne.</div>'}</div></article>
        <article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Épargne investie</span><h2>Placements</h2></div></div><div class="pat-list">${placements.length?placements.map(c=>carteComptePatrimoine_(c,'📈')).join(''):'<div class="empty-state">Aucun compte de type placement.</div>'}</div></article>
      </div>`;
    document.getElementById('pat-refresh')?.addEventListener('click',()=>chargerPatrimoineUI_(true));
  }

  function chargerPatrimoineUI_(force){
    if(!force&&cachePatrimoine_){rendrePatrimoine_(cachePatrimoine_);return;}
    const z=document.getElementById('generic-view');if(z)z.innerHTML='<section class="loading">Chargement du patrimoine…</section>';
    google.script.run.withSuccessHandler(rendrePatrimoine_).withFailureHandler(e=>{if(typeof afficherErreur==='function')afficherErreur(e.message||String(e));}).chargerPatrimoine();
  }

  window.chargerPatrimoineUI=chargerPatrimoineUI_;
  window.budgetsoftModules=window.budgetsoftModules||{};window.budgetsoftModules.patrimoine=()=>chargerPatrimoineUI_(false);
  const base=window.ouvrirVue;
  if(typeof base==='function'&&!base.__patrimoineActifs20260904){
    const w=function(view){const r=base.apply(this,arguments);if(view==='patrimoine')chargerPatrimoineUI_(false);return r;};
    w.__patrimoineActifs20260904=true;window.ouvrirVue=w;
  }

  const st=document.createElement('style');st.textContent=`.pat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}.pat-grid>article:first-child{grid-column:1/-1}.pat-list{display:grid;gap:8px;margin-top:10px}.pat-account{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid #edf1ef}.pat-account:first-child{border-top:0}.pat-icon{width:38px;height:38px;border-radius:10px;background:#eef6f2;display:grid;place-items:center;font-size:20px}.pat-account strong,.pat-account small{display:block}.pat-account small{opacity:.62;margin-top:2px}.pat-account>b{font-size:17px}.pat-summary{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:900px){.pat-summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.pat-grid,.pat-summary{grid-template-columns:1fr}.pat-grid>article:first-child{grid-column:auto}.pat-account{grid-template-columns:auto 1fr}.pat-account>b{grid-column:2}}`;
  document.head.appendChild(st);
})();
</script>
