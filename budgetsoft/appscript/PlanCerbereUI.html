<script>
(function(){
window.budgetsoftModules=window.budgetsoftModules||{};
window.budgetsoftModules.plan=afficherPlanCerbere;
let planData=null;
const pe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pm=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const pd=v=>v?new Date(v).toLocaleDateString('fr-FR'):'—';
function afficherPlanCerbere(){
 const z=document.getElementById('generic-view');z.innerHTML=`<article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Stratégie et prévision</span><h2>Plan</h2></div></div><p class="helper-text">Les Objectifs définissent la stratégie. Les Actions la mettent en œuvre. Les Événements décrivent ce qui modifiera ponctuellement les périodes. Cerbère lit ce plan mais ne le modifie pas.</p><div class="plan-tabs"><button class="secondary-button active" data-pt="objectifs">Objectifs</button><button class="secondary-button" data-pt="actions">Actions</button><button class="secondary-button" data-pt="evenements">Événements</button></div><div id="plan-content" class="loading">Chargement…</div></article>`;
 z.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{z.querySelectorAll('[data-pt]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderPlan(b.dataset.pt)});chargerPlan();stylePlan();
}
function chargerPlan(){google.script.run.withSuccessHandler(d=>{planData=d;renderPlan(document.querySelector('[data-pt].active')?.dataset.pt||'objectifs')}).withFailureHandler(e=>document.getElementById('plan-content').textContent='Erreur : '+(e.message||e)).chargerPlanCerbere()}
function renderPlan(type){const z=document.getElementById('plan-content');if(!z||!planData)return;if(type==='objectifs')z.innerHTML=`<div class="section-toolbar"><p class="section-intro">Orientations à court, moyen et long terme.</p><button class="primary-button" onclick="planAjouterObjectif()">＋ Objectif</button></div>${planData.objectifs.map(o=>`<div class="plan-row"><div><strong>${pe(o.nom)}</strong><small>${pe(o.type)} · ${pe(o.horizon)} · priorité ${pe(o.priorite)} · cible ${pd(o.date_cible)}</small></div><span>${o.montant_cible?pm(o.montant_cible):pe(o.statut)}</span></div>`).join('')||'<div class="empty-state">Aucun objectif stratégique.</div>'}`;
 if(type==='actions')z.innerHTML=`<div class="section-toolbar"><p class="section-intro">Décisions concrètes et date à laquelle leur effet entre dans le prévisionnel.</p><button class="primary-button" onclick="planAjouterAction()">＋ Action</button></div>${planData.actions.map(a=>`<div class="plan-row"><div><strong>${pe(a.libelle)}</strong><small>Effet ${pd(a.date_effet)} · ${pe(a.impact_type)} · ${pe(a.impact_frequence)}</small></div><span>${pm(a.impact_montant)} · ${pe(a.statut)}</span></div>`).join('')||'<div class="empty-state">Aucune action.</div>'}`;
 if(type==='evenements')z.innerHTML=`<div class="section-toolbar"><p class="section-intro">Recettes, dépenses ou capacités ponctuelles connues.</p><button class="primary-button" onclick="planAjouterEvenement()">＋ Événement</button></div>${planData.evenements.map(e=>`<div class="plan-row"><div><strong>${pe(e.libelle)}</strong><small>${pe(e.type)} · ${pd(e.date_effet)} · certitude ${pe(e.certitude)}</small></div><span>${pm(e.montant)} · ${pe(e.statut)}</span></div>`).join('')||'<div class="empty-state">Aucun événement prévu.</div>'}`;}
window.planAjouterObjectif=function(){const nom=prompt('Objectif stratégique (ex. Désendettement revolving)');if(!nom)return;const horizon=prompt('Horizon : court, moyen ou long','court')||'court';const date=prompt('Date cible (AAAA-MM-JJ)','');const montant=prompt('Montant cible éventuel','0');google.script.run.withSuccessHandler(d=>{planData=d;renderPlan('objectifs')}).enregistrerObjectifPlan({nom,horizon,date_cible:date,montant_cible:montant,priorite:'haute',statut:'Actif'});};
window.planAjouterAction=function(){const libelle=prompt('Action (ex. Résilier Deezer)');if(!libelle)return;const date=prompt('Date d’effet prévisionnel (AAAA-MM-JJ)','');const impact=prompt('Impact : baisse_charge, hausse_charge, reservation_objectif','baisse_charge');const montant=prompt('Montant de l’impact','0');const freq=prompt('Fréquence : mensuel ou ponctuel','mensuel');google.script.run.withSuccessHandler(d=>{planData=d;renderPlan('actions')}).enregistrerActionPlan({libelle,date_effet:date,impact_type:impact,impact_montant:montant,impact_frequence:freq,statut:'Prévue',certitude:'certaine'});};
window.planAjouterEvenement=function(){const libelle=prompt('Événement (ex. Report CASDEN septembre)');if(!libelle)return;const type=prompt('Type : recette, depense, charge_supprimee_temporairement, charge_deplacee, argent_reserve','recette');const montant=prompt('Montant','0');const date=prompt('Date d’effet (AAAA-MM-JJ)','');google.script.run.withSuccessHandler(d=>{planData=d;renderPlan('evenements')}).enregistrerEvenementPlan({libelle,type,montant,date_effet:date,certitude:'certaine',statut:'Prévu'});};
function stylePlan(){if(document.getElementById('plan-style'))return;const s=document.createElement('style');s.id='plan-style';s.textContent=`.plan-tabs{display:flex;gap:8px;margin:18px 0}.plan-row{display:flex;justify-content:space-between;gap:18px;padding:13px 4px;border-bottom:1px solid rgba(20,125,100,.12)}.plan-row small{display:block;margin-top:4px;opacity:.68}.plan-row>span{font-weight:700;white-space:nowrap}`;document.head.appendChild(s)}
})();
</script>
