<script>
(function(){
window.budgetsoftModules=window.budgetsoftModules||{};window.budgetsoftModules.plan=afficherPlanCerbere;
let planData=null,actionsV3=null,editing=null;
const pe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pm=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const pd=v=>v?new Date(v).toLocaleDateString('fr-FR'):'—';
function afficherPlanCerbere(){const z=document.getElementById('generic-view');z.innerHTML=`<article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Stratégie et prévision</span><h2>Plan</h2></div></div><p class="helper-text">Les Objectifs donnent la direction. Les Actions sont instruites, chiffrées puis transmises à Cerbère lorsqu'elles sont validées.</p><div class="plan-tabs"><button class="secondary-button active" data-pt="actions">Actions</button><button class="secondary-button" data-pt="objectifs">Objectifs</button><button class="secondary-button" data-pt="evenements">Événements</button></div><div id="plan-content" class="loading">Chargement…</div></article>`;z.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{z.querySelectorAll('[data-pt]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderPlan(b.dataset.pt)});chargerTout();stylePlan();}
function chargerTout(){google.script.run.withSuccessHandler(d=>{planData=d;google.script.run.withSuccessHandler(v=>{actionsV3=v;renderPlan(document.querySelector('[data-pt].active')?.dataset.pt||'actions')}).withFailureHandler(err).chargerActionsPlanV3()}).withFailureHandler(err).chargerPlanCerbere()}
function err(e){const z=document.getElementById('plan-content');if(z)z.textContent='Erreur : '+(e.message||e)}
function renderPlan(t){const z=document.getElementById('plan-content');if(!z||!planData)return;if(t==='actions'){if(!actionsV3){z.textContent='Chargement…';return;}const g=actionsV3.gains||{};z.innerHTML=`<div class="gain-board"><div><small>GAIN ACQUIS</small><strong>${pm(g.mensuel_acquis)}/mois</strong><span>${pm(g.annuel_acquis)}/an</span></div><div><small>GAIN ATTENDU</small><strong>${pm(g.mensuel_attendu)}/mois</strong><span>${pm(g.annuel_attendu)}/an</span></div></div><div class="section-toolbar"><p class="section-intro">Une action peut être simple ou devenir un processus de résolution révisable.</p><button class="primary-button" id="pa-new">＋ Action</button></div>${actionsV3.actions.map(a=>actionRow(a)).join('')||'<div class="empty-state">Aucune action.</div>'}`;document.getElementById('pa-new').onclick=()=>openAction();z.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openAction(actionsV3.actions.find(a=>String(a.id)===b.dataset.edit)));z.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer cette action et son processus ?'))google.script.run.withSuccessHandler(v=>{actionsV3=v;renderPlan('actions')}).supprimerActionPlanV3(b.dataset.del)});return;}
if(t==='objectifs')z.innerHTML=`<div class="section-toolbar"><p class="section-intro">Orientations à court, moyen et long terme.</p><button class="primary-button" onclick="planAjouterObjectif()">＋ Objectif</button></div>${planData.objectifs.map(o=>`<div class="plan-row"><div><strong>${pe(o.nom)}</strong><small>${pe(o.horizon)} · cible ${pd(o.date_cible)}</small></div><span>${o.montant_cible?pm(o.montant_cible):pe(o.statut)}</span></div>`).join('')||'<div class="empty-state">Aucun objectif.</div>'}`;
if(t==='evenements')z.innerHTML=`<div class="section-toolbar"><p class="section-intro">Déformations ponctuelles du budget.</p><button class="primary-button" onclick="planAjouterEvenement()">＋ Événement</button></div>${planData.evenements.map(e=>`<div class="plan-row"><div><strong>${pe(e.libelle)}</strong><small>${pe(e.type)} · ${pd(e.date_effet)}</small></div><span>${pm(e.montant)}</span></div>`).join('')||'<div class="empty-state">Aucun événement.</div>'}`;}
function actionRow(a){const steps=(a.etapes||[]),done=steps.filter(e=>Number(e.montant_reel||0)>0).reduce((s,e)=>s+Number(e.montant_reel||0),0),planned=steps.reduce((s,e)=>s+Number(e.montant_prevu||0),0);return `<div class="plan-row action-row"><div><strong>${pe(a.libelle)}</strong><small>${pe(a.mode_impact||'manuel')} · ${pe(a.statut||'À instruire')} ${a.source_libelle?'· ↔ '+pe(a.source_libelle):''}</small>${a.processus?`<div class="process-mini">Processus V${pe(a.version_processus||1)} · prévu ${pm(planned)} · réalisé ${pm(done)}</div>`:''}</div><span>${pm(a.impact_montant)} ${a.impact_frequence==='mensuel'?'/mois':''}<div><button class="mini-btn" data-edit="${pe(a.id)}">Modifier</button><button class="mini-btn danger" data-del="${pe(a.id)}">Supprimer</button></div></span></div>`}
function openAction(a){editing=a||null;let m=document.getElementById('action-v3-modal');if(!m){m=document.createElement('div');m.id='action-v3-modal';m.className='modal';document.body.appendChild(m);}const objectives=(actionsV3?.objectifs||[]);const steps=a?.etapes?.length?a.etapes:[{libelle:'',date_prevue:'',montant_prevu:0,montant_reel:0,statut:'Prévue'}];m.innerHTML=`<div class="modal-card action-form"><div class="modal-heading"><div><p class="panel-kicker">Action instruite</p><h2>${a?'Modifier':'Nouvelle'} action</h2></div><button class="modal-close" id="af-close">×</button></div><div class="form-grid"><label class="full-field">Action<input id="af-label" value="${pe(a?.libelle||'')}"></label><label>Objectif<select id="af-obj"><option value="">— Aucun —</option>${objectives.map(o=>`<option value="${pe(o.id)}" ${String(a?.objectif_id)==String(o.id)?'selected':''}>${pe(o.nom)}</option>`).join('')}</select></label><label>Projet<input id="af-project" value="${pe(a?.projet||'')}"></label><label>Mode d'impact<select id="af-mode"><option value="manuel">Manuel / à préciser</option><option value="adosse" ${a?.mode_impact==='adosse'?'selected':''}>Adossé aux données</option></select></label><label>Statut<select id="af-status"><option>À instruire</option><option ${a?.statut==='Décidée'?'selected':''}>Décidée</option><option ${a?.statut==='En cours'?'selected':''}>En cours</option><option ${a?.statut==='Effective'?'selected':''}>Effective</option><option ${a?.statut==='Abandonnée'?'selected':''}>Abandonnée</option></select></label></div><div id="af-source" class="source-box"><strong>Rapprochement BudgetSoft</strong><div class="source-search"><input id="af-q" placeholder="Deezer, Oney…" value="${pe(a?.source_libelle||'')}"><button class="secondary-button" id="af-search">Rechercher</button></div><div id="af-results"></div></div><div class="form-grid"><label>Impact<select id="af-impact"><option value="baisse_charge">Baisse de charge</option><option value="hausse_revenu" ${a?.impact_type==='hausse_revenu'?'selected':''}>Hausse de revenu</option><option value="hausse_charge" ${a?.impact_type==='hausse_charge'?'selected':''}>Hausse de charge</option><option value="reservation_objectif" ${a?.impact_type==='reservation_objectif'?'selected':''}>Réservation objectif</option></select></label><label>Montant<input id="af-amount" type="number" step="0.01" value="${Number(a?.impact_montant||0)}"></label><label>Fréquence<select id="af-freq"><option value="mensuel">Mensuel</option><option value="ponctuel" ${a?.impact_frequence==='ponctuel'?'selected':''}>Ponctuel</option></select></label><label>Date d'effet<input id="af-date" type="date" value="${isoDate(a?.date_effet)}"></label><label class="checkbox-line full-field"><input type="checkbox" id="af-confirm" ${truth(a?.impact_confirme)?'checked':''}> Impact confirmé : montant et date suffisamment certains pour alimenter le prévisionnel</label><label class="checkbox-line full-field"><input type="checkbox" id="af-process" ${truth(a?.processus)?'checked':''}> Cette action nécessite un processus de résolution</label></div><div id="af-process-box"><div class="panel-heading"><strong>Plan de résolution</strong><button class="secondary-button" id="af-add-step">＋ Étape</button></div><div id="af-steps"></div></div><div class="impact-preview" id="af-preview"></div><label>Commentaire<textarea id="af-comment" rows="2">${pe(a?.commentaire||'')}</textarea></label><div class="form-actions"><button class="secondary-button" id="af-cancel">Annuler</button><button class="primary-button" id="af-save">Valider l'action</button></div></div>`;m.classList.remove('hidden');m._source={type:a?.source_type||'',id:a?.source_id||'',libelle:a?.source_libelle||''};m._steps=steps.map(x=>Object.assign({},x));document.getElementById('af-close').onclick=document.getElementById('af-cancel').onclick=()=>m.remove();document.getElementById('af-search').onclick=searchSource;document.getElementById('af-add-step').onclick=()=>{m._steps.push({libelle:'',date_prevue:'',montant_prevu:0,montant_reel:0,statut:'Prévue'});renderSteps()};document.getElementById('af-process').onchange=renderSteps;['af-amount','af-freq'].forEach(id=>document.getElementById(id).oninput=preview);document.getElementById('af-save').onclick=saveAction;renderSteps();preview();}
function searchSource(){const q=document.getElementById('af-q').value;google.script.run.withSuccessHandler(r=>{document.getElementById('af-results').innerHTML=r.map((x,i)=>`<button class="source-hit" data-src="${i}"><b>${pe(x.libelle)}</b><span>${pe(x.detail)} · ${pm(x.montant)}${x.capital_restant?' · capital '+pm(x.capital_restant):''}</span></button>`).join('')||'<small>Aucune correspondance.</small>';document.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{const x=r[Number(b.dataset.src)],m=document.getElementById('action-v3-modal');m._source=x;document.getElementById('af-q').value=x.libelle;document.getElementById('af-amount').value=x.montant||0;if(x.type==='credit')document.getElementById('af-process').checked=true;renderSteps();preview();});}).rechercherSourceActionV3(q)}
function renderSteps(){const m=document.getElementById('action-v3-modal'),box=document.getElementById('af-process-box');if(!m||!box)return;box.style.display=document.getElementById('af-process').checked?'block':'none';const z=document.getElementById('af-steps');z.innerHTML=m._steps.map((e,i)=>`<div class="step-row"><input data-si="${i}" data-k="libelle" placeholder="Étape" value="${pe(e.libelle||'')}"><input data-si="${i}" data-k="date_prevue" type="date" value="${isoDate(e.date_prevue)}"><input data-si="${i}" data-k="montant_prevu" type="number" step="0.01" value="${Number(e.montant_prevu||0)}" title="Prévu"><input data-si="${i}" data-k="montant_reel" type="number" step="0.01" value="${Number(e.montant_reel||0)}" title="Réalisé"><button data-rm="${i}">×</button></div>`).join('');z.querySelectorAll('[data-si]').forEach(x=>x.onchange=()=>{m._steps[Number(x.dataset.si)][x.dataset.k]=x.type==='number'?Number(x.value):x.value});z.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{m._steps.splice(Number(b.dataset.rm),1);renderSteps()})}
function preview(){const m=Number(document.getElementById('af-amount')?.value||0),freq=document.getElementById('af-freq')?.value,z=document.getElementById('af-preview');if(!z)return;const hs=[1,3,6,12,36,60,120];z.innerHTML='<strong>Impact projeté</strong>'+hs.map(h=>`<span>${h<12?h+' mois':h/12+' an'+(h>12?'s':'')}<b>${pm(freq==='mensuel'?m*h:m)}</b></span>`).join('')}
function saveAction(){const m=document.getElementById('action-v3-modal');m.querySelectorAll('[data-si]').forEach(x=>m._steps[Number(x.dataset.si)][x.dataset.k]=x.type==='number'?Number(x.value):x.value);const d={id:editing?.id||'',libelle:document.getElementById('af-label').value,objectif_id:document.getElementById('af-obj').value,projet:document.getElementById('af-project').value,mode_impact:document.getElementById('af-mode').value,source_type:m._source?.type||'',source_id:m._source?.id||'',source_libelle:m._source?.libelle||'',impact_type:document.getElementById('af-impact').value,impact_montant:Number(document.getElementById('af-amount').value||0),impact_frequence:document.getElementById('af-freq').value,date_effet:document.getElementById('af-date').value,impact_confirme:document.getElementById('af-confirm').checked,processus:document.getElementById('af-process').checked,statut:document.getElementById('af-status').value,commentaire:document.getElementById('af-comment').value,etapes:document.getElementById('af-process').checked?m._steps:[]};google.script.run.withSuccessHandler(v=>{actionsV3=v;m.remove();renderPlan('actions')}).withFailureHandler(e=>alert(e.message||e)).enregistrerActionPlanV3(d)}
window.planAjouterObjectif=function(){const nom=prompt('Objectif stratégique');if(!nom)return;google.script.run.withSuccessHandler(d=>{planData=d;renderPlan('objectifs')}).enregistrerObjectifPlan({nom,horizon:'court',priorite:'haute',statut:'Actif'});};window.planAjouterEvenement=function(){const libelle=prompt('Événement');if(!libelle)return;const montant=prompt('Montant','0'),date=prompt('Date d’effet (AAAA-MM-JJ)','');google.script.run.withSuccessHandler(d=>{planData=d;renderPlan('evenements')}).enregistrerEvenementPlan({libelle,type:'recette',montant,date_effet:date,certitude:'certaine',statut:'Prévu'});};
function isoDate(v){if(!v)return'';const d=new Date(v);return isNaN(d)?String(v).slice(0,10):d.toISOString().slice(0,10)}function truth(v){return v===true||String(v)==='true'}
function stylePlan(){if(document.getElementById('plan-style'))return;const s=document.createElement('style');s.id='plan-style';s.textContent=`.plan-tabs{display:flex;gap:8px;margin:18px 0}.plan-row{display:flex;justify-content:space-between;gap:18px;padding:13px 4px;border-bottom:1px solid rgba(20,125,100,.12)}.plan-row small{display:block;margin-top:4px;opacity:.68}.plan-row>span{font-weight:700;text-align:right}.gain-board{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.gain-board>div{background:#edf7f3;border-radius:12px;padding:14px}.gain-board small,.gain-board span{display:block}.gain-board strong{font-size:22px;color:#147d64}.mini-btn{border:0;background:transparent;color:#147d64;cursor:pointer;padding:4px}.mini-btn.danger{color:#a33}.process-mini{margin-top:7px;font-size:12px}.action-form{width:min(900px,94vw);max-height:92vh;overflow:auto}.source-box{margin:14px 0;padding:13px;background:#f2f7f5;border-radius:12px}.source-search{display:flex;gap:8px;margin-top:8px}.source-search input{flex:1}.source-hit{width:100%;display:flex;justify-content:space-between;border:0;border-bottom:1px solid #dbe8e3;background:white;padding:9px;cursor:pointer;text-align:left}.source-hit span{font-size:12px}.step-row{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr auto;gap:6px;margin:6px 0}.impact-preview{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.impact-preview>strong{width:100%}.impact-preview span{background:#edf7f3;padding:7px 9px;border-radius:8px;font-size:12px}.impact-preview b{display:block}.checkbox-line{display:flex!important;gap:8px;align-items:center}`;document.head.appendChild(s)}
})();
</script>
