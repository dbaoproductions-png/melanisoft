<script>
(function(){
  function lireChargeForm_(){
    return {
      id:document.getElementById('fixed-charge-id')?.value||'',
      libelle:document.getElementById('fixed-charge-label')?.value.trim()||'',
      libelle_bancaire:document.getElementById('fixed-charge-bank-label')?.value.trim()||'',
      categorie:document.getElementById('fixed-charge-category')?.value||'',
      compte:document.getElementById('fixed-charge-account')?.value||'',
      montant:typeof nombre==='function'?nombre(document.getElementById('fixed-charge-amount')?.value):0,
      tolerance:typeof nombre==='function'?Math.abs(nombre(document.getElementById('fixed-charge-tolerance')?.value)):0.5,
      type:'depense',jour_execution:Number(document.getElementById('fixed-charge-day')?.value||1),
      frequence:document.getElementById('fixed-charge-frequency')?.value||'Mensuelle',
      nature:document.getElementById('fixed-charge-nature')?.value||'Autre',
      date_debut:document.getElementById('fixed-charge-start')?.value||'',
      date_fin:document.getElementById('fixed-charge-end')?.value||'',
      actif:!!document.getElementById('fixed-charge-active')?.checked,
      commentaire:document.getElementById('fixed-charge-comment')?.value.trim()||''
    };
  }

  function installerBoutonAjustement_(){
    const form=document.getElementById('fixed-charge-form');if(!form||document.getElementById('fixed-charge-adjust-forecast'))return;
    const actions=form.querySelector('.form-actions');if(!actions)return;
    const btn=document.createElement('button');btn.type='button';btn.id='fixed-charge-adjust-forecast';btn.className='secondary-button';btn.textContent='Ajuster le prévisionnel';btn.style.display='none';
    actions.insertBefore(btn,actions.firstChild);
    btn.addEventListener('click',ouvrirAjustement_);
  }

  function choisirAction_(){
    const choix=prompt('Ajustement du prévisionnel :\n1 = Reporter une échéance\n2 = Ignorer une échéance\n3 = Changer le montant d’une échéance\n4 = Exclure des mois chaque année (ex. impôts sur 10 mois)\n\nEntrez 1, 2, 3 ou 4 :');
    return ({'1':'reporter','2':'ignorer','3':'montant','4':'exclure_mois'})[String(choix||'').trim()]||'';
  }
  function dateDemandee_(message){const v=prompt(message+' (AAAA-MM-JJ) :');return String(v||'').trim();}
  function ouvrirAjustement_(){
    const chargeId=document.getElementById('fixed-charge-id')?.value||'';if(!chargeId){afficherErreur('Enregistrez d’abord la charge fixe.');return;}
    const action=choisirAction_();if(!action)return;
    const a={charge_fixe_id:chargeId,action:action,actif:true};
    if(action==='reporter'){
      a.date_cible=dateDemandee_('Échéance initiale');if(!a.date_cible)return;
      a.nouvelle_date=dateDemandee_('Nouvelle date');if(!a.nouvelle_date)return;
      const m=prompt('Nouveau montant facultatif (laisser vide pour conserver le montant habituel) :');if(String(m||'').trim())a.nouveau_montant=m;
    }else if(action==='ignorer'){
      a.date_cible=dateDemandee_('Échéance à ne pas prévoir');if(!a.date_cible)return;
    }else if(action==='montant'){
      a.date_cible=dateDemandee_('Échéance concernée');if(!a.date_cible)return;
      const m=prompt('Montant prévu pour cette échéance :');if(!String(m||'').trim())return;a.nouveau_montant=m;
    }else if(action==='exclure_mois'){
      const m=prompt('Mois sans échéance, sous forme de numéros séparés par des virgules.\nExemple : 11,12 pour un impôt prélevé de janvier à octobre.');if(!String(m||'').trim())return;a.mois=m;
    }
    a.commentaire=String(prompt('Motif / commentaire facultatif :')||'').trim();
    google.script.run.withSuccessHandler(()=>{
      if(typeof afficherToast==='function')afficherToast('Prévision ajustée.');
      else alert('Prévision ajustée.');
      if(typeof chargerDashboardTroisCadres==='function')setTimeout(chargerDashboardTroisCadres,200);
    }).withFailureHandler(err=>afficherErreur(err.message||String(err))).enregistrerAjustementChargeFixe(a);
  }

  const ouvrirBase=window.ouvrirChargeFixe;
  if(typeof ouvrirBase==='function'){
    window.ouvrirChargeFixe=function(charge){
      const form=document.getElementById('fixed-charge-form');if(form)form.dataset.sourceOperationId=String(charge&&charge._source_operation_id||'');
      const r=ouvrirBase.apply(this,arguments);
      installerBoutonAjustement_();
      const btn=document.getElementById('fixed-charge-adjust-forecast');if(btn)btn.style.display=charge&&charge.id?'':'none';
      return r;
    };
  }

  document.addEventListener('DOMContentLoaded',()=>{
    installerBoutonAjustement_();
    const form=document.getElementById('fixed-charge-form');if(!form||form.dataset.sourceLinkInstalled)return;
    form.dataset.sourceLinkInstalled='1';
    form.addEventListener('submit',function(e){
      const sourceId=String(form.dataset.sourceOperationId||'').trim();if(!sourceId)return;
      e.preventDefault();e.stopImmediatePropagation();
      const charge=lireChargeForm_();
      if(!charge.libelle||!charge.libelle_bancaire||!charge.compte){afficherErreur('Le libellé, le libellé bancaire et le compte sont obligatoires.');return;}
      const save=document.getElementById('save-fixed-charge');save.disabled=true;
      google.script.run.withSuccessHandler(()=>{
        save.disabled=false;form.dataset.sourceOperationId='';if(typeof fermerChargeFixe==='function')fermerChargeFixe();
        if(typeof charger==='function')charger();if(typeof ouvrirChargesFixes==='function')setTimeout(ouvrirChargesFixes,100);
      }).withFailureHandler(err=>{save.disabled=false;afficherErreur(err.message||String(err));}).enregistrerChargeFixeLieeOperation(sourceId,charge);
    },true);
  });
})();
</script>
