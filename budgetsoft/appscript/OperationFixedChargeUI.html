<script>
(function(){
  function installerOptionChargeFixeOperation(){
    const form=document.getElementById('operation-form');
    if(!form||document.getElementById('operation-to-fixed-charge'))return;
    const actions=form.querySelector('.form-actions');
    if(!actions)return;
    const bloc=document.createElement('div');
    bloc.id='operation-fixed-charge-block';
    bloc.className='full-field';
    bloc.style.marginTop='10px';
    bloc.innerHTML=`<label class="checkbox-line"><input type="checkbox" id="operation-to-fixed-charge"> Enregistrer aussi comme charge fixe</label><p class="helper-text">Crée la règle récurrente et rattache aussi les opérations bancaires équivalentes déjà présentes dans l’historique.</p>`;
    actions.parentNode.insertBefore(bloc,actions);
  }

  function lireOperationFormulaire_(){
    return {
      id:document.getElementById('operation-id').value,
      date:document.getElementById('operation-date').value,
      libelle:document.getElementById('operation-label').value.trim(),
      categorie:document.getElementById('operation-category').value,
      compte:document.getElementById('operation-account').value,
      montant:nombre(document.getElementById('operation-amount').value),
      type:document.getElementById('operation-type').value,
      commentaire:document.getElementById('operation-comment').value.trim()
    };
  }

  function preparerChargeFixeDepuisOperation_(operation){
    const date=new Date(operation.date+'T12:00:00');
    return {
      id:'',
      libelle:operation.libelle,
      categorie:operation.categorie||'',
      compte:operation.compte||'',
      montant:Math.abs(operation.montant),
      type:'depense',
      jour_execution:isNaN(date)?1:date.getDate(),
      date_debut:isNaN(date)?'':dateInput(date),
      date_fin:'',
      actif:true,
      commentaire:'Créée depuis une opération existante',
      frequence:'Mensuelle',
      libelle_bancaire:operation.libelle,
      tolerance:0.50,
      nature:'Autre'
    };
  }

  document.addEventListener('DOMContentLoaded',()=>{
    installerOptionChargeFixeOperation();
    const form=document.getElementById('operation-form');
    if(!form||form.dataset.fixedChargeBridge)return;
    form.dataset.fixedChargeBridge='1';

    form.addEventListener('submit',function(e){
      const coche=document.getElementById('operation-to-fixed-charge');
      if(!coche||!coche.checked)return;

      e.preventDefault();
      e.stopImmediatePropagation();

      const operation=lireOperationFormulaire_();
      if(!operation.libelle||!operation.compte){afficherErreur('Le libellé et le compte sont obligatoires.');return;}
      const charge=preparerChargeFixeDepuisOperation_(operation);
      const bouton=document.getElementById('save-operation');
      bouton.disabled=true;

      google.script.run.withSuccessHandler(r=>{
        bouton.disabled=false;
        coche.checked=false;
        fermerOperation();
        charger();
        ouvrirVue('operations');
        const n=r&&r.retrospectif?Number(r.retrospectif.rattachees||0):0;
        if(typeof afficherToast==='function') afficherToast('Charge fixe créée · '+n+' opération(s) historique(s) rattachée(s).');
        if(typeof chargerDashboardTroisCadres==='function')setTimeout(chargerDashboardTroisCadres,300);
      }).withFailureHandler(err=>{
        bouton.disabled=false;
        afficherErreur(err.message||String(err));
      }).enregistrerOperationAvecChargeFixe(operation,charge);
    },true);
  });
})();
</script>
