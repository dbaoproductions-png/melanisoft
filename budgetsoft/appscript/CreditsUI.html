<script>
/* Redeploiement UI totaux credits 2026-09-26 */
(function(){'use strict';
  let cacheCredits_=null;
  function euro_(v){return typeof money!=='undefined'?money.format(Number(v||0)):Number(v||0).toFixed(2)+' €';}
  function date_(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleDateString('fr-FR');}
  function dateInput_(v){if(!v)return'';const d=new Date(v);if(isNaN(d))return'';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function esc_(s){return typeof echapper==='function'?echapper(String(s??'')):String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function taux_(v){const n=Number(v||0);return n?`${n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})} %`:'—';}
  function num_(v){const n=Number(String(v??'').replace(/\s/g,'').replace(',','.'));return Number.isFinite(n)?n:0;}
  function statutDette_(v,inactive){if(inactive)return'Soldée / inactive';const s=String(v||'a_payer').toLowerCase();if(s==='a_payer')return'À payer';if(s==='en_cours')return'En cours';if(/paye|sold|clos|clot/.test(s))return'Payée';return String(v||'À payer').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase());}
  function somme_(xs,champ){return (xs||[]).reduce((s,x)=>s+Math.max(0,Number(x&&x[champ]||0)),0);}
  function totalCadre_(items,defs){if(!items.length)return'';return `<div class="credit-frame-totals">${defs.map(d=>`<div><span>${esc_(d.label)}</span><strong>${d.money===false?esc_(String(d.value)):euro_(d.value)}</strong></div>`).join('')}</div>`;}

  function estimationCredit_(c){
    const p=cacheCredits_&&cacheCredits_.situationPatrimonialeEstimee;
    return p&&p.credits&&p.credits.find(x=>String(x.id)===String(c.id));
  }
  function prochaineEcheanceEstimee_(c){
    const ref=new Date(),jour=ref.getFullYear()*10000+(ref.getMonth()+1)*100+ref.getDate();
    const est=estimationCredit_(c);
    let d=c.prochaine_echeance?new Date(c.prochaine_echeance):null;
    if(!d||isNaN(d))return '—';
    // Une date contractuelle future est conservée (ex. suspension CASDEN).
    // À défaut, faire avancer une échéance mensuelle jusqu'au prochain mois.
    // Cette date est indicative et ne modifie pas la fiche du contrat.
    const ancre=d.getDate();
    while(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()<=jour){
      const m=d.getMonth()+1,annee=d.getFullYear()+Math.floor(m/12),mois=m%12;
      d=new Date(annee,mois,Math.min(ancre,new Date(annee,mois+1,0).getDate()),12);
    }
    return date_(d);
  }
  function ligneCredit_(c,renouvelable){
    const est=estimationCredit_(c);
    const capital=est&&est.estimationDisponible?est.capitalEstime:c.capital_restant;
    const resume=renouvelable?'Encours estimé':'Capital restant estimé';
    return `<div class="credit-row"><div class="account-main credit-row-main"><div class="account-icon">${renouvelable?'🔄':'💼'}</div><div><strong>${esc_(c.nom||'Crédit')}</strong><small>${c.numero_pret?'N° '+esc_(c.numero_pret):''}</small></div></div><div class="credit-metrics"><div class="credit-metric"><strong>${euro_(capital)}</strong><small>${resume}</small></div><div class="credit-metric"><strong>${euro_(c.mensualite)}</strong><small>Mensualité</small></div><div class="credit-metric"><strong>${date_(c.prochaine_echeance)&&esc_(prochaineEcheanceEstimee_(c))}</strong><small>Prochaine échéance estimée</small></div><div class="credit-metric"><strong>${taux_(c.taux)}</strong><small>${renouvelable?'TAEG variable':'TAEG'}</small></div></div></div>`;
  }
  function chargerMensualitesCredits_(){
    google.script.run.withSuccessHandler(function(d){
      const x=document.getElementById('credits-payments-chart');if(!x)return;
      if(!d||!d.ok){x.innerHTML='<p class="helper-text">Historique des remboursements indisponible.</p>';return;}
      const points=d.mois||[],max=Math.max(1,...points.map(p=>p.credits+p.dettes));
      const montant=v=>euro_(v);
      x.innerHTML='<p class="helper-text">Prélèvements effectivement débités et rapprochés · crédits et dettes hors crédit. Il s’agit des sommes versées, et non de la seule part de capital amorti.</p>'+
        '<div style="display:flex;align-items:end;gap:8px;min-height:180px;overflow-x:auto;padding:15px 0">'+points.map(p=>{
          const h=Math.max(2,Math.round((p.credits+p.dettes)/max*135));
          return '<div title="'+esc_(p.mois+' : '+montant(p.credits+p.dettes))+'" style="flex:1;min-width:42px;text-align:center"><strong style="display:block;font-size:10px">'+esc_(Math.round(p.credits+p.dettes).toLocaleString('fr-FR'))+'</strong><div style="height:'+h+'px;background:#398c70;border-radius:5px 5px 0 0"></div><small>'+esc_(p.mois.slice(5))+'</small></div>';
        }).join('')+'</div><small>Derniers mois · remboursements mensuels constatés</small>';
    }).withFailureHandler(function(e){const x=document.getElementById('credits-payments-chart');if(x)x.textContent='Historique indisponible : '+String(e&&e.message||e);}).chargerHistoriqueRemboursementsCredits20261014();
  }
  function ligneDette_(d,inactive){return `<div class="account-row debt-row ${inactive?'debt-inactive':''}"><div class="account-main"><div class="account-icon">🧾</div><div><strong>${esc_(d.nom||'Dette')}</strong><small>${esc_(d.creancier||d.categorie_dette||'Dette hors crédit')}</small></div></div><div class="account-type"><strong>${euro_(d.capital_restant)}</strong><small>Reste à payer</small></div><div class="account-type"><strong>${esc_(statutDette_(d.statut,inactive))}</strong><small>Statut</small></div><div class="account-type"><strong>${date_(d.date_echeance)}</strong><small>Échéance connue</small></div><div class="debt-actions"><button class="secondary-button debt-action" data-debt-edit="${esc_(d.id)}">Modifier</button>${inactive?`<button class="secondary-button debt-action" data-debt-reactivate="${esc_(d.id)}">Réactiver</button>`:`<button class="secondary-button debt-action" data-debt-close="${esc_(d.id)}">Marquer payée</button>`}<button class="secondary-button debt-action danger" data-debt-delete="${esc_(d.id)}">Supprimer</button></div></div>${d.commentaire?`<p class="helper-text credit-note last">${esc_(d.commentaire)}</p>`:''}`;}
  function alertes_(data){const a=Array.isArray(data?.alertes)?data.alertes:[];if(!a.length)return `<article class="card panel credit-control"><div class="panel-heading"><div><span class="panel-kicker">Contrôle de cohérence</span><h2>Données à vérifier</h2></div><span class="credit-ok">✓ À jour</span></div><p class="helper-text">Aucune incohérence détectée dans les données enregistrées.</p></article>`;return `<article class="card panel credit-control"><div class="panel-heading"><div><span class="panel-kicker">Contrôle de cohérence</span><h2>Données à vérifier</h2></div><span class="badge">${a.length}</span></div><p class="helper-text">Chaque alerte correspond à une donnée à confirmer avec votre dernier relevé ou échéancier.</p><div class="credit-alert-list">${a.map((x,i)=>`<div class="credit-alert ${x.niveau==='attention'?'warn':'info'}"><div class="credit-alert-icon">${x.niveau==='attention'?'!':'i'}</div><div><strong>${esc_(x.nom)}</strong><span>${esc_(x.message)}</span></div><button class="secondary-button" data-credit-alert="${i}">Corriger</button></div>`).join('')}</div></article>`;}

  function rendreCredits_(data){
    cacheCredits_=data;const zone=document.getElementById('generic-view');if(!zone)return;
    const lignes=(data&&data.lignes)||[],credits=lignes.filter(x=>x.table==='Credits'),dettesToutes=Array.isArray(data?.dettes)?data.dettes:[],dettes=(data&&data.dettesActives)||dettesToutes.filter(x=>Number(x.capital_restant||0)>0&&String(x.actif).toLowerCase()!=='false'),soldees=dettesToutes.filter(x=>!dettes.some(a=>String(a.id)===String(x.id)));
    const classiques=credits.filter(c=>String(c.type_credit||'amortissable')!=='revolving'),renouvelables=credits.filter(c=>String(c.type_credit||'')==='revolving');
    const totalAmort=totalCadre_(classiques,[
      {label:'Capital restant estimé',value:classiques.reduce((t,c)=>t+Number(estimationCredit_(c)?.capitalEstime??c.capital_restant),0)},
      {label:'Mensualités totales',value:data?.mensualitesAmortissables??somme_(classiques,'mensualite')}

    const totalRev=totalCadre_(renouvelables,[
      {label:'Encours estimé total',value:renouvelables.reduce((t,c)=>t+Number(estimationCredit_(c)?.capitalEstime??c.capital_restant),0)},

      {label:'Plafonds cumulés',value:data?.plafondRenouvelable??somme_(renouvelables,'plafond_credit')},
      {label:'Disponible total',value:data?.disponibleRenouvelable??somme_(renouvelables,'disponible_credit')}

      {label:'Reste à payer total',value:data?.dettesHorsCredit??somme_(dettes,'capital_restant')},

    const detteEstimee=data&&data.situationPatrimonialeEstimee;
    const resumeEstime=detteEstimee&&Number.isFinite(Number(detteEstimee.endettementTotalEstime))?

    zone.innerHTML=`${resumeEstime}<div class="section-toolbar"><p class="section-intro">Suivi séparé des crédits et des dettes hors crédit. Les données sont lues sans migration ni réparation automatique.</p><div class="toolbar-buttons"><button class="primary-button" id="add-credit">＋ Crédit</button><button class="secondary-button" id="add-debt">＋ Dette</button><button class="secondary-button" id="refresh-credits">Actualiser</button></div></div><article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Financements</span><h2>Crédits amortissables</h2></div></div><div id="credits-list">${classiques.length?classiques.map(c=>ligneCredit_(c,false)).join(''):'<div class="empty-state">Aucun crédit amortissable enregistré.</div>'}</div>${totalAmort}</article><article class="card panel credit-panel"><div class="panel-heading"><div><span class="panel-kicker">Réserves de crédit</span><h2>Crédits renouvelables</h2></div></div><div>${renouvelables.length?renouvelables.map(c=>ligneCredit_(c,true)).join(''):'<div class="empty-state">Aucun crédit renouvelable enregistré.</div>'}</div>${totalRev}</article><article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Historique</span><h2>Remboursements mensuels des dettes</h2></div></div><div id="credits-payments-chart" class="helper-text">Chargement des paiements constatés…</div></article><article class="card panel credit-panel"><div class="panel-heading"><div><span class="panel-kicker">Hors crédits</span><h2>Autres dettes / impayés</h2></div><button class="primary-button" id="add-debt-2">＋ Ajouter une dette</button></div><p class="helper-text">Une dette payée est clôturée : elle ne rentre plus dans l’endettement mais reste consultable ci-dessous.</p><div>${dettes.length?dettes.map(d=>ligneDette_(d,false)).join(''):'<div class="empty-state">Aucune dette hors crédit active.</div>'}</div>${totalDettes}${soldees.length?`<details class="settled-debts"><summary>Dettes soldées / inactives (${soldees.length})</summary><div>${soldees.map(d=>ligneDette_(d,true)).join('')}</div></details>`:''}</article>`;
    chargerMensualitesCredits_();
    document.getElementById('refresh-credits')?.addEventListener('click',()=>chargerCreditsUI_(true));document.getElementById('add-credit')?.addEventListener('click',()=>ouvrirCredit_(null,null));document.getElementById('add-debt')?.addEventListener('click',()=>ouvrirDette_());document.getElementById('add-debt-2')?.addEventListener('click',()=>ouvrirDette_());zone.querySelectorAll('[data-debt-edit]').forEach(b=>b.onclick=()=>ouvrirDette_(dettesToutes.find(d=>String(d.id)===String(b.dataset.debtEdit))));zone.querySelectorAll('[data-debt-close]').forEach(b=>b.onclick=()=>{if(confirm('Marquer cette dette comme payée ?'))actionDette_('cloturerDetteV2',b.dataset.debtClose);});zone.querySelectorAll('[data-debt-reactivate]').forEach(b=>b.onclick=()=>actionDette_('reactiverDetteV2',b.dataset.debtReactivate));zone.querySelectorAll('[data-debt-delete]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer définitivement cette dette ?'))actionDette_('supprimerDetteV2',b.dataset.debtDelete);});zone.querySelectorAll('[data-credit-alert]').forEach(b=>b.onclick=()=>ouvrirAlerte_(Number(b.dataset.creditAlert)));
  }

  function assurerModalCredit_(){let m=document.getElementById('credit-modal-v2');if(m)return m;m=document.createElement('div');m.id='credit-modal-v2';m.className='modal hidden credit-modal-overlay';m.innerHTML=`<div class="modal-card credit-modal-card"><div class="modal-heading"><div><p class="panel-kicker">Financement</p><h2 id="credit-modal-title">Ajouter un crédit</h2></div><button class="modal-close" type="button" data-credit-cancel>×</button></div><div id="credit-reconcile-guide" class="credit-reconcile-guide hidden"><strong id="credit-reconcile-problem"></strong><span id="credit-reconcile-action"></span></div><form id="credit-form-v2"><input type="hidden" id="credit-id"><div id="credit-priority-fields" class="credit-priority-fields"></div><details id="credit-details" class="credit-details" open><summary>Détails du crédit</summary><div class="form-grid credit-full-grid"><label class="full-field">Nom<input id="credit-name" required></label><label>N° de prêt / contrat<input id="credit-number"></label><label>Type<select id="credit-type"><option value="amortissable">Crédit amortissable</option><option value="revolving">Crédit renouvelable</option></select></label><label data-credit-field="capital">Capital / encours restant<input id="credit-capital" inputmode="decimal" required></label><label>Mensualité actuelle<input id="credit-monthly" inputmode="decimal"></label><label>TAEG (%)<input id="credit-rate" inputmode="decimal"></label><label>Mensualités restantes<input id="credit-remaining" type="number" min="0"></label><label data-credit-field="next">Prochaine échéance<input id="credit-next" type="date"></label><label>Date de fin<input id="credit-end" type="date"></label><label>Coût restant estimé<input id="credit-cost" inputmode="decimal"></label><label data-credit-field="limit">Plafond de réserve<input id="credit-limit" inputmode="decimal"></label><label data-credit-field="available">Disponible communiqué<input id="credit-available" inputmode="decimal"></label><label>Assurance mensuelle<input id="credit-insurance" inputmode="decimal"></label><label class="full-field">Précision sur le coût restant<textarea id="credit-cost-note" rows="2"></textarea></label><label class="full-field">Commentaire<textarea id="credit-comment" rows="2"></textarea></label></div></details><div class="form-actions credit-modal-actions"><button type="button" class="secondary-button" data-credit-cancel>Annuler</button><button type="submit" class="primary-button">Enregistrer les corrections</button></div></form></div>`;document.body.appendChild(m);m.querySelectorAll('[data-credit-cancel]').forEach(b=>b.onclick=()=>m.classList.add('hidden'));m.onclick=e=>{if(e.target===m)m.classList.add('hidden');};m.querySelector('form').onsubmit=enregistrerCreditDepuisModal_;return m;}

  function configAlerte_(alerte){const msg=String(alerte?.message||'');if(/Prochaine échéance/i.test(msg))return{champs:['next','capital'],action:'Vérifiez votre dernier relevé : indiquez la nouvelle prochaine échéance et corrigez le capital restant si le prélèvement a déjà été comptabilisé.'};if(/plafond|disponible|Encours/i.test(msg))return{champs:['capital','limit','available'],action:'Recopiez les trois valeurs de votre dernier relevé : encours dû, plafond contractuel et disponible communiqué.'};return{champs:['capital'],action:'Vérifiez la valeur signalée sur votre dernier relevé ou échéancier puis enregistrez la correction.'};}
  function ouvrirCredit_(c,alerte){const m=assurerModalCredit_(),guide=document.getElementById('credit-reconcile-guide'),details=document.getElementById('credit-details');document.getElementById('credit-modal-title').textContent=alerte?'Mettre à jour '+String(c?.nom||'le crédit'):(c?'Modifier le crédit':'Ajouter un crédit');document.getElementById('credit-id').value=c?.id||'';document.getElementById('credit-name').value=c?.nom||'';document.getElementById('credit-number').value=c?.numero_pret||'';document.getElementById('credit-type').value=c?.type_credit||'amortissable';document.getElementById('credit-capital').value=Number(c?.capital_restant||0);document.getElementById('credit-monthly').value=Number(c?.mensualite||0);document.getElementById('credit-rate').value=Number(c?.taux||0);document.getElementById('credit-remaining').value=Number(c?.echeances_restantes||0);document.getElementById('credit-next').value=dateInput_(c?.prochaine_echeance);document.getElementById('credit-end').value=dateInput_(c?.date_fin);document.getElementById('credit-cost').value=Number(c?.cout_restant||0);document.getElementById('credit-limit').value=Number(c?.plafond_credit||0);document.getElementById('credit-available').value=Number(c?.disponible_credit||0);document.getElementById('credit-insurance').value=Number(c?.assurance_mensuelle||0);document.getElementById('credit-cost-note').value=c?.cout_restant_precision||'';document.getElementById('credit-comment').value=c?.commentaire||'';
    document.querySelectorAll('#credit-modal-v2 [data-credit-field]').forEach(x=>x.classList.remove('credit-field-focus'));
    if(alerte){const cfg=configAlerte_(alerte);document.getElementById('credit-reconcile-problem').textContent='À corriger : '+alerte.message;document.getElementById('credit-reconcile-action').textContent=cfg.action;guide.classList.remove('hidden');details.open=false;const p=document.getElementById('credit-priority-fields');p.innerHTML='';cfg.champs.forEach(ch=>{const src=document.querySelector(`#credit-modal-v2 [data-credit-field="${ch}"]`);if(!src)return;const clone=src.cloneNode(true),inp=clone.querySelector('input');if(inp){const original=src.querySelector('input');inp.value=original.value;inp.id='credit-priority-'+ch;inp.addEventListener('input',()=>original.value=inp.value);}clone.classList.add('credit-field-focus');p.appendChild(clone);});}else{guide.classList.add('hidden');document.getElementById('credit-priority-fields').innerHTML='';details.open=true;}
    m.classList.remove('hidden');setTimeout(()=>{const first=m.querySelector('.credit-priority-fields input')||m.querySelector('#credit-name');first?.focus();},50);
  }

  function enregistrerCreditDepuisModal_(e){e.preventDefault();const d={id:document.getElementById('credit-id').value,nom:document.getElementById('credit-name').value.trim(),numero_pret:document.getElementById('credit-number').value.trim(),type_credit:document.getElementById('credit-type').value,capital_restant:num_(document.getElementById('credit-capital').value),mensualite:num_(document.getElementById('credit-monthly').value),taux:num_(document.getElementById('credit-rate').value),echeances_restantes:Number(document.getElementById('credit-remaining').value||0),prochaine_echeance:document.getElementById('credit-next').value,date_fin:document.getElementById('credit-end').value,cout_restant:num_(document.getElementById('credit-cost').value),plafond_credit:num_(document.getElementById('credit-limit').value),disponible_credit:num_(document.getElementById('credit-available').value),assurance_mensuelle:num_(document.getElementById('credit-insurance').value),cout_restant_precision:document.getElementById('credit-cost-note').value.trim(),commentaire:document.getElementById('credit-comment').value.trim()};const btn=e.target.querySelector('[type=submit]');btn.disabled=true;google.script.run.withSuccessHandler(()=>{btn.disabled=false;document.getElementById('credit-modal-v2').classList.add('hidden');cacheCredits_=null;chargerCreditsUI_(true);}).withFailureHandler(err=>{btn.disabled=false;if(typeof afficherErreur==='function')afficherErreur(err.message||String(err));}).enregistrerCreditV2(d);}
  function ouvrirAlerte_(index){const a=Array.isArray(cacheCredits_?.alertes)?cacheCredits_.alertes[index]:null;if(!a)return;if(a.type==='credit'){const c=(cacheCredits_.lignes||[]).find(x=>x.table==='Credits'&&String(x.id)===String(a.id));ouvrirCredit_(c||null,a);return;}const d=(cacheCredits_.dettes||[]).find(x=>String(x.id)===String(a.id));ouvrirDette_(d||null,a);}

  function assurerModalDette_(){let m=document.getElementById('debt-modal-v2');if(m)return m;m=document.createElement('div');m.id='debt-modal-v2';m.className='modal hidden';m.innerHTML=`<div class="modal-card wide-modal"><div class="modal-heading"><div><p class="panel-kicker">Dette hors crédit</p><h2 id="debt-modal-title">Ajouter une dette</h2></div><button class="modal-close" type="button" data-debt-cancel>×</button></div><p id="debt-reconcile-note" class="credit-reconcile-note hidden"></p><form id="debt-form-v2"><input type="hidden" id="debt-id"><div class="form-grid"><label class="full-field">Nom<input id="debt-name" required></label><label>Créancier<input id="debt-creditor"></label><label>Catégorie<input id="debt-category"></label><label>Montant initial<input id="debt-initial" inputmode="decimal"></label><label>Reste à payer<input id="debt-balance" inputmode="decimal" required></label><label>Mensualité éventuelle<input id="debt-monthly" inputmode="decimal"></label><label>Échéance<input id="debt-date" type="date"></label><label>Priorité<select id="debt-priority"><option value="non_definie">Non définie</option><option value="haute">Haute</option><option value="normale">Normale</option><option value="basse">Basse</option></select></label><label class="full-field">Commentaire<textarea id="debt-comment" rows="3"></textarea></label></div><div class="form-actions"><button type="button" class="secondary-button" data-debt-cancel>Annuler</button><button type="submit" class="primary-button">Enregistrer</button></div></form></div>`;document.body.appendChild(m);m.querySelectorAll('[data-debt-cancel]').forEach(b=>b.onclick=()=>m.classList.add('hidden'));m.onclick=e=>{if(e.target===m)m.classList.add('hidden');};m.querySelector('form').onsubmit=enregistrerDetteDepuisModal_;
    const initial=m.querySelector('#debt-initial'),balance=m.querySelector('#debt-balance');
    if(initial&&balance){
      balance.dataset.touched='0';
      balance.addEventListener('input',()=>balance.dataset.touched='1');
      initial.addEventListener('input',()=>{if(balance.dataset.touched!=='1')balance.value=initial.value;});
    }
