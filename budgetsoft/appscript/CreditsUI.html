<script>
(function(){'use strict';
  let cacheCredits_=null;
  function euro_(v){return typeof money!=='undefined'?money.format(Number(v||0)):Number(v||0).toFixed(2)+' €';}
  function date_(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleDateString('fr-FR');}
  function dateInput_(v){if(!v)return'';const d=new Date(v);if(isNaN(d))return'';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function esc_(s){return typeof echapper==='function'?echapper(String(s??'')):String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function taux_(v){const n=Number(v||0);return n?`${n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})} %`:'—';}
  function num_(v){const n=Number(String(v??'').replace(/\s/g,'').replace(',','.'));return Number.isFinite(n)?n:0;}
  function ligneCredit_(c,renouvelable){return `<div class="account-row"><div class="account-main"><div class="account-icon">${renouvelable?'🔄':'💼'}</div><div><strong>${esc_(c.nom||'Crédit')}</strong><small>${c.numero_pret?'N° '+esc_(c.numero_pret):''}</small></div></div><div class="account-type"><strong>${euro_(c.capital_restant)}</strong><small>${renouvelable?'Encours utilisé':'Capital restant'}</small></div><div class="account-type"><strong>${euro_(c.mensualite)}</strong><small>Mensualité actuelle</small></div><div class="account-type"><strong>${euro_(c.cout_restant)}</strong><small>Coût restant estimé</small></div><div class="account-type"><strong>${taux_(c.taux)}</strong><small>${renouvelable?'TAEG révisable':'TAEG'}</small></div><div class="account-type"><strong>${Number(c.echeances_restantes||0)||'—'}</strong><small>Mensualités estimées</small></div><div class="account-type"><strong>${date_(c.prochaine_echeance)}</strong><small>Prochaine échéance</small></div><div class="account-type"><strong>${date_(c.date_fin)}</strong><small>${renouvelable?'Fin estimée':'Fin du crédit'}</small></div></div>${renouvelable?`<p class="helper-text credit-note"><strong>Réserve :</strong> plafond ${euro_(c.plafond_credit)} · disponible ${euro_(c.disponible_credit)}${Number(c.assurance_mensuelle||0)?` · assurance actuelle ${euro_(c.assurance_mensuelle)}`:''}</p>`:''}${c.cout_restant_precision?`<p class="helper-text credit-note"><strong>Coût restant :</strong> ${esc_(c.cout_restant_precision)}</p>`:''}${c.commentaire?`<p class="helper-text credit-note last">${esc_(c.commentaire)}</p>`:''}`;}
  function ligneDette_(d,inactive){return `<div class="account-row debt-row ${inactive?'debt-inactive':''}"><div class="account-main"><div class="account-icon">🧾</div><div><strong>${esc_(d.nom||'Dette')}</strong><small>${esc_(d.creancier||d.categorie_dette||'Dette hors crédit')}</small></div></div><div class="account-type"><strong>${euro_(d.capital_restant)}</strong><small>Reste à payer</small></div><div class="account-type"><strong>${esc_(d.statut||'à payer')}</strong><small>Statut</small></div><div class="account-type"><strong>${date_(d.date_echeance)}</strong><small>Échéance connue</small></div><div class="debt-actions"><button class="small-button" data-debt-edit="${esc_(d.id)}">✎</button>${inactive?`<button class="small-button" data-debt-reactivate="${esc_(d.id)}">↻</button>`:`<button class="small-button" data-debt-close="${esc_(d.id)}">✓ Payée</button>`}<button class="small-button danger" data-debt-delete="${esc_(d.id)}">🗑</button></div></div>${d.commentaire?`<p class="helper-text credit-note last">${esc_(d.commentaire)}</p>`:''}`;}
  function alertes_(data){const a=Array.isArray(data?.alertes)?data.alertes:[];if(!a.length)return'';return `<article class="card panel credit-alerts"><div class="panel-heading"><div><span class="panel-kicker">Contrôle de cohérence</span><h2>Données à vérifier</h2></div><span class="badge">${a.length}</span></div>${a.map(x=>`<div class="credit-alert ${x.niveau==='attention'?'warn':''}"><strong>${esc_(x.nom)}</strong><span>${esc_(x.message)}</span></div>`).join('')}</article>`;}

  function rendreCredits_(data){
    cacheCredits_=data;
    const zone=document.getElementById('generic-view');if(!zone)return;
    const lignes=(data&&data.lignes)||[],credits=lignes.filter(x=>x.table==='Credits'),dettesToutes=Array.isArray(data?.dettes)?data.dettes:[],dettes=(data&&data.dettesActives)||dettesToutes.filter(x=>Number(x.capital_restant||0)>0&&String(x.actif).toLowerCase()!=='false'),soldees=dettesToutes.filter(x=>!dettes.some(a=>String(a.id)===String(x.id)));
    const classiques=credits.filter(c=>String(c.type_credit||'amortissable')!=='revolving'),renouvelables=credits.filter(c=>String(c.type_credit||'')==='revolving');
    zone.innerHTML=`<div class="section-toolbar"><p class="section-intro">Suivi séparé des crédits et des dettes hors crédit. Les données sont maintenant lues sans migration ni réparation automatique.</p><div class="toolbar-buttons"><button class="secondary-button" id="add-debt">＋ Dette</button><button class="secondary-button" id="refresh-credits">Actualiser</button></div></div><div class="cards"><article class="card metric-card"><span>Crédits restant dus</span><strong>${euro_(data?.capitalCredits||0)}</strong><small>Amortissables + renouvelables</small></article><article class="card metric-card"><span>Dettes hors crédit</span><strong>${euro_(data?.dettesHorsCredit||0)}</strong><small>${dettes.length} dette(s) active(s)</small></article><article class="card metric-card"><span>Endettement total</span><strong>${euro_(data?.endettementTotal||0)}</strong><small>Crédits + dettes hors crédit</small></article><article class="card metric-card"><span>Mensualités actuelles</span><strong>${euro_(data?.mensualites||0)}</strong><small>Échéances connues uniquement</small></article></div>${alertes_(data)}<article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Financements</span><h2>Crédits amortissables</h2></div></div><div id="credits-list">${classiques.length?classiques.map(c=>ligneCredit_(c,false)).join(''):'<div class="empty-state">Aucun crédit amortissable enregistré.</div>'}</div></article><article class="card panel credit-panel"><div class="panel-heading"><div><span class="panel-kicker">Réserves de crédit</span><h2>Crédits renouvelables</h2></div></div><div>${renouvelables.length?renouvelables.map(c=>ligneCredit_(c,true)).join(''):'<div class="empty-state">Aucun crédit renouvelable enregistré.</div>'}</div></article><article class="card panel credit-panel"><div class="panel-heading"><div><span class="panel-kicker">Hors crédits</span><h2>Autres dettes / impayés</h2></div><button class="primary-button" id="add-debt-2">＋ Ajouter</button></div><p class="helper-text">Une dette payée est clôturée : elle ne rentre plus dans l’endettement mais reste consultable ci-dessous.</p><div>${dettes.length?dettes.map(d=>ligneDette_(d,false)).join(''):'<div class="empty-state">Aucune dette hors crédit active.</div>'}</div>${soldees.length?`<details class="settled-debts"><summary>Dettes soldées / inactives (${soldees.length})</summary><div>${soldees.map(d=>ligneDette_(d,true)).join('')}</div></details>`:''}</article><details class="card panel credit-tools"><summary>Outils d’initialisation anciens</summary><div class="toolbar-buttons"><button class="secondary-button" id="add-accessio-revolving">Accessio</button><button class="secondary-button" id="add-floa-revolving">FLOA</button><button class="secondary-button" id="add-carrefour-revolving">Carrefour PASS</button><button class="secondary-button" id="add-oney-revolving">Oney b+</button><button class="secondary-button" id="add-creatis-credit">Creatis</button><button class="secondary-button" id="add-cofidis-credit">Cofidis</button><button class="secondary-button" id="apply-casden-amendment">Avenant CASDEN 2026</button></div></details>`;
    document.getElementById('refresh-credits')?.addEventListener('click',()=>chargerCreditsUI_(true));document.getElementById('add-debt')?.addEventListener('click',()=>ouvrirDette_());document.getElementById('add-debt-2')?.addEventListener('click',()=>ouvrirDette_());
    zone.querySelectorAll('[data-debt-edit]').forEach(b=>b.onclick=()=>ouvrirDette_(dettesToutes.find(d=>String(d.id)===String(b.dataset.debtEdit))));
    zone.querySelectorAll('[data-debt-close]').forEach(b=>b.onclick=()=>{if(confirm('Marquer cette dette comme payée ?'))actionDette_('cloturerDetteV2',b.dataset.debtClose);});
    zone.querySelectorAll('[data-debt-reactivate]').forEach(b=>b.onclick=()=>actionDette_('reactiverDetteV2',b.dataset.debtReactivate));
    zone.querySelectorAll('[data-debt-delete]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer définitivement cette dette ?'))actionDette_('supprimerDetteV2',b.dataset.debtDelete);});
    const installer=(id,texte,methode,message)=>document.getElementById(id)?.addEventListener('click',()=>{if(!confirm(texte))return;const b=document.getElementById(id);b.disabled=true;google.script.run.withSuccessHandler(()=>{b.disabled=false;cacheCredits_=null;if(typeof afficherToast==='function')afficherToast(message);chargerCreditsUI_(true);}).withFailureHandler(err=>{b.disabled=false;if(typeof afficherErreur==='function')afficherErreur(err.message||String(err));})[methode]();});
    installer('add-accessio-revolving','Ajouter ou mettre à jour le crédit renouvelable Cofidis Accessio ?','ajouterRevolvingAccessio2026','Accessio mis à jour.');installer('add-floa-revolving','Ajouter ou mettre à jour FLOA / Cdiscount ?','ajouterRevolvingFloa2026','FLOA mis à jour.');installer('add-oney-revolving','Ajouter ou mettre à jour Oney b+ ?','ajouterRevolvingOney2026','Oney mis à jour.');installer('add-carrefour-revolving','Ajouter ou mettre à jour Carrefour PASS ?','ajouterRevolvingCarrefourPass2026','Carrefour PASS mis à jour.');installer('add-creatis-credit','Ajouter ou mettre à jour Creatis ?','ajouterCreditCreatis2026','Creatis mis à jour.');installer('add-cofidis-credit','Ajouter ou mettre à jour Cofidis ?','ajouterCreditCofidis2026','Cofidis mis à jour.');
    document.getElementById('apply-casden-amendment')?.addEventListener('click',()=>{if(!confirm('Appliquer l’avenant CASDEN 2026 ?'))return;google.script.run.withSuccessHandler(()=>{cacheCredits_=null;chargerCreditsUI_(true);}).withFailureHandler(err=>{if(typeof afficherErreur==='function')afficherErreur(err.message||String(err));}).appliquerAvenantCasden2026();});
  }

  function assurerModalDette_(){let m=document.getElementById('debt-modal-v2');if(m)return m;m=document.createElement('div');m.id='debt-modal-v2';m.className='modal hidden';m.innerHTML=`<div class="modal-card wide-modal"><div class="modal-heading"><div><p class="panel-kicker">Dette hors crédit</p><h2 id="debt-modal-title">Ajouter une dette</h2></div><button class="modal-close" type="button" data-debt-cancel>×</button></div><form id="debt-form-v2"><input type="hidden" id="debt-id"><div class="form-grid"><label class="full-field">Nom<input id="debt-name" required></label><label>Créancier<input id="debt-creditor"></label><label>Catégorie<input id="debt-category"></label><label>Montant initial<input id="debt-initial" inputmode="decimal"></label><label>Reste à payer<input id="debt-balance" inputmode="decimal" required></label><label>Mensualité éventuelle<input id="debt-monthly" inputmode="decimal"></label><label>Échéance<input id="debt-date" type="date"></label><label>Priorité<select id="debt-priority"><option value="non_definie">Non définie</option><option value="haute">Haute</option><option value="normale">Normale</option><option value="basse">Basse</option></select></label><label class="full-field">Commentaire<textarea id="debt-comment" rows="3"></textarea></label></div><div class="form-actions"><button type="button" class="secondary-button" data-debt-cancel>Annuler</button><button type="submit" class="primary-button">Enregistrer</button></div></form></div>`;document.body.appendChild(m);m.querySelectorAll('[data-debt-cancel]').forEach(b=>b.onclick=()=>m.classList.add('hidden'));m.onclick=e=>{if(e.target===m)m.classList.add('hidden');};m.querySelector('form').onsubmit=enregistrerDetteDepuisModal_;return m;}
  function ouvrirDette_(d){const m=assurerModalDette_();document.getElementById('debt-modal-title').textContent=d?'Modifier la dette':'Ajouter une dette';document.getElementById('debt-id').value=d?.id||'';document.getElementById('debt-name').value=d?.nom||'';document.getElementById('debt-creditor').value=d?.creancier||'';document.getElementById('debt-category').value=d?.categorie_dette||'';document.getElementById('debt-initial').value=Number(d?.montant_initial||d?.capital_restant||0);document.getElementById('debt-balance').value=Number(d?.capital_restant||0);document.getElementById('debt-monthly').value=Number(d?.mensualite||0);document.getElementById('debt-date').value=dateInput_(d?.date_echeance);document.getElementById('debt-priority').value=d?.priorite||'non_definie';document.getElementById('debt-comment').value=d?.commentaire||'';m.classList.remove('hidden');}
  function enregistrerDetteDepuisModal_(e){e.preventDefault();const d={id:document.getElementById('debt-id').value,nom:document.getElementById('debt-name').value.trim(),creancier:document.getElementById('debt-creditor').value.trim(),categorie_dette:document.getElementById('debt-category').value.trim(),montant_initial:num_(document.getElementById('debt-initial').value),capital_restant:num_(document.getElementById('debt-balance').value),mensualite:num_(document.getElementById('debt-monthly').value),date_echeance:document.getElementById('debt-date').value,priorite:document.getElementById('debt-priority').value,commentaire:document.getElementById('debt-comment').value.trim(),actif:true,statut:'a_payer'};const btn=e.target.querySelector('[type=submit]');btn.disabled=true;google.script.run.withSuccessHandler(()=>{btn.disabled=false;document.getElementById('debt-modal-v2').classList.add('hidden');cacheCredits_=null;chargerCreditsUI_(true);}).withFailureHandler(err=>{btn.disabled=false;if(typeof afficherErreur==='function')afficherErreur(err.message||String(err));}) .enregistrerDetteV2(d);}
  function actionDette_(methode,id){google.script.run.withSuccessHandler(()=>{cacheCredits_=null;chargerCreditsUI_(true);}).withFailureHandler(err=>{if(typeof afficherErreur==='function')afficherErreur(err.message||String(err));})[methode](id);}
  function chargerCreditsUI_(force){const zone=document.getElementById('generic-view');if(!force&&cacheCredits_){rendreCredits_(cacheCredits_);return;}const pre=!force&&window.__BUDGETSOFT_PREFETCH&&window.__BUDGETSOFT_PREFETCH.credits;if(pre){cacheCredits_=pre;delete window.__BUDGETSOFT_PREFETCH.credits;rendreCredits_(pre);return;}if(zone)zone.innerHTML='<section class="loading">Chargement des crédits et dettes…</section>';google.script.run.withSuccessHandler(rendreCredits_).withFailureHandler(err=>{if(typeof afficherErreur==='function')afficherErreur(err.message||String(err));}).chargerCreditsEtDettesV2();}
  window.chargerCreditsUI=chargerCreditsUI_;window.budgetsoftModules=window.budgetsoftModules||{};window.budgetsoftModules.credits=()=>chargerCreditsUI_(false);const base=window.ouvrirVue;if(typeof base==='function')window.ouvrirVue=function(view){const r=base.apply(this,arguments);if(view==='credits')chargerCreditsUI_(false);return r;};
  const st=document.createElement('style');st.textContent=`.credit-panel,.credit-alerts{margin-top:18px}.credit-note{margin:0 0 4px 58px}.credit-note.last{margin-bottom:14px}.credit-alert{display:grid;grid-template-columns:minmax(160px,.35fr) 1fr;gap:12px;padding:9px 4px;border-top:1px solid #edf1ef}.credit-alert.warn{background:#fff8e8;border-radius:8px;padding:9px}.debt-row{grid-template-columns:minmax(220px,1.4fr) repeat(3,minmax(100px,.6fr)) auto}.debt-inactive{opacity:.65}.debt-actions{display:flex;gap:5px;justify-content:flex-end}.settled-debts{margin-top:14px;border-top:1px solid #edf1ef;padding-top:12px}.settled-debts summary,.credit-tools summary{cursor:pointer;font-weight:700}.credit-tools{margin-top:18px}.credit-tools .toolbar-buttons{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}@media(max-width:900px){.debt-row{grid-template-columns:1fr 1fr}.debt-actions{grid-column:1/-1;justify-content:flex-start}.credit-alert{grid-template-columns:1fr}}@media(max-width:650px){.credit-note{margin-left:0}.debt-row{grid-template-columns:1fr}.debt-actions{grid-column:auto}}`;
  document.head.appendChild(st);
})();
</script>
