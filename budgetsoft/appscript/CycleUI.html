<script>
const cycleUI={donnees:null};
const maintenanceUI={donnees:null};
window.budgetsoftModules=window.budgetsoftModules||{};
window.budgetsoftModules.maintenance=afficherCentreMaintenance;

const rendreDashboardAvantCycle = typeof rendreDashboard === 'function' ? rendreDashboard : null;
if (rendreDashboardAvantCycle) {
  rendreDashboard = function(data){ rendreDashboardAvantCycle(data); if(cycleUI.donnees) setTimeout(rendreCycleUI,0); else setTimeout(chargerCycleUI,0); };
}
document.addEventListener('DOMContentLoaded',()=>{installerCycleUI();installerImportCycle();installerMaintenanceUI();chargerCycleUI();});

function installerCycleUI(){
  const cards=document.querySelector('#dashboard .cards');
  if(cards&&!document.getElementById('cycle-status-card')){const bloc=document.createElement('article');bloc.className='card metric-card';bloc.id='cycle-status-card';bloc.innerHTML='<span>Dernier cycle analysé</span><strong id="cycle-day">—</strong><small id="cycle-dates">Chargement…</small>';cards.prepend(bloc);}
  const grille=document.querySelector('#dashboard .dashboard-grid');
  if(grille&&!document.getElementById('cycle-finance-panel')){const panneau=document.createElement('article');panneau.className='card panel';panneau.id='cycle-finance-panel';panneau.innerHTML='<div class="panel-heading"><div><span class="panel-kicker">Deux temporalités</span><h2>Cycles financiers</h2></div><button class="secondary-button" type="button" onclick="chargerCycleUI()">Actualiser</button></div><div id="cycle-finance-content" class="helper-text">Chargement…</div>';grille.prepend(panneau);}
}
function installerImportCycle(){const bouton=document.getElementById('confirm-pdf-import');if(!bouton||bouton.dataset.cycleInstalled)return;bouton.dataset.cycleInstalled='1';bouton.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();const compte=document.getElementById('pdf-account').value,status=document.getElementById('pdf-status');if(!compte){status.textContent='Choisissez le compte concerné.';return;}bouton.disabled=true;status.textContent='Import en cours…';google.script.run.withSuccessHandler(r=>{bouton.disabled=false;let message=`Import terminé : ${r.importees} opération(s) importée(s), ${r.doublons} doublon(s) ignoré(s), ${r.rapprochees} rapprochement(s).`;if(r.soldeOuverture!=null)message+=` Solde d’ouverture : ${money.format(r.soldeOuverture)}.`;if(r.soldeCloture!=null)message+=` Solde de clôture : ${money.format(r.soldeCloture)}.`;if(r.continuite===true)message+=' Continuité avec le relevé précédent : conforme.';if(r.continuite===false)message+=` Attention : écart de continuité de ${money.format(r.ecartContinuite||0)}.`;status.innerHTML=`<div class="success-box"><strong>Relevé importé avec succès</strong><br>${echapper(message)}</div>`;charger();chargerCycleUI();setTimeout(()=>{fermerImportPdf();alert(message);},700);}).withFailureHandler(err=>{bouton.disabled=false;status.innerHTML=`<div class="error"><strong>Échec de l’import</strong><br>${echapper(err.message||String(err))}</div>`;}).importerOperationsHelloBankCycle(sprint0809.pdfOperations,compte,sprint0809.pdfMeta);},true);}
function chargerCycleUI(){google.script.run.withSuccessHandler(d=>{cycleUI.donnees=d;rendreCycleUI();}).withFailureHandler(e=>{const z=document.getElementById('cycle-finance-content');if(z)z.textContent='Erreur : '+(e.message||e);}).chargerCycleFinancier();}
function rendreCycleUI(){
  const d=cycleUI.donnees;if(!d)return;const p=d.periode,i=d.indicateurs,c=d.couverture||{};const debut=new Date(p.debut),fin=new Date(p.fin);const cycleCouvert=c.completeCycle===true;const dateReleve=c.dateDernierReleve?new Date(c.dateDernierReleve):null;const dateReleveTxt=dateReleve?dateReleve.toLocaleDateString('fr-FR'):'';
  const cycleDay=document.getElementById('cycle-day'),cycleDates=document.getElementById('cycle-dates');if(cycleDay)cycleDay.textContent=p.libelle||'Cycle analysé';if(cycleDates)cycleDates.textContent=`${debut.toLocaleDateString('fr-FR')} → ${fin.toLocaleDateString('fr-FR')} · ${p.termine?'Cycle terminé · '+p.dureeJours+' jours':'Jour '+p.jourCourant+'/'+p.dureeJours}`;
  const solde=document.getElementById('solde-global'),revenus=document.getElementById('revenus-mois'),depenses=document.getElementById('depenses-mois'),epargne=document.getElementById('epargne-mois');if(solde){solde.textContent=c.soldeFiable?money.format(i.soldeBancaire):'À synchroniser';const small=solde.parentElement&&solde.parentElement.querySelector('small');if(small)small.textContent=dateReleve?'Dernier solde bancaire connu au '+dateReleveTxt:'Aucun solde de clôture mémorisé';}
  const suffixePartiel=!cycleCouvert&&dateReleve?'Partiel · relevés jusqu’au '+dateReleveTxt:'Données partielles';if(revenus){revenus.textContent=money.format(i.revenusCycle);const small=revenus.parentElement&&revenus.parentElement.querySelector('small');if(small)small.textContent=cycleCouvert?'Entrées du cycle '+p.libelle:suffixePartiel;}if(depenses){depenses.textContent=money.format(i.depensesCycle);const small=depenses.parentElement&&depenses.parentElement.querySelector('small');if(small)small.textContent=cycleCouvert?'Sorties du cycle '+p.libelle:suffixePartiel;}if(epargne){epargne.textContent=money.format(i.epargneCycle);const small=epargne.parentElement&&epargne.parentElement.querySelector('small');if(small)small.textContent=cycleCouvert?'Revenus moins dépenses du cycle':(!cycleCouvert&&dateReleve?'Partiel · calcul jusqu’au '+dateReleveTxt:'Calcul provisoire');}
  const z=document.getElementById('cycle-finance-content');if(!z)return;
  const maintenant=new Date();const jourRef=d.salaire?Math.max(1,Math.min(28,Number(d.salaire.jourMoyen)||28)):28;let debutCourant=maintenant.getDate()>=jourRef?new Date(maintenant.getFullYear(),maintenant.getMonth(),jourRef):new Date(maintenant.getFullYear(),maintenant.getMonth()-1,jourRef);let finCourant=new Date(debutCourant.getFullYear(),debutCourant.getMonth()+1,jourRef);finCourant.setDate(finCourant.getDate()-1);const libelleCourant=new Date(debutCourant.getFullYear(),debutCourant.getMonth()+1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}).replace(/^./,x=>x.toUpperCase());const dureeCourante=Math.round((new Date(finCourant.getFullYear(),finCourant.getMonth(),finCourant.getDate(),12)-new Date(debutCourant.getFullYear(),debutCourant.getMonth(),debutCourant.getDate(),12))/86400000)+1;const jourCourant=Math.min(dureeCourante,Math.round((new Date(maintenant.getFullYear(),maintenant.getMonth(),maintenant.getDate(),12)-new Date(debutCourant.getFullYear(),debutCourant.getMonth(),debutCourant.getDate(),12))/86400000)+1);
  const couvertureInfo=cycleCouvert?'<div class="success-box" style="margin-top:12px"><strong>Cycle couvert</strong> · les relevés atteignent la fin du cycle.</div>':`<div class="error" style="margin-top:12px"><strong>Résultats partiels</strong> · ${dateReleve?'relevés disponibles jusqu’au '+dateReleveTxt:'aucun relevé de clôture disponible'}, cycle prévu jusqu’au ${fin.toLocaleDateString('fr-FR')}.</div>`;
  z.innerHTML=`<div class="dashboard-grid" style="margin-top:4px"><article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Dernier cycle analysé</span><h2>${echapper(p.libelle||'Cycle')}</h2></div><span class="badge">${p.termine?'Terminé':'Historique'}</span></div><p><strong>${debut.toLocaleDateString('fr-FR')} → ${fin.toLocaleDateString('fr-FR')}</strong> · ${p.dureeJours} jours.</p><div class="cards" style="margin-top:12px"><article class="card metric-card"><span>Solde bancaire</span><strong>${c.soldeFiable?money.format(i.soldeBancaire):'À synchroniser'}</strong><small>${dateReleve?'Au '+dateReleveTxt:'Solde absent'}</small></article><article class="card metric-card"><span>Revenus</span><strong>${money.format(i.revenusCycle)}</strong><small>${cycleCouvert?'Cycle couvert':suffixePartiel}</small></article><article class="card metric-card"><span>Dépenses</span><strong>${money.format(i.depensesCycle)}</strong><small>${cycleCouvert?'Cycle couvert':suffixePartiel}</small></article><article class="card metric-card"><span>Épargne</span><strong>${money.format(i.epargneCycle)}</strong><small>${cycleCouvert?'Bilan du cycle':'Calcul provisoire'}</small></article></div>${couvertureInfo}</article><article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Temps réel</span><h2>Cycle en cours · ${echapper(libelleCourant)}</h2></div><span class="badge">Jour ${jourCourant}/${dureeCourante}</span></div><p><strong>${debutCourant.toLocaleDateString('fr-FR')} → ${finCourant.toLocaleDateString('fr-FR')}</strong></p><div class="cards" style="margin-top:12px"><article class="card metric-card"><span>Dernier solde connu</span><strong>${c.soldeFiable?money.format(i.soldeBancaire):'À synchroniser'}</strong><small>${dateReleve?'Banque au '+dateReleveTxt:'Pas de relevé récent'}</small></article><article class="card metric-card"><span>CB en attente</span><strong>${money.format(i.cbEnAttente)}</strong><small>${i.nombreCbEnAttente} opération(s) connues</small></article><article class="card metric-card"><span>Solde engagé</span><strong>${c.soldeFiable?money.format(i.soldeEngage):'—'}</strong><small>Sur les données disponibles</small></article><article class="card metric-card"><span>Projection</span><strong>—</strong><small>Disponible avec les opérations du cycle courant</small></article></div><div class="error" style="margin-top:12px"><strong>Temps réel à alimenter</strong> · ce cadre représente le cycle actuel même si les relevés historiques importés s’arrêtent avant aujourd’hui. Les montants deviennent progressivement fiables avec les opérations courantes.</div></article></div>${d.salaire?`<p class="helper-text">Référence des cycles : ${echapper(d.salaire.libelle)} · réception habituelle du ${d.salaire.jourMin} au ${d.salaire.jourMax} · confiance ${d.salaire.confiance}%.</p>`:''}${d.alertes.length?'<div class="error" style="margin-top:12px">'+d.alertes.map(e=>echapper(e)).join('<br>')+'</div>':''}`;
}

function installerMaintenanceUI(){const nav=document.querySelector('.nav');if(!nav||document.querySelector('[data-view="maintenance"]'))return;const bouton=document.createElement('button');bouton.className='nav-item';bouton.dataset.view='maintenance';bouton.innerHTML='🛠 <span>Maintenance</span>';const parametres=nav.querySelector('[data-view="parametres"]');nav.insertBefore(bouton,parametres||null);}
function afficherCentreMaintenance(){const zone=document.getElementById('generic-view');zone.innerHTML='<div class="section-toolbar"><p class="section-intro">Nettoyez, recalculez et contrôlez les données de BudgetSoft.</p><button class="secondary-button" type="button" onclick="chargerMaintenanceUI()">↻ Actualiser</button></div><div id="maintenance-status" class="helper-text">Chargement…</div><div id="maintenance-content"></div>';chargerMaintenanceUI();}
function chargerMaintenanceUI(){google.script.run.withSuccessHandler(d=>{maintenanceUI.donnees=d;rendreMaintenanceUI();}).withFailureHandler(e=>{const s=document.getElementById('maintenance-status');if(s)s.textContent='Erreur : '+(e.message||e);}).chargerCentreMaintenance();}
function rendreMaintenanceUI(){const d=maintenanceUI.donnees,zone=document.getElementById('maintenance-content'),status=document.getElementById('maintenance-status');if(!d||!zone)return;if(status)status.textContent=`Version ${d.version} · ${d.compteurs.Operations||0} opération(s) · santé ${d.controle.score}/100`;zone.innerHTML=`<div class="dashboard-grid"><article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Nettoyage</span><h2>Données</h2></div></div><p class="helper-text">La structure et les en-têtes des feuilles sont conservés.</p>${ligneMaintenance_('Vider toutes les opérations',d.compteurs.Operations||0,"nettoyerMaintenance('operations','Vider toutes les opérations')",true)}${ligneMaintenance_('Retirer les imports PDF et leur apprentissage',(d.compteurs.Rapprochements_a_valider||0)+(d.compteurs.Correspondances_bancaires||0),"nettoyerMaintenance('imports_bancaires','Retirer les imports PDF')",true)}${ligneMaintenance_('Vider les rapprochements',d.compteurs.Rapprochements_a_valider||0,"nettoyerMaintenance('rapprochements','Vider les rapprochements')")}${ligneMaintenance_('Vider les correspondances bancaires',d.compteurs.Correspondances_bancaires||0,"nettoyerMaintenance('correspondances','Vider les correspondances')")}${ligneMaintenance_('Vider les charges fixes',d.compteurs.Charges_fixes||0,"nettoyerMaintenance('charges_fixes','Vider les charges fixes')",true)}</article><article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Mise à jour</span><h2>Recalcul</h2></div></div>${ligneAction_('Recalculer le cycle financier',"recalculerMaintenanceUI('cycles')")}${ligneAction_('Recalculer les budgets',"recalculerMaintenanceUI('budgets')")}${ligneAction_('Recalculer le patrimoine',"recalculerMaintenanceUI('patrimoine')")}${ligneAction_('Recalculer les analyses',"recalculerMaintenanceUI('analyses')")}${ligneAction_('Tout recalculer',"recalculerMaintenanceUI('tout')",true)}</article><article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Intégrité</span><h2>Contrôle qualité</h2></div><strong>${d.controle.score}/100</strong></div><div class="cards"><article class="card metric-card"><span>Erreurs</span><strong>${d.controle.erreurs}</strong></article><article class="card metric-card"><span>À vérifier</span><strong>${d.controle.attentions}</strong></article></div><div style="margin-top:14px">${d.controle.anomalies.length?d.controle.anomalies.slice(0,25).map(a=>`<div class="account-row"><div><strong>${echapper(a.domaine)}</strong><small>${echapper(a.message)}</small></div><span class="badge">${a.niveau==='erreur'?'Erreur':'À vérifier'}</span></div>`).join(''):'<div class="success-box"><strong>Aucune anomalie détectée.</strong></div>'}</div><div class="form-actions"><button class="primary-button" type="button" onclick="controlerMaintenanceUI()">Vérification complète</button></div></article></div><div id="maintenance-result" style="margin-top:16px"></div>`;}
function ligneMaintenance_(label,nombre,action,danger){return `<div class="account-row"><div><strong>${echapper(label)}</strong><small>${nombre} ligne(s)</small></div><button class="small-button ${danger?'danger':''}" type="button" onclick="${action}">Exécuter</button></div>`;}
function ligneAction_(label,action,principal){return `<div class="account-row"><strong>${echapper(label)}</strong><button class="${principal?'primary-button':'small-button'}" type="button" onclick="${action}">Exécuter</button></div>`;}
function nettoyerMaintenance(cible,label){if(!confirm(label+'\n\nCette action supprime les données concernées. Continuer ?'))return;resultatMaintenance_('Traitement en cours…');google.script.run.withSuccessHandler(r=>{resultatMaintenance_(`<div class="success-box"><strong>Nettoyage terminé</strong><br>${r.supprimees} ligne(s) supprimée(s).</div>`);chargerMaintenanceUI();charger();chargerCycleUI();}).withFailureHandler(e=>resultatMaintenance_(`<div class="error">Erreur : ${echapper(e.message||e)}</div>`)).viderDonneesMaintenance(cible);}
function recalculerMaintenanceUI(cible){resultatMaintenance_('Recalcul en cours…');google.script.run.withSuccessHandler(r=>{resultatMaintenance_(`<div class="${r.succes?'success-box':'error'}"><strong>${r.succes?'Recalcul terminé':'Recalcul incomplet'}</strong><br>${(r.details||[]).map(echapper).join('<br>')}</div>`);chargerMaintenanceUI();chargerCycleUI();}).withFailureHandler(e=>resultatMaintenance_(`<div class="error">Erreur : ${echapper(e.message||e)}</div>`)).recalculerMaintenance(cible);}
function controlerMaintenanceUI(){resultatMaintenance_('Contrôle en cours…');google.script.run.withSuccessHandler(r=>{maintenanceUI.donnees.controle=r;rendreMaintenanceUI();resultatMaintenance_(`<div class="success-box"><strong>Contrôle terminé</strong><br>Score ${r.score}/100 · ${r.erreurs} erreur(s) · ${r.attentions} point(s) d’attention.</div>`);}).withFailureHandler(e=>resultatMaintenance_(`<div class="error">Erreur : ${echapper(e.message||e)}</div>`)).controlerQualiteBudgetSoft();}
function resultatMaintenance_(contenu){const zone=document.getElementById('maintenance-result');if(zone)zone.innerHTML=contenu;}
</script>
