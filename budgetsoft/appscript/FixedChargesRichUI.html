<script>
(function(){
  const ancienRendreChargesFixes = typeof rendreChargesFixes === 'function' ? rendreChargesFixes : null;

  function compteNom_(id){const c=(state.data?.Comptes||[]).find(x=>String(x.id)===String(id));return c?c.nom:(id||'—');}
  function dateFr_(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('fr-FR');}
  function jourLibelle_(j){j=Number(j)||1;return j===1?'1er':String(j);}

  window.rendreChargesFixes=function(){
    if(!state.data)return;
    const charges=(state.data.Charges_fixes||[]).filter(c=>estActif(c.actif));
    const compteur=document.getElementById('fixed-charge-count');if(compteur)compteur.textContent=charges.length+' active'+(charges.length>1?'s':'');
    const zone=document.getElementById('fixed-charges-list');if(!zone)return;
    if(!charges.length){zone.className='empty-state';zone.textContent='Aucune charge fixe enregistrée.';return;}
    zone.className='';
    zone.innerHTML=charges.map(c=>{
      const montant=Math.abs(nombre(c.montant));
      const meta=[compteNom_(c.compte),c.categorie||'Sans catégorie',c.frequence||'Mensuelle','le '+jourLibelle_(c.jour_execution)+' de chaque mois'].join(' · ');
      const details=[];
      if(c.date_debut)details.push('Début '+dateFr_(c.date_debut));
      if(c.date_fin)details.push('Fin '+dateFr_(c.date_fin));
      if(c.nature)details.push(c.nature);
      if(Number(c.tolerance)>0)details.push('tolérance '+money.format(Math.abs(nombre(c.tolerance))));
      return `<div class="operation-table-row"><div class="operation-date">${jourLibelle_(c.jour_execution)}</div><div class="operation-label"><strong>${echapper(c.libelle||'Charge fixe')} <span class="badge auto-badge">Fixe</span></strong><small>${echapper(meta)}${details.length?'<br>'+echapper(details.join(' · ')):''}${c.libelle_bancaire?'<br>Libellé bancaire : '+echapper(c.libelle_bancaire):''}</small></div><div class="operation-account hide-medium">${echapper(compteNom_(c.compte))}</div><div class="operation-category hide-medium">${echapper(c.categorie||'Sans catégorie')}</div><div class="operation-amount amount-negative">−${money.format(montant)}</div><div class="operation-actions"><button class="small-button" onclick="modifierChargeFixe('${echapperAttribut(c.id)}')" title="Modifier">✎</button><button class="small-button danger" onclick="supprimerChargeFixe('${echapperAttribut(c.id)}')" title="Supprimer">🗑</button></div></div>`;
    }).join('');
  };

  document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{if(state.data)rendreChargesFixes();},500));
})();
</script>
