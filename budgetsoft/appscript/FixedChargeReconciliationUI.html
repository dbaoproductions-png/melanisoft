<script>
(function(){
  const VERSION='2026-08-29.6';
  let vue=null,chargementVue=false,chargeeLe=0,propositions=[],propositionsChargees=false,restaurationEnCours=false,requeteRapprochements=0,rapprochementsEnCours=false;
  const q=id=>document.getElementById(id);
  const n=v=>{const x=Number(v||0);return Number.isFinite(x)?x:0};
  const vueChargesFixesVisible=()=>!!q('charges_fixes')?.classList.contains('active');

  function installerStyles(){
    if(q('fixed-charges-review-style'))return;
    const s=document.createElement('style');s.id='fixed-charges-review-style';s.textContent=`
      #charges_fixes .cards{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
      #charges_fixes .fixed-category{margin:0 0 18px;border:1px solid var(--border,#e5e7eb);border-radius:12px;overflow:hidden}
      #charges_fixes .fixed-category-title{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:rgba(0,0,0,.025);font-weight:700}
      #charges_fixes .fixed-review-row{display:grid;grid-template-columns:minmax(210px,1.6fr) 120px 125px 180px 90px 210px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--border,#edf0f2)}
      #charges_fixes .fixed-review-row.header{font-size:.78rem;font-weight:700;opacity:.68;background:rgba(0,0,0,.015)}
      #charges_fixes .fixed-review-row.subtotal{font-weight:700;background:rgba(0,0,0,.02)}
      #charges_fixes .fixed-review-main small{display:block;opacity:.68;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      #charges_fixes .fixed-real-alert{color:#c66a00;font-weight:800}
      #charges_fixes .fixed-review-actions{display:flex;justify-content:flex-end;align-items:center;gap:6px;flex-wrap:wrap}
      #charges_fixes .fixed-status{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;font-size:.72rem;font-weight:700;background:rgba(20,125,100,.10);color:#147d64}
      #charges_fixes .fixed-status.inactive{background:rgba(100,116,139,.12);color:#64748b}
      #charges_fixes .fixed-status.future{background:rgba(202,138,4,.12);color:#a16207}
      #charges_fixes .fixed-review-row.archived{opacity:.68}
      #charges_fixes .fixed-review-row.future{background:rgba(202,138,4,.025)}
      #charges_fixes .fixed-toggle{white-space:nowrap}
      #charges_fixes .reconciliation-item.is-processing{opacity:.48;pointer-events:none}
      @media(max-width:1200px){#charges_fixes .cards{grid-template-columns:repeat(3,minmax(0,1fr))}#charges_fixes .fixed-review-row{grid-template-columns:minmax(190px,1.5fr) 105px 115px 160px 80px 185px}}
    `;document.head.appendChild(s);
  }

  function boutonRapprochements(){return q('fixed-charge-matches-list')?.closest('.card.panel')?.querySelector('.panel-heading button')||null;}

  function installerStructure(){
    const section=q('charges_fixes');if(!section)return;
    q('import-fixed-charges-button')?.remove();
    const cards=section.querySelector('.cards');
    if(cards&&!cards.dataset.review20260828){
      cards.dataset.review20260828='1';
      cards.innerHTML=`<article class="card metric-card"><span>Charges actives</span><strong id="fixed-charge-count">—</strong><small id="fixed-charge-count-note">Référentiel en cours</small></article><article class="card metric-card"><span>Montant indicatif mensuel</span><strong id="fixed-charge-monthly-total">—</strong><small>Équivalent mensuel applicable au cycle courant</small></article><article class="card metric-card"><span>Réel cycle précédent</span><strong id="fixed-charge-real-prev">—</strong><small id="fixed-charge-prev-cycle">Opérations réellement rapprochées</small></article><article class="card metric-card"><span>Réel cycle en cours</span><strong id="fixed-charge-real-current">—</strong><small id="fixed-charge-current-cycle">Constaté à la dernière date bancaire</small></article><article class="card metric-card"><span>Rapprochements à valider</span><strong id="fixed-charge-match-count">…</strong><small>Opérations réelles avec une proposition</small></article>`;
    }
    const panel=section.querySelector('.fixed-charge-panel');if(panel){panel.querySelector('h2').textContent='Charges fixes par catégorie';const p=panel.querySelector('.helper-text');if(p)p.textContent='Le sous-total de référence additionne les charges actives applicables au cycle courant. Une charge future reste dans le référentiel mais n’est pas comptée.';}
    const controle=q('fixed-charge-matches-list')?.closest('.card.panel');if(controle){const p=controle.querySelector('.helper-text');if(p)p.textContent='Analyse ciblée sur le cycle précédent et le cycle en cours. Le compte bancaire n’est plus un critère éliminatoire à lui seul.';const b=controle.querySelector('.panel-heading button');if(b){b.onclick=()=>window.chargerRapprochementsChargesFixesUI(true);b.textContent='Actualiser';}}
  }

  function preparerSelects(){
    const comptes=(state.data?.Comptes||[]).filter(c=>typeof estActif==='function'?estActif(c.actif):true),cats=(state.data?.Categories||[]).filter(c=>typeof estActif==='function'?estActif(c.actif):true);
    if(typeof remplirSelect==='function'&&q('fixed-charge-account'))remplirSelect('fixed-charge-account',comptes,'Choisir un compte');
    if(typeof remplirCategories==='function'&&q('fixed-charge-category'))remplirCategories('fixed-charge-category',cats);
  }

  function renduCartes(){if(!vue)return;const s=vue.synthese||{},c=vue.cycles||{};q('fixed-charge-count').textContent=String(s.chargesActives??0);if(q('fixed-charge-count-note'))q('fixed-charge-count-note').textContent=`${s.chargesApplicables??s.chargesActives??0} applicable(s) au cycle courant`;q('fixed-charge-monthly-total').textContent=money.format(n(s.montantMensuel));q('fixed-charge-real-prev').textContent=money.format(n(s.reelCyclePrecedent));q('fixed-charge-real-current').textContent=money.format(n(s.reelCycleCourant));if(q('fixed-charge-prev-cycle'))q('fixed-charge-prev-cycle').textContent=c.precedent?`${formaterDate(c.precedent.debut)} → ${formaterDate(c.precedent.fin)}`:'Cycle précédent';if(q('fixed-charge-current-cycle'))q('fixed-charge-current-cycle').textContent=c.courant?`${formaterDate(c.courant.debut)} → ${formaterDate(c.courant.fin)} · constaté au ${formaterDate(c.derniereDateBanque)}`:'Cycle en cours';}
  function mensuel(c){const m=Math.abs(n(c.montant));switch(String(c.frequence||'Mensuelle').toLowerCase()){case'quotidienne':return m*30.4375;case'hebdomadaire':return m*52/12;case'trimestrielle':return m/3;case'semestrielle':return m/6;case'annuelle':return m/12;default:return m}}

  function renduCharges(){
    const z=q('fixed-charges-list');if(!z||!vue)return;restaurationEnCours=true;
    const charges=(vue.Charges_fixes||[]).slice().sort((a,b)=>String(a.categorie||'Sans catégorie').localeCompare(String(b.categorie||'Sans catégorie'),'fr')||String(a.libelle||'').localeCompare(String(b.libelle||''),'fr'));
    if(!charges.length){z.className='empty-state';z.textContent='Aucune charge fixe enregistrée.';restaurationEnCours=false;return;}
    const groupes={};charges.forEach(c=>{const k=String(c.categorie||'Sans catégorie').trim()||'Sans catégorie';(groupes[k]||(groupes[k]=[])).push(c)});
    z.className='';z.innerHTML=Object.entries(groupes).map(([cat,lignes])=>{const totalRef=lignes.filter(c=>(typeof estActif==='function'?estActif(c.actif):true)&&c.applicable_cycle_courant!==false).reduce((s,c)=>s+mensuel(c),0),reels=lignes.map(c=>c.reel_cycle_precedent).filter(v=>v!==null&&v!==undefined),totalReel=reels.reduce((s,v)=>s+n(v),0);const rows=lignes.map(c=>{const actif=typeof estActif==='function'?estActif(c.actif):true,applicable=c.applicable_cycle_courant!==false,futur=actif&&!applicable,real=c.reel_cycle_precedent,ecart=c.ecart_precedent,classe=c.alerte_precedent?'fixed-real-alert':'',realTxt=real==null?'—':`${money.format(n(real))}${ecart==null||Math.abs(n(ecart))<.005?'':` (${n(ecart)>0?'+':''}${money.format(n(ecart))})`}`,etat=!actif?'Inactive':futur?'À venir':'Active',etatClasse=!actif?'inactive':futur?'future':'';return `<div class="fixed-review-row ${actif?'':'archived'} ${futur?'future':''}"><div class="fixed-review-main"><strong>${echapper(c.libelle||'Charge fixe')}</strong><small>${echapper(c.libelle_bancaire||'')}</small></div><div>${echapper(c.frequence||'Mensuelle')}</div><div>${money.format(Math.abs(n(c.montant)))}</div><div class="${classe}">${realTxt}</div><div>${Number(c.jour_execution)||1}</div><div class="fixed-review-actions"><span class="fixed-status ${etatClasse}">${etat}</span><button class="small-button" onclick="modifierChargeFixe('${echapperAttribut(c.id)}')">Modifier</button><button class="small-button fixed-toggle" onclick="basculerChargeFixe('${echapperAttribut(c.id)}')">${actif?'Désactiver':'Réactiver'}</button><button class="small-button danger" onclick="supprimerChargeFixe('${echapperAttribut(c.id)}')">Supprimer</button></div></div>`;}).join('');return `<section class="fixed-category"><div class="fixed-category-title"><span>${echapper(cat)}</span><span>${lignes.length} charge(s)</span></div><div class="fixed-review-row header"><div>Charge</div><div>Fréquence</div><div>Référence</div><div>Réel cycle précédent</div><div>Échéance</div><div>État / actions</div></div>${rows}<div class="fixed-review-row subtotal"><div>Sous-total ${echapper(cat)}</div><div></div><div>${money.format(totalRef)}</div><div>${reels.length?money.format(totalReel):'—'}</div><div></div><div></div></div></section>`;}).join('');
    queueMicrotask(()=>{restaurationEnCours=false;});
  }

  function appliquerVue(r){if(!r||!r.ok)return;vue=r;chargeeLe=Date.now();state.data=Object.assign({},state.data||{},{Charges_fixes:r.Charges_fixes||[],Comptes:r.Comptes||[],Categories:r.Categories||[]});preparerSelects();renduCartes();renduCharges();try{if(typeof afficherChargement==='function')afficherChargement(false)}catch(e){}}
  function chargerVue(force){installerStructure();if(vue&&!force){appliquerVue(vue);if(Date.now()-chargeeLe<5000)return;}if(chargementVue)return;chargementVue=true;google.script.run.withSuccessHandler(r=>{chargementVue=false;appliquerVue(r)}).withFailureHandler(e=>{chargementVue=false;if(vueChargesFixesVisible())afficherErreur(e.message||String(e))}).chargerChargesFixesReview20260829();}

  function majCompteur(){const x=q('fixed-charge-match-count');if(x&&propositionsChargees)x.textContent=String(propositions.length);}
  function rendrePropositions(){const z=q('fixed-charge-matches-list');if(!z)return;if(!propositions.length){z.innerHTML='<div class="empty-state">Aucun rapprochement de charge fixe à valider sur les deux cycles suivis.</div>';return;}z.innerHTML=propositions.map(r=>`<article class="reconciliation-item"><div class="reconciliation-head"><strong>${echapper(r.libelle_charge||'Charge fixe')}</strong><span class="reconciliation-score">${Number(r.score)||0}/100</span></div><div class="reconciliation-compare"><div class="reconciliation-side"><small>Référentiel</small><strong>${money.format(Math.abs(n(r.montant_attendu)))}</strong>${r.compte_compatible===false?'<span>Compte différent : proposition conservée</span>':''}${r.revolving?'<span>Crédit revolving : montant réel variable admis</span>':''}</div><div class="reconciliation-side bank"><small>Opération réelle</small><strong>${money.format(Math.abs(n(r.montant_reel)))}</strong><span>${echapper(r.libelle_operation||'')} · ${formaterDate(r.date_operation)}</span></div></div><div class="reconciliation-actions"><button class="primary-button" onclick="deciderChargeFixeRapide20260828('${echapperAttribut(r.charge_fixe_id)}','${echapperAttribut(r.operation_id)}','valider',this)">Valider</button><button class="secondary-button" onclick="deciderChargeFixeRapide20260828('${echapperAttribut(r.charge_fixe_id)}','${echapperAttribut(r.operation_id)}','ignorer',this)">Ignorer</button></div></article>`).join('');}

  function terminerRechercheRapprochements(token){if(token!==requeteRapprochements)return false;rapprochementsEnCours=false;const b=boutonRapprochements();if(b){b.disabled=false;b.textContent='Actualiser';}return true;}

  window.chargerRapprochementsChargesFixesUI=function(){
    installerStructure();const z=q('fixed-charge-matches-list');if(!z||rapprochementsEnCours)return;
    const token=++requeteRapprochements;rapprochementsEnCours=true;propositionsChargees=false;
    const b=boutonRapprochements();if(b){b.disabled=true;b.textContent='Recherche…';}
    q('fixed-charge-match-count').textContent='…';z.innerHTML='<div class="loading">Recherche ciblée sur les deux derniers cycles…</div>';
    google.script.run.withSuccessHandler(r=>{if(!terminerRechercheRapprochements(token))return;propositions=r.propositions||[];propositionsChargees=true;majCompteur();rendrePropositions()}).withFailureHandler(e=>{if(!terminerRechercheRapprochements(token))return;propositions=[];propositionsChargees=true;majCompteur();z.innerHTML='<div class="error">'+echapper(e.message||String(e))+'</div>'}).chargerPropositionsRapprochementChargesFixes20260829();
  };

  window.deciderChargeFixeRapide20260828=function(chargeId,operationId,decision,b){const item=b.closest('.reconciliation-item');if(item)item.classList.add('is-processing');b.disabled=true;google.script.run.withSuccessHandler(r=>{const i=propositions.findIndex(x=>String(x.charge_fixe_id)===String(chargeId)&&String(x.operation_id)===String(operationId));if(i>=0)propositions.splice(i,1);propositionsChargees=true;majCompteur();if(r&&r.decision==='valider')chargerVue(true);window.chargerRapprochementsChargesFixesUI(true)}).withFailureHandler(e=>{if(item)item.classList.remove('is-processing');b.disabled=false;afficherErreur(e.message||String(e))}).deciderRapprochementChargeFixeRapide20260828(chargeId,operationId,decision);};

  function installerGardienTableau(){
    const z=q('fixed-charges-list');if(!z||z.dataset.modernGuard)return;z.dataset.modernGuard='1';
    new MutationObserver(()=>{
      if(restaurationEnCours||!vue||!vueChargesFixesVisible())return;
      if(!z.querySelector('.fixed-category')){console.warn('[Charges fixes] rendu historique intercepté',{state:window.state?.currentView,active:true});renduCharges();renduCartes();}
    }).observe(z,{childList:true,subtree:true,characterData:true});
  }

  function installerGardienCompteur(){
    const x=q('fixed-charge-match-count');if(!x||x.dataset.modernCountGuard)return;x.dataset.modernCountGuard='1';
    new MutationObserver(()=>{if(!propositionsChargees)return;const attendu=String(propositions.length);if(x.textContent!==attendu)queueMicrotask(()=>{if(propositionsChargees&&x.textContent!==attendu)x.textContent=attendu;});}).observe(x,{childList:true,subtree:true,characterData:true});
  }

  function installerOverrides(){
    installerStyles();installerStructure();installerGardienTableau();installerGardienCompteur();
    const baseOps=window.rendreOperationsPage;if(typeof baseOps==='function'&&!baseOps.__fixedModern20260829){const w=function(){if(vueChargesFixesVisible()){chargerVue(false);return;}return baseOps.apply(this,arguments)};w.__fixedModern20260829=true;window.rendreOperationsPage=w;}
    const baseCF=window.rendreChargesFixes;if(typeof baseCF==='function'&&!baseCF.__fixedModern20260829){const w=function(){if(vueChargesFixesVisible()){if(vue){renduCartes();renduCharges()}else chargerVue(false);return;}return baseCF.apply(this,arguments)};w.__fixedModern20260829=true;window.rendreChargesFixes=w;}
    window.sauvegarderChargeFixe=function(charge){const b=q('save-fixed-charge');if(b)b.disabled=true;google.script.run.withSuccessHandler(r=>{if(b)b.disabled=false;if(typeof fermerChargeFixe==='function')fermerChargeFixe();chargerVue(true)}).withFailureHandler(e=>{if(b)b.disabled=false;afficherErreur(e.message||String(e))}).sauvegarderChargeFixeReview20260828(charge);};
    window.supprimerChargeFixe=function(id){if(!confirm('Supprimer cette charge fixe du référentiel ? Les opérations bancaires réelles ne seront pas modifiées.'))return;google.script.run.withSuccessHandler(()=>chargerVue(true)).withFailureHandler(e=>afficherErreur(e.message||String(e))).supprimerChargeFixeReview20260828(id);};
    setTimeout(()=>chargerVue(false),250);
  }

  document.addEventListener('DOMContentLoaded',()=>setTimeout(installerOverrides,0));
})();
</script>
