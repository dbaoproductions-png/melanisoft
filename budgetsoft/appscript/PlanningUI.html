<script>
const planningUI={budget:null,patrimoine:null,credits:null};
window.budgetsoftModules=window.budgetsoftModules||{};
window.budgetsoftModules.budget=afficherModuleBudget;
window.budgetsoftModules.patrimoine=afficherModulePatrimoine;
window.budgetsoftModules.credits=afficherModuleCredits;

document.addEventListener('DOMContentLoaded',()=>{
  document.addEventListener('click',e=>{
    const bouton=e.target.closest('.nav-item[data-view]');
    if(!bouton)return;
    const view=bouton.dataset.view;
    if(!window.budgetsoftModules[view])return;
    e.preventDefault();
    e.stopImmediatePropagation();
    ouvrirModuleBudgetSoft(view);
  },true);
});

function ouvrirModuleBudgetSoft(view){
  state.currentView=view;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  document.getElementById('page-title').textContent=titles[view]?.[0]||view;
  document.getElementById('page-eyebrow').textContent=titles[view]?.[2]||'';
  ['dashboard','comptes','operations'].forEach(id=>document.getElementById(id)?.classList.remove('active'));
  const generic=document.getElementById('generic-view');
  generic.classList.add('active');
  window.budgetsoftModules[view]();
}

function afficherModuleBudget(){
  const zone=document.getElementById('generic-view');
  zone.innerHTML='<article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Prévisions</span><h2>Budget de la période</h2></div></div><div id="budget-ui-status" class="helper-text">Chargement…</div><div id="budget-ui-content"></div></article>';
  google.script.run.withSuccessHandler(d=>{planningUI.budget=d;rendreBudget();}).withFailureHandler(e=>{const s=document.getElementById('budget-ui-status');if(s)s.textContent='Erreur : '+(e.message||e);}).chargerBudgetPeriode('');
}
function rendreBudget(){
  const d=planningUI.budget,status=document.getElementById('budget-ui-status'),zone=document.getElementById('budget-ui-content');if(!d||!zone)return;
  if(status)status.textContent=`${new Date(d.periode.debut).toLocaleDateString('fr-FR')} → ${new Date(d.periode.fin).toLocaleDateString('fr-FR')}`;
  zone.innerHTML=`<div class="cards"><article class="card metric-card"><span>Dépenses prévues</span><strong>${money.format(d.totaux.depensesPrevues)}</strong></article><article class="card metric-card"><span>Dépenses réalisées</span><strong>${money.format(d.totaux.depensesReelles)}</strong></article><article class="card metric-card"><span>Reste</span><strong>${money.format(d.totaux.depensesPrevues-d.totaux.depensesReelles)}</strong></article></div><div style="margin-top:18px;display:grid;gap:10px">${d.postes.map((p,i)=>`<div class="account-row"><div><strong>${echapper(p.poste)}</strong><small>${p.type==='revenu'?'Revenu':'Dépense'} · Réalisé ${money.format(p.reel)}</small></div><input style="max-width:140px" inputmode="decimal" value="${Number(p.prevu||0).toFixed(2).replace('.',',')}" data-budget-index="${i}"></div>`).join('')}</div><div class="form-actions"><button class="primary-button" type="button" onclick="sauverBudget()">Enregistrer le budget</button></div>`;
}
function sauverBudget(){
  const postes=planningUI.budget.postes.map((p,i)=>({...p,prevu:nombre(document.querySelector(`[data-budget-index="${i}"]`).value)}));
  google.script.run.withSuccessHandler(d=>{planningUI.budget=d;rendreBudget();}).withFailureHandler(e=>afficherErreur(e.message||e)).enregistrerBudgetPeriode(planningUI.budget.periode.cle,postes);
}

function afficherModulePatrimoine(){
  const zone=document.getElementById('generic-view');
  zone.innerHTML='<article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Situation globale</span><h2>Patrimoine net</h2></div><button class="primary-button" type="button" onclick="ajouterElementPatrimoine()">＋ Ajouter</button></div><div id="patrimoine-status" class="helper-text">Chargement…</div><div id="patrimoine-content"></div></article>';
  google.script.run.withSuccessHandler(d=>{planningUI.patrimoine=d;rendrePatrimoine();}).withFailureHandler(e=>{const s=document.getElementById('patrimoine-status');if(s)s.textContent='Erreur : '+(e.message||e);}).chargerPatrimoine();
}
function rendrePatrimoine(){
  const d=planningUI.patrimoine,zone=document.getElementById('patrimoine-content');if(!d||!zone)return;const status=document.getElementById('patrimoine-status');if(status)status.textContent='';
  zone.innerHTML=`<div class="cards"><article class="card metric-card"><span>Actifs</span><strong>${money.format(d.totalActifs)}</strong></article><article class="card metric-card"><span>Dettes</span><strong>${money.format(d.totalDettes)}</strong></article><article class="card metric-card"><span>Patrimoine net</span><strong>${money.format(d.patrimoineNet)}</strong></article></div><div style="margin-top:18px"><h3>Actifs</h3>${d.actifs.length?d.actifs.map(a=>`<div class="account-row"><strong>${echapper(a.nom)}</strong><span>${echapper(a.type||'Autre')}</span><strong>${money.format(Number(a.valeur)||0)}</strong></div>`).join(''):'<div class="empty-state">Aucun actif enregistré.</div>'}<h3 style="margin-top:18px">Dettes et crédits</h3>${[...d.dettes,...d.credits].length?[...d.dettes,...d.credits].map(a=>`<div class="account-row"><strong>${echapper(a.nom)}</strong><span>Mensualité ${money.format(Number(a.mensualite)||0)}</span><strong>${money.format(Number(a.capital_restant)||0)}</strong></div>`).join(''):'<div class="empty-state">Aucune dette enregistrée.</div>'}</div>`;
}
function ajouterElementPatrimoine(){
  const nature=prompt('Saisissez ACTIF ou DETTE :','ACTIF');if(!nature)return;const nom=prompt('Nom :');if(!nom)return;const montant=nombre(prompt(nature.toUpperCase()==='ACTIF'?'Valeur actuelle :':'Capital restant :','0'));
  if(nature.toUpperCase()==='ACTIF') google.script.run.withSuccessHandler(afficherModulePatrimoine).enregistrerActifPatrimonial({nom,type:'Autre',valeur:montant,date_valeur:new Date().toISOString()});
  else google.script.run.withSuccessHandler(afficherModulePatrimoine).enregistrerDettePatrimoniale({table:'Dettes',nom,capital_restant:montant,mensualite:0,taux:0});
}

function afficherModuleCredits(){
  const zone=document.getElementById('generic-view');
  zone.innerHTML='<article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Financements</span><h2>Crédits et dettes</h2></div><button class="primary-button" type="button" onclick="ouvrirCreditDette()">＋ Ajouter</button></div><div id="credits-status" class="helper-text">Chargement…</div><div id="credits-content"></div></article>';
  google.script.run.withSuccessHandler(d=>{planningUI.credits=d;rendreCredits();}).withFailureHandler(e=>{const s=document.getElementById('credits-status');if(s)s.textContent='Erreur : '+(e.message||e);}).chargerCreditsEtDettes();
}
function rendreCredits(){
  const d=planningUI.credits,zone=document.getElementById('credits-content');if(!d||!zone)return;const status=document.getElementById('credits-status');if(status)status.textContent='';
  zone.innerHTML=`<div class="cards"><article class="card metric-card"><span>Capital restant</span><strong>${money.format(d.capitalRestant)}</strong></article><article class="card metric-card"><span>Mensualités</span><strong>${money.format(d.mensualites)}</strong></article><article class="card metric-card"><span>Taux moyen</span><strong>${Number(d.tauxPondere||0).toLocaleString('fr-FR',{maximumFractionDigits:2})} %</strong></article></div><div style="margin-top:18px">${d.lignes.length?d.lignes.map(l=>`<div class="account-row"><div><strong>${echapper(l.nom)}</strong><small>${echapper(l.nature)} · fin ${l.date_fin?new Date(l.date_fin).toLocaleDateString('fr-FR'):'non renseignée'}</small></div><div>${money.format(Number(l.mensualite)||0)} / mois</div><div><strong>${money.format(Number(l.capital_restant)||0)}</strong><small>${Number(l.taux||0).toLocaleString('fr-FR')} %</small></div><div class="account-actions"><button class="small-button" onclick="ouvrirCreditDette('${echapperAttribut(l.id)}','${echapperAttribut(l.table)}')">✎</button><button class="small-button danger" onclick="supprimerCreditDette('${echapperAttribut(l.id)}','${echapperAttribut(l.table)}')">🗑</button></div></div>`).join(''):'<div class="empty-state">Aucun crédit ou dette enregistré.</div>'}</div>`;
}
function ouvrirCreditDette(id,table){
  const existant=(planningUI.credits?.lignes||[]).find(l=>String(l.id)===String(id)&&String(l.table)===String(table));
  const nature=prompt('Type : CREDIT ou DETTE',existant?.table==='Dettes'?'DETTE':'CREDIT');if(!nature)return;const nom=prompt('Nom',existant?.nom||'');if(!nom)return;
  const capital=nombre(prompt('Capital restant',existant?.capital_restant||'0')),mensualite=nombre(prompt('Mensualité',existant?.mensualite||'0')),taux=nombre(prompt('Taux annuel (%)',existant?.taux||'0')),dateFin=prompt('Date de fin (AAAA-MM-JJ)',existant?.date_fin?dateInput(existant.date_fin):'');
  google.script.run.withSuccessHandler(d=>{planningUI.credits=d;rendreCredits();}).withFailureHandler(e=>afficherErreur(e.message||e)).enregistrerCreditOuDette({id:existant?.id||'',table:nature.toUpperCase()==='DETTE'?'Dettes':'Credits',nom,capital_restant:capital,mensualite,taux,date_fin:dateFin});
}
function supprimerCreditDette(id,table){
  if(!confirm('Supprimer cet élément ?'))return;
  google.script.run.withSuccessHandler(d=>{planningUI.credits=d;rendreCredits();}).withFailureHandler(e=>afficherErreur(e.message||e)).supprimerCreditOuDette(table,id);
}
</script>
