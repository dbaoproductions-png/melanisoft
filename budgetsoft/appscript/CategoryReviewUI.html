<script>
(function(){
  let data=null;
  document.addEventListener('DOMContentLoaded',()=>{
    const toolbar=document.querySelector('#operations .section-toolbar .toolbar-buttons');
    if(toolbar&&!document.getElementById('category-review-button')){
      const b=document.createElement('button');b.id='category-review-button';b.className='secondary-button';b.textContent='🏷 Catégoriser';b.addEventListener('click',ouvrirCategorieReview);toolbar.insertBefore(b,toolbar.firstChild);
    }
    // Filet de sécurité : l'affichage des opérations ne doit pas dépendre du rendu du tableau de bord.
    setTimeout(()=>rafraichirOperations(true),400);
  });
  function ech(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function garantirModal(){if(document.getElementById('category-review-modal'))return;const m=document.createElement('div');m.id='category-review-modal';m.className='modal hidden';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.innerHTML=`<div class="modal-card wide-modal" style="max-width:980px"><div class="modal-heading"><div><p class="panel-kicker">Catégorisation supervisée</p><h2>Valider les propositions</h2></div><button class="modal-close" id="category-review-close">×</button></div><p class="helper-text">Chaque carte regroupe des opérations similaires. « Valider » applique la proposition à tout le groupe. Une contre-proposition s’applique au groupe et devient la règle apprise pour les prochains imports.</p><div id="category-review-summary" class="import-summary">Chargement…</div><div id="category-review-list" style="max-height:62vh;overflow:auto"></div><div class="form-actions"><button class="secondary-button" id="category-review-refresh">Actualiser</button><button class="secondary-button" id="category-review-done">Fermer</button></div></div>`;document.body.appendChild(m);document.getElementById('category-review-close').onclick=fermer;document.getElementById('category-review-done').onclick=fermer;document.getElementById('category-review-refresh').onclick=chargerGroupes; m.addEventListener('click',e=>{if(e.target===m)fermer();});}
  function ouvrirCategorieReview(){garantirModal();document.getElementById('category-review-modal').classList.remove('hidden');chargerGroupes();}
  function rafraichirOperations(silencieux){
    google.script.run.withSuccessHandler(d=>{
      if(typeof state!=='undefined')state.data=d;
      try{if(typeof reinitialiserFiltresOperations==='function')reinitialiserFiltresOperations();}catch(e){}
      try{if(typeof rendreComptes==='function')rendreComptes();}catch(e){}
      try{if(typeof rendreOperationsPage==='function')rendreOperationsPage();}catch(e){if(!silencieux&&typeof afficherErreur==='function')afficherErreur('Affichage des opérations : '+e.message);}
      try{if(typeof ouvrirVue==='function'&&(!silencieux||state.currentView==='operations'))ouvrirVue('operations');}catch(e){}
    }).withFailureHandler(e=>{if(!silencieux&&typeof afficherErreur==='function')afficherErreur(e.message||String(e));}).chargerToutesLesDonnees();
  }
  function fermer(){document.getElementById('category-review-modal')?.classList.add('hidden');rafraichirOperations(false);}
  function chargerGroupes(){const s=document.getElementById('category-review-summary'),l=document.getElementById('category-review-list');s.textContent='Analyse des propositions…';l.innerHTML='';google.script.run.withSuccessHandler(r=>{data=r;render();}).withFailureHandler(err=>{s.textContent='Erreur : '+(err.message||String(err));}).listerGroupesCategorisationBudgetSoft();}
  function optionsCategories(g){const groupes={depense:'Dépenses',revenu:'Revenus',tresorerie:'Mouvements de trésorerie'};let html='';['depense','revenu','tresorerie'].forEach(t=>{const xs=(data.categories||[]).filter(c=>String(c.type||'').toLowerCase()===t);if(!xs.length)return;html+=`<optgroup label="${groupes[t]}">`+xs.map(c=>`<option value="${ech(c.nom)}" ${c.nom===g.proposition?'selected':''}>${ech(c.nom)}</option>`).join('')+'</optgroup>';});return html;}
  function render(){const s=document.getElementById('category-review-summary'),l=document.getElementById('category-review-list');s.textContent=`${data.nombreGroupes} groupe(s) à examiner sur ${data.totalOperations} opérations. ${data.groupesHistorique||0} groupe(s) proviennent de l’historique déjà catégorisé.`;if(!data.groupes.length){l.innerHTML='<div class="empty-state">Aucune proposition de changement à valider.</div>';return;}l.innerHTML=data.groupes.map((g,i)=>{const actuelles=Object.entries(g.categoriesActuelles||{}).map(([k,v])=>`${ech(k)} (${v})`).join(', ')||'sans catégorie';const ex=(g.exemples||[]).map(o=>`<div style="padding:5px 0;border-top:1px solid #eee"><strong>${ech(o.marchand||o.libelle)}</strong> · ${ech(o.montant)} € <small>${ech(o.date)} · ${ech(o.categorieActuelle||'sans catégorie')}</small></div>`).join('');return `<article class="card" style="margin:12px 0;padding:16px" data-i="${i}"><div style="display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap"><div style="min-width:300px;flex:1"><span class="badge">${g.nombre} opération${g.nombre>1?'s':''}</span> <small>${ech(g.source)} · motif : ${ech(g.motif)}</small><h3 style="margin:8px 0">Proposition : ${ech(g.proposition)}</h3><p class="helper-text">Actuellement : ${actuelles}</p>${ex}</div><div style="min-width:260px"><label>Catégorie<select class="category-review-select" style="width:100%;margin:6px 0 10px">${optionsCategories(g)}</select></label><button class="primary-button category-review-validate" style="width:100%;margin-bottom:8px">✓ Valider la proposition</button><button class="secondary-button category-review-counter" style="width:100%">↪ Appliquer ma contre-proposition</button><div class="category-review-status helper-text" style="margin-top:8px"></div></div></div></article>`;}).join('');l.querySelectorAll('article[data-i]').forEach(card=>{const i=Number(card.dataset.i),g=data.groupes[i],select=card.querySelector('.category-review-select'),status=card.querySelector('.category-review-status');card.querySelector('.category-review-validate').onclick=()=>agir(card,status,()=>google.script.run.withSuccessHandler(r=>fini(card,status,r)).withFailureHandler(e=>erreur(card,status,e)).validerGroupeCategorisationBudgetSoft(g));card.querySelector('.category-review-counter').onclick=()=>{const cat=select.value;if(cat===g.proposition){status.textContent='Choisissez une catégorie différente pour une contre-proposition.';return;}agir(card,status,()=>google.script.run.withSuccessHandler(r=>fini(card,status,r)).withFailureHandler(e=>erreur(card,status,e)).contreProposerGroupeCategorisationBudgetSoft(g,cat));};});}
  function agir(card,status,fn){card.querySelectorAll('button,select').forEach(x=>x.disabled=true);status.textContent='Application en cours…';fn();}
  function fini(card,status,r){status.textContent=`✓ ${r.modifiees} opération(s) modifiée(s) sur ${r.trouvees}.`;rafraichirOperations(true);setTimeout(chargerGroupes,500);}
  function erreur(card,status,e){card.querySelectorAll('button,select').forEach(x=>x.disabled=false);status.textContent='Erreur : '+(e.message||String(e));}
  window.ouvrirCategorieReview=ouvrirCategorieReview;
  window.rafraichirOperationsBudgetSoft=()=>rafraichirOperations(false);
})();
</script>
