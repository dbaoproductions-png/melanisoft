<script>
(function(){'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const mois=p=>{const d=new Date(p?.periode?.fin||p?.periode?.debut);return isNaN(d)?'P'+(p?.index||''):d.toLocaleDateString('fr-FR',{month:'long'}).replace(/^./,c=>c.toUpperCase());};
let data=null,req=0;

function card(label,value,small,cls,attr){return `<div class="c37-card ${cls||''}" ${attr||''}><span>${esc(label)}</span><b>${value}</b>${small?`<small>${small}</small>`:''}</div>`;}
function appreciation(){const f=data?.fenetreRoulante||{niveau:'vert',titre:'Lecture du court terme',raisons:[]};const p=data?.periodes||[];return `<section class="c37-app c37-${esc(f.niveau)}"><div><small>APPRÉCIATION GÉNÉRALE · PRÉSENT + FUTUR PROCHE</small><h2>${esc(f.titre)}</h2><p>${(f.raisons||[]).map(esc).join(' · ')}</p></div><div class="c37-appnums"><span>Encore disponible M<b>${money(p[0]?.v37?.sct1)}</b></span><span>Encore disponible M+1<b>${money(p[1]?.v37?.sct1)}</b></span></div></section>`;}
function reelLigne(x){return Number(x.reelNetPrevisionnel!=null?x.reelNetPrevisionnel:(x.reelImpute||0));}

function topo(p,pos){
 const v=p.v37||{},r=p.roulant||{},j=v.joker||{},sc=Number(v.sct1||0),ret=Number(v.ret1||0);
 const principal=card('Encore disponible jusqu’au 27',money(sc),'Ce que Cerbère estime encore disponible avec le réel connu et tout ce qui reste prévu jusqu’à la fin du cycle.','hero '+(sc<0?'warn':'ok'),'data-sct1-card');
 const situation=card('Situation par rapport au budget initial',money(ret),'P1 − dépenses pilotables déjà consommées ou réservées.','', 'data-ret1-card');
 const ss=card('Solde significatif de départ',money(v.ss1),`${esc(v.ss1Statut||'')} · frontière 27/28`);
 const rt=card('Recettes réévaluées',money(v.rt1),'Passé : réel · futur : R1 + Actions/Événements non rapprochés.');
 const cf=card('Charges fixes réévaluées',money(v.cft1),`${money(v.chargesFixesTotal)} référence du cycle · le réel rapproché remplace le prévu.`);
 const dp=card('Dépenses pilotables estimées sur le cycle',money(v.dpt1),'Dépenses déjà engagées + budget encore prévu d’ici au 27.','','data-dpt1-card');
 const cb=pos===1&&Number(r.cbHeritee||0)>0?card('CB de M déjà engagées',money(r.cbHeritee),'Hors charges fixes · imputées sur M+1.'):'';
 return `<div class="c37-topo">${principal}${situation}${ss}${rt}${cf}${dp}${cb}</div><div class="c37-joker ${j.actif?'on':''}"><label><input type="checkbox" data-joker ${j.actif?'checked':''}> <b>Joker P0</b></label><span>${esc(j.raison||'')}</span>${j.automatique?'<small>Activation automatique</small>':''}</div>`;
}

function ligne(x,j){const reel=reelLigne(x),plan=Number(x.planifie||0),reste=Number(x.resteV37!=null?x.resteV37:(Number(x.prevu||0)-reel-plan)),max=Math.max(200,Math.ceil(Math.max(Number(x.canon||0),Number(x.prevu||0),reel+plan)*2+1200));return `<div class="c37-line" data-j="${j}"><strong>${esc(x.categorie)}</strong><span>${money(x.canon)}</span><div class="c37-slider"><button data-d="-10">−10</button><input class="c37-range" type="range" min="0" max="${max}" step="1" value="${Number(x.prevu||0)}"><button data-d="10">+10</button><input class="c37-amount" type="number" min="0" step="1" value="${Number(x.prevu||0)}"></div><span>${money(reel)}</span><span>${plan?money(plan):'—'}</span><span class="${reste<0?'neg':''}">${money(reste)}</span></div>`;}

function reequilibrage(p){const v=p.v37||{},sc=Number(v.sct1||0),abs=Number(v.absorbableParAllocations||0),inc=Number(v.incompressible||0);return `<div class="c37-balance" data-balance><div><small>À RÉÉQUILIBRER</small><b class="${sc<0?'neg':''}">${money(sc)}</b><span>${sc<0?'Réduisez les allocations encore compressibles pour revenir vers 0.':'Affectez ce surplus aux postes souhaités pour revenir vers 0.'}</span></div><div><small>Absorbable avec les allocations restantes</small><b>${money(abs)}</b>${inc>0?`<span>Part incompressible à ce stade : <strong>${money(inc)}</strong></span>`:''}</div></div>`;}

function secondaires(p){const r=p.roulant||{},h=r.horsPilotable||{},orp=Object.keys(r.orphelines||{}),v=p.v37||{},ec=Number(v.ecartHelloCerbere||0);return `<div class="c37-bottom"><details><summary>Audit SS1 / Rt1 / CFt1 / SHBt1</summary><p>SS1 : <b>${money(v.ss1)}</b> (${esc(v.ss1Statut||'')}) · Rt1 : <b>${money(v.rt1)}</b> · CFt1 : <b>${money(v.cft1)}</b></p><p>SHBt1 Hello bank : <b>${v.shbt1==null?'—':money(v.shbt1)}</b> · Solde Cerbère présent : <b>${v.scPresent==null?'—':money(v.scPresent)}</b> · Écart : <b>${v.ecartHelloCerbere==null?'—':money(ec)}</b></p></details><details><summary>Situation par rapport au budget initial · ${money(v.ret1)}</summary><p>P1 − dépenses pilotables consommées ou réservées. Indicateur de bilan, distinct de la consigne quotidienne.</p></details><details><summary>Opérations hors pilotable à contrôler · ${money(h.total||0)}</summary><p>À expliquer par rapprochement CF, mouvement de trésorerie ou classement métier. Elles ne sont pas injectées silencieusement dans SCt1 tant que leur statut n’est pas certain.</p><p>Non-CB ${money(h.nonCb||0)} · CB ${money(h.cb||0)}</p>${Object.keys(h.nonCbParCategorie||{}).map(c=>`<span>${esc(c)} : ${money(h.nonCbParCategorie[c])}</span>`).join('')}${Object.keys(h.cbParCategorie||{}).map(c=>`<span>${esc(c)} : ${money(h.cbParCategorie[c])} (CB)</span>`).join('')}</details><details><summary>Contrôles de cohérence</summary><p>Réconciliation moteur : <b>${Math.abs(Number(r.reconciliation?.ecart||0))<.01?'OK':'ÉCART '+money(r.reconciliation?.ecart)}</b> · moteur ventilation ${esc(r.moteurVentilation||'—')}</p>${orp.length?`<p class="warn">À classer : ${orp.map(k=>esc(k)+' ('+r.orphelines[k]+')').join(', ')}</p>`:''}</details></div>`;}

function budget(p,pos){const nom=mois(p),id='c37-'+pos;return `<article class="c37-month" id="${id}"><header><div><small>${pos===0?'M · AUJOURD’HUI → 27':'M+1 · 28 → 27 SUIVANT'}</small><h3>${esc(nom)}</h3></div><span>${new Date(p.periode.debut).toLocaleDateString('fr-FR')} → ${new Date(p.periode.fin).toLocaleDateString('fr-FR')}</span></header>${topo(p,pos)}${reequilibrage(p)}<div class="c37-actions"><button class="secondary-button" data-reset>Revenir à P0</button><button class="primary-button" data-save>Valider ${esc(nom)}</button></div><div class="c37-head"><span>Poste pilotable</span><span>P0</span><span>Allocation P1</span><span>Réel / engagé</span><span>Plan</span><span>Encore disponible</span></div><div class="c37-lines">${(p.enveloppes||[]).map((x,j)=>ligne(x,j)).join('')}</div>${secondaires(p)}</article>`;}

function recalculer(p,root,pos){let total=0,reste=0,dpt1=0,abs=0;root.querySelectorAll('.c37-line').forEach((row,j)=>{const x=p.enveloppes[j],range=row.querySelector('.c37-range'),amount=row.querySelector('.c37-amount'),val=Math.max(0,Number(amount.value||range.value||0)),reel=reelLigne(x),plan=Number(x.planifie||0),engage=reel+plan,rr=val-engage;x.prevu=val;x.resteV37=rr;x.engageV37=engage;x.dpt1=Math.max(val,engage);range.value=Math.min(Number(range.max),val);amount.value=val;total+=val;reste+=rr;dpt1+=x.dpt1;abs+=Math.max(0,rr);row.lastElementChild.textContent=money(rr);row.lastElementChild.classList.toggle('neg',rr<0);});
 p.budgetReparti=total;p.v37.ret1=reste;p.v37.dpt1=dpt1;p.v37.absorbableParAllocations=abs;p.v37.dt1=Number(p.v37.cft1||0)+dpt1+Number(p.v37.het1||0);p.v37.sct1=Number(p.v37.ss1||0)+Number(p.v37.rt1||0)-p.v37.dt1;p.v37.incompressible=p.v37.sct1<0?Math.max(0,Math.abs(p.v37.sct1)-abs):0;p.v37.rpt1=p.v37.sct1;
 const sc=root.querySelector('[data-sct1-card] b');if(sc)sc.textContent=money(p.v37.sct1);const ret=root.querySelector('[data-ret1-card] b');if(ret)ret.textContent=money(reste);const dp=root.querySelector('[data-dpt1-card] b');if(dp)dp.textContent=money(dpt1);const bal=root.querySelector('[data-balance]');if(bal){bal.querySelector('div:first-child b').textContent=money(p.v37.sct1);bal.querySelector('div:first-child b').classList.toggle('neg',p.v37.sct1<0);bal.querySelector('div:nth-child(2) b').textContent=money(abs);const sp=bal.querySelector('div:nth-child(2) span');if(sp)sp.innerHTML=p.v37.incompressible>0?`Part incompressible à ce stade : <strong>${money(p.v37.incompressible)}</strong>`:'';}
 if(pos===0&&data?.periodes?.[1]){const n=data.periodes[1],nr=$('c37-1');n.v37.ss1=p.v37.sct1;n.v37.soldeOuverture=p.v37.sct1;n.v37.sct1=Number(n.v37.ss1||0)+Number(n.v37.rt1||0)-Number(n.v37.cft1||0)-Number(n.v37.dpt1||0)-Number(n.v37.het1||0);n.v37.rpt1=n.v37.sct1;if(nr){const b=nr.querySelector('[data-sct1-card] b');if(b)b.textContent=money(n.v37.sct1);const bb=nr.querySelector('[data-balance] div:first-child b');if(bb)bb.textContent=money(n.v37.sct1);}}
}

function brancher(p,pos){const root=$('c37-'+pos);if(!root)return;root.querySelectorAll('.c37-line').forEach(row=>{const range=row.querySelector('.c37-range'),amount=row.querySelector('.c37-amount');range.oninput=()=>{amount.value=range.value;recalculer(p,root,pos)};amount.oninput=()=>recalculer(p,root,pos);row.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{amount.value=Math.max(0,Number(amount.value||0)+Number(b.dataset.d));recalculer(p,root,pos);});});root.querySelector('[data-save]').onclick=()=>{recalculer(p,root,pos);const postes=p.enveloppes.map(x=>({categorie:x.categorie,montant:Number(x.prevu||0)}));google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).withFailureHandler(e=>alert(e.message||e)).sauvegarderBudgetPeriodeCerbereV33({cle:p.clePilotage,postes});};root.querySelector('[data-reset]').onclick=()=>{if(confirm('Supprimer les ajustements locaux de '+mois(p)+' et revenir au P0 courant ?'))google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).reinitialiserBudgetPeriodeCerbereV33(p.clePilotage);};const j=root.querySelector('[data-joker]');if(j)j.onchange=()=>google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).withFailureHandler(e=>{alert(e.message||e);j.checked=!j.checked}).reglerJokerCerbereV37(p.clePilotage,j.checked);}
function ouvrirCanonDepuisBandeau(type){const fn=type==='p0'?window.ouvrirCanonDepensesCerbereUI:type==='r0'?window.ouvrirCanonRecettesCerbereUI:window.ouvrirCF0CerbereUI;if(typeof fn==='function')fn();else alert('Le module '+type.toUpperCase()+' n’est pas chargé.');}
function rendre(d){const z=$('cerbere-content');if(!z)return;const p=d.periodes||[],r=d.reel||{},cf=d.cf0||{};const cfMaster=cf.totalCourant!=null?cf.totalCourant:(cf.totalPondereCourant!=null?cf.totalPondereCourant:0);z.innerHTML=`<div class="c37-canons"><button class="c37-canon" data-open-canon="p0"><small>P0 · PILOTABLE MAÎTRE</small><b>${money(d.p0?.totaux?.monetaire)}</b><em>Configurer · historique réel</em></button><button class="c37-canon" data-open-canon="r0"><small>R0 · RECETTES MAÎTRE</small><b>${money(d.recettesCanon?.total)}</b><em>Configurer la référence</em></button><button class="c37-canon" data-open-canon="cf0"><small>CF0 · CHARGES FIXES MAÎTRE</small><b>${money(cfMaster)}</b><small>${Number(cf.nombreActives||0)} active(s) · référence</small><em>Voir / reparamétrer</em></button><span class="c37-canon-static"><small>SHBt1 · HELLO BANK</small><b>${r.soldeBancaire==null?'—':money(r.soldeBancaire)}</b></span><span class="c37-canon-static"><small>MOTEUR</small><b>${esc(d.version||'')}</b></span></div>${appreciation()}<div class="c37-window">${p[0]?budget(p[0],0):''}${p[1]?budget(p[1],1):''}</div>`;z.querySelectorAll('[data-open-canon]').forEach(b=>b.onclick=()=>ouvrirCanonDepuisBandeau(b.dataset.openCanon));if(p[0])brancher(p[0],0);if(p[1])brancher(p[1],1);}
window.chargerCerbereV2UI=function(){const z=$('cerbere-content');if(!z)return;const id=++req;z.innerHTML='<div class="cerb-progress"><strong>Connexion à Cerbère 3.7.6…</strong><small>Calcul de la capacité jusqu’au 27 et du rééquilibrage M/M+1.</small></div>';google.script.run.withSuccessHandler(d=>{if(id!==req)return;if(!d||d.ok===false){z.innerHTML='<div class="cerb-error">'+esc(d?.erreur||'Erreur Cerbère')+'</div>';return;}data=d;rendre(d);}).withFailureHandler(e=>z.innerHTML='<div class="cerb-error">'+esc(e.message||e)+'</div>').chargerCerbereV374();};
const st=document.createElement('style');st.textContent=`.c37-canons{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.c37-canon,.c37-canon-static{background:#edf7f3;border-radius:12px;padding:11px;text-align:left;box-sizing:border-box}.c37-canon{border:1px solid transparent;cursor:pointer;font:inherit}.c37-canon small,.c37-canon b,.c37-canon em,.c37-canon-static small,.c37-canon-static b{display:block}.c37-canon em{font-size:10px;font-style:normal;margin-top:4px}.c37-app{display:flex;justify-content:space-between;gap:16px;border-radius:14px;padding:14px 16px;margin:12px 0;background:#eef7f4}.c37-appnums{display:grid;grid-template-columns:1fr 1fr;gap:8px}.c37-appnums span{background:white;padding:8px;border-radius:8px;font-size:11px}.c37-appnums b{display:block;font-size:16px}.c37-window{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.c37-month{background:#fff;border:1px solid #dce8e3;border-radius:14px;padding:13px;min-width:0}.c37-month header{display:flex;justify-content:space-between;align-items:end}.c37-month h3{margin:2px 0;font-size:22px}.c37-topo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.c37-card{background:#f7faf9;border-radius:10px;padding:10px}.c37-card.hero{grid-column:1/-1;background:#edf7f3;border:1px solid #c9dfd7}.c37-card.warn{background:#fff4dd}.c37-card.ok{background:#eaf8f2}.c37-card span,.c37-card small,.c37-card b{display:block}.c37-card b{font-size:18px}.c37-balance{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:2px solid #c9dfd7;border-radius:12px;padding:10px;margin:10px 0;background:#fbfdfc}.c37-balance small,.c37-balance b,.c37-balance span{display:block}.c37-balance b{font-size:20px}.c37-joker{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px dashed #b9cbc4;border-radius:10px;margin:8px 0 12px}.c37-joker span{flex:1;font-size:12px}.c37-actions{display:flex;justify-content:flex-end;gap:8px;margin:10px 0}.c37-head,.c37-line{display:grid;grid-template-columns:1.35fr .7fr 1.55fr .8fr .65fr .8fr;gap:7px;align-items:center}.c37-head{font-size:10px;font-weight:800;color:#65746f;padding:7px}.c37-line{padding:8px 7px;border-top:1px solid #edf1ef;font-size:12px}.c37-slider{display:grid;grid-template-columns:auto 1fr auto;gap:4px;align-items:center}.c37-amount{grid-column:1/-1;width:100%;box-sizing:border-box;text-align:center;border:1px solid #d9e5e0;border-radius:7px;padding:4px}.c37-slider button{border:0;background:#edf7f3;border-radius:6px;padding:3px}.c37-bottom details{border-top:1px solid #edf1ef;padding:8px 0}.c37-bottom span{display:block;font-size:11px}.neg{color:#b42318;font-weight:800}.warn{color:#9a5b00}@media(max-width:1000px){.c37-window{grid-template-columns:1fr}.c37-canons{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.c37-topo,.c37-appnums,.c37-balance{grid-template-columns:1fr}.c37-head{display:none}.c37-line{grid-template-columns:1fr}.c37-app{display:block}}`;document.head.appendChild(st);
})();
</script>
