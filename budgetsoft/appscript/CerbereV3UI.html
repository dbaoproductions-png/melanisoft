<script>
(function(){'use strict';
const q=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
let req=0;

window.chargerCerbereV2UI=function(){
  const z=q('cerbere-content');if(!z)return;
  const id=++req;
  z.innerHTML='<div class="cerb-progress"><strong>Connexion à Cerbère V3…</strong><small>Lecture de P0, du Plan validé et du réel.</small></div>';
  google.script.run.withSuccessHandler(diag=>{
    if(id!==req)return;
    if(!diag||diag.ok===false){z.innerHTML=`<div class="cerb-error"><strong>Diagnostic Cerbère impossible</strong><small>${esc(diag?.erreur||'Réponse serveur vide')}</small></div>`;return;}
    z.innerHTML=`<div class="cerb-progress"><strong>Moteur ${esc(diag.version||'')}</strong><small>P0 ${diag.categories_p0||0} postes · ${diag.actions_executees||0}/${diag.actions_total||0} actions exécutables · calcul P1–P6…</small></div>`;
    google.script.run.withSuccessHandler(d=>{
      if(id!==req)return;
      if(!d){z.innerHTML='<div class="cerb-error"><strong>Réponse Cerbère vide</strong></div>';return;}
      if(d.ok===false){z.innerHTML=`<div class="cerb-error"><strong>Erreur pendant ${esc(d.stage||'le calcul')}</strong><small>${esc(d.erreur||'Erreur inconnue')}</small></div>`;return;}
      if(typeof window.rendreCerbere_==='function')window.rendreCerbere_(d);
      else rendreV3_(d);
      injectResumeV3_(d);
    }).withFailureHandler(e=>{if(id!==req)return;z.innerHTML=`<div class="cerb-error"><strong>Échec du calcul Cerbère V3</strong><small>${esc(e.message||e)}</small></div>`;}).chargerCerbereV3();
  }).withFailureHandler(e=>{if(id!==req)return;z.innerHTML=`<div class="cerb-error"><strong>Échec du diagnostic Cerbère V3</strong><small>${esc(e.message||e)}</small></div>`;}).diagnostiquerCerbereV3();
};

function rendreV3_(d){
  const z=q('cerbere-content');if(!z)return;
  z.innerHTML=`<div class="cerb-tabs">${(d.periodes||[]).map((p,i)=>`<button class="secondary-button ${i===0?'active':''}" data-v3p="${i}">P${i+1}</button>`).join('')}</div><div id="cerb-period"></div>`;
  const render=i=>{const p=d.periodes[i],c=q('cerb-period');if(!p||!c)return;c.innerHTML=`<div class="cards"><article class="card metric-card"><span>Héritage P0</span><strong>${money(p.heritageP0?.totalMonetaire)}</strong><small>${money(p.heritageP0?.totalPluxee)} Pluxee</small></article><article class="card metric-card"><span>Disponible restant</span><strong>${money(p.disponibleRestant)}</strong><small>${p.soldeReporte!=null?'Solde reporté '+money(p.soldeReporte):'Projection structurelle'}</small></article><article class="card metric-card"><span>État</span><strong>${p.etat==='rouge'?'🔴':p.etat==='orange'?'🟠':'🟢'} ${esc(p.etat)}</strong><small>${(p.plan?.actions||[]).length} action(s) appliquée(s)</small></article></div>`;};
  z.querySelectorAll('[data-v3p]').forEach(b=>b.onclick=()=>{z.querySelectorAll('[data-v3p]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(Number(b.dataset.v3p));});render(0);
}

function injectResumeV3_(d){
  const z=q('cerbere-content');if(!z)return;
  let rule=z.querySelector('.cerb-rule');
  const r=d.reel||{},p0=d.p0||{},diag=d.diagnostic||{};
  const html=`<div class="cerb-v3-summary"><div><small>P0 · BUDGET MAÎTRE</small><strong>${money(p0.totaux?.monetaire||0)} monétique + ${money(p0.totaux?.pluxee||0)} Pluxee</strong></div><div><small>SOLDE REPORTÉ P1</small><strong>${r.soldeBancaire==null?'Non disponible':money(r.soldeBancaire)}</strong><span>${r.soldeFiable?'✓ relevé bancaire':'⚠ non certifié'}</span></div><div><small>PLAN EXÉCUTÉ</small><strong>${diag.actions_executees||0} action(s)</strong><span>${diag.actions_total||0} au total</span></div></div>`;
  if(rule)rule.insertAdjacentHTML('afterend',html);else z.insertAdjacentHTML('afterbegin',html);
}

const st=document.createElement('style');st.textContent=`.cerb-v3-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 18px}.cerb-v3-summary>div{background:#edf7f3;border-radius:12px;padding:12px}.cerb-v3-summary small,.cerb-v3-summary span{display:block}.cerb-v3-summary small{font-weight:800;color:#147d64}.cerb-v3-summary strong{display:block;margin:4px 0;font-size:16px}@media(max-width:760px){.cerb-v3-summary{grid-template-columns:1fr}}`;document.head.appendChild(st);
})();
</script>
