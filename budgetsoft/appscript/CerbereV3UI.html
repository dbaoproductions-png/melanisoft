<script>
(function(){'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const mois=p=>{const d=new Date(p?.periode?.fin||p?.periode?.debut);return isNaN(d)?'P'+(p?.index||''):d.toLocaleDateString('fr-FR',{month:'long'}).replace(/^./,c=>c.toUpperCase());};let data=null,req=0;
function etat(){const p=data?.periodes||[],m=p[0],n=p[1];if(!m||!n)return{niveau:'vert',titre:'Lecture de la trajectoire',raisons:[],pm:0,pn:0,tm:0,tn:0};const pm=Number(m.resteBudgetPilotable||0),pn=Number(n.resteBudgetPilotable||0),tm=Number(m.capaciteTresorerie||0),tn=Number(n.capaciteTresorerie||0),rec=[m,n].every(x=>Math.abs(Number(x.roulant?.reconciliation?.ecart||0))<.01),orp=[m,n].reduce((s,x)=>s+Object.keys(x.roulant?.orphelines||{}).length,0);let niveau='vert',titre='Trajectoire pilotable saine sur deux mois';if(!rec){niveau='rouge';titre='Calcul incomplet : ventilation non réconciliée';}else if(tm<0||tn<0){niveau='rouge';titre='Risque de trésorerie sur la fenêtre roulante';}else if(pm<0||pn<0||orp){niveau='orange';titre='Vigilance sur les enveloppes pilotables';}const raisons=[];if(pm<0)raisons.push('M dépasse le pilotable de '+money(-pm));if(pn<0)raisons.push('M+1 dépasse déjà le pilotable de '+money(-pn));if(tm<0)raisons.push('trésorerie globale M : '+money(tm));if(tn<0)raisons.push('trésorerie globale M+1 : '+money(tn));if(Number(n.roulant?.cbHeritee||0)>0)raisons.push(money(n.roulant.cbHeritee)+' de CB pilotables déjà engagés sur M+1');if(Number(n.roulant?.horsPilotable?.total||0)>0)raisons.push(money(n.roulant.horsPilotable.total)+' hors enveloppes sur M+1');if(Number(n.engagementsPlanifies||0)>0)raisons.push(money(n.engagementsPlanifies)+' de Plan sur M+1');if(orp)raisons.push(orp+' catégorie(s) orpheline(s) à classer');if(!raisons.length)raisons.push('pilotable et trésorerie globale restent soutenables sur M et M+1');return{niveau,titre,raisons,pm,pn,tm,tn};}
function appreciation(){const f=etat();return `<section id="cr36-app" class="cr36-app cr36-${f.niveau}"><div><small>APPRÉCIATION GÉNÉRALE · 2 MOIS ROULANTS</small><h2 data-title>${esc(f.titre)}</h2><p data-reasons>${f.raisons.map(esc).join(' · ')}</p></div><div class="cr36-restes"><span>Reste pilotable M <b data-pm>${money(f.pm)}</b></span><span>Reste pilotable M+1 <b data-pn>${money(f.pn)}</b></span><span>Trésorerie M <b data-tm>${money(f.tm)}</b></span><span>Trésorerie M+1 <b data-tn>${money(f.tn)}</b></span></div></section>`;}
function topo(p,pos){const r=p.roulant||{},h=r.horsPilotable||{},delta=Number(p.budgetReparti||0)-Number(data.p0?.totaux?.monetaire||0);return `<div class="cr36-topo"><div><span>Budget pilotable</span><b data-budget>${money(p.budgetReparti)}</b><small data-delta>${Math.abs(delta)<.01?'conforme à P0':(delta>0?'+':'')+money(delta)+' vs P0'}</small></div><div><span>Réel pilotable non-CB</span><b>${money(r.reelNonCb)}</b></div><div><span>CB pilotable héritée de M−1</span><b>${money(r.cbHeritee)}</b></div><div><span>Plan pilotable</span><b>${money(p.planDansEnveloppes||0)}</b></div><div><span>Reste pilotable</span><b data-reste class="${Number(p.resteBudgetPilotable)<0?'neg':''}">${money(p.resteBudgetPilotable)}</b><small>Pn − réel pilotable − Plan</small></div><div><span>Trésorerie globale après réel + Plan</span><b data-tres class="${Number(p.capaciteTresorerie)<0?'neg':''}">${money(p.capaciteTresorerie)}</b></div><div><span>Hors enveloppes pilotables</span><b>${money(h.total)}</b><small>non-CB ${money(h.nonCb)} · CB ${money(h.cb)}</small></div><div><span>CF0 rapproché au réel</span><b>${money(r.chargesFixesReelles)}</b><small>${Number(r.nombreChargesFixesReelles||0)} opération(s)</small></div><div><span>Mouvements de trésorerie</span><b>${money(r.tresorerieNette)}</b><small>+ ${money(r.tresoreriePositive)} · − ${money(r.tresorerieNegative)}</small></div>${pos===0?`<div><span>CB pilotable déjà engagée pour M+1</span><b>${money(r.cbEngageePourSuivant)}</b><small>hors P0 en plus : ${money(r.cbEngageePourSuivantHorsP0)}</small></div>`:''}</div>`;}
function ligne(x,j){const reel=Number(x.reelImpute||0),plan=Number(x.planifie||0),reste=Number(x.prevu||0)-reel-plan,max=Math.max(200,Math.ceil(Math.max(Number(x.canon||0),Number(x.prevu||0),reel+plan)*2+200));return `<div class="cr36-line" data-j="${j}"><strong>${esc(x.categorie)}</strong><span>${money(x.canon)}</span><div class="cr36-slider"><button data-d="-10">−10</button><input type="range" min="0" max="${max}" step="1" value="${Number(x.prevu||0)}"><button data-d="10">+10</button><b>${money(x.prevu)}</b></div><span>${money(x.reelNonCb)}</span><span>${money(x.cbHeritee)}</span><span>${plan?money(plan):'—'}</span><span class="${reste<0?'neg':''}">${money(reste)}</span></div>`;}
function horsDetails(r){const h=r?.horsPilotable||{},cats=new Set([...Object.keys(h.nonCbParCategorie||{}),...Object.keys(h.cbParCategorie||{})]);if(!cats.size)return'';return `<details class="cr36-audit"><summary>Hors enveloppes pilotables · ${money(h.total)}</summary><div>${Array.from(cats).map(c=>`${esc(c)} : ${money(Number(h.nonCbParCategorie?.[c]||0)+Number(h.cbParCategorie?.[c]||0))}`).join(' · ')}</div></details>`;}
function budget(p,pos){const nom=mois(p),id='cr36-'+pos,r=p.roulant||{},orp=Object.keys(r.orphelines||{});const audit=`<details class="cr36-audit"><summary>Contrôles de cohérence</summary><div>Réconciliation : <b>${Math.abs(Number(r.reconciliation?.ecart||0))<.01?'OK':'ÉCART '+money(r.reconciliation?.ecart)}</b> · Santé nette : ${money(r.sante?.net||0)} · moteur ${esc(r.moteurVentilation||'—')}</div>${orp.length?`<div class="warn">Orphelines dans Divers : ${orp.map(k=>esc(k)+' ('+r.orphelines[k]+')').join(', ')}</div>`:''}</details>`;return `<article class="cr36-month" id="${id}"><header><div><small>${pos===0?'M · MOIS EN COURS':'M+1 · MOIS SUIVANT'}</small><h3>${esc(nom)}</h3></div><span>${new Date(p.periode.debut).toLocaleDateString('fr-FR')} → ${new Date(p.periode.fin).toLocaleDateString('fr-FR')}</span></header>${topo(p,pos)}${horsDetails(r)}${audit}<div class="cr36-actions"><button class="secondary-button" data-reset>Revenir à P0</button><button class="primary-button" data-save>Valider uniquement ${esc(nom)}</button></div><div class="cr36-head"><span>Poste pilotable</span><span>P0</span><span>Budget ${esc(nom)}</span><span>Réel non-CB</span><span>CB M−1</span><span>Plan</span><span>Reste</span></div><div class="cr36-lines">${(p.enveloppes||[]).map((x,j)=>ligne(x,j)).join('')}</div></article>`;}
function majApp(){const f=etat(),r=$('cr36-app');if(!r)return;r.className='cr36-app cr36-'+f.niveau;r.querySelector('[data-title]').textContent=f.titre;r.querySelector('[data-reasons]').textContent=f.raisons.join(' · ');['pm','pn','tm','tn'].forEach(k=>r.querySelector('[data-'+k+']').textContent=money(f[k]));}
function recalculer(p,root){let budget=0,reel=0,cb=0,plan=0;root.querySelectorAll('.cr36-line').forEach((row,j)=>{const x=p.enveloppes[j],inp=row.querySelector('input'),v=Number(inp.value||0);x.prevu=v;budget+=v;reel+=Number(x.reelNonCb||0);cb+=Number(x.cbHeritee||0);plan+=Number(x.planifie||0);row.querySelector('.cr36-slider b').textContent=money(v);const rr=v-Number(x.reelImpute||0)-Number(x.planifie||0);row.lastElementChild.textContent=money(rr);row.lastElementChild.classList.toggle('neg',rr<0);});p.budgetReparti=budget;p.resteBudgetPilotable=budget-reel-cb-plan;p.resteBudgetAlloue=p.resteBudgetPilotable;p.restePilotable=p.resteBudgetPilotable;const h=Number(p.roulant?.horsPilotable?.total||0);p.capaciteTresorerie=Number(p.budgetDisponible||0)-reel-cb-h-plan;p.capacitePilotable=p.capaciteTresorerie;root.querySelector('[data-budget]').textContent=money(budget);root.querySelector('[data-reste]').textContent=money(p.resteBudgetPilotable);root.querySelector('[data-reste]').classList.toggle('neg',p.resteBudgetPilotable<0);root.querySelector('[data-tres]').textContent=money(p.capaciteTresorerie);root.querySelector('[data-tres]').classList.toggle('neg',p.capaciteTresorerie<0);majApp();}
function brancher(p,pos){const root=$('cr36-'+pos);if(!root)return;const maj=()=>recalculer(p,root);root.querySelectorAll('.cr36-line').forEach(row=>{const inp=row.querySelector('input');inp.oninput=maj;row.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{inp.value=Math.max(0,Math.min(Number(inp.max),Number(inp.value)+Number(b.dataset.d)));maj();});});root.querySelector('[data-save]').onclick=()=>{maj();const postes=p.enveloppes.map(x=>({categorie:x.categorie,montant:Number(x.prevu||0)}));google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).withFailureHandler(e=>alert(e.message||e)).sauvegarderBudgetPeriodeCerbereV33({cle:p.clePilotage,postes});};root.querySelector('[data-reset]').onclick=()=>{if(confirm('Supprimer les ajustements locaux de '+mois(p)+' et réhériter du P0 courant ?'))google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).reinitialiserBudgetPeriodeCerbereV33(p.clePilotage);};}
function rendre(d){const z=$('cerbere-content');if(!z)return;const p=d.periodes||[],r=d.reel||{},cf=d.cf0||{};z.innerHTML=`<div class="cr36-canons"><span><small>P0 · PILOTABLE MAÎTRE</small><b>${money(d.p0?.totaux?.monetaire)}</b></span><span><small>R0 · RECETTES MAÎTRE</small><b>${money(d.recettesCanon?.total)}</b></span><span><small>CF0 · CHARGES FIXES</small><b>${money(cf.totalPondereCourant??cf.totalCourant)}</b><small>${Number(cf.nombreActives||0)} active(s) · synthèse</small></span><span><small>SOLDE ACTUEL</small><b>${r.soldeBancaire==null?'—':money(r.soldeBancaire)}</b></span><span><small>MOTEUR</small><b>${esc(d.version||'')}</b></span></div>${appreciation()}<div class="cr36-window">${p[0]?budget(p[0],0):''}${p[1]?budget(p[1],1):''}</div><details class="cr36-horizon"><summary>Voir l’horizon P3–P6</summary><div>${p.slice(2).map(x=>`<span><b>${esc(mois(x))}</b> · pilotable ${money(x.resteBudgetPilotable)} · trésorerie ${money(x.capaciteTresorerie)} · plan ${money(x.engagementsPlanifies)}</span>`).join('')}</div></details>`;if(p[0])brancher(p[0],0);if(p[1])brancher(p[1],1);}
window.chargerCerbereV2UI=function(){const z=$('cerbere-content');if(!z)return;const id=++req;z.innerHTML='<div class="cerb-progress"><strong>Connexion à Cerbère…</strong><small>Ventilation commune puis cockpit pilotable M / M+1.</small></div>';google.script.run.withSuccessHandler(d=>{if(id!==req)return;if(!d||d.ok===false){z.innerHTML='<div class="cerb-error">'+esc(d?.erreur||'Erreur Cerbère')+'</div>';return;}data=d;rendre(d);}).withFailureHandler(e=>z.innerHTML='<div class="cerb-error">'+esc(e.message||e)+'</div>').chargerCerbereRoulant();};
const st=document.createElement('style');st.textContent=`.cr36-canons{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.cr36-canons>span{background:#edf7f3;border-radius:12px;padding:11px}.cr36-canons small,.cr36-canons b{display:block}.cr36-canons small{color:#147d64;font-weight:800}.cr36-app{display:flex;justify-content:space-between;gap:18px;border-radius:15px;padding:16px 18px;margin:12px 0}.cr36-app h2{margin:3px 0 5px;font-size:20px}.cr36-app p{margin:0}.cr36-vert{background:#eaf8f2}.cr36-orange{background:#fff4dd}.cr36-rouge{background:#fdeaea}.cr36-restes{display:grid;grid-template-columns:1fr 1fr;gap:7px}.cr36-restes span{background:#fff;padding:7px 10px;border-radius:9px;font-size:10px}.cr36-restes b{display:block;font-size:14px}.cr36-window{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.cr36-month{background:#fff;border:1px solid #dce8e3;border-radius:14px;padding:13px;min-width:0}.cr36-month header{display:flex;justify-content:space-between;align-items:end}.cr36-month h3{margin:2px 0;font-size:22px}.cr36-topo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.cr36-topo>div{background:#f7faf9;border-radius:9px;padding:8px}.cr36-topo span,.cr36-topo small,.cr36-topo b{display:block}.cr36-topo span{font-size:11px}.cr36-topo b{font-size:16px}.cr36-topo small{font-size:10px;color:#667}.cr36-actions{display:flex;justify-content:flex-end;gap:7px;margin:9px 0}.cr36-head,.cr36-line{display:grid;grid-template-columns:1.2fr .62fr 1.5fr .7fr .65fr .58fr .7fr;gap:6px;align-items:center}.cr36-head{font-size:9px;font-weight:800;color:#667;padding:6px 4px}.cr36-line{border-top:1px solid #edf1ef;padding:7px 4px;font-size:10px}.cr36-slider{display:grid;grid-template-columns:28px 1fr 28px 55px;gap:3px;align-items:center}.cr36-slider button{padding:3px}.cr36-slider input{min-width:40px;width:100%}.cr36-slider b{text-align:right}.neg{color:#b42318!important}.warn{color:#9a6700!important}.cr36-audit,.cr36-horizon{margin-top:9px;background:#f7faf9;border-radius:10px;padding:9px}.cr36-audit summary,.cr36-horizon summary{font-weight:800;cursor:pointer}.cr36-audit div{padding-top:6px;font-size:10px}.cr36-horizon div{display:flex;gap:16px;flex-wrap:wrap;padding-top:8px}@media(max-width:1250px){.cr36-window{grid-template-columns:1fr}.cr36-canons{grid-template-columns:repeat(2,1fr)}}`;document.head.appendChild(st);
})();
</script>
