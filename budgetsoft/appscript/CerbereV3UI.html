<script>
(function(){'use strict';
const q=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const dateFR=d=>{const x=new Date(d);return isNaN(x)?'':x.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});};
const moisPeriode=p=>{const x=new Date(p?.periode?.fin||p?.periode?.debut);return isNaN(x)?'P'+(p?.index||''):x.toLocaleDateString('fr-FR',{month:'long'}).replace(/^./,c=>c.toUpperCase());};
let req=0, dataV33=null, periodeActive=0;

window.chargerCerbereV2UI=function(){const z=q('cerbere-content');if(!z)return;const id=++req;z.innerHTML='<div class="cerb-progress"><strong>Connexion à Cerbère…</strong><small>Lecture de P0, du Plan et du réel.</small></div>';google.script.run.withSuccessHandler(d=>{if(id!==req)return;if(!d||d.ok===false){z.innerHTML=`<div class="cerb-error"><strong>Échec Cerbère</strong><small>${esc(d?.erreur||'Réponse vide')}</small></div>`;return;}dataV33=d;rendreV33_(d);}).withFailureHandler(e=>{if(id!==req)return;z.innerHTML=`<div class="cerb-error"><strong>Échec du calcul Cerbère</strong><small>${esc(e.message||e)}</small></div>`;}).chargerCerbereV33();};

function barre_(postes){const a=(postes||[]).filter(x=>Number(x.prevu||0)+Number(x.pluxee||0)>0),t=a.reduce((s,x)=>s+Number(x.prevu||0)+Number(x.pluxee||0),0)||1;return `<div class="cerb-stack">${a.map((x,i)=>`<span class="s${i%10}" style="width:${((Number(x.prevu||0)+Number(x.pluxee||0))*100/t).toFixed(2)}%" title="${esc(x.categorie)} : ${money(Number(x.prevu||0)+Number(x.pluxee||0))}"></span>`).join('')}</div>`;}
function etatPeriode_(p){if(Number(p.resteAVentiler)<-.009)return ['🔴','budget suraffecté'];if(Number(p.depassementCategories)>.009)return ['🔴','dépassement prévu'];if(Number(p.resteAVentiler)>.009)return ['🟢','à ventiler'];return ['🟠','équilibré'];}
function audit_(p){const a=p.auditEnveloppe||{};if(!Object.keys(a).length)return'';const ajust=Number(a.ajustementsChargesFixes||0);return `<details class="v34-audit"><summary>D'où vient l'enveloppe de ${money(a.enveloppeDisponible)} ?</summary><div class="v34-grid"><span>Recettes de base</span><b>+ ${money(a.recettesBase)}</b><small>${esc(a.methodeRecettes||'')}</small><span>Recettes du Plan</span><b>+ ${money(a.recettesPlan)}</b><small>Actions et événements positifs</small><span>Charges fixes prévues</span><b>− ${money(a.chargesFixesApresPlan)}</b><small>${a.nbAjustementsFixes?`${a.nbAjustementsFixes} ajustement(s) · ${money(ajust)} évité(s)/reporté(s)`:''}</small><span>Épargne protégée</span><b>− ${money(a.epargne)}</b><small></small><span>Réserves objectifs</span><b>− ${money(a.reserveObjectifs)}</b><small></small><span>Plan sans catégorie</span><b>− ${money(a.depensesPlanSansCategorie)}</b><small></small><span class="v34-total">Enveloppe disponible</span><b class="v34-total">${money(a.enveloppeDisponible)}</b><small></small></div></details>`;}

function renderPeriode_(i){
  periodeActive=i;const p=dataV33.periodes[i],c=q('cerb-period');if(!p||!c)return;const nom=moisPeriode(p),reste=Number(p.resteAVentiler||0),etat=etatPeriode_(p);
  c.innerHTML=`<div class="cerb-period-head"><div><small>P${i+1} · ${dateFR(p.periode.debut)} → ${dateFR(p.periode.fin)}</small><h3>${esc(nom)}</h3></div><strong>${etat[0]} ${etat[1]}</strong></div>
  <div class="cards v331-cards">
    <article class="card metric-card"><span>Enveloppe disponible</span><strong>${money(p.budgetDisponible)}</strong><small>Après charges fixes, épargne et réserves</small></article>
    <article class="card metric-card"><span>Budget réparti</span><strong id="v33-reparti">${money(p.budgetReparti)}</strong><small>Allocation décidée pour ce mois</small></article>
    <article class="card metric-card"><span>Reste à ventiler</span><strong id="v33-reste" class="${reste<0?'neg':''}">${money(reste)}</strong><small>Disponible non encore affecté</small></article>
  </div>
  <div class="v331-reel"><span><b>Dépenses constatées dans les enveloppes :</b> ${money(p.depensesConstateesPilotables)}</span><span><b>Plan à venir catégorisé :</b> ${money(p.engagementsPlanifies)}</span><span class="${Number(p.depassementCategories)>0?'neg':''}"><b>Dépassements :</b> ${money(p.depassementCategories)}</span></div>
  ${audit_(p)}
  <section class="cerb-detail"><div class="v33-title"><h4>Budget de ${esc(nom)}</h4><div><button class="secondary-button" id="v33-reset">Revenir à P0</button><button class="primary-button" id="v33-save">Valider ${esc(nom)}</button></div></div>${barre_(p.enveloppes)}
    <div class="v33-head"><span>Catégorie</span><span>P0</span><span>Budget ${esc(nom)}</span><span>Dépensé</span><span>Plan à venir</span><span>Reste / dépassement</span></div>
    <div id="v33-lines">${(p.enveloppes||[]).map((x,j)=>ligne_(x,j)).join('')}</div>
  </section>
  <section class="cerb-detail"><h4>Plan intégré à la période</h4><small>Ces lignes expliquent les engagements du Plan. Les dépenses catégorisées sont déjà intégrées dans la colonne « Plan à venir » ci-dessus.</small>${plan_(p)}</section>`;
  brancherSliders_(p);
}

function ligne_(x,j){
  const min=0,max=Math.max(200,Math.ceil(Math.max(Number(x.canon||0),Number(x.prevu||0),Number(x.reel||0)+Number(x.planifie||0))*2+200));
  const reste=Number(x.prevu||0)-Number(x.reel||0)-Number(x.planifie||0),dep=-reste;
  return `<div class="v33-line" data-j="${j}"><strong>${esc(x.categorie)}</strong><span>${money(x.canon)}${Number(x.pluxee||0)?'<small> + '+money(x.pluxee)+' Pluxee</small>':''}</span><div class="v33-slider"><button data-d="-10">−10</button><input type="range" min="${min}" max="${max}" step="1" value="${Number(x.prevu||0)}"><button data-d="10">+10</button><b>${money(x.prevu)}</b></div><span>${money(x.reel)}</span><span>${Number(x.planifie||0)>0?money(x.planifie):'—'}</span><span class="v33-cat-rest ${reste<0?'neg':''}">${reste<0?'Dépassement '+money(dep):money(reste)}</span></div>`;
}

function brancherSliders_(p){
  const maj=()=>{
    let total=0,depassements=0;
    q('v33-lines').querySelectorAll('.v33-line').forEach((row,j)=>{
      const input=row.querySelector('input'),v=Number(input.value||0),x=p.enveloppes[j],charge=Number(x.reel||0)+Number(x.planifie||0),r=v-charge;
      x.prevu=v;x.reste=r;x.depassement=Math.max(0,-r);total+=v;depassements+=x.depassement;
      row.querySelector('.v33-slider b').textContent=money(v);
      const cell=row.querySelector('.v33-cat-rest');cell.textContent=r<0?'Dépassement '+money(-r):money(r);cell.classList.toggle('neg',r<0);
    });
    p.budgetReparti=total;p.resteAVentiler=Number(p.budgetDisponible||0)-total;p.depassementCategories=depassements;
    q('v33-reparti').textContent=money(total);q('v33-reste').textContent=money(p.resteAVentiler);q('v33-reste').classList.toggle('neg',p.resteAVentiler<-.009);
    q('v33-save').disabled=p.resteAVentiler<-.009;
  };
  q('v33-lines').querySelectorAll('.v33-line').forEach(row=>{const input=row.querySelector('input');input.oninput=maj;row.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{input.value=Math.max(Number(input.min),Math.min(Number(input.max),Number(input.value)+Number(b.dataset.d)));maj();});});
  q('v33-save').disabled=Number(p.resteAVentiler)<-.009;
  q('v33-save').onclick=()=>{const postes=p.enveloppes.map(x=>({categorie:x.categorie,montant:Number(x.prevu||0)}));q('v33-save').disabled=true;q('v33-save').textContent='Enregistrement…';google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).withFailureHandler(e=>{alert(e.message||e);q('v33-save').disabled=false;}).sauvegarderBudgetPeriodeCerbereV33({cle:p.clePilotage,postes});};
  q('v33-reset').onclick=()=>{if(!confirm('Revenir au budget P0 pour '+moisPeriode(p)+' ?'))return;google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).reinitialiserBudgetPeriodeCerbereV33(p.clePilotage);};
}

function plan_(p){const a=p.plan?.actions||[],e=p.plan?.evenements||[];if(!a.length&&!e.length)return '<div class="cerb-plan-list"><small>Aucune action ni événement sur cette période.</small></div>';return `<div class="cerb-plan-list">${a.map(x=>`<div><b>Action</b> ${esc(x.libelle||x.nom||'')} ${x.categorie?'<em>'+esc(x.categorie)+'</em> ':''}<strong>${money(x.impact_montant)}</strong></div>`).join('')}${e.map(x=>`<div><b>Événement</b> ${esc(x.libelle||'')} ${x.categorie?'<em>'+esc(x.categorie)+'</em> ':''}<strong>${x.type==='depense'?'-':'+'}${money(Math.abs(Number(x.montant||0)))}</strong></div>`).join('')}</div>`;}

function rendreV33_(d){const z=q('cerbere-content'),diag=d.diagnostic||{},r=d.reel||{},p0=d.p0||{};z.innerHTML=`<div class="cerb-v3-summary"><div><small>P0 · BUDGET MAÎTRE</small><strong>${money(p0.totaux?.monetaire)} monétique + ${money(p0.totaux?.pluxee)} Pluxee</strong></div><div><small>SOLDE REPORTÉ</small><strong>${r.soldeBancaire==null?'Non disponible':money(r.soldeBancaire)}</strong><span>${r.soldeFiable?'✓ relevé bancaire':'⚠ non certifié'}</span></div><div><small>MOTEUR</small><strong>${esc(d.version||'')}</strong><span>${diag.duree_ms||0} ms</span></div></div><div class="cerb-tabs">${(d.periodes||[]).map((p,i)=>`<button class="secondary-button ${i===0?'active':''}" data-v33p="${i}">${esc(moisPeriode(p))}</button>`).join('')}</div><div id="cerb-period"></div>`;z.querySelectorAll('[data-v33p]').forEach(b=>b.onclick=()=>{z.querySelectorAll('[data-v33p]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderPeriode_(Number(b.dataset.v33p));});renderPeriode_(0);}

const st=document.createElement('style');st.textContent=`.cerb-v3-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 18px}.cerb-v3-summary>div{background:#edf7f3;border-radius:12px;padding:12px}.cerb-v3-summary small,.cerb-v3-summary span{display:block}.cerb-v3-summary small{font-weight:800;color:#147d64}.cerb-v3-summary strong{display:block;margin:4px 0}.cerb-period-head,.v33-title{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}.v33-title h4{margin:0}.v33-title div{display:flex;gap:8px}.cerb-detail{background:#fff;border:1px solid #dce8e3;border-radius:14px;padding:14px;margin-top:12px}.v34-audit{margin:10px 0;background:#fbfdfc;border:1px solid #dce8e3;border-radius:12px;padding:8px 12px}.v34-audit summary{cursor:pointer;font-weight:800;color:#147d64}.v34-grid{display:grid;grid-template-columns:1.4fr .7fr 1.6fr;gap:7px 12px;padding:10px 2px 4px;font-size:12px}.v34-grid b{text-align:right}.v34-grid small{color:#667}.v34-total{border-top:1px solid #dce8e3;padding-top:7px;font-weight:900}.cerb-stack{display:flex;height:22px;border-radius:8px;overflow:hidden;background:#edf2f0;margin:8px 0 12px}.cerb-stack span{min-width:2px}.cerb-stack .s0{background:#147d64}.cerb-stack .s1{background:#25b99a}.cerb-stack .s2{background:#91c93d}.cerb-stack .s3{background:#efbd16}.cerb-stack .s4{background:#f08b2e}.cerb-stack .s5{background:#8f68d8}.cerb-stack .s6{background:#18a8c4}.cerb-stack .s7{background:#6f7e91}.cerb-stack .s8{background:#b55d91}.cerb-stack .s9{background:#3d9a78}.v331-reel{display:flex;flex-wrap:wrap;gap:18px;background:#f7faf9;border:1px solid #e2ebe7;border-radius:10px;padding:9px 12px;margin:8px 0 2px;font-size:12px}.v33-head,.v33-line{display:grid;grid-template-columns:1.05fr .65fr 1.7fr .62fr .62fr .9fr;gap:10px;align-items:center;padding:8px 4px}.v33-head{font-size:11px;font-weight:800;color:#557}.v33-line{border-top:1px solid #edf2f0;font-size:12px}.v33-line small{display:block}.v33-slider{display:grid;grid-template-columns:auto 1fr auto 80px;gap:6px;align-items:center}.v33-slider button{padding:4px 7px}.v33-slider input{width:100%}.v33-slider b{text-align:right}.neg{color:#b42318!important;font-weight:800}.cerb-plan-list{margin-top:8px}.cerb-plan-list>div{padding:7px 0;border-top:1px solid #edf2f0}.cerb-plan-list b{color:#147d64;margin-right:6px}.cerb-plan-list em{font-style:normal;background:#edf7f3;border-radius:999px;padding:2px 6px;margin-right:6px;font-size:11px}@media(max-width:1050px){.v33-head{display:none}.v33-line{grid-template-columns:1fr}.v33-slider{grid-template-columns:auto 1fr auto 80px}.v34-grid{grid-template-columns:1fr auto}.v34-grid small{grid-column:1/-1}}@media(max-width:900px){.cerb-v3-summary{grid-template-columns:1fr}}`;document.head.appendChild(st);
})();
</script>
