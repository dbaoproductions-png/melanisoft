<script>
(function(){'use strict';
const q=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const dateFR=d=>{const x=new Date(d);return isNaN(x)?'':x.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});};
const moisPeriode=p=>{const x=new Date(p?.periode?.fin||p?.periode?.debut);return isNaN(x)?'P'+(p?.index||''):x.toLocaleDateString('fr-FR',{month:'long'}).replace(/^./,c=>c.toUpperCase());};
let req=0, dataV33=null, periodeActive=0;

window.chargerCerbereV2UI=function(){const z=q('cerbere-content');if(!z)return;const id=++req;z.innerHTML='<div class="cerb-progress"><strong>Connexion à Cerbère…</strong><small>Lecture de P0, du Plan et du réel.</small></div>';google.script.run.withSuccessHandler(d=>{if(id!==req)return;if(!d||d.ok===false){z.innerHTML=`<div class="cerb-error"><strong>Échec Cerbère</strong><small>${esc(d?.erreur||'Réponse vide')}</small></div>`;return;}dataV33=d;rendreV33_(d);}).withFailureHandler(e=>{if(id!==req)return;z.innerHTML=`<div class="cerb-error"><strong>Échec du calcul Cerbère</strong><small>${esc(e.message||e)}</small></div>`;}).chargerCerbereV33();};

function barre_(postes){const a=(postes||[]).filter(x=>Number(x.prevu||0)+Number(x.pluxee||0)>0),t=a.reduce((s,x)=>s+Number(x.prevu||0)+Number(x.pluxee||0),0)||1;return `<div class="cerb-stack">${a.map((x,i)=>`<span class="s${i%10}" style="width:${((Number(x.prevu||0)+Number(x.pluxee||0))*100/t).toFixed(2)}%" title="${esc(x.categorie)} : ${money(Number(x.prevu||0)+Number(x.pluxee||0))}"></span>`).join('')}</div>`;}
function renderPeriode_(i){periodeActive=i;const p=dataV33.periodes[i],c=q('cerb-period');if(!p||!c)return;const nom=moisPeriode(p),reste=Number(p.resteAVentiler||0);c.innerHTML=`<div class="cerb-period-head"><div><small>P${i+1} · ${dateFR(p.periode.debut)} → ${dateFR(p.periode.fin)}</small><h3>${esc(nom)}</h3></div><strong>${reste<-.009?'🔴':reste<.01?'🟠':'🟢'} ${reste<-.009?'à équilibrer':reste>.009?'à ventiler':'équilibré'}</strong></div><div class="cards"><article class="card metric-card"><span>Argent disponible pour la période</span><strong>${money(p.budgetDisponible)}</strong><small>Après charges fixes, épargne et Plan</small></article><article class="card metric-card"><span>Budget actuellement réparti</span><strong id="v33-reparti">${money(p.budgetReparti)}</strong><small>P0 hérité puis ajusté pour ce mois</small></article><article class="card metric-card"><span>Reste à répartir</span><strong id="v33-reste" class="${reste<0?'neg':''}">${money(reste)}</strong><small>Doit être ≥ 0 pour valider</small></article></div><section class="cerb-detail"><div class="v33-title"><h4>Budget de ${esc(nom)}</h4><div><button class="secondary-button" id="v33-reset">Revenir à P0</button><button class="primary-button" id="v33-save">Valider ${esc(nom)}</button></div></div>${barre_(p.enveloppes)}<div class="v33-head"><span>Catégorie</span><span>P0</span><span>Budget ${esc(nom)}</span><span>Dépensé</span><span>Reste</span></div><div id="v33-lines">${(p.enveloppes||[]).map((x,j)=>ligne_(x,j)).join('')}</div></section><section class="cerb-detail"><h4>Plan intégré à la période</h4>${plan_(p)}</section>`;brancherSliders_(p);};
function ligne_(x,j){const min=Math.max(0,Math.ceil(Number(x.reel||0))),max=Math.max(min+100,Math.ceil(Math.max(Number(x.canon||0),Number(x.prevu||0))*2+200));return `<div class="v33-line" data-j="${j}"><strong>${esc(x.categorie)}</strong><span>${money(x.canon)}${Number(x.pluxee||0)?'<small> + '+money(x.pluxee)+' Pluxee</small>':''}</span><div class="v33-slider"><button data-d="-10">−10</button><input type="range" min="${min}" max="${max}" step="1" value="${Number(x.prevu||0)}"><button data-d="10">+10</button><b>${money(x.prevu)}</b></div><span>${money(x.reel)}</span><span class="v33-cat-rest">${money(Number(x.prevu||0)-Number(x.reel||0))}</span></div>`;}
function brancherSliders_(p){const maj=()=>{let total=0;q('v33-lines').querySelectorAll('.v33-line').forEach((row,j)=>{const input=row.querySelector('input'),v=Number(input.value||0),x=p.enveloppes[j];x.prevu=v;total+=v;row.querySelector('.v33-slider b').textContent=money(v);row.querySelector('.v33-cat-rest').textContent=money(v-Number(x.reel||0));});p.budgetReparti=total;p.resteAVentiler=Number(p.budgetDisponible||0)-total;q('v33-reparti').textContent=money(total);q('v33-reste').textContent=money(p.resteAVentiler);q('v33-reste').classList.toggle('neg',p.resteAVentiler<-.009);q('v33-save').disabled=p.resteAVentiler<-.009;};q('v33-lines').querySelectorAll('.v33-line').forEach(row=>{const input=row.querySelector('input');input.oninput=maj;row.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{input.value=Math.max(Number(input.min),Math.min(Number(input.max),Number(input.value)+Number(b.dataset.d)));maj();});});q('v33-save').disabled=Number(p.resteAVentiler)<-.009;q('v33-save').onclick=()=>{const postes=p.enveloppes.map(x=>({categorie:x.categorie,montant:Number(x.prevu||0)}));q('v33-save').disabled=true;q('v33-save').textContent='Enregistrement…';google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).withFailureHandler(e=>{alert(e.message||e);q('v33-save').disabled=false;}).sauvegarderBudgetPeriodeCerbereV33({cle:p.clePilotage,postes});};q('v33-reset').onclick=()=>{if(!confirm('Revenir au budget P0 pour '+moisPeriode(p)+' ?'))return;google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).reinitialiserBudgetPeriodeCerbereV33(p.clePilotage);};}
function plan_(p){const a=p.plan?.actions||[],e=p.plan?.evenements||[];if(!a.length&&!e.length)return '<small>Aucune action ni événement sur cette période.</small>';return `<div class="cerb-plan-list">${a.map(x=>`<div><b>Action</b> ${esc(x.libelle||x.nom||'')} <strong>${money(x.impact_montant)}</strong></div>`).join('')}${e.map(x=>`<div><b>Événement</b> ${esc(x.libelle||'')} <strong>${x.type==='depense'?'-':'+'}${money(Math.abs(Number(x.montant||0)))}</strong></div>`).join('')}</div>`;}
function rendreV33_(d){const z=q('cerbere-content'),diag=d.diagnostic||{},r=d.reel||{},p0=d.p0||{};z.innerHTML=`<div class="cerb-v3-summary"><div><small>P0 · BUDGET MAÎTRE</small><strong>${money(p0.totaux?.monetaire)} monétique + ${money(p0.totaux?.pluxee)} Pluxee</strong></div><div><small>SOLDE REPORTÉ</small><strong>${r.soldeBancaire==null?'Non disponible':money(r.soldeBancaire)}</strong><span>${r.soldeFiable?'✓ relevé bancaire':'⚠ non certifié'}</span></div><div><small>MOTEUR</small><strong>${esc(d.version||'')}</strong><span>${diag.duree_ms||0} ms</span></div></div><div class="cerb-tabs">${(d.periodes||[]).map((p,i)=>`<button class="secondary-button ${i===0?'active':''}" data-v33p="${i}">${esc(moisPeriode(p))}</button>`).join('')}</div><div id="cerb-period"></div>`;z.querySelectorAll('[data-v33p]').forEach(b=>b.onclick=()=>{z.querySelectorAll('[data-v33p]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderPeriode_(Number(b.dataset.v33p));});renderPeriode_(0);}
const st=document.createElement('style');st.textContent=`.cerb-v3-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 18px}.cerb-v3-summary>div{background:#edf7f3;border-radius:12px;padding:12px}.cerb-v3-summary small,.cerb-v3-summary span{display:block}.cerb-v3-summary small{font-weight:800;color:#147d64}.cerb-v3-summary strong{display:block;margin:4px 0}.cerb-period-head,.v33-title{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}.v33-title h4{margin:0}.v33-title div{display:flex;gap:8px}.cerb-detail{background:#fff;border:1px solid #dce8e3;border-radius:14px;padding:14px;margin-top:12px}.cerb-stack{display:flex;height:22px;border-radius:8px;overflow:hidden;background:#edf2f0;margin:8px 0 12px}.cerb-stack span{min-width:2px}.cerb-stack .s0{background:#147d64}.cerb-stack .s1{background:#25b99a}.cerb-stack .s2{background:#91c93d}.cerb-stack .s3{background:#efbd16}.cerb-stack .s4{background:#f08b2e}.cerb-stack .s5{background:#8f68d8}.cerb-stack .s6{background:#18a8c4}.cerb-stack .s7{background:#6f7e91}.cerb-stack .s8{background:#b55d91}.cerb-stack .s9{background:#3d9a78}.v33-head,.v33-line{display:grid;grid-template-columns:1.25fr .75fr 2fr .7fr .7fr;gap:10px;align-items:center;padding:8px 4px}.v33-head{font-size:11px;font-weight:800;color:#557}.v33-line{border-top:1px solid #edf2f0;font-size:12px}.v33-line small{display:block}.v33-slider{display:grid;grid-template-columns:auto 1fr auto 80px;gap:6px;align-items:center}.v33-slider button{padding:4px 7px}.v33-slider input{width:100%}.v33-slider b{text-align:right}.neg{color:#b42318!important}.cerb-plan-list>div{padding:7px 0;border-top:1px solid #edf2f0}.cerb-plan-list b{color:#147d64;margin-right:6px}@media(max-width:900px){.cerb-v3-summary{grid-template-columns:1fr}.v33-head{display:none}.v33-line{grid-template-columns:1fr}.v33-slider{grid-template-columns:auto 1fr auto 80px}}`;document.head.appendChild(st);
})();
</script>
