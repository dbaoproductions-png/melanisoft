<script>
(function(){'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const mois=p=>{const d=new Date(p?.periode?.fin||p?.periode?.debut);return isNaN(d)?'P'+(p?.index||''):d.toLocaleDateString('fr-FR',{month:'long'}).replace(/^./,c=>c.toUpperCase());};let data=null,req=0;
function appreciation(){const f=data?.fenetreRoulante||{niveau:'vert',titre:'Lecture du court terme',raisons:[]};return `<section class="c37-app c37-${esc(f.niveau)}"><div><small>APPRÉCIATION GÉNÉRALE · PRÉSENT + FUTUR PROCHE</small><h2>${esc(f.titre)}</h2><p>${(f.raisons||[]).map(esc).join(' · ')}</p></div><div class="c37-appnums"><span>Reliquat pilotable M<b>${money(f.disponibleM)}</b></span><span>SCt1 M+1<b>${money(f.capaciteM1)}</b></span></div></section>`;}
function infoCard(label,value,small,cls,attr){return `<div class="c37-card ${cls||''}" ${attr||''}><span>${esc(label)}</span><b>${value}</b>${small?`<small>${small}</small>`:''}</div>`;}
function topo(p,pos){
  const v=p.v37||{},r=p.roulant||{},j=v.joker||{};
  const principal=infoCard(pos===0?'Reste pilotable à l’instant t':'Reste pilotable projeté',money(p.resteBudgetPilotable),'RPt1 = P1 − dépenses pilotables déjà consommées / engagées','hero','data-rpt1-card');
  const sc=infoCard('Trajectoire Cerbère fin de cycle · SCt1',money(v.sct1),`SS1 ${money(v.ss1)} + Rt1 ${money(v.rt1)} − CFt1 ${money(v.cft1)} − DPt1 ${money(v.dpt1)}`,Number(v.sct1||0)<0?'warn':'ok','data-sct1-card');
  const ss=infoCard('SS1 · solde significatif',money(v.ss1),`${esc(v.ss1Statut||'')} · frontière 27/28`,'','data-ss1-card');
  const rt=infoCard('Rt1 · recettes réévaluées',money(v.rt1),'réel quand constaté · sinon prévision R1 + événements connus');
  const cf=infoCard('CFt1 · charges fixes réévaluées',money(v.cft1),`${money(v.chargesFixesTotal)} prévu · réel remplace le prévu quand rapproché`);
  const dp=infoCard('DPt1 · pilotable réévalué',money(v.dpt1),'réel/engagé pour le connu · P1 pour le futur restant','', 'data-dpt1-card');
  const cb=pos===1&&Number(r.cbHeritee||0)>0?infoCard('CB de M déjà engagées',money(r.cbHeritee),'hors charges fixes · imputées sur M+1'):'';
  return `<div class="c37-topo">${principal}${sc}${ss}${rt}${cf}${dp}${cb}</div><div class="c37-joker ${j.actif?'on':''}"><label><input type="checkbox" data-joker ${j.actif?'checked':''}> <b>Joker P0</b></label><span>${esc(j.raison||'')}</span>${j.automatique?'<small>Activation automatique</small>':''}</div>`;
}
function reelLigne(x){return Number(x.reelNetPrevisionnel!=null?x.reelNetPrevisionnel:(x.reelImpute||0));}
function ligne(x,j){const reel=reelLigne(x),plan=Number(x.planifie||0),reste=Number(x.resteV37!=null?x.resteV37:(Number(x.prevu||0)-reel-plan)),max=Math.max(200,Math.ceil(Math.max(Number(x.canon||0),Number(x.prevu||0),reel+plan)*2+300));return `<div class="c37-line" data-j="${j}"><strong>${esc(x.categorie)}</strong><span>${money(x.canon)}</span><div class="c37-slider"><button data-d="-10">−10</button><input class="c37-range" type="range" min="0" max="${max}" step="1" value="${Number(x.prevu||0)}"><button data-d="10">+10</button><input class="c37-amount" type="number" min="0" step="1" value="${Number(x.prevu||0)}" aria-label="Allocation ${esc(x.categorie)}"></div><span>${money(reel)}${Number(x.remboursementsAttendus||0)>0?`<small>après ${money(x.remboursementsAttendus)} attendu(s)</small>`:''}</span><span>${plan?money(plan):'—'}</span><span class="${reste<0?'neg':''}">${money(reste)}</span></div>`;}
function secondaires(p){const r=p.roulant||{},h=r.horsPilotable||{},orp=Object.keys(r.orphelines||{}),v=p.v37||{},ec=Number(v.ecartHelloCerbere||0);return `<div class="c37-bottom"><details><summary>Contrôle SHBt1 / solde Cerbère</summary><p>SHBt1 Hello bank : <b>${v.shbt1==null?'—':money(v.shbt1)}</b> · Solde Cerbère présent : <b>${v.scPresent==null?'—':money(v.scPresent)}</b> · Écart : <b class="${Math.abs(ec)>.01?'warn':''}">${v.ecartHelloCerbere==null?'—':money(ec)}</b></p><small>${v.ss1Valide?'SS1 validé : l’écart est un vrai contrôle de cohérence.':'SS1 reconstitué : le contrôle sert d’abord à préparer la validation de la frontière 27/28.'}</small></details><details><summary>Hors enveloppes pilotables · ${money(h.total||0)}</summary><p>Ces lignes doivent être explicables : charge fixe, catégorie à reclasser dans P1/Divers ou flux bancaire de frontière.</p><p>Non-CB ${money(h.nonCb||0)} · CB ${money(h.cb||0)}</p>${Object.keys(h.nonCbParCategorie||{}).map(c=>`<span>${esc(c)} : ${money(h.nonCbParCategorie[c])}</span>`).join('')}${Object.keys(h.cbParCategorie||{}).map(c=>`<span>${esc(c)} : ${money(h.cbParCategorie[c])} (CB)</span>`).join('')}</details><details><summary>Contrôles de cohérence</summary><p>Réconciliation moteur : <b>${Math.abs(Number(r.reconciliation?.ecart||0))<.01?'OK':'ÉCART '+money(r.reconciliation?.ecart)}</b> · moteur ventilation ${esc(r.moteurVentilation||'—')}</p>${orp.length?`<p class="warn">À classer : ${orp.map(k=>esc(k)+' ('+r.orphelines[k]+')').join(', ')}</p>`:''}</details></div>`;}
function budget(p,pos){const nom=mois(p),id='c37-'+pos;return `<article class="c37-month" id="${id}"><header><div><small>${pos===0?'M · AUJOURD’HUI → 27':'M+1 · 28 → 27 SUIVANT'}</small><h3>${esc(nom)}</h3></div><span>${new Date(p.periode.debut).toLocaleDateString('fr-FR')} → ${new Date(p.periode.fin).toLocaleDateString('fr-FR')}</span></header>${topo(p,pos)}<div class="c37-actions"><button class="secondary-button" data-reset>Revenir à P0</button><button class="primary-button" data-save>Valider ${esc(nom)}</button></div><div class="c37-head"><span>Poste pilotable</span><span>P0</span><span>Allocation P1</span><span>Réel / engagé</span><span>Plan</span><span>Encore disponible</span></div><div class="c37-lines">${(p.enveloppes||[]).map((x,j)=>ligne(x,j)).join('')}</div>${secondaires(p)}</article>`;}
function recalculer(p,root){
  let total=0,reste=0,dpt1=0;
  root.querySelectorAll('.c37-line').forEach((row,j)=>{
    const x=p.enveloppes[j],range=row.querySelector('.c37-range'),amount=row.querySelector('.c37-amount'),v=Number(amount.value||range.value||0),reel=reelLigne(x),plan=Number(x.planifie||0),engage=reel+plan,rr=v-engage;
    x.prevu=v;x.resteV37=rr;x.engageV37=engage;x.dpt1=Math.max(v,engage);
    range.value=Math.min(Number(range.max),Math.max(0,v));amount.value=v;total+=v;reste+=rr;dpt1+=x.dpt1;
    row.lastElementChild.textContent=money(rr);row.lastElementChild.classList.toggle('neg',rr<0);
  });
  p.budgetReparti=total;p.resteBudgetPilotable=reste;
  p.v37.dpt1=dpt1;p.v37.dt1=Number(p.v37.cft1||0)+dpt1;p.v37.sct1=Number(p.v37.ss1||0)+Number(p.v37.rt1||0)-p.v37.dt1;
  const rpt=root.querySelector('[data-rpt1-card] b');if(rpt)rpt.textContent=money(reste);
  const dp=root.querySelector('[data-dpt1-card] b');if(dp)dp.textContent=money(dpt1);
  const sc=root.querySelector('[data-sct1-card]');if(sc){sc.querySelector('b').textContent=money(p.v37.sct1);sc.classList.toggle('warn',p.v37.sct1<0);sc.classList.toggle('ok',p.v37.sct1>=0);sc.querySelector('small').textContent=`SS1 ${money(p.v37.ss1)} + Rt1 ${money(p.v37.rt1)} − CFt1 ${money(p.v37.cft1)} − DPt1 ${money(dpt1)}`;}
}
function brancher(p,pos){const root=$('c37-'+pos);if(!root)return;root.querySelectorAll('.c37-line').forEach(row=>{const range=row.querySelector('.c37-range'),amount=row.querySelector('.c37-amount');range.oninput=()=>{amount.value=range.value;recalculer(p,root)};amount.oninput=()=>recalculer(p,root);row.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{amount.value=Math.max(0,Number(amount.value||0)+Number(b.dataset.d));recalculer(p,root);});});root.querySelector('[data-save]').onclick=()=>{recalculer(p,root);const postes=p.enveloppes.map(x=>({categorie:x.categorie,montant:Number(x.prevu||0)}));google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).withFailureHandler(e=>alert(e.message||e)).sauvegarderBudgetPeriodeCerbereV33({cle:p.clePilotage,postes});};root.querySelector('[data-reset]').onclick=()=>{if(confirm('Supprimer les ajustements locaux de '+mois(p)+' et revenir au P0 courant ?'))google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).reinitialiserBudgetPeriodeCerbereV33(p.clePilotage);};const j=root.querySelector('[data-joker]');if(j)j.onchange=()=>google.script.run.withSuccessHandler(d=>{data=d;rendre(d)}).withFailureHandler(e=>{alert(e.message||e);j.checked=!j.checked}).reglerJokerCerbereV37(p.clePilotage,j.checked);}
function ouvrirCanonDepuisBandeau(type){const fn=type==='p0'?window.ouvrirCanonDepensesCerbereUI:type==='r0'?window.ouvrirCanonRecettesCerbereUI:window.ouvrirCF0CerbereUI;if(typeof fn==='function')fn();else alert('Le module de paramétrage '+type.toUpperCase()+' n’est pas chargé.')}
function rendre(d){const z=$('cerbere-content');if(!z)return;const p=d.periodes||[],r=d.reel||{},cf=d.cf0||{};const cfMaster=cf.totalCourant!=null?cf.totalCourant:(cf.totalPondereCourant!=null?cf.totalPondereCourant:0);z.innerHTML=`<div class="c37-canons"><button class="c37-canon" data-open-canon="p0"><small>P0 · PILOTABLE MAÎTRE</small><b>${money(d.p0?.totaux?.monetaire)}</b><em>Configurer · historique réel</em></button><button class="c37-canon" data-open-canon="r0"><small>R0 · RECETTES MAÎTRE</small><b>${money(d.recettesCanon?.total)}</b><em>Configurer la référence</em></button><button class="c37-canon" data-open-canon="cf0"><small>CF0 · CHARGES FIXES MAÎTRE</small><b>${money(cfMaster)}</b><small>${Number(cf.nombreActives||0)} active(s) · référence</small><em>Voir / reparamétrer</em></button><span class="c37-canon-static"><small>SHBt1 · HELLO BANK</small><b>${r.soldeBancaire==null?'—':money(r.soldeBancaire)}</b></span><span class="c37-canon-static"><small>MOTEUR</small><b>${esc(d.version||'')}</b></span></div>${appreciation()}<div class="c37-window">${p[0]?budget(p[0],0):''}${p[1]?budget(p[1],1):''}</div><details class="c37-horizon"><summary>Voir l’horizon P3–P6</summary><div>${p.slice(2).map(x=>`<span><b>${esc(mois(x))}</b> · SS1 ${money(x.v37?.ss1)} · SCt1 ${money(x.v37?.sct1)}</span>`).join('')}</div></details>`;z.querySelectorAll('[data-open-canon]').forEach(b=>b.onclick=()=>ouvrirCanonDepuisBandeau(b.dataset.openCanon));if(p[0])brancher(p[0],0);if(p[1])brancher(p[1],1);}
window.chargerCerbereV2UI=function(){const z=$('cerbere-content');if(!z)return;const id=++req;z.innerHTML='<div class="cerb-progress"><strong>Connexion à Cerbère 3.7…</strong><small>Calcul de P1, RPt1, SS1, Rt1, CFt1 et SCt1.</small></div>';google.script.run.withSuccessHandler(d=>{if(id!==req)return;if(!d||d.ok===false){z.innerHTML='<div class="cerb-error">'+esc(d?.erreur||'Erreur Cerbère')+'</div>';return;}data=d;rendre(d);}).withFailureHandler(e=>z.innerHTML='<div class="cerb-error">'+esc(e.message||e)+'</div>').chargerCerbereV37();};
const st=document.createElement('style');st.textContent=`.c37-canons{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.c37-canon,.c37-canon-static{background:#edf7f3;border-radius:12px;padding:11px;text-align:left;box-sizing:border-box}.c37-canon{border:1px solid transparent;cursor:pointer;font:inherit}.c37-canon:hover{border-color:#147d64;box-shadow:0 2px 8px rgba(20,125,100,.12)}.c37-canon small,.c37-canon b,.c37-canon em,.c37-canon-static small,.c37-canon-static b{display:block}.c37-canon small,.c37-canon-static small{color:#147d64;font-weight:800}.c37-canon em{font-size:10px;font-style:normal;color:#60716b;margin-top:5px}.c37-app{display:flex;justify-content:space-between;gap:18px;border-radius:15px;padding:16px 18px;margin:12px 0}.c37-app h2{margin:3px 0 5px;font-size:20px}.c37-app p{margin:0}.c37-vert{background:#eaf8f2}.c37-orange{background:#fff4dd}.c37-rouge{background:#fdeaea}.c37-appnums{display:grid;grid-template-columns:1fr 1fr;gap:8px}.c37-appnums span{background:#fff;padding:9px 12px;border-radius:10px;font-size:11px}.c37-appnums b{display:block;font-size:16px}.c37-window{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.c37-month{background:#fff;border:1px solid #dce8e3;border-radius:14px;padding:13px;min-width:0}.c37-month header{display:flex;justify-content:space-between;align-items:end}.c37-month h3{margin:2px 0;font-size:22px}.c37-topo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.c37-card{background:#f7faf9;border-radius:10px;padding:10px}.c37-card.hero{grid-column:1/-1;background:#edf7f3}.c37-card.warn{background:#fff4dd}.c37-card.ok{background:#eaf8f2}.c37-card span,.c37-card small,.c37-card b{display:block}.c37-card b{font-size:18px}.c37-joker{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px dashed #b9cbc4;border-radius:10px;margin:8px 0 12px}.c37-joker.on{background:#fff4dd}.c37-joker span{flex:1;font-size:12px}.c37-actions{display:flex;justify-content:flex-end;gap:8px;margin:10px 0}.c37-head,.c37-line{display:grid;grid-template-columns:1.35fr .7fr 1.55fr .8fr .65fr .8fr;gap:7px;align-items:center}.c37-head{font-size:10px;font-weight:800;color:#65746f;padding:7px}.c37-line{padding:8px 7px;border-top:1px solid #edf1ef;font-size:12px}.c37-line small{display:block;color:#64726e}.c37-slider{display:grid;grid-template-columns:auto 1fr auto;gap:4px;align-items:center}.c37-amount{grid-column:1/-1;width:100%;box-sizing:border-box;text-align:center;border:1px solid #d9e5e0;border-radius:7px;padding:4px}.c37-slider button{border:0;background:#edf7f3;border-radius:6px;padding:3px}.neg{color:#b42318;font-weight:800}.c37-bottom{margin-top:10px}.c37-bottom details{border-top:1px solid #edf1ef;padding:8px 0}.c37-bottom span{display:block;font-size:11px}.c37-horizon{margin-top:14px}.c37-horizon span{display:block;padding:5px}.warn{color:#9a5b00}@media(max-width:1000px){.c37-window{grid-template-columns:1fr}.c37-canons{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.c37-topo,.c37-appnums{grid-template-columns:1fr}.c37-head{display:none}.c37-line{grid-template-columns:1fr}.c37-slider{grid-template-columns:auto 1fr auto}.c37-app{display:block}}`;document.head.appendChild(st);
})();
</script>
