<script>
(function(){'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const mois=p=>{const d=new Date(p?.periode?.fin||p?.periode?.debut);return isNaN(d)?'P'+(p?.index||''):d.toLocaleDateString('fr-FR',{month:'long'}).replace(/^./,c=>c.toUpperCase());};
let data=null,req=0;
function appreciation(d){const f=d.fenetreRoulante||{},cls='cr36-'+(f.niveau||'vert');return `<section class="cr36-app ${cls}"><div><small>APPRÉCIATION GÉNÉRALE · 2 MOIS ROULANTS</small><h2>${esc(f.titre||'Lecture de la trajectoire')}</h2><p>${(f.raisons||[]).map(esc).join(' · ')||'Aucune tension particulière détectée.'}</p></div><div class="cr36-restes"><span>M <b>${money(f.resteM)}</b></span><span>M+1 <b>${money(f.resteM1)}</b></span></div></section>`;}
function topo(p,pos){const r=p.roulant||{},delta=Number(p.budgetReparti||0)-Number(data.p0?.totaux?.monetaire||0);return `<div class="cr36-topo"><div><span>Budget de la période</span><b>${money(p.budgetReparti)}</b><small>${delta===0?'conforme à P0':(delta>0?'+':'')+money(delta)+' par rapport à P0'}</small></div><div><span>Réel non-CB de ${esc(mois(p))}</span><b>${money(r.reelNonCb)}</b></div><div><span>CB héritée de M−1</span><b>${money(r.cbHeritee)}</b><small>déjà engagée sur cette période</small></div><div><span>Plan à venir</span><b>${money(p.engagementsPlanifies)}</b></div><div><span>Reste à ventiler</span><b class="${Number(p.resteAVentiler)<0?'neg':''}">${money(p.resteAVentiler)}</b></div>${pos===0?`<div><span>CB déjà engagée pour M+1</span><b>${money(r.cbEngageePourSuivant)}</b></div>`:''}</div>`;}
function ligne(x,j){const reel=Number(x.reelImpute??x.reel??0),plan=Number(x.planifie||0),reste=Number(x.prevu||0)-reel-plan,max=Math.max(200,Math.ceil(Math.max(Number(x.canon||0),Number(x.prevu||0),reel+plan)*2+200));return `<div class="cr36-line" data-j="${j}"><strong>${esc(x.categorie)}</strong><span>${money(x.canon)}</span><div class="cr36-slider"><button data-d="-10">−10</button><input type="range" min="0" max="${max}" step="1" value="${Number(x.prevu||0)}"><button data-d="10">+10</button><b>${money(x.prevu)}</b></div><span>${money(x.reelNonCb||0)}</span><span>${money(x.cbHeritee||0)}</span><span>${plan?money(plan):'—'}</span><span class="${reste<0?'neg':''}">${reste<0?'− '+money(-reste):money(reste)}</span></div>`;}
function budget(p,pos){const nom=mois(p),id='cr36-'+pos;return `<article class="cr36-month" id="${id}"><header><div><small>${pos===0?'M · MOIS EN COURS':'M+1 · MOIS SUIVANT'}</small><h3>${esc(nom)}</h3></div><span>${new Date(p.periode.debut).toLocaleDateString('fr-FR')} → ${new Date(p.periode.fin).toLocaleDateString('fr-FR')}</span></header>${topo(p,pos)}<div class="cr36-actions"><button class="secondary-button" data-reset>Revenir à P0</button><button class="primary-button" data-save>Valider uniquement ${esc(nom)}</button></div><div class="cr36-head"><span>Catégorie</span><span>P0</span><span>Budget ${esc(nom)}</span><span>Réel non-CB</span><span>CB M−1</span><span>Plan</span><span>Reste</span></div><div class="cr36-lines">${(p.enveloppes||[]).map((x,j)=>ligne(x,j)).join('')}</div></article>`;}
function brancher(p,pos){const root=$('cr36-'+pos);if(!root)return;const maj=()=>{let total=0;root.querySelectorAll('.cr36-line').forEach((row,j)=>{const inp=row.querySelector('input'),v=Number(inp.value||0),x=p.enveloppes[j];x.prevu=v;total+=v;row.querySelector('.cr36-slider b').textContent=money(v);});p.budgetReparti=total;p.resteAVentiler=Number(p.budgetDisponible||0)-total;};root.querySelectorAll('.cr36-line').forEach(row=>{const inp=row.querySelector('input');inp.oninput=maj;row.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{inp.value=Math.max(0,Math.min(Number(inp.max),Number(inp.value)+Number(b.dataset.d)));maj();});});root.querySelector('[data-save]').onclick=()=>{maj();if(Number(p.resteAVentiler)<-.009){alert('Ce budget dépasse la capacité de la période.');return;}const postes=p.enveloppes.map(x=>({categorie:x.categorie,montant:Number(x.prevu||0)}));google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).withFailureHandler(e=>alert(e.message||e)).sauvegarderBudgetPeriodeCerbereV33({cle:p.clePilotage,postes});};root.querySelector('[data-reset]').onclick=()=>{if(confirm('Supprimer les ajustements locaux de '+mois(p)+' et réhériter de P0 ?'))google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).reinitialiserBudgetPeriodeCerbereV33(p.clePilotage);};}
function rendre(d){const z=$('cerbere-content');if(!z)return;const p=d.periodes||[],r=d.reel||{};z.innerHTML=`<div class="cr36-canons"><span><small>P0 · DÉPENSES</small><b>${money(d.p0?.totaux?.monetaire)}</b></span><span><small>R0 · RECETTES</small><b>${money(d.recettesCanon?.total)}</b></span><span><small>SOLDE ACTUEL</small><b>${r.soldeBancaire==null?'—':money(r.soldeBancaire)}</b></span><span><small>MOTEUR</small><b>${esc(d.version||'')}</b></span></div>${appreciation(d)}<div class="cr36-window">${p[0]?budget(p[0],0):''}${p[1]?budget(p[1],1):''}</div><details class="cr36-horizon"><summary>Voir l’horizon P3–P6</summary><div>${p.slice(2).map(x=>`<span><b>${esc(mois(x))}</b> · disponible ${money(x.budgetDisponible)} · plan ${money(x.engagementsPlanifies)}</span>`).join('')}</div></details>`;if(p[0])brancher(p[0],0);if(p[1])brancher(p[1],1);}
window.chargerCerbereV2UI=function(){const z=$('cerbere-content');if(!z)return;const id=++req;z.innerHTML='<div class="cerb-progress"><strong>Connexion à Cerbère…</strong><small>Construction de la fenêtre M / M+1.</small></div>';google.script.run.withSuccessHandler(d=>{if(id!==req)return;if(!d||d.ok===false){z.innerHTML='<div class="cerb-error">'+esc(d?.erreur||'Erreur Cerbère')+'</div>';return;}data=d;rendre(d);}).withFailureHandler(e=>{z.innerHTML='<div class="cerb-error">'+esc(e.message||e)+'</div>';}).chargerCerbereRoulant();};
const st=document.createElement('style');st.textContent=`.cr36-canons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.cr36-canons>span{background:#edf7f3;border-radius:12px;padding:11px}.cr36-canons small,.cr36-canons b{display:block}.cr36-canons small{color:#147d64;font-weight:800}.cr36-app{display:flex;justify-content:space-between;gap:20px;border-radius:15px;padding:16px 18px;margin:12px 0}.cr36-app h2{margin:3px 0 5px;font-size:20px}.cr36-app p{margin:0}.cr36-vert{background:#eaf8f2}.cr36-orange{background:#fff4dd}.cr36-rouge{background:#fdeaea}.cr36-restes{display:flex;gap:12px;align-items:center}.cr36-restes span{background:#fff;padding:8px 12px;border-radius:10px}.cr36-window{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.cr36-month{background:#fff;border:1px solid #dce8e3;border-radius:14px;padding:13px;min-width:0}.cr36-month header{display:flex;justify-content:space-between;align-items:end}.cr36-month h3{margin:2px 0;font-size:22px}.cr36-topo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.cr36-topo>div{background:#f7faf9;border-radius:9px;padding:8px}.cr36-topo span,.cr36-topo small,.cr36-topo b{display:block}.cr36-topo span{font-size:11px}.cr36-topo b{font-size:16px}.cr36-topo small{font-size:10px;color:#667}.cr36-actions{display:flex;justify-content:flex-end;gap:7px;margin:9px 0}.cr36-head,.cr36-line{display:grid;grid-template-columns:1.15fr .65fr 1.55fr .7fr .65fr .6fr .7fr;gap:6px;align-items:center}.cr36-head{font-size:9px;font-weight:800;color:#667;padding:6px 4px}.cr36-line{border-top:1px solid #edf1ef;padding:7px 4px;font-size:10px}.cr36-slider{display:grid;grid-template-columns:28px 1fr 28px 55px;gap:3px;align-items:center}.cr36-slider button{padding:3px}.cr36-slider input{min-width:40px;width:100%}.cr36-slider b{text-align:right}.neg{color:#b42318!important}.cr36-horizon{margin-top:12px;background:#f7faf9;border-radius:10px;padding:10px}.cr36-horizon summary{font-weight:800;cursor:pointer}.cr36-horizon div{display:flex;gap:16px;flex-wrap:wrap;padding-top:8px}@media(max-width:1150px){.cr36-window{grid-template-columns:1fr}.cr36-canons{grid-template-columns:1fr 1fr}}`;document.head.appendChild(st);
})();
</script>
