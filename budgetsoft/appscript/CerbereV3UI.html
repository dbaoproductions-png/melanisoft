<script>
(function(){'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const iso=d=>{const x=new Date(d);if(isNaN(x))return'';return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const fr=d=>{const x=new Date(d);return isNaN(x)?'—':x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'})};
const mois=p=>{const d=new Date(p?.periode?.fin||p?.periode?.debut);return isNaN(d)?'Cycle':d.toLocaleDateString('fr-FR',{month:'long'}).replace(/^./,c=>c.toUpperCase());};
let data=null,req=0,bankReq=0;

function reelLigne(x){return Math.max(0,Number(x&&x.reelNetPrevisionnel!=null?x.reelNetPrevisionnel:(x&&x.reelImpute||0)));}
function cycleMeta(p){
 const a=new Date(p?.periode?.debut),b=new Date(p?.periode?.fin),m=new Date((a.getTime()+b.getTime())/2);
 return {debut:iso(a),milieu:iso(m),fin:iso(b)};
}
function cockpit(p){return p?.v37?.cockpit20260902||{};}

function recalculDerivesObjet(p){
 const v=p.v37||(p.v37={}),c=v.cockpit20260902||(v.cockpit20260902={});let p1=0,ret=0,dpt=0,cons=0,plan=0,dep=0;
 (p.enveloppes||[]).forEach(x=>{const a=Math.max(0,Number(x.prevu||0)),r=reelLigne(x),pl=Math.max(0,Number(x.planifie||0)),e=r+pl;p1+=a;cons+=r;plan+=pl;ret+=a-e;dpt+=Math.max(a,e);dep+=Math.max(0,e-a);x.engageV37=e;x.resteV37=a-e;x.dpt1=Math.max(a,e);});
 c.p1Total=p1;c.ret1=ret;c.dpt1=dpt;c.consommePilotable=cons;c.reservePlan=plan;c.depassements=dep;c.margeARepartir=Number(c.capacitePilotable||0)-dpt;v.ret1=ret;v.dpt1=dpt;p.budgetReparti=p1;
}
function proposerSurplusProjet(p){
 const c=cockpit(p),surplus=Math.max(0,Number(c.surplusVsP0||0));if(surplus<.01)return;
 const env=p.enveloppes||[],estP0=env.every(x=>Math.abs(Number(x.prevu||0)-Number(x.canon||0))<.01);if(!estP0)return;
 const projet=env.find(x=>String(x.categorie||'').trim().toLowerCase()==='projet');if(!projet)return;
 projet.prevu=Math.max(0,Number(projet.prevu||0))+surplus;p._propositionProjet=true;recalculDerivesObjet(p);
}

function appreciation(){
 const a=data?.cockpit20260902?.appreciation||{},cls=a.niveau||'vert';
 return `<section class="c4-app c4-${esc(cls)}"><div class="c4-weather"><span>${esc(a.emoji||'🌤️')}</span><div><small>APPRÉCIATION GÉNÉRALE</small><h2>${esc(a.titre||'Situation')}</h2><p>${esc(a.resume||'')}</p></div></div><div class="c4-consigne"><small>À RETENIR</small><b>${esc(a.consigne||'Aucun arbitrage particulier à ce stade.')}</b></div></section>`;
}
function miniCard(label,val,txt,cls,attr){return `<div class="c4-card ${cls||''}" ${attr||''}><span>${esc(label)}</span><b>${val}</b>${txt?`<small>${txt}</small>`:''}</div>`;}
function topoPilotage(p){
 const c=cockpit(p),p1=Number(c.p1Total||0),ret=Number(c.ret1||0),cap=Number(c.capacitePilotable||0),m=Number(c.margeARepartir||0);
 return `<div class="c4-pilotage">
   ${miniCard('P1 · budget pilotable retenu',money(p1),p._propositionProjet?'P0 + surplus proposé dans Projet · à valider':'Allocation enregistrée / réglée par les molettes','hero','data-p1-card')}
   ${miniCard('Encore disponible sur P1',money(ret),`P1 − ${money(c.consommePilotable||0)} réel − ${money(c.reservePlan||0)} réservé Plan`,ret<0?'warn':'','data-ret1-card')}
   ${miniCard('Capacité pilotable du cycle',money(cap),'Rt1 − CFt1 − hors-pilotable du cycle')}
   ${miniCard(m<0?'À réduire':'Marge à ventiler',money(Math.abs(m)),m<0?'Le projet P1 dépasse la capacité économique du cycle.':'Capacité encore non affectée.',m<0?'warn':'ok','data-margin-card')}
 </div>`;
}
function pointCard(label,date,value,source,attr){return `<div class="c4-point" ${attr||''}><span>${esc(label)}</span><b>${value==null?'Calcul…':money(value)}</b><small>${esc(date?fr(date):'')}${source?' · '+esc(source):''}</small></div>`;}
function pointsReel(p,pos){
 const m=cycleMeta(p),v=p.v37||{},realNow=pos===0?Number(data?.reel?.soldeBancaire||v.shbt1||0):null;
 const debutPasse=pos===0&&new Date(m.debut)<=new Date();
 return `<section class="c4-real"><div class="c4-section-title"><small>POINTS DE RÉFÉRENCE DANS LE RÉEL</small><span>Repères bancaires issus du moteur de trésorerie, sans entrer dans la formule de P1.</span></div><div class="c4-points">
 ${pointCard('Solde au jour J','',realNow,pos===0?'réel Hello bank':'voir cycle courant',pos===0?'data-bank-now':'')}
 ${debutPasse?pointCard('Premier jour du cycle',m.debut,Number(v.ss1||0),String(v.ss1Statut||'frontière Cerbère')):pointCard('Premier jour du cycle',m.debut,null,'prévisionnel',`data-bank-date="${m.debut}"`)}
 ${pointCard('Milieu du cycle',m.milieu,null,new Date(m.milieu)<=new Date()?'réel/reconstitué':'prévisionnel',`data-bank-date="${m.milieu}"`)}
 ${pointCard('Dernier jour du cycle',m.fin,null,new Date(m.fin)<=new Date()?'réel/reconstitué':'prévisionnel',`data-bank-date="${m.fin}"`)}
 </div></section>`;
}
function construction(p){
 const v=p.v37||{};return `<section class="c4-construction"><div class="c4-section-title"><small>CONSTRUCTION DU CYCLE</small></div><div class="c4-build">
 ${miniCard('Recettes réévaluées',money(v.rt1),'R1 + effets du cycle ; le Réel remplace le prévu.')}
 ${miniCard('Charges fixes réévaluées',money(v.cft1),`${money(v.chargesFixesTotal||v.cft1)} référence · le Réel rapproché remplace le prévu.`)}
 ${miniCard('Dépenses pilotables estimées',money(v.dpt1),'P1 retenu, augmenté seulement des dépassements déjà acquis.','','data-dpt1-card')}
 </div></section>`;
}
function effetsCycle(p){
 const v=p.v37||{},l=Array.isArray(v.actionsEvenementsCycle)?v.actionsEvenementsCycle:[],r=v.actionsEvenementsResume||{};
 if(!l.length)return `<div class="c4-effects"><div class="c4-effects-title"><div><small>ACTIONS & ÉVÉNEMENTS</small><b>Aucun effet spécifique</b></div></div></div>`;
 return `<div class="c4-effects"><div class="c4-effects-title"><div><small>ACTIONS & ÉVÉNEMENTS</small><b>${Number(r.nombre||l.length)} effet(s) · net ${money(r.net||0)}</b></div></div>${l.map(x=>{const s=Number(x.montantSigne||0);return `<div class="c4-effect-row"><div><strong>${esc(x.libelle||x.source)}</strong><small>${esc(x.source||'')} · ${esc(x.dateEffet||'')} · ${esc(x.categorie||x.cible||'')}</small></div><b class="${s<0?'neg':'pos'}">${s>0?'+':''}${money(s)}</b><em>${esc(x.statut||'Prévu')}</em></div>`}).join('')}</div>`;
}
function joker(p){const j=p?.v37?.joker||{};return `<div class="c4-joker ${j.actif?'on':''}"><label><input type="checkbox" data-joker ${j.actif?'checked':''}> <b>Joker P0</b></label><span>${esc(j.raison||'Reprendre P0 comme forme de référence, puis réévaluer la situation du cycle.')}</span>${j.automatique?'<small>Activation automatique</small>':''}</div>`;}
function ligne(x,j){const reel=reelLigne(x),plan=Number(x.planifie||0),reste=Number(x.resteV37!=null?x.resteV37:Number(x.prevu||0)-reel-plan),max=Math.max(200,Math.ceil(Math.max(Number(x.canon||0),Number(x.prevu||0),reel+plan)*2+1200));return `<div class="c4-line" data-j="${j}"><strong>${esc(x.categorie)}</strong><span>${money(x.canon)}</span><div class="c4-slider"><button data-d="-10">−10</button><input class="c4-range" type="range" min="0" max="${max}" step="1" value="${Number(x.prevu||0)}"><button data-d="10">+10</button><input class="c4-amount" type="number" min="0" step="1" value="${Number(x.prevu||0)}"></div><span>${money(reel)}</span><span>${plan?money(plan):'—'}</span><span class="${reste<0?'neg':''}" data-reste>${money(reste)}</span></div>`;}
function molettes(p){return `<section class="c4-molettes"><div class="c4-actions"><button class="secondary-button" data-reset>Revenir à P0</button><button class="primary-button" data-save>Valider ${esc(mois(p))}</button></div><div class="c4-head"><span>Poste pilotable</span><span>P0</span><span>Allocation P1</span><span>Réel</span><span>Plan</span><span>Encore disponible</span></div><div class="c4-lines">${(p.enveloppes||[]).map(ligne).join('')}</div></section>`;}
function secondaires(p){const r=p.roulant||{},h=r.horsPilotable||{},v=p.v37||{};return `<div class="c4-bottom"><details><summary>Audit du cycle</summary><p>SS1 : <b>${money(v.ss1)}</b> (${esc(v.ss1Statut||'')}) · SHBt1 : <b>${v.shbt1==null?'—':money(v.shbt1)}</b></p><p>Rt1 : <b>${money(v.rt1)}</b> · CFt1 : <b>${money(v.cft1)}</b> · HEt1 : <b>${money(v.het1||0)}</b></p></details><details><summary>Opérations hors pilotable à contrôler · ${money(h.total||0)}</summary><p>Diagnostic seulement : rapprochement CF, trésorerie ou classement métier.</p></details></div>`;}
function cycle(p,pos){const id='c4-'+pos,m=cycleMeta(p);return `<article class="c4-cycle" id="${id}"><header><div><small>${pos===0?'C1 · CYCLE COURANT':'C2 · CYCLE SUIVANT'}</small><h3>${esc(mois(p))}</h3></div><span>${fr(m.debut)} → ${fr(m.fin)}</span></header>${topoPilotage(p)}${pointsReel(p,pos)}${construction(p)}${effetsCycle(p)}${joker(p)}${molettes(p)}${secondaires(p)}</article>`;}
function canons(){const cf=data?.cf0||{},cfMaster=cf.totalCourant!=null?cf.totalCourant:(cf.totalPondereCourant!=null?cf.totalPondereCourant:0);return `<section class="c37-canons c4-canons"><div class="c4-section-title"><small>RÉFÉRENTIELS / CANONS CERBÈRE</small><span>Références maîtres : elles ne sont jamais réécrites par le Réel.</span></div><div class="c4-canon-grid"><button class="c4-canon" data-open-canon="p0"><small>P0 · PILOTABLE MAÎTRE</small><b>${money(data?.p0?.totaux?.monetaire)}</b><em>Configurer · historique réel</em></button><button class="c4-canon" data-open-canon="r0"><small>R0 · RECETTES MAÎTRE</small><b>${money(data?.recettesCanon?.total)}</b><em>Configurer la référence</em></button><button class="c4-canon" data-open-canon="cf0"><small>CF0 · CHARGES FIXES MAÎTRE</small><b>${money(cfMaster)}</b><em>${Number(cf.nombreActives||0)} active(s) · voir / reparamétrer</em></button></div></section>`;}
function ouvrirCanon(type){const fn=type==='p0'?window.ouvrirCanonDepensesCerbereUI:type==='r0'?window.ouvrirCanonRecettesCerbereUI:window.ouvrirCF0CerbereUI;if(typeof fn==='function')fn();else alert('Le module '+type.toUpperCase()+' n’est pas chargé.');}

function mettreAJourCartes(root,p){const c=cockpit(p);const set=(sel,val)=>{const e=root.querySelector(sel);if(e)e.textContent=money(val)};set('[data-p1-card] b',c.p1Total);set('[data-ret1-card] b',c.ret1);set('[data-dpt1-card] b',c.dpt1);const mb=root.querySelector('[data-margin-card]'),m=Number(c.margeARepartir||0);if(mb){mb.querySelector('span').textContent=m<0?'À réduire':'Marge à ventiler';mb.querySelector('b').textContent=money(Math.abs(m));mb.classList.toggle('warn',m<0);mb.classList.toggle('ok',m>=0);mb.querySelector('small').textContent=m<0?'Le projet P1 dépasse la capacité économique du cycle.':'Capacité encore non affectée.';}}
function recalculer(p,root,pos){
 root.querySelectorAll('.c4-line').forEach((row,j)=>{const x=p.enveloppes[j],range=row.querySelector('.c4-range'),amount=row.querySelector('.c4-amount'),val=Math.max(0,Number(amount.value||range.value||0));x.prevu=val;range.value=Math.min(Number(range.max),val);amount.value=val;});
 p._propositionProjet=false;recalculDerivesObjet(p);root.querySelectorAll('.c4-line').forEach((row,j)=>{const x=p.enveloppes[j],e=row.querySelector('[data-reste]');if(e){e.textContent=money(x.resteV37);e.classList.toggle('neg',Number(x.resteV37)<0);}});mettreAJourCartes(root,p);
 // L'effet bancaire est différé : on ne relance pas le serveur à chaque mouvement.
 // La trajectoire bancaire est rafraîchie après validation du P1.
}
function brancher(p,pos){const root=$('c4-'+pos);if(!root)return;root.querySelectorAll('.c4-line').forEach(row=>{const range=row.querySelector('.c4-range'),amount=row.querySelector('.c4-amount');range.oninput=()=>{amount.value=range.value;recalculer(p,root,pos)};amount.oninput=()=>recalculer(p,root,pos);row.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{amount.value=Math.max(0,Number(amount.value||0)+Number(b.dataset.d));recalculer(p,root,pos);});});root.querySelector('[data-save]').onclick=()=>{recalculer(p,root,pos);const postes=p.enveloppes.map(x=>({categorie:x.categorie,montant:Number(x.prevu||0)}));google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).withFailureHandler(e=>alert(e.message||e)).sauvegarderBudgetPeriodeCerbereV33({cle:p.clePilotage,postes});};root.querySelector('[data-reset]').onclick=()=>{if(confirm('Supprimer les ajustements locaux de '+mois(p)+' et revenir au P0 courant ?'))google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).reinitialiserBudgetPeriodeCerbereV33(p.clePilotage);};const j=root.querySelector('[data-joker]');if(j)j.onchange=()=>google.script.run.withSuccessHandler(()=>window.chargerCerbereV2UI()).withFailureHandler(e=>{alert(e.message||e);j.checked=!j.checked}).reglerJokerCerbereV37(p.clePilotage,j.checked);}

function chargerTrajectoireBanque(){
 const nodes=[...document.querySelectorAll('.c4-point[data-bank-date]')];if(!nodes.length)return;const id=++bankReq,dates=nodes.map(n=>n.dataset.bankDate).filter(Boolean).sort(),maxDate=dates[dates.length-1];if(!maxDate)return;
 google.script.run.withSuccessHandler(r=>{if(id!==bankReq||!r||!r.ok)return;const ref=String(r.dateReference||''),base=Number(r.soldeReel||0),lignes=Array.isArray(r.lignes)?r.lignes:[];nodes.forEach(n=>{const d=n.dataset.bankDate,b=n.querySelector('b'),s=n.querySelector('small');if(!b)return;if(d<ref){b.textContent='—';if(s)s.textContent=fr(d)+' · historique non recalculé';return;}const delta=lignes.reduce((sum,x)=>String(x.date||'')<=d?sum+Number(x.montantSigne||0):sum,0);b.textContent=money(base+delta);if(s)s.textContent=fr(d)+' · '+(d===ref?'réel':'prévisionnel bancaire');});}).withFailureHandler(()=>nodes.forEach(n=>{const b=n.querySelector('b');if(b)b.textContent='Indisponible';})).chargerTresoreriePrevisionnelleRapide20260901(maxDate);
}
function rendre(d){data=d;const z=$('cerbere-content');if(!z)return;const p=data.periodes||[];p.forEach(proposerSurplusProjet);z.innerHTML=`${appreciation()}<div class="c4-window">${p[0]?cycle(p[0],0):''}${p[1]?cycle(p[1],1):''}</div>${canons()}<div class="c4-engine">Moteur ${esc(data.version||'')} · cockpit ${esc(data.cockpit20260902?.version||'')}</div>`;z.querySelectorAll('[data-open-canon]').forEach(b=>b.onclick=()=>ouvrirCanon(b.dataset.openCanon));if(p[0])brancher(p[0],0);if(p[1])brancher(p[1],1);setTimeout(chargerTrajectoireBanque,40);}
window.chargerCerbereV2UI=function(){const z=$('cerbere-content');if(!z)return;const id=++req;z.innerHTML='<div class="cerb-progress"><strong>Connexion à Cerbère…</strong><small>Chargement du contexte économique ; les repères bancaires arriveront ensuite sans bloquer le cockpit.</small></div>';google.script.run.withSuccessHandler(d=>{if(id!==req)return;if(!d||d.ok===false){z.innerHTML='<div class="cerb-error">'+esc(d?.erreur||'Erreur Cerbère')+'</div>';return;}rendre(d);}).withFailureHandler(e=>z.innerHTML='<div class="cerb-error">'+esc(e.message||e)+'</div>').chargerCerbereCockpit20260902();};

const st=document.createElement('style');st.textContent=`
.c4-app{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;border-radius:14px;padding:14px 16px;margin:12px 0;background:#eef7f4}.c4-weather{display:flex;gap:12px;align-items:center}.c4-weather>span{font-size:38px}.c4-weather h2{margin:2px 0;font-size:20px}.c4-weather p{margin:2px 0;color:#52655e}.c4-consigne{background:#fff;border-radius:10px;padding:10px}.c4-consigne small,.c4-consigne b{display:block}.c4-window{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.c4-cycle{background:#fff;border:1px solid #dce8e3;border-radius:14px;padding:13px;min-width:0}.c4-cycle>header{display:flex;justify-content:space-between;align-items:end}.c4-cycle h3{margin:2px 0;font-size:22px}.c4-pilotage,.c4-build{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.c4-card{background:#f7faf9;border-radius:10px;padding:10px}.c4-card.hero{grid-column:1/-1;background:#edf7f3;border:1px solid #c9dfd7}.c4-card.warn{background:#fff4dd}.c4-card.ok{background:#eaf8f2}.c4-card span,.c4-card small,.c4-card b{display:block}.c4-card b{font-size:18px}.c4-section-title{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:11px 0 7px}.c4-section-title small{font-weight:800;color:#365047;letter-spacing:.04em}.c4-section-title span{font-size:10px;color:#6d7d77;text-align:right}.c4-real{border-top:1px solid #e8efec;margin-top:10px;padding-top:2px}.c4-points{display:grid;grid-template-columns:1fr 1fr;gap:7px}.c4-point{background:#f8faf9;border:1px solid #edf1ef;border-radius:9px;padding:8px}.c4-point span,.c4-point b,.c4-point small{display:block}.c4-point b{font-size:16px}.c4-point small{font-size:10px;color:#70817b}.c4-effects{border:1px solid #dce8e3;border-radius:12px;padding:10px;margin:9px 0;background:#f9fcfb}.c4-effects-title small,.c4-effects-title b{display:block}.c4-effect-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border-top:1px solid #e7efec;padding:7px 0;font-size:12px}.c4-effect-row small{display:block;color:#65746f}.c4-effect-row em{font-size:10px;font-style:normal;background:#edf7f3;border-radius:10px;padding:3px 6px}.c4-joker{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px dashed #b9cbc4;border-radius:10px;margin:10px 0}.c4-joker span{flex:1;font-size:12px}.c4-actions{display:flex;justify-content:flex-end;gap:8px;margin:10px 0}.c4-head,.c4-line{display:grid;grid-template-columns:1.35fr .7fr 1.55fr .8fr .65fr .8fr;gap:7px;align-items:center}.c4-head{font-size:10px;font-weight:800;color:#65746f;padding:7px}.c4-line{padding:8px 7px;border-top:1px solid #edf1ef;font-size:12px}.c4-slider{display:grid;grid-template-columns:auto 1fr auto;gap:4px;align-items:center}.c4-amount{grid-column:1/-1;width:100%;box-sizing:border-box;text-align:center;border:1px solid #d9e5e0;border-radius:7px;padding:4px}.c4-slider button{border:0;background:#edf7f3;border-radius:6px;padding:3px}.c4-bottom details{border-top:1px solid #edf1ef;padding:8px 0}.c4-canons{margin:18px 0 10px;padding-top:12px;border-top:2px solid #dce8e3}.c4-canon-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.c4-canon{background:#edf7f3;border:1px solid transparent;border-radius:12px;padding:11px;text-align:left;cursor:pointer;font:inherit}.c4-canon small,.c4-canon b,.c4-canon em{display:block}.c4-canon em{font-size:10px;font-style:normal;margin-top:4px}.c4-engine{text-align:right;font-size:10px;color:#89958f;margin:6px 0 14px}.pos{color:#1a7f55;font-weight:800}.neg{color:#b42318;font-weight:800}@media(max-width:1000px){.c4-window{grid-template-columns:1fr}}@media(max-width:700px){.c4-app,.c4-pilotage,.c4-build,.c4-points,.c4-canon-grid{grid-template-columns:1fr}.c4-head{display:none}.c4-line{grid-template-columns:1fr}.c4-effect-row{grid-template-columns:1fr}}
`;document.head.appendChild(st);
})();
</script>
