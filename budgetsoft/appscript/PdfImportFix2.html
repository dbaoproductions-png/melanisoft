<script>
(function () {
  function nettoyerBrutLibelle_(brut) {
    var morceaux = String(brut || '').split(/\s*\|\|\s*|\s*\|\s*/).map(function(s){return String(s||'').trim();}).filter(Boolean);
    if (!morceaux.length) return '';

    var gardes = morceaux.filter(function(s) {
      if (/^\d{2}\.\d{2}$/.test(s)) return false;
      if (/^[+-]?\d{1,3}(?:[ .]\d{3})*,\d{2}$/.test(s)) return false;
      if (/^\d+[.,]\d{2}\s*EUR$/i.test(s)) return false;
      if (/RELEVE DE COMPTE|Date Nature|Hello bank|RIB\s*:|P\.\s*\d+\/|TOTAL DES OPERATIONS|SOLDE (?:CREDITEUR|DEBITEUR)|SCPT\d|^\d{10,}$/i.test(s)) return false;
      return true;
    });

    var texte = gardes.join(' ').replace(/\s+/g,' ').trim();
    // Cas où PDF.js a regroupé date + libellé dans le même item.
    texte = texte.replace(/^\s*\d{2}\.\d{2}\s+/,'').trim();
    // Retire une éventuelle date valeur ou un montant résiduel en fin de texte.
    texte = texte.replace(/\s+\d{2}\.\d{2}\s+[+-]?\d{1,3}(?:[ .]\d{3})*,\d{2}\s*$/,'').trim();
    return texte;
  }

  function estLibelleValide_(s) {
    s=String(s||'').trim();
    return !!s && !/^\d{2}[.\/]\d{2}(?:[.\/]\d{2,4})?$/.test(s);
  }

  var original = window.extraireOperationsPageHelloBank;
  if (typeof original !== 'function') return;

  window.extraireOperationsPageHelloBank = function(items, largeur) {
    var ops = original(items, largeur) || [];
    ops.forEach(function(o) {
      var lib = String(o.libelle_bancaire || o.details || o.libelle || '').trim();
      if (!estLibelleValide_(lib)) {
        var recupere = nettoyerBrutLibelle_(o._ligneBrute);
        if (estLibelleValide_(recupere)) {
          o.libelle_bancaire = recupere;
          o.details = recupere;
          o.libelle = recupere;
          delete o._parseError;
        }
      }

      var final = String(o.libelle_bancaire || '').trim();
      if (!estLibelleValide_(final)) o._parseError = 'LIBELLE_BANCAIRE_INCOMPLET';
    });
    return ops;
  };
})();

// Import PDF contrôlé V2 : nom serveur unique pour éviter toute collision
// avec d'anciennes implémentations globales Apps Script.
window.confirmerImportPdf = function(){
  const compte=document.getElementById('pdf-account').value;
  const status=document.getElementById('pdf-status');
  const controle=sprint0809.pdfMeta?.controle;
  if(!compte){status.textContent='Choisissez le compte concerné.';return;}
  if(controle?.verifiable&&!controle.conforme){status.textContent='Import bloqué : les totaux calculés ne correspondent pas aux totaux officiels du relevé.';return;}
  const bouton=document.getElementById('confirm-pdf-import');
  bouton.disabled=true;
  bouton.textContent='Import en cours…';
  google.script.run
    .withSuccessHandler(r=>{
      bouton.disabled=false;
      bouton.textContent='Importer les opérations';
      let message=`Relevé importé et contrôlé : ${r.importees} importées, ${r.doublons} doublons ignorés, ${r.rapprochees} rapprochées.`;
      if(r.continuite===true)message+=' Continuité des soldes : conforme.';
      if(r.continuite===false)message+=` ⚠ Écart de continuité : ${money.format(r.ecartContinuite||0)}.`;
      if(r.controleReleveEnregistre)message+=` Contrôle enregistré (ligne ${r.controleReleveLigne}).`;
      if(r.soldeCloture!=null)message+=` Solde de clôture mémorisé : ${money.format(r.soldeCloture)} au ${new Date(r.dateCloture).toLocaleDateString('fr-FR')}.`;
      message+=` [${r.moteurImport||'moteur inconnu'}]`;
      status.textContent=message;
      charger();
      if(typeof chargerCycleFinancierUI==='function')chargerCycleFinancierUI();
      setTimeout(fermerImportPdf,2200);
    })
    .withFailureHandler(err=>{
      bouton.disabled=false;
      bouton.textContent='Importer les opérations';
      status.textContent='Erreur pendant l’import contrôlé : '+(err.message||String(err));
    })
    .importerOperationsHelloBankControleV2(sprint0809.pdfOperations,compte,sprint0809.pdfMeta);
};
</script>
