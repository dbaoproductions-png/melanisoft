<script>
(function(){
  const TITRE=['Charges fixes','🔁','Prévisions récurrentes'];
  document.addEventListener('DOMContentLoaded',()=>{
    const bouton=document.querySelector('.nav-item[data-view="charges_fixes"]');
    if(!bouton)return;
    bouton.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();ouvrirChargesFixes();},true);
  });
  window.ouvrirChargesFixes=ouvrirChargesFixes;
  function ouvrirChargesFixes(){state.currentView='charges_fixes';document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view==='charges_fixes'));document.getElementById('page-title').textContent=TITRE[0];document.getElementById('page-eyebrow').textContent=TITRE[2];['dashboard','comptes','operations','charges_fixes'].forEach(id=>document.getElementById(id)?.classList.toggle('active',id==='charges_fixes'));document.getElementById('generic-view')?.classList.remove('active');if(typeof rendreOperationsPage==='function')rendreOperationsPage();mettreAJourIndicateurs();if(typeof chargerRapprochementsChargesFixesUI==='function')chargerRapprochementsChargesFixesUI();}
  function mettreAJourIndicateurs(){const charges=(state.data?.Charges_fixes||[]),actives=charges.filter(c=>estActif(c.actif));const count=document.getElementById('fixed-charge-count');if(count)count.textContent=String(actives.length);const total=document.getElementById('fixed-charge-monthly-total');if(total)total.textContent=money.format(actives.reduce((s,c)=>s+equivalentMensuel(c),0));if(typeof google!=='undefined'&&google.script?.run){google.script.run.withSuccessHandler(l=>{const n=(l||[]).filter(r=>String(r.statut)==='À valider').length;const x=document.getElementById('fixed-charge-match-count');if(x)x.textContent=String(n);}).lireRapprochementsChargesFixes();}}
  function equivalentMensuel(c){const m=Math.abs(nombre(c.montant));switch(String(c.frequence||'Mensuelle').toLowerCase()){case'quotidienne':return m*30.4375;case'hebdomadaire':return m*52/12;case'trimestrielle':return m/3;case'semestrielle':return m/6;case'annuelle':return m/12;default:return m;}}
  const ancienneRendreCharges=window.rendreChargesFixes;if(typeof ancienneRendreCharges==='function')window.rendreChargesFixes=function(){ancienneRendreCharges.apply(this,arguments);mettreAJourIndicateurs();};
  const ancienneSauvegarde=window.sauvegarderChargeFixe;if(typeof ancienneSauvegarde==='function')window.sauvegarderChargeFixe=function(charge){document.getElementById('save-fixed-charge').disabled=true;google.script.run.withSuccessHandler(()=>{document.getElementById('save-fixed-charge').disabled=false;fermerChargeFixe();charger();setTimeout(ouvrirChargesFixes,100);}).withFailureHandler(err=>{document.getElementById('save-fixed-charge').disabled=false;afficherErreur(err.message||String(err));}).enregistrerLigne('Charges_fixes',charge);};
  window.supprimerChargeFixe=function(id){if(!confirm('Supprimer cette charge fixe du référentiel ? Les opérations bancaires réelles ne seront pas modifiées.'))return;google.script.run.withSuccessHandler(()=>{charger();setTimeout(ouvrirChargesFixes,100);}).withFailureHandler(err=>afficherErreur(err.message||String(err))).supprimerLigne('Charges_fixes',id);};
})();

// Adaptateur du formulaire manuel au schéma bancaire actuel.
// Le formulaire reste simple ; les colonnes techniques sont gérées côté serveur.
window.enregistrerOperation=function(e){
  e.preventDefault();
  const operation={id:document.getElementById('operation-id').value,date:document.getElementById('operation-date').value,libelle:document.getElementById('operation-label').value.trim(),categorie:document.getElementById('operation-category').value,compte:document.getElementById('operation-account').value,montant:nombre(document.getElementById('operation-amount').value),type:document.getElementById('operation-type').value,commentaire:document.getElementById('operation-comment').value.trim()};
  if(!operation.libelle||!operation.compte){afficherErreur('Le libellé et le compte sont obligatoires.');return;}
  document.getElementById('save-operation').disabled=true;
  google.script.run.withSuccessHandler(()=>{document.getElementById('save-operation').disabled=false;fermerOperation();charger();ouvrirVue('operations');}).withFailureHandler(err=>{document.getElementById('save-operation').disabled=false;afficherErreur(err.message||String(err));}).enregistrerOperationManuelle(operation);
};
</script>

<script>
(function(){
  let etat=null,lotColler='',lotPdf=[];
  document.addEventListener('DOMContentLoaded',installerPluxeeUI);

  function installerPluxeeUI(){
    const nav=document.querySelector('.nav');if(!nav||document.querySelector('[data-view="pluxee"]'))return;
    const ref=document.querySelector('.nav-item[data-view="operations"]');
    const b=document.createElement('button');b.className='nav-item';b.dataset.view='pluxee';b.innerHTML='🍽️ <span>Pluxee</span>';
    ref&&ref.parentNode?ref.parentNode.insertBefore(b,ref.nextSibling):nav.appendChild(b);
    b.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();ouvrirPluxee();},true);
    const main=document.querySelector('.main'),generic=document.getElementById('generic-view');
    const s=document.createElement('section');s.id='pluxee';s.className='view';s.innerHTML=vuePluxee_();
    main.insertBefore(s,generic);
    creerModalesPluxee_();
    document.getElementById('pluxee-refresh').addEventListener('click',chargerPluxeeUI_);
    document.getElementById('pluxee-paste').addEventListener('click',()=>ouvrirModalPluxee_('pluxee-paste-modal'));
    document.getElementById('pluxee-pdf').addEventListener('click',()=>ouvrirModalPluxee_('pluxee-pdf-modal'));
    document.getElementById('pluxee-manual').addEventListener('click',()=>ouvrirModalPluxee_('pluxee-manual-modal'));
  }

  function vuePluxee_(){return `<div class="section-toolbar"><p class="section-intro">Carte repas affectée : rechargements et dépenses immédiates, sans effet sur la trésorerie Hello bank.</p><div class="toolbar-buttons"><button class="secondary-button" id="pluxee-paste">📋 Copier-coller</button><button class="secondary-button" id="pluxee-pdf">📄 PDF</button><button class="primary-button" id="pluxee-manual">＋ Saisie manuelle</button></div></div><div class="cards"><article class="card metric-card"><span>Solde Pluxee</span><strong id="pluxee-solde">—</strong><small id="pluxee-reference">Solde affecté, hors banque</small></article><article class="card metric-card"><span>Courses Pluxee</span><strong id="pluxee-courses">—</strong><small>Dépenses classées</small></article><article class="card metric-card"><span>Restaurants Pluxee</span><strong id="pluxee-restaurants">—</strong><small>Dépenses classées</small></article><article class="card metric-card"><span>À classer</span><strong id="pluxee-aclass">—</strong><small>Courses ou Restaurants uniquement</small></article></div><article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Registre affecté</span><h2>Opérations Pluxee</h2></div><button type="button" class="secondary-button" id="pluxee-refresh">Actualiser</button></div><p class="helper-text">Une recharge augmente le solde Pluxee. Une dépense diminue ce solde et alimente Courses ou Restaurants. Les transactions refusées ne sont jamais écrites.</p><div id="pluxee-list" class="empty-state">Chargement…</div></article>`;}

  window.ouvrirPluxee=ouvrirPluxee;
  function ouvrirPluxee(){state.currentView='pluxee';document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.view==='pluxee'));document.getElementById('page-title').textContent='Pluxee';document.getElementById('page-eyebrow').textContent='Titres-restaurant';document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('pluxee').classList.add('active');chargerPluxeeUI_();}
  function chargerPluxeeUI_(){google.script.run.withSuccessHandler(r=>{etat=r;rendrePluxee_();}).withFailureHandler(e=>afficherErreur(e.message||String(e))).chargerPluxee();}
  function rendrePluxee_(){if(!etat)return;document.getElementById('pluxee-solde').textContent=money.format(Number(etat.solde||0));document.getElementById('pluxee-reference').textContent=`Référence ${etat.dateReference} : ${money.format(Number(etat.soldeInitial||0))}`;document.getElementById('pluxee-courses').textContent=money.format(Number(etat.depensesParCategorie?.Courses||0));document.getElementById('pluxee-restaurants').textContent=money.format(Number(etat.depensesParCategorie?.Restaurants||0));document.getElementById('pluxee-aclass').textContent=money.format(Number(etat.depensesParCategorie?.['À classer']||0));const z=document.getElementById('pluxee-list'),ops=etat.operations||[];if(!ops.length){z.className='empty-state';z.textContent='Aucune opération Pluxee importée.';return;}z.className='';z.innerHTML='<div class="operation-table-row header"><span>Date</span><span>Libellé</span><span class="hide-medium">Type</span><span class="hide-medium">Catégorie</span><span>Montant</span><span></span></div>'+ops.slice(0,250).map(o=>{const m=Number(o.montant||0),cat=m>0?'—':`<select data-pluxee-cat="${echapperAttribut(o.id)}"><option value="" ${!o.categorie?'selected':''}>À classer</option><option value="Courses" ${o.categorie==='Courses'?'selected':''}>Courses</option><option value="Restaurants" ${o.categorie==='Restaurants'?'selected':''}>Restaurants</option></select>`;return `<div class="operation-table-row"><div class="operation-date">${new Date(o.date).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</div><div class="operation-label"><strong>${echapper(o.libelle)}</strong><small>${echapper(o.source||'')}</small></div><div class="hide-medium">${o.type==='rechargement'?'Rechargement':'Dépense'}</div><div class="hide-medium">${cat}</div><div class="operation-amount ${m>=0?'amount-positive':'amount-negative'}">${money.format(m)}</div><div></div></div>`;}).join('');z.querySelectorAll('[data-pluxee-cat]').forEach(s=>s.addEventListener('change',()=>google.script.run.withSuccessHandler(r=>{etat=r;rendrePluxee_();}).withFailureHandler(e=>afficherErreur(e.message||String(e))).mettreAJourCategoriePluxee(s.dataset.pluxeeCat,s.value)));}

  function creerModalesPluxee_(){
    document.body.insertAdjacentHTML('beforeend',`<div class="modal hidden" id="pluxee-paste-modal"><div class="modal-card wide-modal"><div class="modal-heading"><div><p class="panel-kicker">Pluxee</p><h2>Importer un copier-coller</h2></div><button class="modal-close" data-pluxee-close>×</button></div><label>Historique copié depuis Pluxee<textarea id="pluxee-paste-text" class="import-area" rows="12"></textarea></label><div id="pluxee-paste-status" class="helper-text"></div><div class="form-actions"><button class="secondary-button" data-pluxee-close>Annuler</button><button class="secondary-button" id="pluxee-analyze-paste">Analyser</button><button class="primary-button hidden" id="pluxee-import-paste">Importer</button></div></div></div>`);
    document.body.insertAdjacentHTML('beforeend',`<div class="modal hidden" id="pluxee-pdf-modal"><div class="modal-card wide-modal"><div class="modal-heading"><div><p class="panel-kicker">Pluxee</p><h2>Importer un relevé PDF</h2></div><button class="modal-close" data-pluxee-close>×</button></div><label>Relevé Pluxee PDF<input type="file" id="pluxee-pdf-file" accept="application/pdf"></label><div id="pluxee-pdf-status" class="helper-text"></div><div class="form-actions"><button class="secondary-button" data-pluxee-close>Annuler</button><button class="secondary-button" id="pluxee-analyze-pdf">Analyser</button><button class="primary-button hidden" id="pluxee-import-pdf">Importer</button></div></div></div>`);
    document.body.insertAdjacentHTML('beforeend',`<div class="modal hidden" id="pluxee-manual-modal"><div class="modal-card"><div class="modal-heading"><div><p class="panel-kicker">Pluxee</p><h2>Saisie manuelle</h2></div><button class="modal-close" data-pluxee-close>×</button></div><form id="pluxee-manual-form"><div class="form-grid"><label>Date<input type="date" id="pluxee-manual-date" required></label><label>Type<select id="pluxee-manual-type"><option value="depense">Dépense</option><option value="rechargement">Rechargement</option></select></label><label class="full-field">Libellé<input id="pluxee-manual-label" required></label><label>Montant<input id="pluxee-manual-amount" inputmode="decimal" required></label><label>Catégorie<select id="pluxee-manual-category"><option value="">Automatique / à classer</option><option value="Courses">Courses</option><option value="Restaurants">Restaurants</option></select></label></div><div class="form-actions"><button class="secondary-button" type="button" data-pluxee-close>Annuler</button><button class="primary-button" type="submit">Enregistrer</button></div></form></div></div>`);
    document.querySelectorAll('[data-pluxee-close]').forEach(b=>b.addEventListener('click',()=>b.closest('.modal').classList.add('hidden')));
    document.getElementById('pluxee-analyze-paste').addEventListener('click',analyserColler_);document.getElementById('pluxee-import-paste').addEventListener('click',importerColler_);document.getElementById('pluxee-analyze-pdf').addEventListener('click',analyserPdf_);document.getElementById('pluxee-import-pdf').addEventListener('click',importerPdf_);document.getElementById('pluxee-manual-form').addEventListener('submit',enregistrerManuel_);
  }
  function ouvrirModalPluxee_(id){document.getElementById(id).classList.remove('hidden');if(id==='pluxee-manual-modal')document.getElementById('pluxee-manual-date').value=new Date().toISOString().slice(0,10);}
  function texteResume_(r){return `${r.detectees} détectée(s) · ${r.existantes} existante(s) · ${r.nouvelles} nouvelle(s) · ${r.refusees} refusée(s) exclue(s) · ${r.ambigues} ambiguë(s).`;}
  function analyserColler_(){lotColler=document.getElementById('pluxee-paste-text').value;const s=document.getElementById('pluxee-paste-status');google.script.run.withSuccessHandler(r=>{s.textContent=texteResume_(r);document.getElementById('pluxee-import-paste').classList.toggle('hidden',!r.ok||!r.nouvelles);}).withFailureHandler(e=>s.textContent=e.message||String(e)).analyserCollerPluxee(lotColler);}
  function importerColler_(){google.script.run.withSuccessHandler(r=>{document.getElementById('pluxee-paste-status').textContent=`${r.importees} importée(s). Solde calculé : ${money.format(r.soldeApresImport)}.`;document.getElementById('pluxee-import-paste').classList.add('hidden');chargerPluxeeUI_();}).withFailureHandler(e=>afficherErreur(e.message||String(e))).importerCollerPluxee(lotColler);}

  async function analyserPdf_(){const f=document.getElementById('pluxee-pdf-file').files[0],s=document.getElementById('pluxee-pdf-status');if(!f){s.textContent='Choisissez un PDF Pluxee.';return;}try{const pdfjs=await chargerPdfJs(),pdf=await pdfjs.getDocument({data:await f.arrayBuffer()}).promise,tokens=[];for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),c=await page.getTextContent();c.items.forEach(i=>{const t=String(i.str||'').trim();if(t)tokens.push(t);});}lotPdf=parserTokensPdfPluxee_(tokens);google.script.run.withSuccessHandler(r=>{s.textContent=texteResume_(r);document.getElementById('pluxee-import-pdf').classList.toggle('hidden',!r.ok||!r.nouvelles);}).withFailureHandler(e=>s.textContent=e.message||String(e)).analyserPdfPluxee(lotPdf);}catch(e){s.textContent='Erreur PDF : '+(e.message||String(e));}}
  function importerPdf_(){google.script.run.withSuccessHandler(r=>{document.getElementById('pluxee-pdf-status').textContent=`${r.importees} importée(s). Solde calculé : ${money.format(r.soldeApresImport)}.`;document.getElementById('pluxee-import-pdf').classList.add('hidden');chargerPluxeeUI_();}).withFailureHandler(e=>afficherErreur(e.message||String(e))).importerPdfPluxee(lotPdf);}

  function parserTokensPdfPluxee_(tokens){const mois={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11},out=[];for(let i=0;i<tokens.length;i++){const m=tokens[i].match(/^(\d{2})-([A-Z][a-z]{2})-(\d{4})\s+(\d{2}):(\d{2}):(\d{2})$/);if(!m||mois[m[2]]==null)continue;const lib=String(tokens[i+1]||'').trim(),am=String(tokens[i+2]||'').match(/^(-?\d+(?:\.\d{2})?)\s+EUR$/i);if(!lib||!am)continue;const utc=new Date(Date.UTC(Number(m[3]),mois[m[2]],Number(m[1]),Number(m[4]),Number(m[5]),Number(m[6]))),date=franceDateHeure_(utc),montant=Number(am[1]);out.push({date,libelle:montant>0&&/^pluxee$/i.test(lib)?'Rechargement':lib,montant});i+=2;}return out;}
  function franceDateHeure_(d){const ps=Object.fromEntries(new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return `${ps.year}-${ps.month}-${ps.day} ${ps.hour}:${ps.minute}`;}
  function enregistrerManuel_(e){e.preventDefault();const d={date:document.getElementById('pluxee-manual-date').value,libelle:document.getElementById('pluxee-manual-label').value.trim(),montant:nombre(document.getElementById('pluxee-manual-amount').value),type:document.getElementById('pluxee-manual-type').value,categorie:document.getElementById('pluxee-manual-category').value};google.script.run.withSuccessHandler(r=>{document.getElementById('pluxee-manual-modal').classList.add('hidden');chargerPluxeeUI_();}).withFailureHandler(e=>afficherErreur(e.message||String(e))).enregistrerPluxeeManuel(d);}
})();
</script>
