<script>
const retroAuditUI={liste:[]};
document.addEventListener('DOMContentLoaded',installerRetroAuditUI);

function installerRetroAuditUI(){
  const toolbar=document.querySelector('#operations .toolbar-buttons');
  if(toolbar&&!document.getElementById('retro-audit-button')){
    const b=document.createElement('button');b.type='button';b.className='secondary-button';b.id='retro-audit-button';b.textContent='🧹 Audit rétrospectif';
    b.addEventListener('click',ouvrirRetroAudit);toolbar.prepend(b);
  }
  if(document.getElementById('retro-audit-modal'))return;
  const modal=document.createElement('div');modal.id='retro-audit-modal';modal.className='modal hidden';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');
  modal.innerHTML=`<div class="modal-card wide-modal"><div class="modal-heading"><div><p class="panel-kicker">Contrôle rétrospectif</p><h2>Corrections à valider</h2></div><button class="modal-close" id="close-retro-audit">×</button></div><p class="helper-text">L’audit recherche les catégories vides ou incohérentes, les types contradictoires et les libellés bancaires non normalisés. Rien n’est corrigé sans validation.</p><div class="reconciliation-toolbar"><button type="button" class="primary-button" id="run-retro-audit">Lancer l’analyse</button><button type="button" class="secondary-button" id="refresh-retro-audit">Actualiser</button></div><div id="retro-audit-status" class="helper-text"></div><div id="retro-audit-list" class="reconciliation-list"></div></div>`;
  document.body.appendChild(modal);
  document.getElementById('close-retro-audit').addEventListener('click',()=>modal.classList.add('hidden'));
  document.getElementById('run-retro-audit').addEventListener('click',lancerRetroAuditUI);
  document.getElementById('refresh-retro-audit').addEventListener('click',chargerRetroAuditUI);
  modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.add('hidden');});
}
function ouvrirRetroAudit(){document.getElementById('retro-audit-modal').classList.remove('hidden');chargerRetroAuditUI();}
function chargerRetroAuditUI(){const s=document.getElementById('retro-audit-status');s.textContent='Chargement…';google.script.run.withSuccessHandler(l=>{retroAuditUI.liste=(l||[]).filter(x=>String(x.statut)==='À valider');s.textContent='';rendreRetroAuditUI();}).withFailureHandler(e=>s.textContent='Erreur : '+(e.message||String(e))).lireAuditRetro();}
function lancerRetroAuditUI(){const s=document.getElementById('retro-audit-status'),b=document.getElementById('run-retro-audit');b.disabled=true;b.textContent='Analyse en cours…';s.textContent='Fusion des catégories bancaires puis analyse du rétrospectif…';google.script.run.withSuccessHandler(()=>{google.script.run.withSuccessHandler(r=>{b.disabled=false;b.textContent='Lancer l’analyse';s.textContent=`${r.analysees||0} opération(s) analysée(s) · ${r.nouvelles||0} nouvelle(s) proposition(s) · ${r.aValider||0} à valider.`;chargerRetroAuditUI();if(typeof charger==='function')charger();}).withFailureHandler(e=>{b.disabled=false;b.textContent='Lancer l’analyse';s.textContent='Erreur : '+(e.message||String(e));}).lancerAuditRetro();}).withFailureHandler(e=>{b.disabled=false;b.textContent='Lancer l’analyse';s.textContent='Erreur fusion bancaire : '+(e.message||String(e));}).fusionnerCategoriesBancaires();}
function rendreRetroAuditUI(){const z=document.getElementById('retro-audit-list');if(!z)return;if(!retroAuditUI.liste.length){z.innerHTML='<div class="empty-state">Aucune correction à valider.</div>';return;}z.innerHTML=retroAuditUI.liste.map(x=>`<article class="reconciliation-item" data-id="${echapperAttribut(x.id)}"><div class="reconciliation-head"><strong>${echapper(x.raison||'Contrôle')}</strong><span class="reconciliation-score">Confiance ${Number(x.confiance||0)}%</span></div><div class="reconciliation-compare"><div class="reconciliation-side"><small>Actuel</small><strong>${echapper(x.libelle_actuel||'—')}</strong><span>${echapper(x.categorie_actuelle||'Sans catégorie')} · ${echapper(x.type_actuel||'—')}</span></div><div class="reconciliation-side bank"><small>Proposé</small><strong>${echapper(x.libelle_propose||'—')}</strong><span>${echapper(x.categorie_proposee||'Sans catégorie')} · ${echapper(x.type_propose||'—')}</span></div></div><div class="reconciliation-meta"><span>${formaterDate(x.date_operation)}</span><span>${money.format(Number(x.montant||0))}</span></div><div class="reconciliation-actions"><button type="button" class="primary-button" onclick="deciderRetroAuditUI('${echapperAttribut(x.id)}','appliquer',this)">Appliquer</button><button type="button" class="secondary-button" onclick="deciderRetroAuditUI('${echapperAttribut(x.id)}','ignorer',this)">Ignorer</button></div></article>`).join('');}
function deciderRetroAuditUI(id,decision,b){const carte=b.closest('.reconciliation-item'),s=document.getElementById('retro-audit-status');carte.querySelectorAll('button').forEach(x=>x.disabled=true);s.textContent='Enregistrement…';google.script.run.withSuccessHandler(()=>{s.textContent='Décision enregistrée.';chargerRetroAuditUI();if(typeof charger==='function')charger();}).withFailureHandler(e=>{s.textContent='Erreur : '+(e.message||String(e));carte.querySelectorAll('button').forEach(x=>x.disabled=false);}).deciderAuditRetro(id,decision);}
</script>
