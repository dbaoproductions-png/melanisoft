<script>
const retroAuditUI={liste:[]};document.addEventListener('DOMContentLoaded',installerRetroAuditUI);
function installerRetroAuditUI(){const toolbar=document.querySelector('#operations .toolbar-buttons');if(toolbar&&!document.getElementById('retro-audit-button')){const b=document.createElement('button');b.type='button';b.className='secondary-button';b.id='retro-audit-button';b.textContent='🧹 Audit rétrospectif';b.addEventListener('click',ouvrirRetroAudit);toolbar.prepend(b);}if(document.getElementById('retro-audit-modal'))return;const modal=document.createElement('div');modal.id='retro-audit-modal';modal.className='modal hidden';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.innerHTML=`<div class="modal-card wide-modal"><div class="modal-heading"><div><p class="panel-kicker">Contrôle rétrospectif</p><h2>Corrections à valider</h2></div><button class="modal-close" id="close-retro-audit">×</button></div><p class="helper-text">BudgetSoft propose une correction. Vous pouvez la modifier et choisir si elle concerne seulement cette ligne ou toutes les opérations bancaires équivalentes.</p><div class="reconciliation-toolbar"><button type="button" class="primary-button" id="run-retro-audit">Lancer l’analyse</button><button type="button" class="secondary-button" id="refresh-retro-audit">Actualiser</button></div><div id="retro-audit-status" class="helper-text"></div><div id="retro-audit-list" class="reconciliation-list"></div></div>`;document.body.appendChild(modal);document.getElementById('close-retro-audit').addEventListener('click',()=>modal.classList.add('hidden'));document.getElementById('run-retro-audit').addEventListener('click',lancerRetroAuditUI);document.getElementById('refresh-retro-audit').addEventListener('click',chargerRetroAuditUI);modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.add('hidden');});const style=document.createElement('style');style.textContent=`.retro-edit-grid{display:grid;grid-template-columns:1fr 180px 140px;gap:10px;margin-top:10px}.retro-edit-grid label{font-size:.78rem;color:var(--muted)}.retro-edit-grid input,.retro-edit-grid select{width:100%;box-sizing:border-box;margin-top:5px}.retro-proposed{border:1px solid rgba(20,125,100,.22);background:rgba(20,125,100,.04);border-radius:12px;padding:12px}.retro-scope{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 4px;padding:10px 12px;border-radius:10px;background:var(--surface-soft,#f7f7f7)}.retro-scope label{display:flex;align-items:center;gap:7px;font-size:.86rem}.retro-scope input{margin:0}@media(max-width:760px){.retro-edit-grid{grid-template-columns:1fr}}`;document.head.appendChild(style);}
function ouvrirRetroAudit(){document.getElementById('retro-audit-modal').classList.remove('hidden');chargerRetroAuditUI();}
function chargerRetroAuditUI(){const s=document.getElementById('retro-audit-status');s.textContent='Chargement…';google.script.run.withSuccessHandler(l=>{retroAuditUI.liste=(l||[]).filter(x=>String(x.statut)==='À valider');s.textContent='';rendreRetroAuditUI();}).withFailureHandler(e=>s.textContent='Erreur : '+(e.message||String(e))).lireAuditRetro();}
function lancerRetroAuditUI(){const s=document.getElementById('retro-audit-status'),b=document.getElementById('run-retro-audit');b.disabled=true;b.textContent='Analyse en cours…';s.textContent='Fusion des catégories bancaires puis analyse du rétrospectif…';google.script.run.withSuccessHandler(()=>{google.script.run.withSuccessHandler(r=>{b.disabled=false;b.textContent='Lancer l’analyse';s.textContent=`${r.analysees||0} opération(s) analysée(s) · ${r.nouvelles||0} nouvelle(s) proposition(s) · ${r.aValider||0} à valider.`;chargerRetroAuditUI();if(typeof charger==='function')charger();}).withFailureHandler(e=>{b.disabled=false;b.textContent='Lancer l’analyse';s.textContent='Erreur : '+(e.message||String(e));}).lancerAuditRetro();}).withFailureHandler(e=>{b.disabled=false;b.textContent='Lancer l’analyse';s.textContent='Erreur fusion bancaire : '+(e.message||String(e));}).fusionnerCategoriesBancaires();}
function optionsCategoriesRetro(type,valeur){const cats=(state.data?.Categories||[]).filter(c=>estActif(c.actif)&&(!type||String(c.type||'').toLowerCase()===String(type).toLowerCase()));const noms=[...new Set(cats.map(c=>String(c.nom||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));return '<option value="">Sans catégorie</option>'+noms.map(n=>`<option value="${echapperAttribut(n)}" ${n===valeur?'selected':''}>${echapper(n)}</option>`).join('');}
function rendreRetroAuditUI(){const z=document.getElementById('retro-audit-list');if(!z)return;if(!retroAuditUI.liste.length){z.innerHTML='<div class="empty-state">Aucune correction à valider.</div>';return;}z.innerHTML=retroAuditUI.liste.map(x=>{const id=echapperAttribut(x.id),type=String(x.type_propose||x.type_actuel||'depense').toLowerCase();return `<article class="reconciliation-item" data-id="${id}"><div class="reconciliation-head"><strong>${echapper(x.raison||'Contrôle')}</strong><span class="reconciliation-score">Confiance ${Number(x.confiance||0)}%</span></div><div class="reconciliation-side"><small>Actuel</small><strong>${echapper(x.libelle_actuel||'—')}</strong><span>${echapper(x.categorie_actuelle||'Sans catégorie')} · ${echapper(x.type_actuel||'—')}</span></div><div class="retro-proposed"><small>Proposition modifiable</small><div class="retro-edit-grid"><label>Libellé<input class="retro-label" value="${echapperAttribut(x.libelle_propose||x.libelle_actuel||'')}"></label><label>Catégorie<select class="retro-category">${optionsCategoriesRetro(type,String(x.categorie_proposee||''))}</select></label><label>Type<select class="retro-type" onchange="actualiserCategoriesRetro(this)"><option value="depense" ${type==='depense'?'selected':''}>Dépense</option><option value="revenu" ${type==='revenu'?'selected':''}>Revenu</option></select></label></div><div class="retro-scope"><label><input type="radio" name="scope-${id}" value="unique" checked> Cette opération uniquement</label><label><input type="radio" name="scope-${id}" value="equivalentes"> Cette opération + toutes les équivalentes</label></div><small class="helper-text">Le second choix corrige l’historique équivalent et mémorise la règle pour les prochains imports.</small></div><div class="reconciliation-meta"><span>${formaterDate(x.date_operation)}</span><span>${money.format(Number(x.montant||0))}</span></div><div class="reconciliation-actions"><button type="button" class="primary-button" onclick="deciderRetroAuditUI('${id}','appliquer',this)">Appliquer ma version</button><button type="button" class="secondary-button" onclick="deciderRetroAuditUI('${id}','ignorer',this)">Ignorer</button></div></article>`;}).join('');}
function actualiserCategoriesRetro(selectType){const carte=selectType.closest('.reconciliation-item'),cat=carte.querySelector('.retro-category'),ancienne=cat.value;cat.innerHTML=optionsCategoriesRetro(selectType.value,ancienne);if([...cat.options].some(o=>o.value===ancienne))cat.value=ancienne;}
function deciderRetroAuditUI(id,decision,b){const carte=b.closest('.reconciliation-item'),s=document.getElementById('retro-audit-status');carte.querySelectorAll('button').forEach(x=>x.disabled=true);s.textContent='Enregistrement…';const scope=carte.querySelector('input[type="radio"]:checked')?.value||'unique',mod=decision==='appliquer'?{libelle:carte.querySelector('.retro-label').value,categorie:carte.querySelector('.retro-category').value,type:carte.querySelector('.retro-type').value,propager:scope==='equivalentes'}:{};google.script.run.withSuccessHandler(r=>{s.textContent=r&&r.propagation?`${r.modifiees||0} opération(s) équivalente(s) corrigée(s) et règle mémorisée.`:'Décision enregistrée.';chargerRetroAuditUI();if(typeof charger==='function')charger();}).withFailureHandler(e=>{s.textContent='Erreur : '+(e.message||String(e));carte.querySelectorAll('button').forEach(x=>x.disabled=false);}).deciderAuditRetro(id,decision,mod);}
</script>
