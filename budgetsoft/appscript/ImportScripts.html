<script>
let analyseImport = null;

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('import-fixed-charges-button').addEventListener('click', ouvrirImportCharges);
  document.getElementById('close-import-modal').addEventListener('click', fermerImportCharges);
  document.getElementById('cancel-import').addEventListener('click', fermerImportCharges);
  document.getElementById('analyze-import').addEventListener('click', analyserImport);
  document.getElementById('confirm-import').addEventListener('click', confirmerImport);
  document.getElementById('import-modal').addEventListener('click', e => {
    if (e.target.id === 'import-modal') fermerImportCharges();
  });
});

function ouvrirImportCharges() {
  analyseImport = null;
  document.getElementById('import-text').value =
    'Libellé\tLibellé bancaire\tMontant\tTolérance\tJour\tCatégorie\tCompte\tFréquence\tActif\n';
  document.getElementById('import-results').classList.add('hidden');
  document.getElementById('confirm-import').classList.add('hidden');
  document.getElementById('import-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('import-text').focus(), 50);
}

function fermerImportCharges() {
  document.getElementById('import-modal').classList.add('hidden');
}

function analyserImport() {
  const bouton = document.getElementById('analyze-import');
  bouton.disabled = true;

  google.script.run
    .withSuccessHandler(resultat => {
      bouton.disabled = false;
      analyseImport = resultat || { lignes: [] };
      rendreAnalyseImport(analyseImport);
    })
    .withFailureHandler(err => {
      bouton.disabled = false;
      afficherErreur(err && err.message ? err.message : String(err));
    })
    .analyserImportChargesFixes(document.getElementById('import-text').value);
}

function rendreAnalyseImport(resultat) {
  const r = resultat || {};
  const lignes = Array.isArray(r.lignes) ? r.lignes : [];
  const nouvellesCategories = Array.isArray(r.nouvellesCategories) ? r.nouvellesCategories : [];

  const total = Number.isFinite(Number(r.total)) ? Number(r.total) : lignes.length;
  const valides = Number.isFinite(Number(r.valides))
    ? Number(r.valides)
    : lignes.filter(l => l && l.valide === true).length;
  const doublons = Number.isFinite(Number(r.doublons))
    ? Number(r.doublons)
    : lignes.filter(l => l && l.doublon_id).length;
  const invalides = Number.isFinite(Number(r.invalides))
    ? Number(r.invalides)
    : lignes.filter(l => !l || l.valide !== true).length;

  const zone = document.getElementById('import-results');
  zone.classList.remove('hidden');

  document.getElementById('import-summary').innerHTML =
    `<div class="import-stat"><span>Lignes</span><strong>${total}</strong></div>` +
    `<div class="import-stat"><span>Valides</span><strong>${valides}</strong></div>` +
    `<div class="import-stat"><span>Doublons</span><strong>${doublons}</strong></div>` +
    `<div class="import-stat"><span>Erreurs</span><strong>${invalides}</strong></div>`;

  const motifs = {};
  lignes.forEach(ligne => {
    const erreurs = ligne && Array.isArray(ligne.erreurs) ? ligne.erreurs : [];
    erreurs.forEach(erreur => {
      const cle = String(erreur || '').replace(/\s*:\s*.*/, '').trim();
      if (cle) motifs[cle] = (motifs[cle] || 0) + 1;
    });
  });

  const diagnostic = invalides > 0
    ? `<div class="import-diagnostic"><strong>Pourquoi l’import est bloqué</strong>` +
      Object.entries(motifs)
        .map(([motif, nombre]) => `${nombre} ligne(s) : ${echapper(motif)}`)
        .join('<br>') +
      `<br><span>Corrigez les cellules signalées dans Excel, puis recollez le tableau et relancez l’analyse.</span></div>`
    : '';

  const entete =
    '<div class="import-row header">' +
      '<span>Libellé</span><span>Montant</span><span>Jour</span>' +
      '<span class="import-hide">Compte</span>' +
      '<span class="import-hide">Catégorie</span><span>Action</span>' +
    '</div>';

  const contenu = lignes.map((ligne, index) => {
    const l = ligne || {};
    const erreurs = Array.isArray(l.erreurs) ? l.erreurs : [];
    const avertissements = Array.isArray(l.avertissements) ? l.avertissements : [];
    const valide = l.valide === true;
    const montant = Number.isFinite(Number(l.montant))
      ? money.format(nombre(l.montant))
      : '—';

    return `<div class="import-row ${valide ? '' : 'invalid'}">` +
      `<div><strong>${echapper(l.libelle || '—')}</strong>` +
        `${erreurs.length ? '<small>' + echapper(erreurs.join(' · ')) + '</small>' : ''}` +
        `${avertissements.length ? '<small class="warning-text">' + echapper(avertissements.join(' · ')) + '</small>' : ''}` +
      `</div>` +
      `<span>${montant}</span>` +
      `<span>${l.jour_execution || '—'}</span>` +
      `<span class="import-hide">${echapper(l.compte_nom || '—')}</span>` +
      `<span class="import-hide">${echapper(l.categorie || 'Sans catégorie')}</span>` +
      `<select onchange="changerActionImport(${index},this.value)" ${valide ? '' : 'disabled'}>` +
        `<option value="creer" ${l.action === 'creer' ? 'selected' : ''}>Créer</option>` +
        `<option value="mettre_a_jour" ${l.action === 'mettre_a_jour' ? 'selected' : ''} ${l.doublon_id ? '' : 'disabled'}>Mettre à jour</option>` +
        `<option value="ignorer" ${l.action === 'ignorer' ? 'selected' : ''}>Ignorer</option>` +
      `</select>` +
    `</div>`;
  }).join('');

  document.getElementById('import-preview').innerHTML = diagnostic + entete + contenu;
  document.getElementById('new-categories-note').textContent = nouvellesCategories.length
    ? 'Nouvelles catégories proposées : ' + nouvellesCategories.join(', ')
    : 'Aucune nouvelle catégorie.';

  document.getElementById('confirm-import').classList.toggle('hidden', valides === 0);
}

function changerActionImport(index, action) {
  if (analyseImport && Array.isArray(analyseImport.lignes) && analyseImport.lignes[index]) {
    analyseImport.lignes[index].action = action;
  }
}

function confirmerImport() {
  if (!analyseImport || !Array.isArray(analyseImport.lignes)) return;

  const bouton = document.getElementById('confirm-import');
  bouton.disabled = true;

  google.script.run
    .withSuccessHandler(resultat => {
      bouton.disabled = false;
      const bilan = resultat || {};
      const erreurs = Array.isArray(bilan.erreurs) ? bilan.erreurs : [];

      document.getElementById('import-results').innerHTML =
        `<div class="success-box"><strong>Import terminé</strong><br>` +
        `${Number(bilan.creees) || 0} charge(s) créée(s), ` +
        `${Number(bilan.misesAJour) || 0} mise(s) à jour, ` +
        `${Number(bilan.ignorees) || 0} ignorée(s).` +
        `${erreurs.length ? '<br>Erreurs : ' + echapper(erreurs.join(' | ')) : ''}` +
        `</div>`;

      document.getElementById('confirm-import').classList.add('hidden');
      setTimeout(() => {
        fermerImportCharges();
        charger();
        ouvrirVue('operations');
      }, 1300);
    })
    .withFailureHandler(err => {
      bouton.disabled = false;
      afficherErreur(err && err.message ? err.message : String(err));
    })
    .importerChargesFixes(
      analyseImport.lignes,
      document.getElementById('create-import-categories').checked
    );
}
</script>
