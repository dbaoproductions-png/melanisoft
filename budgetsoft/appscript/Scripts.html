<script>
const state={data:null,currentView:'dashboard'};
const money=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const titles={dashboard:['Tableau de bord','📊','Vue d’ensemble'],comptes:['Comptes','💳','Gestion bancaire'],operations:['Opérations','💶','Mouvements'],budget:['Budget','📅','Prévisions'],patrimoine:['Patrimoine','🏠','Situation globale'],credits:['Crédits','💼','Financements'],objectifs:['Objectifs','🎯','Projets'],analyses:['Analyses','📈','Indicateurs'],ia:['Conseiller IA','🤖','Assistant financier'],parametres:['Paramètres','⚙️','Configuration']};

document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('.nav-item').forEach(button=>button.addEventListener('click',()=>ouvrirVue(button.dataset.view)));
  document.getElementById('refresh-button').addEventListener('click',charger);
  document.getElementById('add-account-button').addEventListener('click',()=>ouvrirCompte());
  document.getElementById('close-account-modal').addEventListener('click',fermerCompte);
  document.getElementById('cancel-account').addEventListener('click',fermerCompte);
  document.getElementById('account-form').addEventListener('submit',enregistrerCompte);
  document.getElementById('show-archived').addEventListener('change',rendreComptes);
  document.getElementById('account-modal').addEventListener('click',e=>{if(e.target.id==='account-modal')fermerCompte();});
  document.getElementById('add-operation-button').addEventListener('click',()=>ouvrirOperation());
  document.getElementById('close-operation-modal').addEventListener('click',fermerOperation);
  document.getElementById('cancel-operation').addEventListener('click',fermerOperation);
  document.getElementById('operation-form').addEventListener('submit',enregistrerOperation);
  document.getElementById('operation-modal').addEventListener('click',e=>{if(e.target.id==='operation-modal')fermerOperation();});
  document.getElementById('add-fixed-charge-button').addEventListener('click',()=>ouvrirChargeFixe());
  document.getElementById('close-fixed-charge-modal').addEventListener('click',fermerChargeFixe);
  document.getElementById('cancel-fixed-charge').addEventListener('click',fermerChargeFixe);
  document.getElementById('fixed-charge-form').addEventListener('submit',enregistrerChargeFixe);
  document.getElementById('fixed-charge-modal').addEventListener('click',e=>{if(e.target.id==='fixed-charge-modal')fermerChargeFixe();});
  ['operation-search','operation-account-filter','operation-type-filter','operation-month-filter'].forEach(id=>document.getElementById(id).addEventListener('input',rendreListeOperations));
  document.getElementById('reset-operation-filters').addEventListener('click',reinitialiserFiltresOperations);
  charger();
});

function ouvrirVue(view){
  state.currentView=view;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  document.getElementById('page-title').textContent=titles[view][0];
  document.getElementById('page-eyebrow').textContent=titles[view][2];
  ['dashboard','comptes','operations'].forEach(id=>document.getElementById(id).classList.toggle('active',view===id));
  document.getElementById('generic-view').classList.toggle('active',!['dashboard','comptes','operations'].includes(view));
  if(view==='comptes')rendreComptes();
  if(view==='operations')rendreOperationsPage();
  if(!['dashboard','comptes','operations'].includes(view)){
    document.getElementById('coming-icon').textContent=titles[view][1];
    document.getElementById('coming-title').textContent=titles[view][0];
    document.getElementById('coming-text').textContent='Le module « '+titles[view][0]+' » sera relié aux données du classeur lors d’un prochain sprint.';
  }
}

function charger(){
  afficherChargement(true);
  google.script.run.withSuccessHandler(data=>{
    state.data=data;afficherChargement(false);rendreDashboard(data);rendreComptes();rendreOperationsPage();
  }).withFailureHandler(err=>{afficherChargement(false);afficherErreur(err.message||String(err));}).chargerToutesLesDonnees();
}
function afficherChargement(visible){document.getElementById('loading').classList.toggle('hidden',!visible);document.getElementById('error').classList.add('hidden');}
function afficherErreur(message){const box=document.getElementById('error');box.textContent=message;box.classList.remove('hidden');}
function nombre(v){const n=Number(String(v??'').replace(/\s/g,'').replace(',','.'));return Number.isFinite(n)?n:0;}
function estActif(v){return v!==false&&String(v).toLowerCase()!=='false'&&String(v)!=='0';}
function dateInput(value){const d=value?new Date(value):new Date();return isNaN(d)?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function rendreDashboard(data){
  document.getElementById('version').textContent=data.meta?.version||'0.5.1';
  const comptes=(data.Comptes||[]).filter(c=>estActif(c.actif));
  const operations=data.Operations||[];
  const now=new Date();
  const mois=operations.filter(o=>{const d=new Date(o.date);return !isNaN(d)&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
  const revenus=mois.filter(o=>nombre(o.montant)>0).reduce((s,o)=>s+nombre(o.montant),0);
  const depenses=mois.filter(o=>nombre(o.montant)<0).reduce((s,o)=>s+Math.abs(nombre(o.montant)),0);
  const solde=comptes.reduce((s,c)=>s+soldeCompte(c,operations),0);
  document.getElementById('solde-global').textContent=money.format(solde);
  document.getElementById('revenus-mois').textContent=money.format(revenus);
  document.getElementById('depenses-mois').textContent=money.format(depenses);
  document.getElementById('epargne-mois').textContent=money.format(revenus-depenses);
  rendreOperationsRecentes(operations);rendreGraphique(operations);rendreSante(revenus,depenses,solde,data);rendreAlertes(revenus,depenses,solde,data);
}

function soldeCompte(compte,operations){return nombre(compte.solde_initial)+(operations||[]).filter(o=>String(o.compte)===String(compte.id)||String(o.compte)===String(compte.nom)).reduce((s,o)=>s+nombre(o.montant),0);}
function rendreComptes(){
  if(!state.data)return;
  const afficherArchives=document.getElementById('show-archived').checked;
  const tous=state.data.Comptes||[],actifs=tous.filter(c=>estActif(c.actif)),operations=state.data.Operations||[];
  document.getElementById('accounts-count').textContent=actifs.length;
  document.getElementById('accounts-balance').textContent=money.format(actifs.reduce((s,c)=>s+soldeCompte(c,operations),0));
  document.getElementById('savings-balance').textContent=money.format(actifs.filter(c=>['epargne','placement'].includes(String(c.type).toLowerCase())).reduce((s,c)=>s+soldeCompte(c,operations),0));
  const comptes=tous.filter(c=>afficherArchives||estActif(c.actif)),zone=document.getElementById('accounts-list');
  if(!comptes.length){zone.className='empty-state';zone.textContent='Aucun compte enregistré. Cliquez sur « Ajouter un compte ».';return;}
  zone.className='';zone.innerHTML=comptes.map(c=>{const actif=estActif(c.actif),solde=soldeCompte(c,operations);return `<div class="account-row ${actif?'':'archived'}"><div class="account-main"><div class="account-icon">${iconeCompte(c.type)}</div><div><strong>${echapper(c.nom)}</strong><small>${actif?'<span class="badge">Actif</span>':'<span class="badge archived-badge">Archivé</span>'}</small></div></div><div class="account-type">${libelleType(c.type)}</div><div class="account-balance ${solde<0?'amount-negative':''}">${money.format(solde)}</div><div class="account-actions"><button class="small-button" onclick="modifierCompte('${echapperAttribut(c.id)}')" title="Modifier">✎</button><button class="small-button" onclick="basculerCompte('${echapperAttribut(c.id)}')" title="${actif?'Archiver':'Réactiver'}">${actif?'⌁':'↻'}</button></div></div>`;}).join('');
}
function iconeCompte(type){return ({courant:'🏦',epargne:'🐷',especes:'💶',carte:'💳',placement:'📈',autre:'🗂️'})[String(type).toLowerCase()]||'🏦';}
function libelleType(type){return ({courant:'Compte courant',epargne:'Épargne',especes:'Espèces',carte:'Carte',placement:'Placement',autre:'Autre'})[String(type).toLowerCase()]||echapper(type||'Autre');}
function ouvrirCompte(compte){document.getElementById('account-form').reset();document.getElementById('account-id').value=compte?.id||'';document.getElementById('account-name').value=compte?.nom||'';document.getElementById('account-type').value=compte?.type||'courant';document.getElementById('account-balance-input').value=nombre(compte?.solde_initial).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});document.getElementById('account-active').checked=compte?estActif(compte.actif):true;document.getElementById('account-modal-title').textContent=compte?'Modifier le compte':'Ajouter un compte';document.getElementById('account-modal').classList.remove('hidden');setTimeout(()=>document.getElementById('account-name').focus(),50);}
function fermerCompte(){document.getElementById('account-modal').classList.add('hidden');}
function modifierCompte(id){const compte=(state.data.Comptes||[]).find(c=>String(c.id)===String(id));if(compte)ouvrirCompte(compte);}
function basculerCompte(id){const compte=(state.data.Comptes||[]).find(c=>String(c.id)===String(id));if(compte)sauvegarderCompte({...compte,actif:!estActif(compte.actif)});}
function enregistrerCompte(e){e.preventDefault();const compte={id:document.getElementById('account-id').value,nom:document.getElementById('account-name').value.trim(),type:document.getElementById('account-type').value,solde_initial:nombre(document.getElementById('account-balance-input').value),actif:document.getElementById('account-active').checked};if(!compte.nom){afficherErreur('Le nom du compte est obligatoire.');return;}sauvegarderCompte(compte);}
function sauvegarderCompte(compte){document.getElementById('save-account').disabled=true;google.script.run.withSuccessHandler(()=>{document.getElementById('save-account').disabled=false;fermerCompte();charger();ouvrirVue('comptes');}).withFailureHandler(err=>{document.getElementById('save-account').disabled=false;afficherErreur(err.message||String(err));}).enregistrerLigne('Comptes',compte);}

function rendreOperationsPage(){
  if(!state.data)return;
  const comptes=(state.data.Comptes||[]).filter(c=>estActif(c.actif));
  remplirSelect('operation-account-filter',comptes,'Tous les comptes');
  remplirSelect('operation-account',comptes,'Choisir un compte');
  remplirSelect('fixed-charge-account',comptes,'Choisir un compte');
  const categories=(state.data.Categories||[]).filter(c=>estActif(c.actif));
  remplirCategories('operation-category',categories);
  remplirCategories('fixed-charge-category',categories);
  rendreChargesFixes();
  rendreListeOperations();
}
function remplirSelect(id,comptes,premier){const select=document.getElementById(id),valeur=select.value;select.innerHTML=`<option value="">${premier}</option>`+comptes.map(c=>`<option value="${echapperAttribut(c.id)}">${echapper(c.nom)}</option>`).join('');select.value=valeur;}
function remplirCategories(id,categories){const select=document.getElementById(id),valeur=select.value;select.innerHTML='<option value="">Sans catégorie</option>'+categories.map(c=>`<option value="${echapperAttribut(c.nom)}">${echapper(c.nom)}</option>`).join('');select.value=valeur;}
function operationsFiltrees(){
  const recherche=document.getElementById('operation-search').value.trim().toLowerCase();
  const compte=document.getElementById('operation-account-filter').value,type=document.getElementById('operation-type-filter').value,mois=document.getElementById('operation-month-filter').value;
  return (state.data?.Operations||[]).filter(o=>{
    const texte=[o.libelle,o.categorie,o.commentaire].join(' ').toLowerCase();
    const d=new Date(o.date),moisOperation=isNaN(d)?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    return (!recherche||texte.includes(recherche))&&(!compte||String(o.compte)===String(compte))&&(!type||String(o.type).toLowerCase()===type)&&(!mois||moisOperation===mois);
  }).sort((a,b)=>new Date(b.date)-new Date(a.date));
}
function rendreListeOperations(){
  if(!state.data)return;
  const operations=operationsFiltrees(),revenus=operations.filter(o=>nombre(o.montant)>0).reduce((s,o)=>s+nombre(o.montant),0),depenses=operations.filter(o=>nombre(o.montant)<0).reduce((s,o)=>s+Math.abs(nombre(o.montant)),0);
  document.getElementById('operations-income').textContent=money.format(revenus);document.getElementById('operations-expenses').textContent=money.format(depenses);document.getElementById('operations-net').textContent=money.format(revenus-depenses);
  const zone=document.getElementById('operations-list');
  if(!operations.length){zone.className='empty-state';zone.textContent='Aucune opération ne correspond aux filtres.';return;}
  const comptes=Object.fromEntries((state.data.Comptes||[]).map(c=>[String(c.id),c.nom]));zone.className='';
  zone.innerHTML='<div class="operation-table-row header"><span>Date</span><span>Libellé</span><span class="hide-medium">Compte</span><span class="hide-medium">Catégorie</span><span>Montant</span><span></span></div>'+operations.map(o=>{const m=nombre(o.montant),auto=String(o.commentaire||'').includes('[RECURRENCE:');return `<div class="operation-table-row"><div class="operation-date">${formaterDate(o.date)}</div><div class="operation-label"><strong>${echapper(o.libelle||'Opération')} ${auto?'<span class="badge auto-badge">Auto</span>':''}</strong><small>${echapper(String(o.commentaire||'').replace(/\s*\[RECURRENCE:[^\]]+\]/g,''))}</small></div><div class="operation-account hide-medium">${echapper(comptes[String(o.compte)]||o.compte||'—')}</div><div class="operation-category hide-medium">${echapper(o.categorie||'Sans catégorie')}</div><div class="operation-amount ${m>=0?'amount-positive':'amount-negative'}">${money.format(m)}</div><div class="operation-actions"><button class="small-button" onclick="modifierOperation('${echapperAttribut(o.id)}')" title="Modifier">✎</button><button class="small-button danger" onclick="supprimerOperation('${echapperAttribut(o.id)}')" title="Supprimer">🗑</button></div></div>`;}).join('');
}
function reinitialiserFiltresOperations(){['operation-search','operation-account-filter','operation-type-filter','operation-month-filter'].forEach(id=>document.getElementById(id).value='');rendreListeOperations();}
function ouvrirOperation(operation){document.getElementById('operation-form').reset();rendreOperationsPage();document.getElementById('operation-id').value=operation?.id||'';document.getElementById('operation-date').value=dateInput(operation?.date);document.getElementById('operation-type').value=operation?.type||'depense';document.getElementById('operation-label').value=operation?.libelle||'';document.getElementById('operation-amount').value=Math.abs(nombre(operation?.montant)).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});document.getElementById('operation-account').value=operation?.compte||'';document.getElementById('operation-category').value=operation?.categorie||'';document.getElementById('operation-comment').value=String(operation?.commentaire||'').replace(/\s*\[RECURRENCE:[^\]]+\]/g,'');document.getElementById('operation-modal-title').textContent=operation?'Modifier l’opération':'Ajouter une opération';document.getElementById('operation-modal').classList.remove('hidden');setTimeout(()=>document.getElementById('operation-label').focus(),50);}
function fermerOperation(){document.getElementById('operation-modal').classList.add('hidden');}
function modifierOperation(id){const operation=(state.data.Operations||[]).find(o=>String(o.id)===String(id));if(operation)ouvrirOperation(operation);}
function enregistrerOperation(e){e.preventDefault();const operation={id:document.getElementById('operation-id').value,date:document.getElementById('operation-date').value,libelle:document.getElementById('operation-label').value.trim(),categorie:document.getElementById('operation-category').value,compte:document.getElementById('operation-account').value,montant:nombre(document.getElementById('operation-amount').value),type:document.getElementById('operation-type').value,commentaire:document.getElementById('operation-comment').value.trim()};if(!operation.libelle||!operation.compte){afficherErreur('Le libellé et le compte sont obligatoires.');return;}document.getElementById('save-operation').disabled=true;google.script.run.withSuccessHandler(()=>{document.getElementById('save-operation').disabled=false;fermerOperation();charger();ouvrirVue('operations');}).withFailureHandler(err=>{document.getElementById('save-operation').disabled=false;afficherErreur(err.message||String(err));}).enregistrerLigne('Operations',operation);}
function supprimerOperation(id){if(!confirm('Supprimer définitivement cette opération ?'))return;google.script.run.withSuccessHandler(()=>{charger();ouvrirVue('operations');}).withFailureHandler(err=>afficherErreur(err.message||String(err))).supprimerLigne('Operations',id);}

function rendreChargesFixes(){
  if(!state.data)return;
  const charges=state.data.Charges_fixes||[],actives=charges.filter(c=>estActif(c.actif));
  document.getElementById('fixed-charge-count').textContent=actives.length+(actives.length>1?' actives':' active');
  const zone=document.getElementById('fixed-charges-list');
  if(!charges.length){zone.className='empty-state';zone.textContent='Aucune charge fixe enregistrée.';return;}
  const comptes=Object.fromEntries((state.data.Comptes||[]).map(c=>[String(c.id),c.nom]));
  zone.className='';zone.innerHTML=charges.map(c=>`<div class="fixed-charge-row ${estActif(c.actif)?'':'archived'}"><div><strong>${echapper(c.libelle)}</strong><small>${echapper(comptes[String(c.compte)]||'Compte inconnu')} · le ${Number(c.jour_execution)||1} de chaque mois</small></div><div class="fixed-charge-amount">${money.format(-Math.abs(nombre(c.montant)))}</div><div class="account-actions"><button class="small-button" onclick="modifierChargeFixe('${echapperAttribut(c.id)}')" title="Modifier">✎</button><button class="small-button" onclick="basculerChargeFixe('${echapperAttribut(c.id)}')" title="${estActif(c.actif)?'Suspendre':'Réactiver'}">${estActif(c.actif)?'⏸':'▶'}</button><button class="small-button danger" onclick="supprimerChargeFixe('${echapperAttribut(c.id)}')" title="Supprimer">🗑</button></div></div>`).join('');
}
function ouvrirChargeFixe(charge){
  document.getElementById('fixed-charge-form').reset();rendreOperationsPage();
  document.getElementById('fixed-charge-id').value=charge?.id||'';
  document.getElementById('fixed-charge-label').value=charge?.libelle||'';
  document.getElementById('fixed-charge-amount').value=Math.abs(nombre(charge?.montant)).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('fixed-charge-day').value=Number(charge?.jour_execution)||1;
  document.getElementById('fixed-charge-account').value=charge?.compte||'';
  document.getElementById('fixed-charge-category').value=charge?.categorie||'';
  document.getElementById('fixed-charge-start').value=dateInput(charge?.date_debut);
  document.getElementById('fixed-charge-end').value=charge?.date_fin?dateInput(charge.date_fin):'';
  document.getElementById('fixed-charge-comment').value=charge?.commentaire||'';
  document.getElementById('fixed-charge-active').checked=charge?estActif(charge.actif):true;
  document.getElementById('fixed-charge-modal-title').textContent=charge?'Modifier la charge fixe':'Ajouter une charge fixe';
  document.getElementById('fixed-charge-modal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('fixed-charge-label').focus(),50);
}
function fermerChargeFixe(){document.getElementById('fixed-charge-modal').classList.add('hidden');}
function modifierChargeFixe(id){const charge=(state.data.Charges_fixes||[]).find(c=>String(c.id)===String(id));if(charge)ouvrirChargeFixe(charge);}
function basculerChargeFixe(id){const charge=(state.data.Charges_fixes||[]).find(c=>String(c.id)===String(id));if(charge)sauvegarderChargeFixe({...charge,actif:!estActif(charge.actif)});}
function enregistrerChargeFixe(e){e.preventDefault();const charge={id:document.getElementById('fixed-charge-id').value,libelle:document.getElementById('fixed-charge-label').value.trim(),categorie:document.getElementById('fixed-charge-category').value,compte:document.getElementById('fixed-charge-account').value,montant:nombre(document.getElementById('fixed-charge-amount').value),type:'depense',jour_execution:Number(document.getElementById('fixed-charge-day').value),date_debut:document.getElementById('fixed-charge-start').value,date_fin:document.getElementById('fixed-charge-end').value,actif:document.getElementById('fixed-charge-active').checked,commentaire:document.getElementById('fixed-charge-comment').value.trim()};if(!charge.libelle||!charge.compte){afficherErreur('Le libellé et le compte sont obligatoires.');return;}sauvegarderChargeFixe(charge);}
function sauvegarderChargeFixe(charge){document.getElementById('save-fixed-charge').disabled=true;google.script.run.withSuccessHandler(()=>{document.getElementById('save-fixed-charge').disabled=false;fermerChargeFixe();charger();ouvrirVue('operations');}).withFailureHandler(err=>{document.getElementById('save-fixed-charge').disabled=false;afficherErreur(err.message||String(err));}).enregistrerLigne('Charges_fixes',charge);}
function supprimerChargeFixe(id){if(!confirm('Supprimer cette charge fixe ? Les opérations déjà créées seront conservées.'))return;google.script.run.withSuccessHandler(()=>{charger();ouvrirVue('operations');}).withFailureHandler(err=>afficherErreur(err.message||String(err))).supprimerLigne('Charges_fixes',id);}

function rendreOperationsRecentes(operations){const zone=document.getElementById('recent-operations'),rows=[...operations].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);if(!rows.length){zone.className='empty-state';zone.textContent='Aucune opération enregistrée.';return;}zone.className='';zone.innerHTML=rows.map(o=>{const m=nombre(o.montant);return `<div class="operation-row"><div><strong>${echapper(o.libelle||'Opération')}</strong><small>${formaterDate(o.date)} · ${echapper(o.categorie||'Sans catégorie')}</small></div><div class="${m>=0?'amount-positive':'amount-negative'}">${money.format(m)}</div></div>`;}).join('');}
function rendreGraphique(operations){const zone=document.getElementById('monthly-bars'),mois=[],now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),total=operations.filter(o=>{const od=new Date(o.date);return !isNaN(od)&&od.getMonth()===d.getMonth()&&od.getFullYear()===d.getFullYear();}).reduce((s,o)=>s+nombre(o.montant),0);mois.push({label:d.toLocaleDateString('fr-FR',{month:'short'}),total});}const max=Math.max(1,...mois.map(m=>Math.abs(m.total)));zone.innerHTML=mois.map(m=>`<div class="bar ${m.total<0?'negative':''}" title="${money.format(m.total)}" style="height:${Math.max(4,Math.abs(m.total)/max*150)}px"><span class="bar-label">${m.label}</span></div>`).join('');}
function rendreSante(revenus,depenses,solde,data){let score=50;if(revenus>depenses)score+=20;if(solde>0)score+=20;if((data.Objectifs||[]).length)score+=10;score=Math.min(100,score);document.getElementById('health-score').textContent=score+'/100';document.getElementById('health-label').textContent=score>=75?'Situation saine':score>=55?'À surveiller':'Situation fragile';const lignes=[['Trésorerie',solde>0?'Bon niveau':'À surveiller',solde>0?'good':'bad'],['Équilibre mensuel',revenus>=depenses?'Équilibré':'Déficitaire',revenus>=depenses?'good':'bad'],['Objectifs',(data.Objectifs||[]).length?'Suivis':'À définir',(data.Objectifs||[]).length?'good':'watch']];document.getElementById('health-list').innerHTML=lignes.map(l=>`<div class="health-row"><span>${l[0]}</span><strong class="status-${l[2]}">${l[1]}</strong></div>`).join('');}
function rendreAlertes(revenus,depenses,solde,data){const alertes=[];if(solde<0)alertes.push('Le solde global est négatif.');if(depenses>revenus&&revenus>0)alertes.push('Les dépenses du mois dépassent les revenus.');if(!(data.Comptes||[]).length)alertes.push('Aucun compte n’est encore enregistré.');const zone=document.getElementById('alerts');zone.className=alertes.length?'health-list':'empty-state';zone.innerHTML=alertes.length?alertes.map(a=>`<div class="health-row"><span>⚠️ ${echapper(a)}</span></div>`).join(''):'Aucune alerte pour le moment.';}
function formaterDate(value){const d=new Date(value);return isNaN(d)?'Date inconnue':d.toLocaleDateString('fr-FR');}
function echapper(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function echapperAttribut(value){return String(value??'').replace(/['\\]/g,'');}
</script>
