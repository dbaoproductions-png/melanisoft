<script>
(function(){
'use strict';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const Y=v=>v===true||String(v)==='true';
let timer=null,annotating=false;

function functionLabel(code){return ({REMBOURSER:'Rembourser',TRANSFERER:'Épargner / transférer',RECEVOIR:'Recevoir',REDUIRE:'Réduire',SUPPRIMER:'Supprimer',PLAFONNER:'Plafonner',ATTEINDRE:'Atteindre / maintenir un stock'})[code]||code||'Action';}
function confidenceLabel(c){return c==='certaine'?'preuve certaine':c==='probable'?'preuve probable':'à valider';}
function unitValue(v,u){return u==='€/mois'?M(v)+'/mois':M(v);}

function refreshPlan(){
  if(window.budgetsoftModules&&typeof window.budgetsoftModules.plan==='function')window.budgetsoftModules.plan();
  setTimeout(scheduleAnnotate,250);
}

function scheduleAnnotate(){clearTimeout(timer);timer=setTimeout(annotate,120);}
function annotate(){
  if(annotating)return;
  const root=document.getElementById('generic-view');
  if(!root||!root.classList.contains('active')||!root.querySelector('[data-edit-action]'))return;
  annotating=true;
  google.script.run.withSuccessHandler(d=>{
    try{
      const p=d.progression_globale||{};
      const metrics=root.querySelector('.pa-metrics');
      if(metrics){
        metrics.setAttribute('data-plan-v5','1');
        metrics.innerHTML=`<div><small>AVANCEMENT DU PLAN</small><b>${p.progression==null?'—':E(p.progression)+' %'}</b><span>${E(p.actions_mesurables||0)} action(s) mesurable(s)</span></div><div><small>OBJECTIFS ATTEINTS</small><b>${E(p.atteintes||0)}</b><span>${E(p.en_retard||0)} en retard / dépassée(s)</span></div><div><small>À CONTRÔLER</small><b>${E(p.a_valider||0)}</b><span>preuve automatique à confirmer</span></div>`;
      }
      (d.actions||[]).forEach(a=>{
        const b=root.querySelector(`[data-edit-action="${CSS.escape(String(a.id))}"]`);
        const row=b&&b.closest('.pa-row');if(!row)return;
        let z=row.querySelector('.pv5-measure');if(!z){z=document.createElement('div');z.className='pv5-measure';row.appendChild(z);}
        const m=a.mesure||{},prog=Number(m.progression||0);
        z.innerHTML=`<div class="pv5-line"><strong>${E(functionLabel(a.fonction_plan))}</strong><span>${E(m.statut||'À instruire')}</span><b>${E(Math.round(prog*10)/10)} %</b></div><div class="pv5-bar"><i style="width:${Math.max(0,Math.min(100,prog))}%"></i></div><small>${unitValue(m.realise||0,m.unite)} réalisé · cible ${unitValue(m.cible||0,m.unite)} · ${E(confidenceLabel(m.confiance))}</small>`;
      });
    }finally{annotating=false;}
  }).withFailureHandler(()=>{annotating=false;}).chargerPlanActionsV5();
}

function findAction(d,id){return (d.actions||[]).find(a=>String(a.id)===String(id||''))||{};}
function accountOptions(comptes,selected){return `<option value="">— Compte —</option>${(comptes||[]).filter(c=>c.actif!==false&&String(c.actif)!=='false').map(c=>`<option value="${E(c.id)}" ${String(c.id)===String(selected||'')?'selected':''}>${E(c.nom)} · ${M(c.soldeReel)}</option>`).join('')}`;}
function categoryOptions(cats,selected){return `<option value="">— Sans catégorie —</option>${(cats||[]).map(c=>`<option value="${E(c)}" ${String(c)===String(selected||'')?'selected':''}>${E(c)}</option>`).join('')}`;}

function openActionV5(id){
  google.script.run.withSuccessHandler(d=>{
    const a=findAction(d,id),m=document.createElement('div');m.className='modal';m.id='pv5-modal';m._source={type:a.source_type||'',id:a.source_id||'',libelle:a.source_libelle||''};
    const f=String(a.fonction_plan||((a.nature_action==='rembourser')?'REMBOURSER':'REDUIRE')).toUpperCase();
    m.innerHTML=`<div class="modal-card wide-modal compact-modal"><div class="modal-heading"><div><p class="panel-kicker">Plan · action mesurable</p><h2>${a.id?'Modifier':'Nouvelle'} action</h2></div><button class="modal-close" id="pv5-x">×</button></div>
      <div class="form-grid">
        <label class="full-field">Action<input id="pv5-lib" value="${E(a.libelle||'')}" placeholder="Ex. Rembourser Oney"></label>
        <label>Objectif<select id="pv5-obj"><option value="">— Aucun —</option>${(d.objectifs||[]).map(o=>`<option value="${E(o.id)}" ${String(o.id)===String(a.objectif_id||'')?'selected':''}>${E(o.nom)}</option>`).join('')}</select></label>
        <label>Fonction<select id="pv5-f">${(d.fonctions||[]).map(x=>`<option value="${E(x.code)}" ${x.code===f?'selected':''}>${E(x.libelle)}</option>`).join('')}</select></label>
        <label>Catégorie<select id="pv5-cat">${categoryOptions(d.categories,a.categorie)}</select></label>
        <label>Statut<select id="pv5-st">${['À instruire','Décidée','En cours','Effective','Abandonnée'].map(x=>`<option ${String(a.statut||'À instruire')===x?'selected':''}>${x}</option>`).join('')}</select></label>
        <label>Cible<input id="pv5-target" type="number" min="0" step="0.01" value="${E(a.cible_valeur||a.impact_montant||0)}"></label>
        <label>Date de début<input id="pv5-start" type="date" value="${E(String(a.date_effet||'').slice(0,10))}"></label>
        <label>Date cible<input id="pv5-end" type="date" value="${E(String(a.date_cible||'').slice(0,10))}"></label>
        <label>Tolérance<input id="pv5-tol" type="number" min="0" step="0.01" value="${E(a.tolerance_mesure||0)}"></label>
      </div>
      <div class="source-box" id="pv5-sourcebox"><strong>Source BudgetSoft</strong><p class="helper-text" id="pv5-sourcehelp"></p><div class="source-search"><input id="pv5-q" placeholder="Oney, Deezer, prime…" value="${E(a.source_libelle||'')}"><button class="secondary-button" id="pv5-search">Rechercher</button></div><div id="pv5-results"></div></div>
      <div class="form-grid" id="pv5-accounts"><label>Compte source<select id="pv5-from">${accountOptions(d.comptes,a.compte_source_id)}</select></label><label>Compte destination<select id="pv5-to">${accountOptions(d.comptes,a.compte_destination_id)}</select></label></div>
      <label class="checkbox-line"><input type="checkbox" id="pv5-auto" ${a.enquete_auto===false||String(a.enquete_auto)==='false'?'':'checked'}> Enquête automatique dans les données BudgetSoft</label>
      <label class="checkbox-line" id="pv5-confirm-wrap"><input type="checkbox" id="pv5-confirm" ${Y(a.impact_confirme)?'checked':''}> Impact confirmé : peut alimenter le prévisionnel Cerbère</label>
      <label>Commentaire<textarea id="pv5-com" rows="2">${E(a.commentaire||'')}</textarea></label>
      <div id="pv5-preview" class="pv5-preview"></div>
      <div class="form-actions"><button class="secondary-button" id="pv5-cancel">Annuler</button><button class="primary-button" id="pv5-save">Enregistrer</button></div></div>`;
    document.body.appendChild(m);

    function updateMode(){
      const fn=document.getElementById('pv5-f').value,accounts=document.getElementById('pv5-accounts'),box=document.getElementById('pv5-sourcebox'),confirm=document.getElementById('pv5-confirm-wrap'),help=document.getElementById('pv5-sourcehelp');
      accounts.style.display=(fn==='TRANSFERER'||fn==='ATTEINDRE')?'grid':'none';
      box.style.display=(fn==='TRANSFERER'||fn==='ATTEINDRE'||fn==='PLAFONNER')?'none':'block';
      confirm.style.display=(fn==='REDUIRE'||fn==='SUPPRIMER'||fn==='RECEVOIR')?'flex':'none';
      help.textContent=fn==='REMBOURSER'?'Rattachez le crédit ou la dette.':fn==='REDUIRE'||fn==='SUPPRIMER'?'Rattachez la charge fixe concernée.':fn==='RECEVOIR'?'Rattachez une recette connue ou indiquez un libellé reconnaissable.':'';
      const target=Math.abs(Number(document.getElementById('pv5-target').value||0));
      document.getElementById('pv5-preview').innerHTML=`<small>Mesure</small><b>${E(functionLabel(fn))} · cible ${M(target)}</b>`;
    }
    document.getElementById('pv5-x').onclick=document.getElementById('pv5-cancel').onclick=()=>m.remove();
    document.getElementById('pv5-f').onchange=updateMode;document.getElementById('pv5-target').oninput=updateMode;updateMode();
    document.getElementById('pv5-search').onclick=()=>{
      const z=document.getElementById('pv5-results');z.innerHTML='<div class="loading">Recherche…</div>';
      google.script.run.withSuccessHandler(r=>{z.innerHTML=(r||[]).map((x,i)=>`<button class="source-hit" data-pv5-src="${i}"><b>${E(x.libelle)}</b><span>${E(x.detail||'')} · ${M(x.capital_restant||x.montant||0)}</span></button>`).join('')||'<small>Aucune correspondance.</small>';z.querySelectorAll('[data-pv5-src]').forEach(b=>b.onclick=()=>{const x=r[Number(b.dataset.pv5Src)];m._source=x;document.getElementById('pv5-q').value=x.libelle||'';if(x.categorie)document.getElementById('pv5-cat').value=x.categorie;if(document.getElementById('pv5-f').value==='REMBOURSER'&&x.capital_restant&&Number(document.getElementById('pv5-target').value||0)===0)document.getElementById('pv5-target').value=x.capital_restant;z.innerHTML=`<small>Lié à <b>${E(x.libelle)}</b></small>`;updateMode();});}).withFailureHandler(e=>z.textContent=e.message||e).rechercherSourceActionV4(document.getElementById('pv5-q').value);
    };
    document.getElementById('pv5-save').onclick=()=>{
      const fn=document.getElementById('pv5-f').value,source=m._source||{};
      const dto={id:a.id||'',libelle:document.getElementById('pv5-lib').value.trim(),objectif_id:document.getElementById('pv5-obj').value,fonction_plan:fn,categorie:document.getElementById('pv5-cat').value,statut:document.getElementById('pv5-st').value,cible_valeur:Math.abs(Number(document.getElementById('pv5-target').value||0)),date_effet:document.getElementById('pv5-start').value,date_cible:document.getElementById('pv5-end').value,tolerance_mesure:Math.abs(Number(document.getElementById('pv5-tol').value||0)),source_type:source.type||a.source_type||'',source_id:source.id||a.source_id||'',source_libelle:source.libelle||document.getElementById('pv5-q').value||a.source_libelle||'',compte_source_id:document.getElementById('pv5-from').value,compte_destination_id:document.getElementById('pv5-to').value,enquete_auto:document.getElementById('pv5-auto').checked,impact_confirme:document.getElementById('pv5-confirm').checked,commentaire:document.getElementById('pv5-com').value,nature_action:String(fn).toLowerCase(),mode_paiement:a.mode_paiement||'Virement',processus:Y(a.processus),reevaluer_charges_fixes:Y(a.reevaluer_charges_fixes)};
      if(!dto.libelle)return alert("Le libellé de l'action est obligatoire.");
      if(!dto.cible_valeur&&fn!=='SUPPRIMER')return alert('La cible doit être supérieure à zéro.');
      if(fn==='TRANSFERER'&&(!dto.compte_source_id||!dto.compte_destination_id))return alert('Choisissez le compte source et le compte destination.');
      google.script.run.withSuccessHandler(()=>{m.remove();refreshPlan();}).withFailureHandler(e=>alert(e.message||e)).enregistrerActionPlanV5(dto);
    };
  }).withFailureHandler(e=>alert(e.message||e)).chargerPlanActionsV5();
}

// Window capture précède les handlers document historiques de PlanPriorityUI.
window.addEventListener('click',function(e){
  const t=e.target&&e.target.closest?e.target.closest('#pv4-action,#pa-new,[data-edit-action]'):null;
  if(!t)return;
  const root=document.getElementById('generic-view');if(!root||!root.classList.contains('active'))return;
  e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
  openActionV5(t.dataset&&t.dataset.editAction?t.dataset.editAction:'');
},true);

const obs=new MutationObserver(scheduleAnnotate);obs.observe(document.documentElement,{childList:true,subtree:true});
setTimeout(scheduleAnnotate,300);

const st=document.createElement('style');st.textContent=`
.pv5-measure{padding:8px 12px 10px 20px;flex:1 0 100%;font-size:12px}.pv5-line{display:flex;gap:10px;align-items:center}.pv5-line strong{min-width:145px}.pv5-line span{flex:1}.pv5-line b{font-variant-numeric:tabular-nums}.pv5-bar{height:5px;background:#e8eeeb;border-radius:999px;overflow:hidden;margin:5px 0}.pv5-bar i{display:block;height:100%;background:currentColor;opacity:.55}.pv5-measure small{opacity:.7}.pv5-preview{margin:10px 0;padding:10px;background:#f7fbf9;border-radius:10px}.pv5-preview small,.pv5-preview b{display:block}`;document.head.appendChild(st);
})();
</script>
