<script>
const sprint0809={configuration:null,pdfOperations:[],pdfMeta:null};
document.addEventListener('DOMContentLoaded',()=>{installerSprint0809();google.script.run.withSuccessHandler(config=>{sprint0809.configuration=config;document.getElementById('version').textContent=config.version||'0.9';afficherPeriodeBudgetaire();}).withFailureHandler(err=>afficherErreur(err.message||String(err))).chargerConfigurationBudgetaire();});
function installerSprint0809(){const toolbar=document.querySelector('#operations .toolbar-buttons');let bouton=document.getElementById('import-pdf-button');if(!bouton&&toolbar){bouton=document.createElement('button');bouton.type='button';bouton.className='secondary-button';bouton.id='import-pdf-button';bouton.textContent='📄 Relevé PDF';toolbar.prepend(bouton);}if(bouton&&!bouton.dataset.listenerInstalled){bouton.dataset.listenerInstalled='1';bouton.addEventListener('click',ouvrirImportPdf);}const cards=document.querySelector('#dashboard .cards');if(cards&&!document.getElementById('budget-period-card')){const card=document.createElement('article');card.className='card metric-card';card.id='budget-period-card';card.innerHTML='<span>Mois budgétaire</span><strong id="budget-period-label">—</strong><small id="budget-period-dates">Du 28 au 27</small>';cards.prepend(card);}creerModalImportPdf();document.querySelector('[data-view="parametres"]')?.addEventListener('click',()=>setTimeout(rendreParametresBudgetaires,0));}
function afficherPeriodeBudgetaire(){const p=sprint0809.configuration?.periodeCourante;if(!p)return;const debut=new Date(p.debut),fin=new Date(p.fin);document.getElementById('budget-period-label').textContent=(p.libelle||'').replace(/^./,c=>c.toUpperCase());document.getElementById('budget-period-dates').textContent=`${debut.toLocaleDateString('fr-FR')} → ${fin.toLocaleDateString('fr-FR')}`;}
function rendreParametresBudgetaires(){const generic=document.getElementById('generic-view');generic.innerHTML=`<article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Calendrier</span><h2>Mois budgétaire</h2></div></div><p class="helper-text">Le mois affiché commence à la réception réelle du salaire lorsqu’elle est détectée. Le jour de référence sert de solution de repli.</p><form id="budget-calendar-form" class="form-grid"><label>Jour de référence<input type="number" id="budget-start-day" min="1" max="28" value="${sprint0809.configuration?.jourDebutMois||28}" required></label><label>Jour habituel du salaire<input type="number" id="salary-day" min="1" max="28" value="${sprint0809.configuration?.jourSalaire||28}" required></label><div class="form-actions full-field"><button class="primary-button" type="submit">Enregistrer</button></div></form></article>`;document.getElementById('budget-calendar-form').addEventListener('submit',e=>{e.preventDefault();google.script.run.withSuccessHandler(config=>{sprint0809.configuration=config;afficherPeriodeBudgetaire();ouvrirVue('dashboard');}).withFailureHandler(err=>afficherErreur(err.message||String(err))).enregistrerConfigurationBudgetaire({jourDebutMois:Number(document.getElementById('budget-start-day').value),jourSalaire:Number(document.getElementById('salary-day').value)});});}
function creerModalImportPdf(){if(document.getElementById('pdf-import-modal'))return;const modal=document.createElement('div');modal.id='pdf-import-modal';modal.className='modal hidden';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.innerHTML=`<div class="modal-card wide-modal"><div class="modal-heading"><div><p class="panel-kicker">Hello bank!</p><h2>Importer un relevé PDF</h2></div><button class="modal-close" id="close-pdf-import">×</button></div><div class="import-help">Le PDF reste dans votre navigateur : seules les opérations, les soldes et les totaux de contrôle extraits sont envoyés au classeur.</div><div class="form-grid"><label class="full-field">Relevé PDF<input type="file" id="pdf-file" accept="application/pdf"></label><label>Compte concerné<select id="pdf-account"></select></label></div><div id="pdf-status" class="helper-text"></div><div id="pdf-preview" class="import-preview hidden"></div><div class="form-actions"><button type="button" class="secondary-button" id="cancel-pdf-import">Annuler</button><button type="button" class="secondary-button" id="analyze-pdf">Analyser le PDF</button><button type="button" class="primary-button hidden" id="confirm-pdf-import">Importer les opérations</button></div></div>`;document.body.appendChild(modal);document.getElementById('close-pdf-import').addEventListener('click',fermerImportPdf);document.getElementById('cancel-pdf-import').addEventListener('click',fermerImportPdf);document.getElementById('analyze-pdf').addEventListener('click',analyserPdfHelloBank);document.getElementById('confirm-pdf-import').addEventListener('click',confirmerImportPdf);document.getElementById('pdf-file').addEventListener('change',reinitialiserAnalysePdf);modal.addEventListener('click',e=>{if(e.target===modal)fermerImportPdf();});}
function reinitialiserAnalysePdf(){sprint0809.pdfOperations=[];sprint0809.pdfMeta=null;const analyser=document.getElementById('analyze-pdf'),importer=document.getElementById('confirm-pdf-import');analyser.disabled=false;analyser.textContent='Analyser le PDF';analyser.classList.remove('hidden');importer.disabled=false;importer.textContent='Importer les opérations';importer.classList.add('hidden');document.getElementById('pdf-status').textContent='';document.getElementById('pdf-preview').classList.add('hidden');}
function ouvrirImportPdf(){sprint0809.pdfOperations=[];sprint0809.pdfMeta=null;const comptes=(state.data?.Comptes||[]).filter(c=>estActif(c.actif));document.getElementById('pdf-account').innerHTML='<option value="">Choisir un compte</option>'+comptes.map(c=>`<option value="${echapperAttribut(c.id)}">${echapper(c.nom)}</option>`).join('');document.getElementById('pdf-file').value='';reinitialiserAnalysePdf();document.getElementById('pdf-import-modal').classList.remove('hidden');}
function fermerImportPdf(){document.getElementById('pdf-import-modal').classList.add('hidden');}
async function chargerPdfJs(){if(window.pdfjsLib)return window.pdfjsLib;const version='4.10.38',base=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${version}`;const pdfjs=await import(`${base}/pdf.min.mjs`);pdfjs.GlobalWorkerOptions.workerSrc=`${base}/pdf.worker.min.mjs`;window.pdfjsLib=pdfjs;return pdfjs;}
async function analyserPdfHelloBank(){const fichier=document.getElementById('pdf-file').files[0],status=document.getElementById('pdf-status'),analyser=document.getElementById('analyze-pdf'),importer=document.getElementById('confirm-pdf-import');if(!fichier){status.textContent='Choisissez un relevé PDF.';return;}analyser.disabled=true;analyser.textContent='Analyse en cours…';importer.classList.add('hidden');try{status.textContent='Lecture et contrôle du relevé…';const pdfjs=await chargerPdfJs();const data=await fichier.arrayBuffer();const pdf=await pdfjs.getDocument({data}).promise;const operations=[],textes=[];for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),viewport=page.getViewport({scale:1}),contenu=await page.getTextContent();operations.push(...extraireOperationsPageHelloBank(contenu.items,viewport.width));textes.push(contenu.items.map(i=>i.str).join(' '));}sprint0809.pdfOperations=operations;sprint0809.pdfMeta=extraireMetaReleveHelloBank(textes.join(' '));const meta=sprint0809.pdfMeta,controle=controlerTotauxPdf(operations,meta);if(meta)meta.controle=controle;let resume=`Analyse terminée : ${operations.length} opérations détectées sur ${pdf.numPages} pages.`;if(meta?.soldeOuverture!=null)resume+=` Ouverture : ${money.format(meta.soldeOuverture)} au ${new Date(meta.dateOuverture).toLocaleDateString('fr-FR')}.`;if(meta?.soldeCloture!=null)resume+=` Clôture : ${money.format(meta.soldeCloture)} au ${new Date(meta.dateCloture).toLocaleDateString('fr-FR')}.`;if(controle.verifiable)resume+=controle.conforme?' ✓ Totaux PDF conformes au centime.':` ⚠ IMPORT BLOQUÉ : débits calculés ${money.format(controle.debitsCalcules)} au lieu de ${money.format(controle.debitsPdf)} ; crédits calculés ${money.format(controle.creditsCalcules)} au lieu de ${money.format(controle.creditsPdf)}.`;else resume+=' Totaux de contrôle du PDF non détectés : import autorisé sans certification.';status.textContent=resume;const preview=document.getElementById('pdf-preview');preview.classList.remove('hidden');preview.innerHTML=operations.slice(0,40).map(o=>`<div class="import-row"><span>${formaterDate(o.date)}</span><strong>${echapper(o.libelle)}</strong><span class="${o.montant>=0?'amount-positive':'amount-negative'}">${money.format(o.montant)}</span></div>`).join('')+(operations.length>40?`<p class="helper-text">… et ${operations.length-40} autres opérations.</p>`:'');analyser.disabled=false;analyser.textContent='Analyser le PDF';analyser.classList.add('hidden');if(operations.length){importer.classList.remove('hidden');if(controle.verifiable&&!controle.conforme){importer.disabled=true;importer.textContent='Import bloqué — écarts détectés';}else{importer.disabled=false;importer.textContent='Importer les opérations';}}}catch(e){status.textContent='Erreur pendant l’analyse : '+(e.message||String(e));analyser.disabled=false;analyser.textContent='Réessayer l’analyse';analyser.classList.remove('hidden');importer.classList.add('hidden');}}
function extraireMetaReleveHelloBank(texte){const t=String(texte||'').replace(/\s+/g,' ');const soldes=[],regex=/SOLDE\s+(CREDITEUR|DEBITEUR)\s+AU\s+(\d{2})[\.\/]?(\d{2})[\.\/]?(\d{4})\s+([\d\s.]+,\d{2})/ig;let m;while((m=regex.exec(t))!==null){const signe=/DEBITEUR/i.test(m[1])?-1:1,date=new Date(Number(m[4]),Number(m[3])-1,Number(m[2]),12),montant=signe*parseMontantPdf(m[5]);if(!isNaN(date)&&Number.isFinite(montant))soldes.push({date,montant});}soldes.sort((a,b)=>a.date-b.date);const total=t.match(/TOTAL\s+DES\s+OPERATIONS\s+([\d\s.]+,\d{2})\s+([\d\s.]+,\d{2})/i);const ouverture=soldes[0],cloture=soldes[soldes.length-1];return {soldeOuverture:ouverture?.montant??null,dateOuverture:ouverture?.date?.toISOString()||null,soldeCloture:cloture?.montant??null,dateCloture:cloture?.date?.toISOString()||null,nombreSoldesDetectes:soldes.length,totalDebits:total?parseMontantPdf(total[1]):null,totalCredits:total?parseMontantPdf(total[2]):null};}
function extraireMontantLigne_(cellules){const finaux=cellules.filter(c=>c.ratio>0.60&&/^\d{1,3},\d{2}$/.test(c.texte));if(!finaux.length)return null;const decimal=finaux[finaux.length-1],idx=cellules.indexOf(decimal),precedent=idx>0?cellules[idx-1]:null;let texte=decimal.texte;if(precedent&&precedent.ratio>0.60&&/^\d{1,3}$/.test(precedent.texte)&&decimal.x-precedent.x<55)texte=precedent.texte+' '+decimal.texte;return {texte,ratio:decimal.ratio,x:decimal.x};}
function extraireOperationsPageHelloBank(items,largeur){const lignes=new Map();items.forEach(item=>{const texte=item.str.trim();if(!texte)return;const y=Math.round(item.transform[5]);if(!lignes.has(y))lignes.set(y,[]);lignes.get(y).push({texte,x:item.transform[4],ratio:item.transform[4]/largeur});});const ord=[...lignes.entries()].sort((a,b)=>b[0]-a[0]).map(([,c])=>c.sort((a,b)=>a.x-b.x)),resultats=[];let courant=null;const annee=extraireAnneeReleve(ord);for(const cellules of ord){const dateCell=cellules.find(c=>c.ratio<0.16&&/^\d{2}\.\d{2}$/.test(c.texte)),mc=extraireMontantLigne_(cellules);if(dateCell&&mc){if(courant)resultats.push(finaliserOperationPdf(courant));const [jour,mois]=dateCell.texte.split('.').map(Number),credit=mc.ratio>0.82,description=cellules.filter(c=>c.ratio>=0.12&&c.ratio<0.60).map(c=>c.texte).join(' ');courant={date:new Date(annee,mois-1,jour,12).toISOString(),details:description,montant:(credit?1:-1)*parseMontantPdf(mc.texte)};}else if(courant){const suite=cellules.filter(c=>c.ratio>=0.12&&c.ratio<0.60).map(c=>c.texte).join(' ');if(suite&&!/RELEVE DE COMPTE|Date Nature|Hello bank|RIB\s*:|P\.\s*\d+\//i.test(suite))courant.details=(courant.details+' '+suite).trim();}}if(courant)resultats.push(finaliserOperationPdf(courant));return resultats.filter(o=>!/^SOLDE|^TOTAL DES OPERATIONS/i.test(o.details));}
function finaliserOperationPdf(o){o.details=String(o.details||'').replace(/\s+/g,' ').trim();o.libelle=nettoyerLibelleHelloBank(o.details);return o;}
function nettoyerLibelleHelloBank(details){const d=String(details||'').replace(/\s+/g,' ').trim();let m=d.match(/(?:VIR(?:EMENT)?\s+(?:SEPA\s+|SCT\s+INST\s+|CPTE\s+A\s+CPTE\s+)?RECU\s+\/DE\s+)(.+?)(?=\s+\/MOTIF|\s+\/REF|$)/i);if(m)return titreLibelle(m[1]);m=d.match(/^PRLV\s+SEPA\s+(.+?)(?=\s+ECH\/|\s+ID\s+EMETTEUR|$)/i);if(m)return titreLibelle(m[1]);m=d.match(/(?:FACTURE\(S\)\s+CARTE[^]*?\sDU\s+\d{6}\s+)(.+?)(?=\s+(?:FRA|IRL|NLD|ESP)\s+\d|$)/i);if(m)return titreLibelle(m[1]);m=d.match(/^DU\s+\d{6}\s+(.+?)(?=\s+(?:FRA|IRL|NLD|ESP)\s+\d|$)/i);if(m)return titreLibelle(m[1]);return titreLibelle(d.replace(/\/(?:REF|MOTIF|MDT|LIB)\b.*$/i,'').replace(/\b(?:REF|MOTIF|MDT|LIB)\b.*$/i,'').slice(0,100));}
function titreLibelle(s){return String(s||'Opération Hello bank!').trim().toLowerCase().replace(/(^|[\s'-])([a-zà-ÿ])/g,(m,p,c)=>p+c.toUpperCase());}
function extraireAnneeReleve(lignes){const texte=lignes.flat().map(c=>c.texte).join(' '),m=texte.match(/(?:20)\d{2}/);return m?Number(m[0]):new Date().getFullYear();}
function parseMontantPdf(v){return Number(String(v).replace(/[\s.\u00a0\u202f]/g,'').replace(',','.'))||0;}
function controlerTotauxPdf(operations,meta){const debits=operations.filter(o=>o.montant<0).reduce((s,o)=>s+Math.abs(o.montant),0),credits=operations.filter(o=>o.montant>0).reduce((s,o)=>s+o.montant,0),r=n=>Math.round(n*100)/100,verifiable=Number.isFinite(meta?.totalDebits)&&Number.isFinite(meta?.totalCredits);return {verifiable,debitsCalcules:r(debits),creditsCalcules:r(credits),debitsPdf:meta?.totalDebits??null,creditsPdf:meta?.totalCredits??null,ecartDebits:verifiable?r(debits-meta.totalDebits):null,ecartCredits:verifiable?r(credits-meta.totalCredits):null,conforme:verifiable&&Math.abs(debits-meta.totalDebits)<0.005&&Math.abs(credits-meta.totalCredits)<0.005};}
function construireLignesPdfCertifiees(operations,compte){return (operations||[]).map(o=>{const libelle=String(o.libelle_bancaire||o.details||o.libelle||'').replace(/\s+/g,' ').trim();return {date:o.date_achat||o.date_comptable||o.date,date_comptable:o.date_comptable||o.date,date_achat:o.date_achat||'',libelle:o.libelle||libelle,libelle_bancaire:libelle,montant:Number(o.montant),type:Number(o.montant)<0?'depense':'revenu',carte_fin:o.carte_fin||'',marchand_normalise:o.marchand_normalise||'',_ligneBrute:o._ligneBrute||'',compte:compte};});}
