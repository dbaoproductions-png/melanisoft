<script>
(function(){
  function lireDonneesCycle_(){try{return (typeof cycleUI!=='undefined'&&cycleUI&&cycleUI.donnees)?cycleUI.donnees:null;}catch(e){return null;}}
  function lireDashboardData_(){return window.budgetsoftDashboardData||null;}

  function installerBandeau_(){
    const zone=document.querySelector('#dashboard > .cards');if(!zone)return;
    zone.innerHTML='<article class="card panel" id="current-cycle-banner" style="grid-column:1/-1;width:100%;min-height:0;padding:18px 20px"><div style="display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center"><div><span class="panel-kicker">Cycle en cours</span><div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap"><h2 id="current-cycle-title" style="font-size:22px;margin:0">—</h2><strong id="current-cycle-dates" style="font-size:14px">Chargement…</strong></div></div><span class="badge" id="current-cycle-day" style="font-size:12px;padding:6px 10px">—</span></div><div id="current-cycle-data" style="margin-top:14px"></div></article>';
  }

  function rendreBandeau_(){
    installerBandeau_();
    const dash=lireDashboardData_();
    if(!dash||!dash.cycleCourant)return;
    const c=dash.cycleCourant;
    const debut=new Date(c.debut),fin=new Date(c.fin),dernier=c.dateDernierReleve?new Date(c.dateDernierReleve):null;
    document.getElementById('current-cycle-title').textContent=c.libelle;
    document.getElementById('current-cycle-day').textContent='Jour '+c.jour+'/'+c.duree;
    document.getElementById('current-cycle-dates').textContent=debut.toLocaleDateString('fr-FR')+' → '+fin.toLocaleDateString('fr-FR');
    const zone=document.getElementById('current-cycle-data');
    if(!zone)return;
    if(c.operations>0){
      zone.innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px"><div><span class="helper-text">Revenus connus</span><strong style="display:block;font-size:20px">${money.format(c.revenus)}</strong></div><div><span class="helper-text">Dépenses connues</span><strong style="display:block;font-size:20px">${money.format(c.depenses)}</strong></div><div><span class="helper-text">Épargne provisoire</span><strong style="display:block;font-size:20px">${money.format(c.epargne)}</strong></div><div><span class="helper-text">Opérations</span><strong style="display:block;font-size:20px">${c.operations}</strong></div></div>`;
    } else {
      zone.innerHTML=`<div class="error" style="margin:0"><strong>Cycle non alimenté</strong> · aucune opération connue depuis le ${debut.toLocaleDateString('fr-FR')}.${dernier?' Dernier relevé bancaire importé : '+dernier.toLocaleDateString('fr-FR')+'.':''}</div>`;
    }
  }

  function rendreHistorique_(d){
    const panneau=document.getElementById('cycle-finance-panel'),z=document.getElementById('cycle-finance-content');if(!panneau||!z||!d)return;
    panneau.style.minHeight='0';
    const p=d.periode,i=d.indicateurs,c=d.couverture||{};const debut=new Date(p.debut),fin=new Date(p.fin),dateReleve=c.dateDernierReleve?new Date(c.dateDernierReleve):null,dateTxt=dateReleve?dateReleve.toLocaleDateString('fr-FR'):'';const couvert=c.completeCycle===true;const note=couvert?'Cycle couvert':'Partiel jusqu’au '+(dateTxt||'—');
    const heading=panneau.querySelector('.panel-heading > div');if(heading)heading.innerHTML=`<span class="panel-kicker">Historique bancaire</span><h2>Dernier cycle analysé — ${echapper(p.libelle||'Cycle')}</h2>`;
    z.innerHTML=`<p class="helper-text" style="margin:0 0 14px"><strong>${debut.toLocaleDateString('fr-FR')} → ${fin.toLocaleDateString('fr-FR')}</strong> · ${p.dureeJours} jours · ${note}</p><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><article class="card metric-card" style="padding:16px"><span>Solde bancaire</span><strong style="font-size:24px;white-space:nowrap">${c.soldeFiable?money.format(i.soldeBancaire):'À synchroniser'}</strong><small>${dateReleve?'Au '+dateTxt:'Solde absent'}</small></article><article class="card metric-card" style="padding:16px"><span>Revenus</span><strong style="font-size:24px;white-space:nowrap">${money.format(i.revenusCycle)}</strong><small>${note}</small></article><article class="card metric-card" style="padding:16px"><span>Dépenses</span><strong style="font-size:24px;white-space:nowrap">${money.format(i.depensesCycle)}</strong><small>${note}</small></article><article class="card metric-card" style="padding:16px"><span>Épargne</span><strong style="font-size:24px;white-space:nowrap">${money.format(i.epargneCycle)}</strong><small>${couvert?'Bilan du cycle':'Calcul provisoire'}</small></article></div>`;
  }

  const rendreCyclePrecedent=typeof rendreCycleUI==='function'?rendreCycleUI:null;
  window.rendreCycleUI=function(){const d=lireDonneesCycle_();if(rendreCyclePrecedent)rendreCyclePrecedent();if(d)rendreHistorique_(d);rendreBandeau_();};
  document.addEventListener('budgetsoft:dashboard-data',()=>rendreBandeau_());
  document.addEventListener('DOMContentLoaded',()=>{installerBandeau_();const d=lireDonneesCycle_();if(d)rendreHistorique_(d);rendreBandeau_();});
})();
</script>
