<script>
(function(){
'use strict';
const q=id=>document.getElementById(id);
const moneyC=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const dateC=v=>v?new Date(v).toLocaleDateString('fr-FR'):'—';
const escC=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cerbereRequest=0;

function masquerToutesLesVuesCerbere_(){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));}
function activerNavCerbere_(view){document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}
function titreCerbere_(){if(q('page-title'))q('page-title').textContent='Cerbère';if(q('page-eyebrow'))q('page-eyebrow').textContent='Contrôle d’exécution';}

function assurerNavigationCerbere_(){
  const nav=document.querySelector('.nav');if(!nav)return;
  let cerb=document.querySelector('[data-view="cerbere"]');
  const analyses=document.querySelector('[data-view="analyses"]');
  if(!cerb){cerb=document.createElement('button');cerb.className='nav-item';cerb.dataset.view='cerbere';cerb.innerHTML='🐺 <span>Cerbère</span>';nav.insertBefore(cerb,analyses||null);}
}

/* CerbereUI owns Cerbère only. Plan/Planification is exclusively owned by PlanPriorityUI. */
document.addEventListener('click',function(e){
  const b=e.target.closest&&e.target.closest('.nav-item[data-view="cerbere"]');
  if(!b)return;
  e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
  ouvrirCerbereUI();
},true);

function assurerSectionCerbere_(){let s=q('cerbere');if(s)return s;const main=document.querySelector('.main'),generic=q('generic-view');s=document.createElement('section');s.id='cerbere';s.className='view';main.insertBefore(s,generic);return s;}
function ouvrirCerbereUI(){
  masquerToutesLesVuesCerbere_();activerNavCerbere_('cerbere');titreCerbere_();
  const s=assurerSectionCerbere_();s.classList.add('active');
  s.innerHTML=`<article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">POLICE DU BUDGET QUOTIDIEN</span><h2>🐺 Cerbère</h2></div><button class="secondary-button" onclick="chargerCerbereV2UI()">Actualiser</button></div><p class="helper-text">Cerbère applique la stratégie de la Planification sur P1–P6. Il lit le réel, mesure les écarts et propose des compensations ; il ne modifie ni le réel ni la stratégie.</p><div id="cerbere-content" class="loading">Connexion au moteur Cerbère…</div></article>`;
  chargerCerbereV2UI();styleCerbere_();
}

window.chargerCerbereV2UI=function(){
  const z=q('cerbere-content');if(!z)return;
  const request=++cerbereRequest;
  z.innerHTML='<div class="cerb-progress"><strong>Connexion au moteur…</strong><small>Diagnostic serveur en cours.</small></div>';
  const watchdog=setTimeout(()=>{if(request===cerbereRequest&&q('cerbere-content'))q('cerbere-content').innerHTML='<div class="cerb-error"><strong>Cerbère ne répond pas encore</strong><small>Le calcul serveur dépasse 15 secondes. Le diagnostic va permettre d’isoler l’étape bloquante.</small></div>';},15000);
  google.script.run.withSuccessHandler(diag=>{
    if(request!==cerbereRequest)return;
    if(!diag||diag.ok===false){clearTimeout(watchdog);z.innerHTML=`<div class="cerb-error"><strong>Diagnostic Cerbère impossible</strong><small>${escC(diag?.erreur||'Réponse serveur vide')}</small></div>`;return;}
    z.innerHTML=`<div class="cerb-progress"><strong>Moteur ${escC(diag.version||'')}</strong><small>${diag.operations||0} opérations · ${diag.charges_fixes||0} charges fixes · calcul P1–P6…</small></div>`;
    google.script.run.withSuccessHandler(d=>{
      if(request!==cerbereRequest)return;clearTimeout(watchdog);
      if(!d){z.innerHTML='<div class="cerb-error"><strong>Réponse Cerbère vide</strong><small>Le serveur a terminé sans fournir de résultat.</small></div>';return;}
      if(d.ok===false){z.innerHTML=`<div class="cerb-error"><strong>Erreur pendant ${escC(d.stage||'le calcul')}</strong><small>${escC(d.erreur||'Erreur inconnue')}</small></div>`;return;}
      rendreCerbere_(d);
    }).withFailureHandler(e=>{if(request!==cerbereRequest)return;clearTimeout(watchdog);z.innerHTML=`<div class="cerb-error"><strong>Échec du calcul Cerbère</strong><small>${escC(e.message||e)}</small></div>`;}).chargerCerbereV2();
  }).withFailureHandler(e=>{if(request!==cerbereRequest)return;clearTimeout(watchdog);z.innerHTML=`<div class="cerb-error"><strong>Échec du diagnostic Cerbère</strong><small>${escC(e.message||e)}</small></div>`;}).diagnostiquerCerbereV2();
};

function rendreCerbere_(d){
  const z=q('cerbere-content');if(!z)return;
  const diag=d.diagnostic||{};
  z.innerHTML=`<div class="cerb-rule"><strong>Règle :</strong> stratégie reçue de la Planification · épargne 50 € protégée · aucune compensation sans validation.<small>Moteur ${escC(d.version||'')} · ${diag.duree_ms||0} ms · ${diag.operations||0} opérations analysées</small></div><div class="cerb-tabs">${(d.periodes||[]).map((p,i)=>`<button class="secondary-button ${i===0?'active':''}" data-cp="${i}">P${i+1}</button>`).join('')}</div><div id="cerb-period"></div>`;
  z.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{z.querySelectorAll('[data-cp]').forEach(x=>x.classList.remove('active'));b.classList.add('active');rendrePeriodeCerbere_(d.periodes[Number(b.dataset.cp)]);});
  if(d.periodes&&d.periodes.length)rendrePeriodeCerbere_(d.periodes[0]);
  else q('cerb-period').innerHTML='<div class="cerb-error">Aucune période calculée.</div>';
}

function rendrePeriodeCerbere_(p){
  const z=q('cerb-period');if(!z||!p)return;
  const badge=p.etat==='rouge'?'🔴':p.etat==='orange'?'🟠':'🟢';
  const flow=[['Ressources',p.ressources],['Charges fixes pondérées',-p.fixesPonderees],['Dépenses exceptionnelles',-p.depensesExceptionnelles],['Épargne protégée',-p.epargne],['Objectifs réservés',-p.reserveObjectifs],['Enveloppe pilotable',p.enveloppePilotable]];
  const comps=(p.propositions||[]).map(x=>`<div class="cerb-prop"><strong>${x.niveau==='periode'?'Compensation P'+p.index:x.niveau==='periode_suivante'?'Compensation P'+p.index+' → P'+x.periode_cible:'Escalade stratégique'}</strong><div>Dépassement ${escC(x.origine)} : ${moneyC(x.montant)}</div>${(x.compensations||[]).map(c=>`<small>− ${moneyC(c.montant)} sur ${escC(c.categorie)}</small>`).join('')}${x.reste_a_reporter?`<small>Reporter ${moneyC(x.reste_a_reporter)} sur P${x.periode_cible}</small>`:''}${x.message?`<small>${escC(x.message)}</small>`:''}<em>Proposition seulement — validation requise</em></div>`).join('');
  z.innerHTML=`<div class="cards"><article class="card metric-card"><span>Période</span><strong>${dateC(p.periode.debut)} → ${dateC(p.periode.fin)}</strong><small>${badge} ${escC(p.etat)}</small></article><article class="card metric-card"><span>Réel constaté</span><strong>${moneyC(p.depensesReelles)}</strong><small>Lecture seule</small></article><article class="card metric-card"><span>Pilotable</span><strong>${moneyC(p.enveloppePilotable)}</strong><small>Après protections</small></article></div><div class="cerb-flow">${flow.map((x,i)=>`<div class="cerb-box"><span>${escC(x[0])}</span><strong>${moneyC(x[1])}</strong></div>${i<flow.length-1?'<div class="cerb-arrow">↓</div>':''}`).join('')}</div>${p.plan?.evenements?.length?`<div class="cerb-note"><strong>Événements intégrés</strong>${p.plan.evenements.map(e=>`<small>${escC(e.libelle)} · ${moneyC(e.montant)}</small>`).join('')}</div>`:''}${p.plan?.actions?.length?`<div class="cerb-note"><strong>Actions dont l’effet est actif</strong>${p.plan.actions.map(a=>`<small>${escC(a.libelle)} · ${escC(a.impact_type)} ${moneyC(a.impact_montant)}</small>`).join('')}</div>`:''}<div class="cerb-grid-head"><span>Catégorie</span><span>Canonique</span><span>Réel</span><span>Reste</span></div>${(p.enveloppes||[]).map(c=>`<div class="cerb-cat"><strong>${escC(c.categorie)}</strong><span>${moneyC(c.prevu)}</span><span>${moneyC(c.reel)}</span><span>${c.etat==='rouge'?'🔴':c.etat==='orange'?'🟠':'🟢'} ${moneyC(c.reste)}</span></div>`).join('')}<div class="cerb-props">${comps||'<div class="empty-state">Aucune compensation nécessaire.</div>'}</div>`;
}

function styleCerbere_(){if(q('cerb-style'))return;const s=document.createElement('style');s.id='cerb-style';s.textContent=`.cerb-tabs{display:flex;gap:8px;margin:16px 0}.cerb-rule,.cerb-note,.cerb-progress{padding:12px 14px;background:rgba(20,125,100,.07);border-radius:12px;margin:12px 0}.cerb-rule small,.cerb-note small,.cerb-progress small,.cerb-prop small,.cerb-prop em,.cerb-error small{display:block;margin-top:5px}.cerb-error{padding:14px;background:#fff0ef;border-left:6px solid #b42318;border-radius:10px}.cerb-flow{max-width:720px;margin:18px auto}.cerb-box{display:flex;justify-content:space-between;padding:11px 14px;background:#fff;border-left:6px solid #147d64;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}.cerb-arrow{text-align:center;font-size:20px}.cerb-grid-head,.cerb-cat{display:grid;grid-template-columns:1.5fr .8fr .8fr .9fr;gap:8px;padding:9px 12px}.cerb-grid-head{font-size:12px;font-weight:700}.cerb-cat{background:#fff;border-bottom:1px solid rgba(20,125,100,.1)}.cerb-props{margin-top:18px}.cerb-prop{border-left:6px solid #d18a00;background:#fff8e8;padding:12px 14px;border-radius:10px;margin:9px 0}.cerb-prop em{font-size:.82rem;opacity:.7}`;document.head.appendChild(s);}

window.ouvrirCerbereUI=ouvrirCerbereUI;
document.addEventListener('DOMContentLoaded',()=>{assurerNavigationCerbere_();styleCerbere_();});
setTimeout(assurerNavigationCerbere_,500);
})();
</script>
