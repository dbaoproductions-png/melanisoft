<script>
(function(){
'use strict';
const q=id=>document.getElementById(id);

/*
 * CerbereUI ne contient plus de moteur ni de renderer fonctionnel.
 * Il possède uniquement la route/navigation. Le cockpit officiel est
 * CerbereV3UI (Cerbère 3.7) chargé plus loin par Index.html.
 * Cette séparation empêche le renderer historique P1/P2/P3 à onglets de
 * reprendre la main et de faire disparaître M+M1 ou les ajustements.
 */
function masquerToutesLesVuesCerbere_(){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));}
function activerNavCerbere_(){document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view==='cerbere'));}
function assurerNavigationCerbere_(){
  const nav=document.querySelector('.nav');if(!nav)return;
  let cerb=document.querySelector('[data-view="cerbere"]');
  const analyses=document.querySelector('[data-view="analyses"]');
  if(!cerb){cerb=document.createElement('button');cerb.className='nav-item';cerb.dataset.view='cerbere';cerb.innerHTML='🐺 <span>Cerbère</span>';nav.insertBefore(cerb,analyses||null);}
}
function assurerSectionCerbere_(){
  let s=q('cerbere');if(s)return s;
  const main=document.querySelector('.main'),generic=q('generic-view');
  s=document.createElement('section');s.id='cerbere';s.className='view';main.insertBefore(s,generic);return s;
}
function ouvrirCerbereUI(){
  masquerToutesLesVuesCerbere_();activerNavCerbere_();
  if(q('page-title'))q('page-title').textContent='Cerbère';
  if(q('page-eyebrow'))q('page-eyebrow').textContent='Contrôle d’exécution';
  const s=assurerSectionCerbere_();s.classList.add('active');
  s.innerHTML=`<article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">POLICE DU BUDGET QUOTIDIEN</span><h2>🐺 Cerbère</h2></div><button class="secondary-button" id="cerbere-refresh-37">Actualiser</button></div><p class="helper-text">Cerbère pilote simultanément le présent et le mois suivant. Les ajustements sont locaux à chaque période ; P0 reste la référence maître.</p><div id="cerbere-content" class="loading">Connexion à Cerbère 3.7…</div></article>`;
  const lancer=()=>{
    if(typeof window.chargerCerbereV2UI==='function')window.chargerCerbereV2UI(true);
    else {const z=q('cerbere-content');if(z)z.innerHTML='<div class="cerb-error">Le cockpit Cerbère 3.7 n’est pas chargé.</div>';}
  };
  q('cerbere-refresh-37').onclick=lancer;lancer();
}

document.addEventListener('click',function(e){
  const b=e.target.closest&&e.target.closest('.nav-item[data-view="cerbere"]');
  if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();ouvrirCerbereUI();
},true);
window.ouvrirCerbereUI=ouvrirCerbereUI;
document.addEventListener('DOMContentLoaded',assurerNavigationCerbere_);
setTimeout(assurerNavigationCerbere_,500);
})();
</script>

<script>
(function(){'use strict';
const moneyPluxee=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
let dernierGesteCerbere=0,chargementPluxeeEnCours=false;

document.addEventListener('pointerdown',e=>{if(e.target&&e.target.closest&&e.target.closest('#cerbere'))dernierGesteCerbere=Date.now();},true);
document.addEventListener('input',e=>{if(e.target&&e.target.closest&&e.target.closest('#cerbere'))dernierGesteCerbere=Date.now();},true);

function renduPluxeeCerbere_(e){
  const z=document.getElementById('cerbere-content');if(!z||!e||e.ok===false)return;
  let panel=document.getElementById('c37-pluxee');
  if(!panel){panel=document.createElement('section');panel.id='c37-pluxee';panel.className='c37-pluxee';const canons=z.querySelector('.c37-canons');if(canons)canons.insertAdjacentElement('afterend',panel);else z.prepend(panel);}
  const a=e.allocation||{},r=e.reelParCategorie||{},reste=e.resteParCategorie||{},p0=e.p0||{};
  const alC=Number(a.Courses||0),alR=Number(a.Restaurants||0),unc=Number(r['À classer']||0);
  panel.innerHTML=`<div class="c37-pluxee-head"><div><small>PLUXEE · TITRES-RESTAURANT</small><h3>Enveloppe commune ${moneyPluxee(e.enveloppe)}</h3><span>Cycle depuis le rechargement du ${e.cycle?.dateRecharge||'—'}</span></div><div class="c37-pluxee-bal"><span>Solde théorique<b>${moneyPluxee(e.soldeTheorique)}</b><small>154 € − dépenses du cycle</small></span><span>Solde réel Pluxee<b>${moneyPluxee(e.soldeReel)}</b><small>Registre Pluxee</small></span><span>Écart<b>${moneyPluxee(e.ecartReelTheorique)}</b><small>Reliquat / différence de cycle</small></span></div></div>
  <div class="c37-pluxee-headrow"><span>Poste</span><span>P0</span><span>Allocation</span><span>Réel</span><span>Encore disponible</span></div>
  <div class="c37-pluxee-row"><strong>Courses Pluxee</strong><span>${moneyPluxee(p0.Courses)}</span><div><input id="c37-pluxee-courses" type="range" min="0" max="154" step="1" value="${alC}"><input id="c37-pluxee-courses-n" type="number" min="0" max="154" step="1" value="${alC}"></div><span>${moneyPluxee(r.Courses)}</span><span class="${Number(reste.Courses)<0?'neg':''}">${moneyPluxee(reste.Courses)}</span></div>
  <div class="c37-pluxee-row"><strong>Restaurants Pluxee</strong><span>${moneyPluxee(p0.Restaurants)}</span><div><input id="c37-pluxee-restaurants" type="range" min="0" max="154" step="1" value="${alR}"><input id="c37-pluxee-restaurants-n" type="number" min="0" max="154" step="1" value="${alR}"></div><span>${moneyPluxee(r.Restaurants)}</span><span class="${Number(reste.Restaurants)<0?'neg':''}">${moneyPluxee(reste.Restaurants)}</span></div>
  ${unc>0?`<p class="c37-pluxee-warn">À classer dans Pluxee : <b>${moneyPluxee(unc)}</b>. Ces dépenses diminuent le solde théorique mais ne sont affectées à aucune molette.</p>`:''}
  <div class="c37-pluxee-actions"><small>Les deux allocations totalisent toujours 154 €. Pluxee reste hors trésorerie Hello bank.</small><button class="secondary-button" id="c37-pluxee-reset">Revenir au P0 ${moneyPluxee(p0.Courses)} / ${moneyPluxee(p0.Restaurants)}</button><button class="primary-button" id="c37-pluxee-save">Valider Pluxee</button></div>`;
  const cr=document.getElementById('c37-pluxee-courses'),cn=document.getElementById('c37-pluxee-courses-n'),rr=document.getElementById('c37-pluxee-restaurants'),rn=document.getElementById('c37-pluxee-restaurants-n');
  const syncC=v=>{v=Math.max(0,Math.min(154,Number(v||0)));cr.value=cn.value=v;rr.value=rn.value=154-v;};
  const syncR=v=>{v=Math.max(0,Math.min(154,Number(v||0)));rr.value=rn.value=v;cr.value=cn.value=154-v;};
  cr.oninput=()=>syncC(cr.value);cn.oninput=()=>syncC(cn.value);rr.oninput=()=>syncR(rr.value);rn.oninput=()=>syncR(rn.value);
  document.getElementById('c37-pluxee-save').onclick=()=>{dernierGesteCerbere=Date.now();const b=document.getElementById('c37-pluxee-save');b.disabled=true;google.script.run.withSuccessHandler(x=>{b.disabled=false;renduPluxeeCerbere_(x);}).withFailureHandler(err=>{b.disabled=false;alert(err.message||err);}).sauvegarderAllocationPluxeeCerbere20260827({Courses:Number(cn.value),Restaurants:Number(rn.value)});};
  document.getElementById('c37-pluxee-reset').onclick=()=>{dernierGesteCerbere=Date.now();google.script.run.withSuccessHandler(renduPluxeeCerbere_).withFailureHandler(err=>alert(err.message||err)).reinitialiserAllocationPluxeeCerbere20260827();};
}

function chargerBlocPluxeeCerbere_(){if(chargementPluxeeEnCours)return;const z=document.getElementById('cerbere-content');if(!z||!z.querySelector('.c37-canons'))return;chargementPluxeeEnCours=true;google.script.run.withSuccessHandler(e=>{chargementPluxeeEnCours=false;renduPluxeeCerbere_(e);}).withFailureHandler(()=>{chargementPluxeeEnCours=false;}).chargerPluxeeCerbere20260827();}

function installerGardeCerbere_(){
  const original=window.chargerCerbereV2UI;if(typeof original!=='function'||original.__gardeCerbere)return;
  const protege=function(force){
    const z=document.getElementById('cerbere-content');
    const dejaCharge=!!(z&&z.querySelector('.c37-canons'));
    const actionRecente=Date.now()-dernierGesteCerbere<5000;
    if(dejaCharge&&!force&&!actionRecente){chargerBlocPluxeeCerbere_();return;}
    const res=original.apply(this,arguments);
    setTimeout(chargerBlocPluxeeCerbere_,300);
    setTimeout(chargerBlocPluxeeCerbere_,1200);
    return res;
  };
  protege.__gardeCerbere=true;protege.__original=original;window.chargerCerbereV2UI=protege;
}

const obs=new MutationObserver(()=>{installerGardeCerbere_();chargerBlocPluxeeCerbere_();});
obs.observe(document.documentElement,{childList:true,subtree:true});
document.addEventListener('DOMContentLoaded',()=>{installerGardeCerbere_();chargerBlocPluxeeCerbere_();});

const st=document.createElement('style');st.textContent=`.c37-pluxee{margin:12px 0;border:1px solid #c9dfd7;border-radius:14px;background:#fbfdfc;padding:12px}.c37-pluxee-head{display:grid;grid-template-columns:1fr 1.6fr;gap:12px;align-items:center}.c37-pluxee-head h3{margin:2px 0 0;font-size:19px}.c37-pluxee-head small,.c37-pluxee-head span{display:block}.c37-pluxee-bal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.c37-pluxee-bal span{background:#edf7f3;border-radius:9px;padding:8px;font-size:11px}.c37-pluxee-bal b{display:block;font-size:17px}.c37-pluxee-bal small{font-size:9px}.c37-pluxee-headrow,.c37-pluxee-row{display:grid;grid-template-columns:1.2fr .6fr 1.6fr .7fr .8fr;gap:8px;align-items:center}.c37-pluxee-headrow{font-size:10px;font-weight:800;color:#65746f;padding:10px 6px 5px}.c37-pluxee-row{border-top:1px solid #e7efec;padding:8px 6px;font-size:12px}.c37-pluxee-row div{display:grid;grid-template-columns:1fr 62px;gap:6px}.c37-pluxee-row input[type=number]{width:100%;box-sizing:border-box}.c37-pluxee-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:10px}.c37-pluxee-actions small{margin-right:auto}.c37-pluxee-warn{background:#fff4dd;border-radius:8px;padding:7px 9px;font-size:11px}@media(max-width:900px){.c37-pluxee-head{grid-template-columns:1fr}.c37-pluxee-bal{grid-template-columns:1fr 1fr 1fr}}@media(max-width:700px){.c37-pluxee-headrow{display:none}.c37-pluxee-row{grid-template-columns:1fr}.c37-pluxee-bal{grid-template-columns:1fr}.c37-pluxee-actions{display:grid}.c37-pluxee-actions small{margin:0}}`;document.head.appendChild(st);
})();
</script>

<script>
(function(){
'use strict';
const q=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function assurerNavExpress_(){
  const nav=document.querySelector('.nav');if(!nav)return;
  if(document.querySelector('[data-view="cerbere-express"]'))return;
  const cerbere=document.querySelector('[data-view="cerbere"]');
  const b=document.createElement('button');b.className='nav-item';b.dataset.view='cerbere-express';b.innerHTML='⚡ <span>Cerbère Express</span>';
  if(cerbere&&cerbere.nextSibling)nav.insertBefore(b,cerbere.nextSibling);else nav.appendChild(b);
}
function assurerSectionExpress_(){
  let s=q('cerbere-express');if(s)return s;
  const main=document.querySelector('.main'),generic=q('generic-view');
  s=document.createElement('section');s.id='cerbere-express';s.className='view';main.insertBefore(s,generic);return s;
}
function ligne_(x){
  const pct=Math.max(0,Math.min(100,Number(x.partConsommee||0)));
  return `<div class="cex-row ${esc(x.niveau||'vert')}"><div class="cex-row-head"><strong>${esc(x.categorie)}</strong><b>${money(x.reste)}</b></div><div class="cex-bar"><span style="width:${pct}%"></span></div><small>${money(x.consomme)} / ${money(x.allocation)} · ${esc(x.message||'')}</small></div>`;
}
function renderExpress_(v){
  const s=assurerSectionExpress_();
  if(!v||v.ok===false){s.innerHTML='<article class="card panel"><div class="cerb-error">Cerbère Express indisponible.</div></article>';return;}
  const p=v.pilotable||{},pl=v.pluxee||{},m=v.meteo||{},c=v.consigneSaillante||{};
  s.innerHTML=`<article class="card panel cex-shell"><div class="panel-heading"><div><span class="panel-kicker">DÉCISION QUOTIDIENNE</span><h2>⚡ Cerbère Express</h2></div><button class="secondary-button" id="cex-refresh">Actualiser</button></div>
  <div class="cex-weather"><span>${esc(m.emoji||'🌤️')}</span><div><h3>${esc(m.libelle||'Situation')}</h3><p>${esc(m.resume||'')}</p></div></div>
  <div class="cex-action"><small>À RETENIR</small><strong>${esc(c.texte||'')}</strong></div>
  <div class="cex-grid"><div class="cex-metric"><small>Reste pilotable</small><b>${money(p.reste)}</b></div><div class="cex-metric"><small>Consommé</small><b>${money(p.consomme)}</b></div></div>
  <div class="cex-card"><h3>Pilotable</h3>${(p.lignes||[]).map(ligne_).join('')}</div>
  ${pl.disponible?`<div class="cex-card"><h3>Pluxee · solde réel ${money(pl.soldeReel)}</h3><small>Solde théorique ${money(pl.soldeTheorique)}</small>${(pl.lignes||[]).map(ligne_).join('')}</div>`:''}
  <div class="cex-card"><h3>Prochain cycle</h3><p>CB déjà engagée : <b>${money(v.contexte&&v.contexte.cbDejaEngageeM1)}</b><br>Trajectoire M+1 : <b>${money(v.contexte&&v.contexte.prochainCycle)}</b></p></div>
  <p class="helper-text">Lecture seule · décisions à la date réelle d’achat · Cerbère complet reste l’autorité financière.</p></article>`;
  const r=q('cex-refresh');if(r)r.onclick=chargerExpress_;
}
function chargerExpress_(){
  const s=assurerSectionExpress_();
  s.innerHTML='<article class="card panel"><div class="loading">Chargement de Cerbère Express…</div></article>';
  google.script.run.withSuccessHandler(renderExpress_).withFailureHandler(e=>{s.innerHTML='<article class="card panel"><div class="cerb-error">'+esc(e&&e.message||e)+'</div></article>';}).chargerVueCerbereExpress20260827();
}
function ouvrirExpress_(){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view==='cerbere-express'));
  if(q('page-title'))q('page-title').textContent='Cerbère Express';
  if(q('page-eyebrow'))q('page-eyebrow').textContent='Décision quotidienne';
  assurerSectionExpress_().classList.add('active');chargerExpress_();
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.nav-item[data-view="cerbere-express"]');if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();ouvrirExpress_();},true);
function maintenirNavExpress_(){assurerNavExpress_();}
maintenirNavExpress_();
document.addEventListener('DOMContentLoaded',maintenirNavExpress_);
setTimeout(maintenirNavExpress_,100);
setTimeout(maintenirNavExpress_,500);
setTimeout(maintenirNavExpress_,1500);
const observerNavExpress_=new MutationObserver(()=>maintenirNavExpress_());
observerNavExpress_.observe(document.documentElement,{childList:true,subtree:true});
window.ouvrirCerbereExpressUI=ouvrirExpress_;
const st=document.createElement('style');st.textContent=`.cex-shell{max-width:760px}.cex-weather{display:flex;gap:14px;align-items:center;background:#f4f8f6;border-radius:14px;padding:14px;margin:12px 0}.cex-weather>span{font-size:42px}.cex-weather h3,.cex-weather p{margin:0}.cex-action{background:#fff4dd;border-radius:14px;padding:14px;margin:12px 0}.cex-action small{display:block;font-weight:800;margin-bottom:4px}.cex-action strong{font-size:18px}.cex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.cex-metric{background:#eef6f2;border-radius:14px;padding:12px}.cex-metric small{display:block}.cex-metric b{font-size:22px}.cex-card{border:1px solid #e4ece8;border-radius:14px;padding:14px;margin-top:12px}.cex-card h3{margin:0 0 8px}.cex-row{padding:10px 0;border-top:1px solid #edf1ef}.cex-row:first-of-type{border-top:0}.cex-row-head{display:flex;justify-content:space-between;gap:12px}.cex-bar{height:8px;background:#e7ece9;border-radius:999px;overflow:hidden;margin:6px 0}.cex-bar span{display:block;height:100%;background:#5f7e73}.cex-row.orange .cex-bar span{background:#b8871f}.cex-row.rouge .cex-bar span{background:#ad4a41}.cex-row.orange .cex-row-head b{color:#9a6c0e}.cex-row.rouge .cex-row-head b{color:#a13f38}.cex-row small{color:#687a73}@media(max-width:700px){.cex-grid{grid-template-columns:1fr}.cex-shell{max-width:none}}`;document.head.appendChild(st);
})();
</script>
