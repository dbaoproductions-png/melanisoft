<script>
(function(){
function cQ(id){return document.getElementById(id)}
function cMoney(n){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0))}
function cDate(v){return v?new Date(v).toLocaleDateString('fr-FR'):'—'}
function cEsc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function installerCerbere(){
 const nav=document.querySelector('.nav');if(!nav||document.querySelector('[data-view="cerbere"]'))return;
 const b=document.createElement('button');b.className='nav-item';b.dataset.view='cerbere';b.innerHTML='🐺 <span>Cerbère</span>';const ana=document.querySelector('[data-view="analyses"]');nav.insertBefore(b,ana||null);
 const main=document.querySelector('.main');const generic=cQ('generic-view');const s=document.createElement('section');s.id='cerbere';s.className='view';s.innerHTML='<div id="cerbere-root"><article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Pilotage prévisionnel</span><h2>Cerbère</h2></div><button class="secondary-button" id="cerbere-refresh">Actualiser</button></div><p class="helper-text">Cerbère lit les données réelles mais n’y écrit jamais. Il agit uniquement sur le prévisionnel, les actions et les objectifs.</p><div id="cerbere-content" class="loading">Calcul des 6 périodes…</div></article></div>';main.insertBefore(s,generic);
 b.addEventListener('click',()=>setTimeout(chargerCerbereUI,50));cQ('cerbere-refresh').onclick=chargerCerbereUI;
}
function afficherCerbere(d){
 const root=cQ('cerbere-content');if(!root)return;const tabs=d.periodes.map((p,i)=>`<button class="secondary-button cerb-tab ${i===0?'active':''}" data-cb="${i}">P${i+1}</button>`).join('');
 root.innerHTML=`<div class="warning-box"><strong>Règle dure :</strong> épargne 50 € sanctuarisée ; les objectifs et protections CB sont retirés avant de calculer l’argent pilotable. Les données réelles restent intactes.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0">${tabs}</div><div id="cerbere-period"></div><details style="margin-top:16px"><summary><strong>Actions interrogées (${d.actions.length})</strong></summary><div style="margin-top:8px">${d.actions.map(a=>`<div>${cEsc(a.nom)} · ${cDate(a.date_effet)} · ${cMoney(a.montant)} · ${cEsc(a.statut)}</div>`).join('')||'Aucune'}</div></details><details style="margin-top:12px"><summary><strong>Objectifs interrogés (${d.objectifs.length})</strong></summary><div style="margin-top:8px">${d.objectifs.map(o=>`<div>${cEsc(o.nom)} · cible ${cMoney(o.montant_cible)} · ${cDate(o.date_cible)} · priorité ${cEsc(o.priorite)}</div>`).join('')||'Aucun'}</div></details>`;
 root.querySelectorAll('.cerb-tab').forEach(x=>x.onclick=()=>{root.querySelectorAll('.cerb-tab').forEach(y=>y.classList.remove('active'));x.classList.add('active');renderPeriode(d.periodes[Number(x.dataset.cb)])});renderPeriode(d.periodes[0]);
}
function renderPeriode(p){const el=cQ('cerbere-period');if(!el)return;const badge=p.etat==='rouge'?'🔴':p.etat==='orange'?'🟠':'🟢';const flow=[['Ressources prévues',p.recettes,'recette'],['Charges fixes',-p.chargesFixes,'fixe'],['Épargne sanctuarisée',-p.epargne,'epargne'],['Protection CB différées',-p.protectionCb,'cb'],['Objectifs réservés',-p.objectifs,'objectif'],['ENVELOPPE PILOTABLE',p.enveloppePilotable,'pilotable']];
 const boxes=flow.map((x,i)=>`<div style="border-left:6px solid ${x[2]==='pilotable'?'#0f6b57':'#a5b7b3'};padding:10px 14px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)"><div style="display:flex;justify-content:space-between;gap:12px"><strong>${cEsc(x[0])}</strong><strong>${cMoney(x[1])}</strong></div></div>${i<flow.length-1?'<div style="text-align:center;font-size:20px;line-height:22px">↓</div>':''}`).join('');
 const cats=p.enveloppes.map(c=>`<div style="border-left:7px solid ${c.couleur};padding:9px 12px;margin:7px 0;background:#fff;border-radius:9px;display:grid;grid-template-columns:1.5fr .8fr .8fr .8fr;gap:8px"><strong>${cEsc(c.categorie)}</strong><span>${cMoney(c.prevu)}</span><span>${cMoney(c.reel)}</span><span>${c.etat==='rouge'?'🔴':c.etat==='orange'?'🟠':'🟢'} ${cMoney(c.reste)}</span></div>`).join('');
 const acts=(p.actions||[]).map(a=>`<li>${cEsc(a.nom)} : ${cMoney(a.montant)}${a.cible?' → '+cEsc(a.cible):''}</li>`).join('');
 el.innerHTML=`<div class="cards" style="margin-bottom:14px"><article class="card metric-card"><span>Période</span><strong>${cDate(p.periode.debut)} → ${cDate(p.periode.fin)}</strong><small>${badge} ${cEsc(p.etat)}</small></article><article class="card metric-card"><span>Dépenses réelles</span><strong>${cMoney(p.depensesReelles)}</strong><small>Lecture seule</small></article><article class="card metric-card"><span>Disponible pilotable</span><strong>${cMoney(p.enveloppePilotable)}</strong><small>Après protections</small></article></div><div style="max-width:760px;margin:auto">${boxes}</div>${acts?`<div class="warning-box" style="margin-top:14px"><strong>Actions de la période</strong><ul>${acts}</ul></div>`:''}<div style="margin-top:18px"><div style="display:grid;grid-template-columns:1.5fr .8fr .8fr .8fr;gap:8px;font-size:12px;font-weight:700;padding:0 12px"><span>Catégorie</span><span>Budget</span><span>Réel</span><span>Reste</span></div>${cats||'<div class="empty-state">Pas assez d’historique pour répartir les catégories.</div>'}</div>`;
}
function chargerCerbereUI(){const el=cQ('cerbere-content');if(el)el.textContent='Calcul des 6 périodes…';google.script.run.withSuccessHandler(afficherCerbere).withFailureHandler(e=>{if(el)el.textContent='Erreur Cerbère : '+(e.message||e)}).chargerCerbereV1()}
document.addEventListener('DOMContentLoaded',()=>setTimeout(installerCerbere,900));
})();
</script>
