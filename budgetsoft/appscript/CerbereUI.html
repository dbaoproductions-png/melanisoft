<script>
(function(){
window.budgetsoftModules=window.budgetsoftModules||{};
window.budgetsoftModules.cerbere=afficherModuleCerbereV2;
const cq=id=>document.getElementById(id), cm=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0)), cd=v=>v?new Date(v).toLocaleDateString('fr-FR'):'—', ce=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cerbereData=null;
function afficherModuleCerbereV2(){const z=cq('generic-view');z.innerHTML=`<article class="card panel"><div class="panel-heading"><div><span class="panel-kicker">Police du budget quotidien</span><h2>🐺 Cerbère</h2></div><button class="secondary-button" onclick="chargerCerbereV2UI()">Actualiser</button></div><p class="helper-text">Cerbère applique la stratégie du Plan sur P1–P6. Il lit le réel, mesure les écarts et propose des compensations ; il ne modifie ni le réel ni la stratégie.</p><div id="cerbere-content" class="loading">Calcul des six périodes…</div></article>`;chargerCerbereV2UI();styleCerbere();}
window.chargerCerbereV2UI=function(){const z=cq('cerbere-content');if(z)z.textContent='Calcul des six périodes…';google.script.run.withSuccessHandler(d=>{cerbereData=d;renderCerbere(d)}).withFailureHandler(e=>{if(z)z.textContent='Erreur Cerbère : '+(e.message||e)}).chargerCerbereV2()};
function renderCerbere(d){const z=cq('cerbere-content');if(!z)return;z.innerHTML=`<div class="cerb-rule"><strong>Règle :</strong> stratégie reçue du Plan · épargne 50 € protégée · aucune compensation sans validation.</div><div class="cerb-tabs">${d.periodes.map((p,i)=>`<button class="secondary-button ${i===0?'active':''}" data-cp="${i}">P${i+1}</button>`).join('')}</div><div id="cerb-period"></div>`;z.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{z.querySelectorAll('[data-cp]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderPeriode(d.periodes[Number(b.dataset.cp)])});renderPeriode(d.periodes[0]);}
function renderPeriode(p){const z=cq('cerb-period');if(!z)return;const badge=p.etat==='rouge'?'🔴':p.etat==='orange'?'🟠':'🟢';const flow=[['Ressources',p.ressources],['Charges fixes pondérées',-p.fixesPonderees],['Dépenses exceptionnelles',-p.depensesExceptionnelles],['Épargne protégée',-p.epargne],['Objectifs réservés',-p.reserveObjectifs],['Enveloppe pilotable',p.enveloppePilotable]];const comps=(p.propositions||[]).map(x=>`<div class="cerb-prop"><strong>${x.niveau==='periode'?'Compensation P'+p.index:x.niveau==='periode_suivante'?'Compensation P'+p.index+' → P'+x.periode_cible:'Escalade stratégique'}</strong><div>Dépassement ${ce(x.origine)} : ${cm(x.montant)}</div>${(x.compensations||[]).map(c=>`<small>− ${cm(c.montant)} sur ${ce(c.categorie)}</small>`).join('')}${x.reste_a_reporter?`<small>Reporter ${cm(x.reste_a_reporter)} sur P${x.periode_cible}</small>`:''}${x.message?`<small>${ce(x.message)}</small>`:''}<em>Proposition seulement — validation requise</em></div>`).join('');z.innerHTML=`<div class="cards"><article class="card metric-card"><span>Période</span><strong>${cd(p.periode.debut)} → ${cd(p.periode.fin)}</strong><small>${badge} ${ce(p.etat)}</small></article><article class="card metric-card"><span>Réel constaté</span><strong>${cm(p.depensesReelles)}</strong><small>Lecture seule</small></article><article class="card metric-card"><span>Pilotable</span><strong>${cm(p.enveloppePilotable)}</strong><small>Après protections</small></article></div><div class="cerb-flow">${flow.map((x,i)=>`<div class="cerb-box"><span>${ce(x[0])}</span><strong>${cm(x[1])}</strong></div>${i<flow.length-1?'<div class="cerb-arrow">↓</div>':''}`).join('')}</div>${p.plan.evenements.length?`<div class="cerb-note"><strong>Événements intégrés</strong>${p.plan.evenements.map(e=>`<small>${ce(e.libelle)} · ${cm(e.montant)}</small>`).join('')}</div>`:''}${p.plan.actions.length?`<div class="cerb-note"><strong>Actions dont l’effet est actif</strong>${p.plan.actions.map(a=>`<small>${ce(a.libelle)} · ${ce(a.impact_type)} ${cm(a.impact_montant)}</small>`).join('')}</div>`:''}<div class="cerb-grid-head"><span>Catégorie</span><span>Canonique</span><span>Réel</span><span>Reste</span></div>${p.enveloppes.map(c=>`<div class="cerb-cat"><strong>${ce(c.categorie)}</strong><span>${cm(c.prevu)}</span><span>${cm(c.reel)}</span><span>${c.etat==='rouge'?'🔴':c.etat==='orange'?'🟠':'🟢'} ${cm(c.reste)}</span></div>`).join('')}<div class="cerb-props">${comps||'<div class="empty-state">Aucune compensation nécessaire.</div>'}</div>`;}
function styleCerbere(){if(cq('cerb-style'))return;const s=document.createElement('style');s.id='cerb-style';s.textContent=`.cerb-rule,.cerb-note{padding:12px 14px;background:rgba(20,125,100,.07);border-radius:12px;margin:12px 0}.cerb-note small,.cerb-prop small,.cerb-prop em{display:block;margin-top:5px}.cerb-tabs{display:flex;gap:7px;margin:15px 0}.cerb-flow{max-width:720px;margin:18px auto}.cerb-box{display:flex;justify-content:space-between;padding:11px 14px;background:#fff;border-left:6px solid #147d64;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}.cerb-arrow{text-align:center;font-size:20px}.cerb-grid-head,.cerb-cat{display:grid;grid-template-columns:1.5fr .8fr .8fr .9fr;gap:8px;padding:9px 12px}.cerb-grid-head{font-size:12px;font-weight:700}.cerb-cat{background:#fff;border-bottom:1px solid rgba(20,125,100,.1)}.cerb-props{margin-top:18px}.cerb-prop{border-left:6px solid #d18a00;background:#fff8e8;padding:12px 14px;border-radius:10px;margin:9px 0}.cerb-prop em{font-size:.82rem;opacity:.7}`;document.head.appendChild(s)}
})();
</script>
