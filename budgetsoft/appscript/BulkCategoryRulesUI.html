<script>
let categoriesBulkFraiches=[];

document.addEventListener('DOMContentLoaded',()=>{
  installerIndicateurSansCategorie_();
  const ancienRendreOperationsPage=window.rendreOperationsPage;
  if(typeof ancienRendreOperationsPage==='function'&&!ancienRendreOperationsPage.__avecSansCategorie){
    const wrapper=function(){const r=ancienRendreOperationsPage.apply(this,arguments);mettreAJourIndicateurSansCategorie_();return r;};
    wrapper.__avecSansCategorie=true;
    window.rendreOperationsPage=wrapper;
  }
  const tb=document.querySelector('#operations .toolbar-buttons');if(tb&&!document.getElementById('bulk-category-button')){const b=document.createElement('button');b.id='bulk-category-button';b.type='button';b.className='secondary-button';b.textContent='🏷 Catégoriser en masse';b.onclick=ouvrirReglesCategories;tb.prepend(b);}if(document.getElementById('bulk-category-modal'))return;const m=document.createElement('div');m.id='bulk-category-modal';m.className='modal hidden';m.innerHTML=`<div class="modal-card wide-modal bulk-category-card"><div class="modal-heading"><div><p class="panel-kicker">Règles de catégorisation</p><h2>Catégoriser en masse</h2></div><button class="modal-close" id="close-bulk-category">×</button></div><p class="helper-text">Une règle explicite que vous créez ici est prioritaire sur les anciennes catégories. Les listes sont relues directement depuis l’onglet Categories à chaque ouverture.</p><label>Libellés / mots-clés<textarea id="bulk-category-motifs" rows="6" placeholder="Bricaste\nLeroy Merlin\nAdeo"></textarea></label><div class="form-grid" style="margin-top:12px"><label>Type<select id="bulk-category-type"><option value="depense">Dépenses</option><option value="revenu">Revenus</option><option value="tresorerie">Mouvements de trésorerie</option></select></label><label>Catégorie<select id="bulk-category-category"></select></label></div><label class="checkbox-line" style="margin-top:12px"><input type="checkbox" id="bulk-category-only-empty"> Ne modifier que les opérations actuellement Sans catégorie</label><div id="bulk-category-result" class="helper-text" style="margin-top:12px"></div><div id="bulk-category-preview" class="bulk-category-preview"></div><div class="form-actions bulk-category-actions"><button class="secondary-button" type="button" id="bulk-category-analyze">Analyser</button><button class="primary-button" id="bulk-category-apply" type="button" disabled>Appliquer au rétrospectif</button></div></div>`;document.body.appendChild(m);const style=document.createElement('style');style.textContent=`.bulk-category-card{max-height:calc(100vh - 40px);overflow:auto;overscroll-behavior:contain}.bulk-category-preview{max-height:280px;overflow:auto;margin-top:10px}.bulk-category-actions{position:sticky;bottom:-24px;background:#fff;padding:12px 0 2px;z-index:2;border-top:1px solid var(--line)}.bulk-category-conflict{color:var(--warning);font-weight:700}@media(max-height:700px){.bulk-category-card{max-height:94vh}.bulk-category-preview{max-height:180px}}`;document.head.appendChild(style);document.getElementById('close-bulk-category').onclick=()=>m.classList.add('hidden');m.addEventListener('click',e=>{if(e.target===m)m.classList.add('hidden');});document.getElementById('bulk-category-type').onchange=remplirCategoriesBulk;document.getElementById('bulk-category-analyze').onclick=analyserReglesCategoriesUI;document.getElementById('bulk-category-apply').onclick=appliquerReglesCategoriesUI;
  setTimeout(mettreAJourIndicateurSansCategorie_,200);
});

function installerIndicateurSansCategorie_(){
  const zone=document.querySelector('#operations .operations-summary');
  if(!zone||document.getElementById('operations-uncategorized'))return;
  const card=document.createElement('article');card.className='card metric-card';card.innerHTML='<span>Sans catégorie</span><strong id="operations-uncategorized">0</strong><small>Opérations restant à classer</small>';
  zone.appendChild(card);
}
function mettreAJourIndicateurSansCategorie_(){
  installerIndicateurSansCategorie_();
  const el=document.getElementById('operations-uncategorized');if(!el)return;
  const ops=(typeof state!=='undefined'&&state.data&&Array.isArray(state.data.Operations))?state.data.Operations:[];
  el.textContent=ops.filter(o=>!String(o.categorie||'').trim()).length;
}

function ouvrirReglesCategories(){const m=document.getElementById('bulk-category-modal');if(!m)return;m.classList.remove('hidden');document.getElementById('bulk-category-result').textContent='Actualisation des catégories…';document.getElementById('bulk-category-apply').disabled=true;actualiserCategoriesBulkDepuisServeur_();}
function actualiserCategoriesBulkDepuisServeur_(){
  google.script.run.withSuccessHandler(cats=>{categoriesBulkFraiches=Array.isArray(cats)?cats:[];remplirCategoriesBulk();document.getElementById('bulk-category-result').textContent='';}).withFailureHandler(e=>{categoriesBulkFraiches=(typeof state!=='undefined'&&state.data&&state.data.Categories)?state.data.Categories:[];remplirCategoriesBulk();document.getElementById('bulk-category-result').textContent='Impossible de relire les catégories : '+(e.message||String(e));}).lireTable('Categories');
}
function remplirCategoriesBulk(){const type=document.getElementById('bulk-category-type').value,s=document.getElementById('bulk-category-category'),data=categoriesBulkFraiches.length?categoriesBulkFraiches:((typeof state!=='undefined'&&state.data&&state.data.Categories)?state.data.Categories:[]),cats=data.filter(c=>(typeof estActif==='function'?estActif(c.actif):String(c.actif).toLowerCase()!=='false')&&String(c.type||'').toLowerCase()===type).map(c=>String(c.nom||'').trim()).filter(Boolean);const uniques=[...new Set(cats)].sort((a,b)=>a.localeCompare(b,'fr'));s.innerHTML=uniques.length?uniques.map(x=>`<option value="${typeof echapperAttribut==='function'?echapperAttribut(x):x}">${typeof echapper==='function'?echapper(x):x}</option>`).join(''):'<option value="">Aucune catégorie pour ce type</option>';}
function payloadBulk(){return{motifs:document.getElementById('bulk-category-motifs').value,type:document.getElementById('bulk-category-type').value,categorie:document.getElementById('bulk-category-category').value,ecraser:!document.getElementById('bulk-category-only-empty').checked};}
function analyserReglesCategoriesUI(){const r=document.getElementById('bulk-category-result'),p=document.getElementById('bulk-category-preview'),a=document.getElementById('bulk-category-analyze'),b=document.getElementById('bulk-category-apply');a.disabled=true;a.textContent='Analyse en cours…';b.disabled=true;r.textContent='Recherche des opérations correspondantes…';p.innerHTML='';google.script.run.withSuccessHandler(x=>{a.disabled=false;a.textContent='Analyser';r.innerHTML=`${x.total} opération(s) trouvée(s) · ${x.sansCategorie} sans catégorie · ${x.dejaBonneCategorie} déjà dans la bonne catégorie · <span class="bulk-category-conflict">${x.categorieDifferente} dans une autre catégorie</span>.`;p.innerHTML=(x.exemples||[]).map(o=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)"><strong>${typeof echapper==='function'?echapper(o.libelle||''):o.libelle||''}</strong> · ${typeof echapper==='function'?echapper(o.categorie||'Sans catégorie'):o.categorie||'Sans catégorie'} · ${typeof money!=='undefined'?money.format(Number(o.montant||0)):Number(o.montant||0).toFixed(2)+' €'}</div>`).join('');b.disabled=!x.total;}).withFailureHandler(e=>{a.disabled=false;a.textContent='Analyser';r.textContent='Erreur : '+(e.message||String(e));}).analyserRegleCategorie(payloadBulk());}
function appliquerReglesCategoriesUI(){const r=document.getElementById('bulk-category-result'),a=document.getElementById('bulk-category-analyze'),b=document.getElementById('bulk-category-apply');a.disabled=true;b.disabled=true;b.textContent='Application…';r.textContent='Application de votre règle à l’historique…';google.script.run.withSuccessHandler(x=>{a.disabled=false;b.textContent='Appliquer au rétrospectif';r.textContent=`${x.modifiees} opération(s) reclassée(s) en ${x.categorie}. ${x.dejaCorrectes?x.dejaCorrectes+' déjà correcte(s). ':''}${x.ignorees?x.ignorees+' conservée(s) car la limitation Sans catégorie était active.':''}`;if(typeof charger==='function')charger();setTimeout(mettreAJourIndicateurSansCategorie_,400);}).withFailureHandler(e=>{a.disabled=false;b.disabled=false;b.textContent='Appliquer au rétrospectif';r.textContent='Erreur : '+(e.message||String(e));}).appliquerRegleCategorie(payloadBulk());}
</script>
