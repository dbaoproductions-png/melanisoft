<script>
document.addEventListener('DOMContentLoaded',()=>{const tb=document.querySelector('#operations .toolbar-buttons');if(tb&&!document.getElementById('bulk-category-button')){const b=document.createElement('button');b.id='bulk-category-button';b.type='button';b.className='secondary-button';b.textContent='🏷 Catégoriser en masse';b.onclick=ouvrirReglesCategories;tb.prepend(b);}const m=document.createElement('div');m.id='bulk-category-modal';m.className='modal hidden';m.innerHTML=`<div class="modal-card wide-modal"><div class="modal-heading"><div><p class="panel-kicker">Règles de catégorisation</p><h2>Catégoriser en masse</h2></div><button class="modal-close" onclick="document.getElementById('bulk-category-modal').classList.add('hidden')">×</button></div><p class="helper-text">Un libellé ou mot-clé par ligne. Exemple : Marie Blachère, Artur Ramonville, Aldi. BudgetSoft recherche ces termes dans les libellés bancaires historiques.</p><label>Libellés / mots-clés<textarea id="bulk-category-motifs" rows="6" placeholder="Marie Blachère\nArtur Ramonville\nAldi"></textarea></label><div class="form-grid" style="margin-top:12px"><label>Type<select id="bulk-category-type"><option value="depense">Dépense</option><option value="revenu">Revenu</option></select></label><label>Catégorie<select id="bulk-category-category"></select></label></div><label class="checkbox-line" style="margin-top:12px"><input type="checkbox" id="bulk-category-overwrite"> Remplacer aussi les catégories déjà renseignées</label><div id="bulk-category-result" class="helper-text" style="margin-top:12px"></div><div id="bulk-category-preview" style="max-height:260px;overflow:auto;margin-top:10px"></div><div class="form-actions"><button class="secondary-button" type="button" onclick="analyserReglesCategoriesUI()">Analyser</button><button class="primary-button" id="bulk-category-apply" type="button" onclick="appliquerReglesCategoriesUI()" disabled>Appliquer au rétrospectif</button></div></div>`;document.body.appendChild(m);document.getElementById('bulk-category-type').onchange=remplirCategoriesBulk;});
function ouvrirReglesCategories(){document.getElementById('bulk-category-modal').classList.remove('hidden');remplirCategoriesBulk();}
function remplirCategoriesBulk(){const type=document.getElementById('bulk-category-type').value,s=document.getElementById('bulk-category-category'),cats=(state.data?.Categories||[]).filter(c=>estActif(c.actif)&&String(c.type||'').toLowerCase()===type).map(c=>String(c.nom||'').trim()).filter(Boolean);s.innerHTML=[...new Set(cats)].sort((a,b)=>a.localeCompare(b,'fr')).map(x=>`<option value="${echapperAttribut(x)}">${echapper(x)}</option>`).join('');}
function payloadBulk(){return{motifs:document.getElementById('bulk-category-motifs').value,type:document.getElementById('bulk-category-type').value,categorie:document.getElementById('bulk-category-category').value,ecraser:document.getElementById('bulk-category-overwrite').checked};}
function analyserReglesCategoriesUI(){const r=document.getElementById('bulk-category-result'),p=document.getElementById('bulk-category-preview'),b=document.getElementById('bulk-category-apply');r.textContent='Analyse…';b.disabled=true;google.script.run.withSuccessHandler(x=>{r.textContent=`${x.total} opération(s) trouvée(s) · ${x.sansCategorie} sans catégorie · ${x.dejaCategoriees} déjà catégorisée(s).`;p.innerHTML=(x.exemples||[]).map(o=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)"><strong>${echapper(o.libelle||'')}</strong> · ${echapper(o.categorie||'Sans catégorie')} · ${money.format(Number(o.montant||0))}</div>`).join('');b.disabled=!x.total;}).withFailureHandler(e=>r.textContent='Erreur : '+(e.message||e)).analyserRegleCategorie(payloadBulk());}
function appliquerReglesCategoriesUI(){const r=document.getElementById('bulk-category-result'),b=document.getElementById('bulk-category-apply');b.disabled=true;r.textContent='Application…';google.script.run.withSuccessHandler(x=>{r.textContent=`${x.modifiees} opération(s) classée(s) en ${x.categorie}. ${x.ignorees?x.ignorees+' déjà catégorisée(s) conservée(s).':''}`;if(typeof charger==='function')charger();}).withFailureHandler(e=>{r.textContent='Erreur : '+(e.message||e);b.disabled=false;}).appliquerRegleCategorie(payloadBulk());}
</script>
