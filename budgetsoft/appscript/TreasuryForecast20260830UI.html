<style>
#comptes .accounts-summary{grid-template-columns:repeat(5,minmax(0,1fr))!important}
#treasury-forecast-card{background:#f5faf7}
#treasury-forecast-card .tf-date{display:flex;gap:6px;align-items:center;margin-top:6px}
#treasury-forecast-card input[type=date]{width:138px;padding:5px 7px;border:1px solid #dce6e1;border-radius:7px;background:white;font-size:12px}
#treasury-forecast-card .tf-confidence{font-size:11px;margin-top:4px;opacity:.68}
#operations-future-panel{margin:14px 0 18px;background:#fff;border:1px solid #e4ece8;border-radius:14px;overflow:hidden}
#operations-future-panel.hidden{display:none}
#operations-future-panel>header{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:#f8faf9;border-bottom:1px solid #edf1ef}
#operations-future-panel>header h3{margin:0;font-size:15px}#operations-future-panel>header small{opacity:.62}
.tf-future-row{display:grid;grid-template-columns:100px minmax(220px,1fr) 150px 130px;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid #edf1ef}.tf-future-row:last-child{border-bottom:0}
.tf-future-row .tf-lib b,.tf-future-row .tf-lib small{display:block}.tf-future-row .tf-lib small{opacity:.62;margin-top:2px}
.tf-badge{justify-self:start;font-size:10px;font-weight:700;letter-spacing:.03em;padding:3px 7px;border-radius:999px;background:#edf2ef}.tf-badge.certain{background:#e4f5e8}.tf-badge.tres_probable{background:#edf5e8}.tf-badge.prevu{background:#fff5d9}.tf-badge.estime{background:#f1f1f1}.tf-amount{text-align:right;font-weight:700}.tf-amount.neg{color:#9b3535}
.tf-ops-toggle.on{background:#e6f1eb!important}
#tf-cerbere-card{border:1px solid #dce9e2;background:#f5faf7;border-radius:14px;padding:14px;min-height:92px;display:flex;flex-direction:column;justify-content:center}
#tf-cerbere-card span,#tf-cerbere-card b,#tf-cerbere-card small{display:block}#tf-cerbere-card b{font-size:21px;margin:4px 0}.tf-cerbere-delta{font-size:11px;opacity:.7}
@media(max-width:1250px){#comptes .accounts-summary{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media(max-width:850px){#comptes .accounts-summary{grid-template-columns:repeat(2,minmax(0,1fr))!important}.tf-future-row{grid-template-columns:90px 1fr 110px}.tf-future-row .tf-source{display:none}}
</style>
<script>
(function(){'use strict';
const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let comptesReq=0,opsReq=0,cerbereReq=0,cerbereBase=null;
const q=id=>document.getElementById(id);
function isoLocal(d){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
function plusJ(n){const d=new Date();d.setDate(d.getDate()+n);return isoLocal(d)}
function dateFr(s){const d=new Date(s);return isNaN(d)?'—':d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'})}
function certLabel(c){return {certain:'CERTAIN',tres_probable:'TRÈS PROBABLE',prevu:'PRÉVU',estime:'ESTIMATION'}[c]||String(c||'').toUpperCase()}
function sourceLabel(s){return {operation_future:'Opération déjà connue',charge_fixe:'Charge fixe',evenement:'Événement',action:'Action',revenu_recurrent:'Revenu récurrent',debit_cb_estime:'Débit CB estimé',pilotable:'Ancienne estimation Cerbère'}[s]||s}

function installerCarteComptes(){
 const z=document.querySelector('#comptes .accounts-summary');if(!z||q('treasury-forecast-card'))return;
 const card=document.createElement('article');card.id='treasury-forecast-card';card.className='card metric-card';card.innerHTML=`<span>Solde prévisionnel</span><strong id="tf-account-value">Calcul…</strong><small id="tf-account-detail">Compte courant à J+3</small><div class="tf-date"><input type="date" id="tf-account-date" value="${plusJ(3)}"></div><div class="tf-confidence" id="tf-account-confidence"></div>`;z.appendChild(card);
 q('tf-account-date').addEventListener('change',chargerPrevisionComptes);
}
function chargerPrevisionComptes(){
 installerCarteComptes();const input=q('tf-account-date');if(!input)return;const id=++comptesReq;q('tf-account-value').textContent='Calcul…';
 google.script.run.withSuccessHandler(r=>{if(id!==comptesReq||!r||!r.ok)return;q('tf-account-value').textContent=money(r.soldePrevisionnel);q('tf-account-value').classList.toggle('amount-negative',Number(r.soldePrevisionnel)<0);q('tf-account-detail').textContent=`Réel ${money(r.soldeReel)} · variation ${Number(r.variationPrevue)>=0?'+':''}${money(r.variationPrevue)}`;q('tf-account-confidence').textContent=`Référence réelle ${dateFr(r.dateReference)} · fiabilité ${r.confiance?.libelle||'—'} · cible ${dateFr(r.dateCible)}`;}).withFailureHandler(()=>{if(id===comptesReq)q('tf-account-value').textContent='Indisponible';}).chargerTresoreriePrevisionnelleRapide20260901(input.value);
}

function installerOperations(){
 const actions=q('operations-current-actions');if(actions&&!q('tf-ops-toggle')){const b=document.createElement('button');b.id='tf-ops-toggle';b.type='button';b.className='secondary-button tf-ops-toggle';b.textContent='◷ Futures';b.onclick=()=>{const on=b.classList.toggle('on');b.textContent=on?'✓ Futures':'◷ Futures';if(on)chargerFuturesOperations();else q('operations-future-panel')?.classList.add('hidden')};actions.appendChild(b);}
 const panel=q('operations-future-panel');if(!panel){const target=document.querySelector('#operations .operations-page-panel');if(target){const p=document.createElement('section');p.id='operations-future-panel';p.className='hidden';p.innerHTML='<header><div><h3>Opérations futures probables</h3><small>Projection bancaire virtuelle : chaque prévision disparaît lorsqu’elle est remplacée par le Réel</small></div><input type="date" id="tf-ops-date" value="'+plusJ(45)+'"></header><div id="tf-ops-list"></div>';target.parentNode.insertBefore(p,target);q('tf-ops-date').onchange=chargerFuturesOperations;}}
}
function chargerFuturesOperations(){
 installerOperations();const panel=q('operations-future-panel'),date=q('tf-ops-date');if(!panel||!date)return;panel.classList.remove('hidden');const z=q('tf-ops-list'),id=++opsReq;z.innerHTML='<div class="empty-state">Calcul des mouvements futurs…</div>';
 google.script.run.withSuccessHandler(r=>{if(id!==opsReq)return;const xs=(r&&r.lignes||[]).filter(x=>x.source!=='pilotable');if(!xs.length){z.innerHTML='<div class="empty-state">Aucun mouvement futur identifié.</div>';return;}z.innerHTML=xs.map(x=>`<div class="tf-future-row"><span>${dateFr(x.date)}${x.dateConventionnelle?' *':''}</span><div class="tf-lib"><b>${esc(x.libelle)}</b><small>${esc(x.categorie||'Sans catégorie')}${x.dateConventionnelle?' · date estimée':''}</small></div><span class="tf-source">${esc(sourceLabel(x.source))}</span><div><span class="tf-badge ${esc(x.certitude)}">${esc(certLabel(x.certitude))}</span><div class="tf-amount ${Number(x.montantSigne)<0?'neg':''}">${Number(x.montantSigne)>0?'+':''}${money(x.montantSigne)}</div></div></div>`).join('');}).withFailureHandler(()=>{z.innerHTML='<div class="empty-state">Impossible de calculer les opérations futures.</div>';}).listerMouvementsFutursTresorerieRapide20260901(date.value);
}

function cibleFinCycleDepuisDom(){const root=document.querySelector('.c37-month');if(!root)return null;const t=root.querySelector('header>span')?.textContent||'';const m=t.match(/→\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(!m)return null;return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;}
function installerCerbereCard(){
 const topo=document.querySelector('.c37-month .c37-topo');if(!topo||q('tf-cerbere-card'))return false;const c=document.createElement('div');c.id='tf-cerbere-card';c.innerHTML='<span>SOLDE BANCAIRE ESTIMÉ AU 27</span><b id="tf-cerbere-value">Calcul…</b><small id="tf-cerbere-detail">Projection bancaire indépendante des molettes avant le débit CB</small><div class="tf-cerbere-delta" id="tf-cerbere-delta"></div>';topo.appendChild(c);return true;
}
function chargerCerbereForecast(){
 if(!document.querySelector('.c37-month'))return;installerCerbereCard();const id=++cerbereReq,target=cibleFinCycleDepuisDom();if(!target)return;
 google.script.run.withSuccessHandler(r=>{if(id!==cerbereReq||!r||!r.ok)return;cerbereBase=r;majCerbereLocal();}).withFailureHandler(()=>{}).chargerTresoreriePrevisionnelleRapide20260901(target);
}
function majCerbereLocal(){
 if(!cerbereBase||!q('tf-cerbere-value'))return;const solde=Number(cerbereBase.soldePrevisionnel||0);q('tf-cerbere-value').textContent=money(solde);q('tf-cerbere-value').style.color=solde<0?'#9b3535':'';q('tf-cerbere-detail').textContent=`Référence ${dateFr(cerbereBase.dateReference)} · ${cerbereBase.confiance?.libelle||'—'} · réel + flux bancaires restant à passer`;const joker=document.querySelector('.c37-month [data-joker]');q('tf-cerbere-delta').textContent='Les molettes'+(joker?.checked?' et le Joker':'')+' agissent sur l’estimation du prochain débit CB, pas sur le solde avant ce débit.';
}
function brancherCerbere(){
 const root=document.querySelector('.c37-month');if(!root)return;installerCerbereCard();
 // Doctrine 01/09 : les molettes ne peuvent pas modifier le solde bancaire au 27.
 // On ne relance donc plus un calcul serveur coûteux à chaque mouvement de tirette.
 if(!cerbereBase)chargerCerbereForecast();else majCerbereLocal();
}

function activeView(){return window.state&&state.currentView||document.querySelector('.nav-item.active')?.dataset.view||'';}
function tick(){const v=activeView();if(v==='comptes'){installerCarteComptes();if(!q('tf-account-value')?.dataset.loaded){q('tf-account-value')&&(q('tf-account-value').dataset.loaded='1');chargerPrevisionComptes();}}else if(v==='operations')installerOperations();else if(v==='cerbere'||document.querySelector('.c37-month'))brancherCerbere();}
document.addEventListener('click',e=>{const b=e.target.closest?.('.nav-item[data-view]');if(!b)return;setTimeout(()=>{if(b.dataset.view==='comptes'){installerCarteComptes();chargerPrevisionComptes();}else if(b.dataset.view==='operations')installerOperations();else if(b.dataset.view==='cerbere'){cerbereBase=null;setTimeout(brancherCerbere,180);}},80);},true);
const obs=new MutationObserver(()=>setTimeout(tick,120));obs.observe(document.body,{childList:true,subtree:true});
document.addEventListener('DOMContentLoaded',()=>setTimeout(tick,700));setTimeout(tick,1200);
})();
</script>
