name: Patch synthese Cerbere CF owner

on:
  push:
    branches:
      - budgetsoft-import-lab
    paths:
      - '.github/workflows/patch-synthese-cerbere-cf-owner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: budgetsoft-import-lab
          fetch-depth: 0
      - name: Patch authoritative synthese snapshot Cerbere build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('budgetsoft/appscript/BudgetSoftGlobalSnapshotSynthese20260907.gs')
          s=p.read_text(encoding='utf-8')
          old="""      const cerbere=prendre('cerbere',()=>{\n        if(cerbereBase&&cerbereBase.ok!==false)return composerCerbereCockpitDepuisBaseSnapshotBudgetSoft20260910_(cerbereBase);\n        return typeof chargerCerbereCockpit20260902==='function'?chargerCerbereCockpit20260902():null;\n      });"""
          new="""      const cerbere=prendre('cerbere',()=>{\n        const brut=(cerbereBase&&cerbereBase.ok!==false)\n          ?composerCerbereCockpitDepuisBaseSnapshotBudgetSoft20260910_(cerbereBase)\n          :(typeof recalculerCerbereCockpitP1Frais20260912_==='function'\n            ?recalculerCerbereCockpitP1Frais20260912_({contexteExterne:true})\n            :(typeof chargerCerbereCockpit20260902==='function'?chargerCerbereCockpit20260902():null));\n        if(!brut)throw new Error('Cerbère frais absent pendant la construction synthèse.');\n        if(brut.ok===false)throw new Error('Cerbère frais en erreur : '+String(brut.erreur||brut.stage||brut.message||'cause inconnue'));\n        if(!Array.isArray(brut.periodes)||brut.periodes.length<2)throw new Error('Cerbère frais incomplet : deux périodes C1/C2 sont requises.');\n        const normalise=typeof normaliserCerbereCfPourSnapshot20260914_==='function'\n          ?normaliserCerbereCfPourSnapshot20260914_(brut,sources)\n          :brut;\n        const attendu=typeof BUDGETSOFT_CERBERE_CF_SNAPSHOT_BUILD_20260914_VERSION!=='undefined'\n          ?String(BUDGETSOFT_CERBERE_CF_SNAPSHOT_BUILD_20260914_VERSION)\n          :'2026-09-14.4';\n        const obtenu=String(normalise&&normalise.diagnostic&&normalise.diagnostic.cfSnapshotBuild20260914&&normalise.diagnostic.cfSnapshotBuild20260914.version||'');\n        if(obtenu!==attendu)throw new Error('Normalisation Charges_fixes absente du Cerbère synthèse : attendu '+attendu+', obtenu '+(obtenu||'vide'));\n        return normalise;\n      });"""
          if s.count(old)!=1:
              raise SystemExit(f'authoritative synthese Cerbere block found {s.count(old)} times')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budgetsoft/appscript/BudgetSoftGlobalSnapshotSynthese20260907.gs
          git diff --cached --quiet && exit 0
          git commit -m 'Apply canonical fixed charges in synthese snapshot'
          git push origin HEAD:budgetsoft-import-lab
