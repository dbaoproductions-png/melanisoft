name: BudgetSoft - Pull TEST TEMP

on:
  push:
    branches:
      - budgetsoft-import-lab
    paths:
      - '.github/workflows/budgetsoft-pull-test-temp.yml'

permissions:
  contents: read

jobs:
  pull-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp configuration
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON" || { echo 'Missing GitHub secret CLASPRC_JSON'; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          cat > .clasp.json <<'JSON'
          {
            "scriptId": "1tvGARYmwH11M0XfsoRKmtLoETCL6_8fmXD16iU39oGWgHHULGiYbDT-n",
            "rootDir": "apps-script-pull"
          }
          JSON
          mkdir -p apps-script-pull
          chmod 600 "$HOME/.clasprc.json" .clasp.json

      - name: Pull current Apps Script TEST source
        run: npx --yes @google/clasp@3 pull

      - name: Upload pulled source
        uses: actions/upload-artifact@v4
        with:
          name: budgetsoft-appscript-test-current
          path: apps-script-pull
          if-no-files-found: error
