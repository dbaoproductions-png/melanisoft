name: Patch health envelope builder

on:
  push:
    branches:
      - budgetsoft-import-lab
    paths:
      - '.github/workflows/patch-health-envelope-20260915.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: budgetsoft-import-lab
          fetch-depth: 0
      - name: Patch authoritative synthese builder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('budgetsoft/appscript/BudgetSoftGlobalSnapshotSynthese20260907.gs')
          s=p.read_text(encoding='utf-8')
          old="""        if(obtenu!==attendu)throw new Error('Normalisation Charges_fixes absente du Cerbère synthèse : attendu '+attendu+', obtenu '+(obtenu||'vide'));
        return normalise;
"""
          new="""        if(obtenu!==attendu)throw new Error('Normalisation Charges_fixes absente du Cerbère synthèse : attendu '+attendu+', obtenu '+(obtenu||'vide'));
        const sante=typeof normaliserCerbereSantePourSnapshot20260915_==='function'
          ?normaliserCerbereSantePourSnapshot20260915_(normalise)
          :normalise;
        if(typeof synchroniserAgregatsApresSante20260915_==='function')synchroniserAgregatsApresSante20260915_(sante);
        const attenduSante=typeof BUDGETSOFT_ENVELOPPE_SANTE_20260915_VERSION!=='undefined'
          ?String(BUDGETSOFT_ENVELOPPE_SANTE_20260915_VERSION)
          :'2026-09-15.1';
        const obtenuSante=String(sante&&sante.diagnostic&&sante.diagnostic.enveloppeSante20260915&&sante.diagnostic.enveloppeSante20260915.version||'');
        if(obtenuSante!==attenduSante)throw new Error('Normalisation enveloppe Santé absente du Cerbère synthèse : attendu '+attenduSante+', obtenu '+(obtenuSante||'vide'));
        return sante;
"""
          if s.count(old)!=1:
              raise SystemExit('authoritative Cerbere return block not found exactly once')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budgetsoft/appscript/BudgetSoftGlobalSnapshotSynthese20260907.gs
          git diff --cached --quiet && exit 0
          git commit -m 'Apply health net consumption in synthese snapshot'
          git push origin HEAD:budgetsoft-import-lab
