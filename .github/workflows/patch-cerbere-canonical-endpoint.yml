name: Patch Cerbere canonical endpoint once

on:
  push:
    branches:
      - budgetsoft-import-lab
    paths:
      - .github/workflows/patch-cerbere-canonical-endpoint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: budgetsoft-import-lab
          fetch-depth: 0

      - name: Route Cerbere UI to unique endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('budgetsoft/appscript/CerbereV3UI.html')
          s = p.read_text(encoding='utf-8')
          old = '.chargerCerbereCockpit20260902();'
          new = '.chargerCerbereCockpitCanonique20260914();'
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'Expected exactly one Cerbere legacy UI endpoint call, found {n}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print('CerbereV3UI routed to chargerCerbereCockpitCanonique20260914')
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budgetsoft/appscript/CerbereV3UI.html
          git diff --cached --quiet && { echo 'Nothing to commit'; exit 0; }
          git commit -m 'Route Cerbere UI through canonical endpoint'
          git push origin HEAD:budgetsoft-import-lab
