name: Apply ISO logical-view patch

on:
  push:
    paths:
      - 'tools/apply_iso_view_patch.py'
      - '.github/workflows/apply-iso-view-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/apply_iso_view_patch.py
      - name: Commit patched HTML
        run: |
          if git diff --quiet -- Melanisoft_finition_rose.html; then
            echo "No change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Melanisoft_finition_rose.html
          git commit -m "Appliquer l’échantillonnage ISO par vue logique"
          git push
