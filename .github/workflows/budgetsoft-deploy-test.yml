name: BudgetSoft - Deploy TEST

on:
  workflow_dispatch:
  push:
    branches:
      - budgetsoft-import-lab
    paths:
      - 'budgetsoft/appscript/**'
      - '.github/workflows/budgetsoft-deploy-test.yml'

permissions:
  contents: read

concurrency:
  group: budgetsoft-appscript-test
  cancel-in-progress: true

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCRIPT_ID: 1tvGARYmwH11M0XfsoRKmtLoETCL6_8fmXD16iU39oGWgHHULGiYbDT-n

    steps:
      - name: Checkout BudgetSoft import lab
        uses: actions/checkout@v7
        with:
          ref: budgetsoft-import-lab

      - name: Validate browser-only OAuth secrets
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_OAUTH_CLIENT_ID" || { echo 'Missing secret GOOGLE_OAUTH_CLIENT_ID'; exit 1; }
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET" || { echo 'Missing secret GOOGLE_OAUTH_CLIENT_SECRET'; exit 1; }
          test -n "$GOOGLE_OAUTH_REFRESH_TOKEN" || { echo 'Missing secret GOOGLE_OAUTH_REFRESH_TOKEN'; exit 1; }

      - name: Validate Apps Script source
        run: |
          set -euo pipefail
          test -d budgetsoft/appscript
          test -f budgetsoft/appscript/appsscript.json

      - name: Build Apps Script API payload
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('budgetsoft/appscript')
          files = []
          for p in sorted(root.iterdir()):
              if not p.is_file():
                  continue
              if p.name == 'appsscript.json':
                  typ, name = 'JSON', 'appsscript'
              elif p.suffix == '.gs':
                  typ, name = 'SERVER_JS', p.stem
              elif p.suffix == '.html':
                  typ, name = 'HTML', p.stem
              else:
                  continue
              files.append({'name': name, 'type': typ, 'source': p.read_text(encoding='utf-8')})
          if not files:
              raise SystemExit('No Apps Script files found')
          pathlib.Path('/tmp/apps-script-content.json').write_text(json.dumps({'files': files}), encoding='utf-8')
          print(f'Prepared {len(files)} Apps Script files')
          PY

      - name: Obtain Google OAuth access token
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/oauth-response.json -w '%{http_code}' -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Google OAuth token exchange failed with HTTP $HTTP_CODE"
            python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/oauth-response.json'))
              print('OAuth error:', d.get('error','unknown'))
              print('OAuth description:', d.get('error_description',''))
          except Exception as e:
              print('Unable to parse OAuth error response:', type(e).__name__)
          PY
            exit 1
          fi
          ACCESS_TOKEN=$(python3 -c 'import json; print(json.load(open("/tmp/oauth-response.json")).get("access_token", ""))')
          test -n "$ACCESS_TOKEN" || { echo 'Google returned HTTP success but no access token'; exit 1; }
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
          echo 'Google OAuth access token obtained successfully.'

      - name: Push source to Apps Script TEST
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/update-response.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/apps-script-content.json \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Apps Script updateContent failed with HTTP $HTTP_CODE"
            python3 -m json.tool /tmp/update-response.json || cat /tmp/update-response.json || true
            exit 1
          fi
          echo 'Apps Script TEST source updated.'

      - name: Verify Apps Script TEST source after push
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/get-content-response.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Apps Script getContent failed with HTTP $HTTP_CODE"
            exit 1
          fi
          python3 - <<'PY'
          import json, pathlib, sys
          remote=json.load(open('/tmp/get-content-response.json'))
          remote_files={f.get('name'):(f.get('type'),f.get('source','')) for f in remote.get('files',[])}
          root=pathlib.Path('budgetsoft/appscript')
          local={}
          for p in sorted(root.iterdir()):
              if not p.is_file(): continue
              if p.name=='appsscript.json': typ,name='JSON','appsscript'
              elif p.suffix=='.gs': typ,name='SERVER_JS',p.stem
              elif p.suffix=='.html': typ,name='HTML',p.stem
              else: continue
              local[name]=(typ,p.read_text(encoding='utf-8'))
          missing=sorted(set(local)-set(remote_files))
          extra=sorted(set(remote_files)-set(local))
          changed=sorted(k for k in set(local)&set(remote_files) if local[k]!=remote_files[k])
          print('Local files:',len(local),'Remote files:',len(remote_files))
          print('Missing:',missing[:10])
          print('Extra:',extra[:10])
          print('Changed:',changed[:10])
          if missing or extra or changed:
              sys.exit('VERIFY FAIL: Apps Script TEST content differs from repository payload.')
          print('VERIFY OK: Apps Script TEST exactly matches repository payload.')
          PY

      - name: Create Apps Script version
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/version-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"description":"BudgetSoft TEST from budgetsoft-import-lab"}' \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Apps Script versions.create failed with HTTP $HTTP_CODE"
            exit 1
          fi
          VERSION_NUMBER=$(python3 -c 'import json; print(json.load(open("/tmp/version-response.json"))["versionNumber"])')
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> "$GITHUB_ENV"
          echo "Apps Script immutable version created: $VERSION_NUMBER"

      - name: Publish TEST web app deployment
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/deployments-response.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Apps Script deployments.list failed with HTTP $HTTP_CODE"
            exit 1
          fi
          python3 - <<'PY' > /tmp/web-deployment-ids.txt
          import json
          d=json.load(open('/tmp/deployments-response.json'))
          for x in d.get('deployments',[]):
              eps=x.get('entryPoints') or []
              if any(e.get('entryPointType')=='WEB_APP' for e in eps):
                  dep=x.get('deploymentId')
                  if dep:
                      print(dep)
          PY
          DEPLOYMENT_COUNT=$(grep -c . /tmp/web-deployment-ids.txt || true)
          if [ "$DEPLOYMENT_COUNT" -lt 1 ]; then
            echo 'No TEST WEB_APP deployment found.'
            exit 1
          fi
          cat > /tmp/deployment-update.json <<JSON
          {"deploymentConfig":{"versionNumber":$VERSION_NUMBER,"manifestFileName":"appsscript","description":"BudgetSoft TEST published from budgetsoft-import-lab"}}
          JSON
          UPDATED=0
          READ_ONLY=0
          FAILED=0
          while IFS= read -r DEPLOYMENT_ID; do
            [ -n "$DEPLOYMENT_ID" ] || continue
            HTTP_CODE=$(curl -sS -o /tmp/deployment-update-response.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/deployment-update.json \
              "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID")
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              UPDATED=$((UPDATED+1))
              continue
            fi
            if [ "$HTTP_CODE" = "400" ] && grep -q "Read-only deployments may not be modified" /tmp/deployment-update-response.json; then
              READ_ONLY=$((READ_ONLY+1))
              echo "Skipping read-only deployment $DEPLOYMENT_ID."
              continue
            fi
            FAILED=$((FAILED+1))
            echo "Apps Script deployments.update failed with HTTP $HTTP_CODE for $DEPLOYMENT_ID"
            python3 -m json.tool /tmp/deployment-update-response.json || true
          done < /tmp/web-deployment-ids.txt
          echo "TEST web app deployments: updated=$UPDATED read-only=$READ_ONLY failed=$FAILED total=$DEPLOYMENT_COUNT."
          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi
          if [ "$UPDATED" -lt 1 ]; then
            echo "No mutable TEST WEB_APP deployment was updated."
            exit 1
          fi
