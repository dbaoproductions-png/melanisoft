name: BudgetSoft - Deploy TEST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budgetsoft-appscript-test
  cancel-in-progress: false

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check clasp authentication secret
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON" || { echo 'Missing GitHub secret CLASPRC_JSON'; exit 1; }

      - name: Install clasp configuration
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          cat > .clasp.json <<'JSON'
          {
            "scriptId": "1tvGARYmwH11M0XfsoRKmtLoETCL6_8fmXD16iU39oGWgHHULGiYbDT-n",
            "rootDir": "budgetsoft/appscript"
          }
          JSON
          chmod 600 "$HOME/.clasprc.json" .clasp.json

      - name: Validate Apps Script source
        shell: bash
        run: |
          set -euo pipefail
          test -d budgetsoft/appscript
          test -f budgetsoft/appscript/appsscript.json
          echo "Files prepared:"
          find budgetsoft/appscript -maxdepth 1 -type f \( -name '*.gs' -o -name '*.html' -o -name 'appsscript.json' \) -printf '%f\n' | sort

      - name: Show clasp status
        run: npx --yes @google/clasp@3 show-file-status

      - name: Push exact GitHub commit to Apps Script TEST
        run: npx --yes @google/clasp@3 push --force

      - name: Update existing TEST web app deployment
        shell: bash
        run: |
          set -euo pipefail
          deployments="$(npx --yes @google/clasp@3 list-deployments)"
          printf '%s\n' "$deployments"
          mapfile -t ids < <(printf '%s\n' "$deployments" | grep -v '@HEAD' | grep -Eo 'AKfy[A-Za-z0-9_-]+' | sort -u)
          if [ "${#ids[@]}" -ne 1 ]; then
            echo "Expected exactly one non-HEAD TEST deployment; found ${#ids[@]}." >&2
            exit 1
          fi
          deployment_id="${ids[0]}"
          for attempt in 1 2 3 4 5; do
            if npx --yes @google/clasp@3 create-deployment --deploymentId "$deployment_id" --description "BudgetSoft TEST ${{ github.sha }}"; then
              exit 0
            fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((10 * attempt))
          done
