name: BudgetSoft - Deploy TEST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budgetsoft-appscript-test
  cancel-in-progress: false

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCRIPT_ID: 1tvGARYmwH11M0XfsoRKmtLoETCL6_8fmXD16iU39oGWgHHULGiYbDT-n
      TEST_DEPLOYMENT_ID: AKfycbw1PXP2k36srEig1qwlpK9hiYwGYPhBR1tOVPZha_GpIwpm9A3Ds4lNqlNZnt_zvbbGKA

    steps:
      - name: Checkout BudgetSoft import lab
        uses: actions/checkout@v7
        with:
          ref: budgetsoft-import-lab

      - name: Show deployed BudgetSoft revision
        run: |
          set -euo pipefail
          echo "Checked out branch: $(git branch --show-current)"
          echo "Commit: $(git rev-parse HEAD)"
          grep -n "CREDITS_DATA_V2_VERSION" budgetsoft/appscript/CreditsDataV2.gs || true
          grep -n "chargerCreditsEtDettesV2" budgetsoft/appscript/CreditsUI.html || true

      - name: Validate browser-only OAuth secrets
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_OAUTH_CLIENT_ID" || { echo 'Missing secret GOOGLE_OAUTH_CLIENT_ID'; exit 1; }
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET" || { echo 'Missing secret GOOGLE_OAUTH_CLIENT_SECRET'; exit 1; }
          test -n "$GOOGLE_OAUTH_REFRESH_TOKEN" || { echo 'Missing secret GOOGLE_OAUTH_REFRESH_TOKEN'; exit 1; }

      - name: Validate Apps Script source
        run: |
          set -euo pipefail
          test -d budgetsoft/appscript
          test -f budgetsoft/appscript/appsscript.json
          find budgetsoft/appscript -maxdepth 1 -type f \( -name '*.gs' -o -name '*.html' -o -name 'appsscript.json' \) -printf '%f\n' | sort

      - name: Build Apps Script API payload
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('budgetsoft/appscript')
          files = []
          for p in sorted(root.iterdir()):
              if not p.is_file():
                  continue
              if p.name == 'appsscript.json':
                  typ, name = 'JSON', 'appsscript'
              elif p.suffix == '.gs':
                  typ, name = 'SERVER_JS', p.stem
              elif p.suffix == '.html':
                  typ, name = 'HTML', p.stem
              else:
                  continue
              files.append({'name': name, 'type': typ, 'source': p.read_text(encoding='utf-8')})
          if not files:
              raise SystemExit('No Apps Script files found')
          pathlib.Path('/tmp/apps-script-content.json').write_text(json.dumps({'files': files}), encoding='utf-8')
          print(f'Prepared {len(files)} Apps Script files')
          PY

      - name: Obtain Google OAuth access token
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail-with-body -sS -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")
          ACCESS_TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))' <<< "$RESPONSE")
          test -n "$ACCESS_TOKEN" || { echo 'Google did not return an access token'; exit 1; }
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Push source to Apps Script TEST
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/update-response.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/apps-script-content.json \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Apps Script updateContent failed with HTTP $HTTP_CODE"
            python3 -m json.tool /tmp/update-response.json || cat /tmp/update-response.json
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/update-response.json'))
          print('Apps Script source updated:', d.get('scriptId','OK'))
          PY

      - name: Create Apps Script version
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/version-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"description\":\"BudgetSoft TEST $(git rev-parse --short HEAD)\"}" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Apps Script versions.create failed with HTTP $HTTP_CODE"
            python3 -m json.tool /tmp/version-response.json || cat /tmp/version-response.json
            exit 1
          fi

          VERSION_NUMBER=$(python3 -c 'import json; print(json.load(open("/tmp/version-response.json")).get("versionNumber", ""))')
          test -n "$VERSION_NUMBER" || { echo 'No Apps Script version number returned'; exit 1; }
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> "$GITHUB_ENV"
          echo "Apps Script version created: $VERSION_NUMBER"

      - name: Update TEST web app deployment to new version
        run: |
          set -euo pipefail
          cat > /tmp/deployment-update.json <<JSON
          {
            "deploymentConfig": {
              "versionNumber": $VERSION_NUMBER,
              "manifestFileName": "appsscript",
              "description": "BudgetSoft TEST $(git rev-parse --short HEAD)"
            }
          }
          JSON

          HTTP_CODE=$(curl -sS -o /tmp/deployment-response.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/deployment-update.json \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$TEST_DEPLOYMENT_ID")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Apps Script deployments.update failed with HTTP $HTTP_CODE"
            python3 -m json.tool /tmp/deployment-response.json || cat /tmp/deployment-response.json
            exit 1
          fi

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/deployment-response.json'))
          cfg=d.get('deploymentConfig',{})
          print('Deployment updated:', d.get('deploymentId','unknown'))
          print('Version now served:', cfg.get('versionNumber','unknown'))
          print('Description:', cfg.get('description',''))
          PY
