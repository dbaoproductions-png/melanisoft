name: BudgetSoft - Deploy TEST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budgetsoft-appscript-test
  cancel-in-progress: false

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Show exact GitHub revision
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "BRANCH=${GITHUB_REF_NAME}"
          echo "CreditsDataV2 marker:"
          grep -n "CREDITS_DATA_V2_VERSION" budgetsoft/appscript/CreditsDataV2.gs || true
          echo "CreditsUI V2 call:"
          grep -n "chargerCreditsEtDettesV2" budgetsoft/appscript/CreditsUI.html || true
          echo "Analyses V2.4 marker:"
          grep -n "ANALYSES_CORRECTIONS_19082026_VERSION = '2.4'" budgetsoft/appscript/AnalysesCorrections19082026.gs || true
          echo "Civil-day banking helper:"
          grep -n "dateBancaireConnueAuJour_" budgetsoft/appscript/BudgetCalendar.gs || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check clasp authentication secret
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON" || { echo 'Missing GitHub secret CLASPRC_JSON'; exit 1; }

      - name: Install clasp configuration
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          cat > .clasp.json <<'JSON'
          {
            "scriptId": "1tvGARYmwH11M0XfsoRKmtLoETCL6_8fmXD16iU39oGWgHHULGiYbDT-n",
            "rootDir": "budgetsoft/appscript"
          }
          JSON
          chmod 600 "$HOME/.clasprc.json" .clasp.json

      - name: Validate Apps Script source
        shell: bash
        run: |
          set -euo pipefail
          test -d budgetsoft/appscript
          test -f budgetsoft/appscript/appsscript.json
          find budgetsoft/appscript -maxdepth 1 -type f \( -name '*.gs' -o -name '*.html' -o -name 'appsscript.json' \) -printf '%f\n' | sort

          echo "Validate Analyses V2.4 source"
          grep -n "ANALYSES_CORRECTIONS_19082026_VERSION = '2.4'" budgetsoft/appscript/AnalysesCorrections19082026.gs
          grep -n "dateBancaireConnueAuJour_" budgetsoft/appscript/BudgetCalendar.gs
          grep -n "datesBancairesCompareesAuJourCivil" budgetsoft/appscript/AnalysesCorrections19082026.gs
          if grep -n -w "depensesCourants" budgetsoft/appscript/AnalysesCorrections19082026.gs; then
            echo 'ERROR: invalid variable depensesCourants found in AnalysesCorrections19082026.gs'
            exit 1
          fi
          if grep -n "__date <= new Date()" budgetsoft/appscript/DashboardCorrections19082026.gs; then
            echo 'ERROR: raw intraday comparison still present in DashboardCorrections19082026.gs'
            exit 1
          fi
          cp budgetsoft/appscript/AnalysesCorrections19082026.gs /tmp/AnalysesCorrections19082026.js
          cp budgetsoft/appscript/BudgetCalendar.gs /tmp/BudgetCalendar.js
          cp budgetsoft/appscript/DashboardCorrections19082026.gs /tmp/DashboardCorrections19082026.js
          cp budgetsoft/appscript/DashboardBalanceDiagnostics.gs /tmp/DashboardBalanceDiagnostics.js
          node --check /tmp/AnalysesCorrections19082026.js
          node --check /tmp/BudgetCalendar.js
          node --check /tmp/DashboardCorrections19082026.js
          node --check /tmp/DashboardBalanceDiagnostics.js

      - name: Show clasp status
        run: npx --yes @google/clasp@3 show-file-status

      - name: Push exact GitHub commit to Apps Script TEST
        run: npx --yes @google/clasp@3 push --force

      - name: Verify pushed Apps Script source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/budgetsoft-clasp-verify
          mkdir -p /tmp/budgetsoft-clasp-verify
          cp "$HOME/.clasprc.json" /tmp/budgetsoft-clasp-verify/.clasprc.json
          cat > /tmp/budgetsoft-clasp-verify/.clasp.json <<'JSON'
          {
            "scriptId": "1tvGARYmwH11M0XfsoRKmtLoETCL6_8fmXD16iU39oGWgHHULGiYbDT-n"
          }
          JSON
          cd /tmp/budgetsoft-clasp-verify
          npx --yes @google/clasp@3 pull
          echo "Pulled CreditsDataV2 marker:"
          grep -R -n "2.1-2026-08-18" . || { echo 'ERROR: Apps Script does not contain CreditsDataV2 2.1'; exit 1; }
          echo "Pulled CreditsUI V2 call:"
          grep -R -n "chargerCreditsEtDettesV2" . || { echo 'ERROR: Apps Script does not contain CreditsUI V2 call'; exit 1; }
          echo "Pulled Analyses V2.4 marker:"
          grep -R -n "ANALYSES_CORRECTIONS_19082026_VERSION = '2.4'" . || { echo 'ERROR: Apps Script does not contain Analyses V2.4'; exit 1; }
          echo "Pulled civil-day banking helper:"
          grep -R -n "dateBancaireConnueAuJour_" . || { echo 'ERROR: Apps Script does not contain civil-day banking helper'; exit 1; }
          if grep -R -n -w "depensesCourants" .; then
            echo 'ERROR: pushed Apps Script still contains invalid variable depensesCourants'
            exit 1
          fi

      - name: Update validated TEST web app deployment
        shell: bash
        env:
          TEST_DEPLOYMENT_ID: AKfycbw1PXP2k36srEig1qwlpK9hiYwGYPhBR1tOVPZha_GpIwpm9A3Ds4lNqlNZnt_zvbbGKA
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "Updating TEST deployment: $TEST_DEPLOYMENT_ID"
          echo "Expected commit: $GITHUB_SHA"
          for attempt in 1 2 3 4 5; do
            if npx --yes @google/clasp@3 update-deployment "$TEST_DEPLOYMENT_ID" --description "BudgetSoft TEST $GITHUB_SHA"; then
              echo "Deployment update succeeded for $TEST_DEPLOYMENT_ID at $GITHUB_SHA"
              echo "Current deployments:"
              npx --yes @google/clasp@3 list-deployments || true
              exit 0
            fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((10 * attempt))
          done
