name: BudgetSoft - Deploy TEST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budgetsoft-appscript-test
  cancel-in-progress: false

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Show exact GitHub revision
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "BRANCH=${GITHUB_REF_NAME}"
          echo "Plan/Cerbere markers:"
          grep -n 'data-view="plan"' budgetsoft/appscript/Index.html
          grep -n 'PlanCerbereUI' budgetsoft/appscript/Index.html
          grep -n "PLAN_CERBERE_VERSION = '2.0.0'" budgetsoft/appscript/PlanCerbere.gs
          grep -n "CERBERE_V2_VERSION = '2.0.0'" budgetsoft/appscript/CerbereV2.gs
          grep -n 'assurerNavigationCerbere_' budgetsoft/appscript/CerbereUI.html

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check clasp authentication secret
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLASPRC_JSON" || { echo 'Missing GitHub secret CLASPRC_JSON'; exit 1; }

      - name: Install clasp configuration
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          cat > .clasp.json <<'JSON'
          {
            "scriptId": "1tvGARYmwH11M0XfsoRKmtLoETCL6_8fmXD16iU39oGWgHHULGiYbDT-n",
            "rootDir": "budgetsoft/appscript"
          }
          JSON
          chmod 600 "$HOME/.clasprc.json" .clasp.json

      - name: Validate Apps Script source
        shell: bash
        run: |
          set -euo pipefail
          test -d budgetsoft/appscript
          test -f budgetsoft/appscript/appsscript.json
          test -f budgetsoft/appscript/PlanCerbere.gs
          test -f budgetsoft/appscript/CerbereV2.gs
          test -f budgetsoft/appscript/CerbereUI.html
          test -f budgetsoft/appscript/PlanCerbereUI.html
          grep -n 'data-view="plan"' budgetsoft/appscript/Index.html
          grep -n 'data-view="cerbere"' budgetsoft/appscript/Index.html
          grep -n 'PlanCerbereUI' budgetsoft/appscript/Index.html
          grep -n "PLAN_CERBERE_VERSION = '2.0.0'" budgetsoft/appscript/PlanCerbere.gs
          grep -n "CERBERE_V2_VERSION = '2.0.0'" budgetsoft/appscript/CerbereV2.gs
          test "$(grep -R -h -E '^const CERBERE_VERSION[[:space:]]*=' budgetsoft/appscript/*.gs | wc -l)" -le 1 || { echo 'ERROR: duplicate global CERBERE_VERSION declarations'; exit 1; }
          test "$(grep -R -h -E '^const CERBERE_V2_VERSION[[:space:]]*=' budgetsoft/appscript/*.gs | wc -l)" -eq 1 || { echo 'ERROR: CERBERE_V2_VERSION must be declared exactly once'; exit 1; }
          cp budgetsoft/appscript/PlanCerbere.gs /tmp/PlanCerbere.js
          cp budgetsoft/appscript/CerbereV2.gs /tmp/CerbereV2.js
          node --check /tmp/PlanCerbere.js
          node --check /tmp/CerbereV2.js

      - name: Show clasp status
        run: npx --yes @google/clasp@3 show-file-status

      - name: Push exact GitHub commit to Apps Script TEST
        run: npx --yes @google/clasp@3 push --force

      - name: Verify pushed Apps Script source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/budgetsoft-clasp-verify
          mkdir -p /tmp/budgetsoft-clasp-verify
          cp "$HOME/.clasprc.json" /tmp/budgetsoft-clasp-verify/.clasprc.json
          cat > /tmp/budgetsoft-clasp-verify/.clasp.json <<'JSON'
          {
            "scriptId": "1tvGARYmwH11M0XfsoRKmtLoETCL6_8fmXD16iU39oGWgHHULGiYbDT-n"
          }
          JSON
          cd /tmp/budgetsoft-clasp-verify
          npx --yes @google/clasp@3 pull
          grep -R -n 'data-view="plan"' . || { echo 'ERROR: pushed Apps Script has no Plan navigation'; exit 1; }
          grep -R -n 'PlanCerbereUI' . || { echo 'ERROR: pushed Apps Script has no PlanCerbereUI include'; exit 1; }
          grep -R -n "PLAN_CERBERE_VERSION = '2.0.0'" . || { echo 'ERROR: pushed Apps Script has no PlanCerbere V2'; exit 1; }
          grep -R -n "CERBERE_V2_VERSION = '2.0.0'" . || { echo 'ERROR: pushed Apps Script has no Cerbere V2'; exit 1; }
          test "$(grep -R -h -E '^const CERBERE_VERSION[[:space:]]*=' ./*.gs 2>/dev/null | wc -l)" -le 1 || { echo 'ERROR: pushed Apps Script still has duplicate CERBERE_VERSION declarations'; exit 1; }
          test "$(grep -R -h -E '^const CERBERE_V2_VERSION[[:space:]]*=' ./*.gs 2>/dev/null | wc -l)" -eq 1 || { echo 'ERROR: pushed Apps Script has invalid CERBERE_V2_VERSION declaration count'; exit 1; }
          grep -R -n 'assurerNavigationCerbere_' . || { echo 'ERROR: pushed Apps Script has no Cerbere router compatibility'; exit 1; }

      - name: Update validated TEST web app deployment
        shell: bash
        env:
          TEST_DEPLOYMENT_ID: AKfycbw1PXP2k36srEig1qwlpK9hiYwGYPhBR1tOVPZha_GpIwpm9A3Ds4lNqlNZnt_zvbbGKA
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "Updating TEST deployment: $TEST_DEPLOYMENT_ID"
          echo "Expected commit: $GITHUB_SHA"
          for attempt in 1 2 3 4 5; do
            if npx --yes @google/clasp@3 update-deployment "$TEST_DEPLOYMENT_ID" --description "BudgetSoft TEST $GITHUB_SHA"; then
              echo "Deployment update succeeded for $TEST_DEPLOYMENT_ID at $GITHUB_SHA"
              npx --yes @google/clasp@3 list-deployments || true
              exit 0
            fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((10 * attempt))
          done
