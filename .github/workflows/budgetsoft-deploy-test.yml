name: BudgetSoft - Deploy TEST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budgetsoft-appscript-test
  cancel-in-progress: false

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCRIPT_ID: 1tvGARYmwH11M0XfsoRKmtLoETCL6_8fmXD16iU39oGWgHHULGiYbDT-n

    steps:
      - name: Checkout BudgetSoft import lab
        uses: actions/checkout@v7
        with:
          ref: budgetsoft-import-lab

      - name: Validate browser-only OAuth secrets
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_OAUTH_CLIENT_ID" || { echo 'Missing secret GOOGLE_OAUTH_CLIENT_ID'; exit 1; }
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET" || { echo 'Missing secret GOOGLE_OAUTH_CLIENT_SECRET'; exit 1; }
          test -n "$GOOGLE_OAUTH_REFRESH_TOKEN" || { echo 'Missing secret GOOGLE_OAUTH_REFRESH_TOKEN'; exit 1; }

      - name: Validate Apps Script source
        run: |
          set -euo pipefail
          test -d budgetsoft/appscript
          test -f budgetsoft/appscript/appsscript.json
          find budgetsoft/appscript -maxdepth 1 -type f \( -name '*.gs' -o -name '*.html' -o -name 'appsscript.json' \) -printf '%f\n' | sort

      - name: Build Apps Script API payload
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('budgetsoft/appscript')
          files = []
          for p in sorted(root.iterdir()):
              if not p.is_file():
                  continue
              if p.name == 'appsscript.json':
                  typ, name = 'JSON', 'appsscript'
              elif p.suffix == '.gs':
                  typ, name = 'SERVER_JS', p.stem
              elif p.suffix == '.html':
                  typ, name = 'HTML', p.stem
              else:
                  continue
              files.append({'name': name, 'type': typ, 'source': p.read_text(encoding='utf-8')})
          if not files:
              raise SystemExit('No Apps Script files found')
          pathlib.Path('/tmp/apps-script-content.json').write_text(json.dumps({'files': files}), encoding='utf-8')
          print(f'Prepared {len(files)} Apps Script files')
          PY

      - name: Obtain Google OAuth access token
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail-with-body -sS -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$GOOGLE_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_OAUTH_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_OAUTH_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")
          ACCESS_TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))' <<< "$RESPONSE")
          test -n "$ACCESS_TOKEN" || { echo 'Google did not return an access token'; exit 1; }
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Push source to Apps Script TEST
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/update-response.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/apps-script-content.json \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Apps Script updateContent failed with HTTP $HTTP_CODE"
            python3 -m json.tool /tmp/update-response.json || cat /tmp/update-response.json
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/update-response.json'))
          print('Apps Script source updated:', d.get('scriptId','OK'))
          PY

      - name: Create Apps Script version
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"description":"BudgetSoft TEST from budgetsoft-import-lab"}' \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions" \
            > /tmp/version-response.json
          VERSION_NUMBER=$(python3 -c 'import json; print(json.load(open("/tmp/version-response.json"))["versionNumber"])')
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> "$GITHUB_ENV"
          echo "Apps Script version created: $VERSION_NUMBER"

      - name: Select TEST Web App deployment
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments?pageSize=200" \
            > /tmp/deployments.json
          python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/deployments.json'))
          deps=d.get('deployments', [])
          web=[]
          for dep in deps:
              eps=dep.get('entryPoints') or []
              if any(ep.get('entryPointType') == 'WEB_APP' for ep in eps):
                  web.append(dep)
          preferred=[dep for dep in web if 'test' in str((dep.get('deploymentConfig') or {}).get('description','')).lower()]
          candidates=preferred if len(preferred)==1 else web
          if len(candidates) != 1:
              print('Unable to select one TEST Web App deployment safely.')
              for dep in web:
                  cfg=dep.get('deploymentConfig') or {}
                  print(' -', dep.get('deploymentId'), 'version', cfg.get('versionNumber'), 'description=', cfg.get('description',''))
              raise SystemExit(1)
          dep=candidates[0]
          cfg=dep.get('deploymentConfig') or {}
          deployment_id=dep['deploymentId']
          manifest=cfg.get('manifestFileName') or 'appsscript'
          description=cfg.get('description') or 'BudgetSoft TEST'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('WEBAPP_DEPLOYMENT_ID='+deployment_id+'\n')
              f.write('WEBAPP_MANIFEST='+manifest+'\n')
              f.write('WEBAPP_DESCRIPTION='+description.replace('\n',' ')+'\n')
          print('Selected Web App deployment:', deployment_id, 'currently on version', cfg.get('versionNumber'))
          PY

      - name: Update TEST Web App deployment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          payload={
            'deploymentConfig':{
              'scriptId':os.environ['SCRIPT_ID'],
              'versionNumber':int(os.environ['VERSION_NUMBER']),
              'manifestFileName':os.environ['WEBAPP_MANIFEST'],
              'description':os.environ['WEBAPP_DESCRIPTION']
            }
          }
          json.dump(payload, open('/tmp/deployment-update.json','w'))
          PY
          HTTP_CODE=$(curl -sS -o /tmp/deployment-update-response.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/deployment-update.json \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$WEBAPP_DEPLOYMENT_ID")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Apps Script deployment update failed with HTTP $HTTP_CODE"
            python3 -m json.tool /tmp/deployment-update-response.json || cat /tmp/deployment-update-response.json
            exit 1
          fi
          echo "Web App deployment updated to Apps Script version $VERSION_NUMBER"
