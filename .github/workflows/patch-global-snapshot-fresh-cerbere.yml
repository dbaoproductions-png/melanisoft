name: Patch global snapshot Cerbere fresh engine

on:
  push:
    branches:
      - budgetsoft-import-lab
    paths:
      - '.github/workflows/patch-global-snapshot-fresh-cerbere.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: budgetsoft-import-lab
          fetch-depth: 0

      - name: Patch snapshot builder Cerbere source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('budgetsoft/appscript/BudgetSoftGlobalSnapshot20260906.gs')
          s = p.read_text(encoding='utf-8')
          old = "const brut=typeof chargerCerbereCockpit20260902==='function'?chargerCerbereCockpit20260902():null;"
          new = "const brut=typeof recalculerCerbereCockpitP1Frais20260912_==='function'?recalculerCerbereCockpitP1Frais20260912_():(typeof chargerCerbereCockpit20260902==='function'?chargerCerbereCockpit20260902():null);"
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'Expected exactly one legacy Cerbere snapshot source, found {n}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print('Global snapshot now builds Cerbere from fresh engine')
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add budgetsoft/appscript/BudgetSoftGlobalSnapshot20260906.gs
          git diff --cached --quiet && { echo 'Nothing to commit'; exit 0; }
          git commit -m 'Build Cerbere fresh inside global snapshot'
          git push origin HEAD:budgetsoft-import-lab
